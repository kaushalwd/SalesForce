<template>
    <template if:true={hasRecords}>
        <lightning-card title="SPA Voided Approvals"
            icon-name="custom:custom63">
            <template if:true={salesOrders}>
                <table
                    class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate"
                                    title="Sales Order">Sales Order</div></th>
                            <th scope="col"><div class="slds-truncate"
                                    title="Unit">Unit</div></th>
                            <th scope="col"><div class="slds-truncate"
                                    title="Unit">Voided Reason</div></th>
                            <th scope="col"><div class="slds-truncate"
                                    title="Unit">Customer Name</div></th>
                            <th scope="col"><div class="slds-truncate"
                                    title></div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={salesOrders} for:item="so">
                            <tr key={so.Id}>
                                <td>
                                    <div class="slds-truncate">
                                        <a href={so.recordLink}
                                            target="_blank">{so.Name}</a>
                                    </div>
                                </td>

                                <td><div
                                        class="slds-truncate">{so.UnitName}</div></td>
                                <td><div
                                        class="slds-truncate">{so.VoidReason}</div></td>
                                <td><div
                                        class="slds-truncate">{so.CustomerName}</div></td>
                                <td>
                                    <lightning-button
                                        label="Approve"
                                        variant="success"
                                        class="slds-m-right_small"
                                        onclick={handleApprove}
                                        data-id={so.Id}>
                                    </lightning-button>
                                    <lightning-button
                                        label="Reject"
                                        variant="destructive"
                                        onclick={handleReject}
                                        data-id={so.Id}>
                                    </lightning-button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_medium">
                    <lightning-spinner alternative-text="Loading..."
                        size="medium"></lightning-spinner>
                </div>
            </template>
        </lightning-card>
    </template>

    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">SPA Rejection Comments</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea
                        label="Enter Rejection Comments"
                        value={comments}
                        onchange={handleCommentChange}>
                    </lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="brand" label="Cancel"
                        onclick={closeModal}></lightning-button>&nbsp;&nbsp;
                    <lightning-button variant="destructive"
                        label="Reject"
                        onclick={submitRejection}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
