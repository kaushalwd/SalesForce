<template>

    <lightning-card
        title="Bank Details"
        icon-name="standard:account">

        <!-- Pencil icon in header -->
        <lightning-button-icon
            slot="actions"
            icon-name="utility:edit"
            alternative-text="Edit Bank Details"
            title="Edit Bank Details"
            variant="border-filled"
            onclick={handleEdit}>
        </lightning-button-icon>

        <div class="slds-p-around_medium">

            <!-- Account found -->
            <template if:true={accountId}>

                <lightning-record-edit-form
                    object-api-name="Account"
                    record-id={accountId}
                    onsuccess={handleSuccess}
                    onerror={handleError}>

                    <lightning-messages></lightning-messages>

                    <div class="slds-grid slds-wrap slds-gutters">

                        <!-- Bank Name -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field
                                field-name="Bank_Name__c"
                                disabled={isReadOnly}>
                            </lightning-input-field>
                        </div>

                        <!-- Beneficiary Name -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field
                                field-name="Beneficiary_Name__c"
                                disabled={isReadOnly}>
                            </lightning-input-field>
                        </div>

                        <!-- Bank Account Number -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field
                                field-name="Bank_Account_Number__c"
                                disabled={isReadOnly}>
                            </lightning-input-field>
                        </div>

                        <!-- IBAN -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field
                                field-name="IBAN_Number__c"
                                disabled={isReadOnly}>
                            </lightning-input-field>
                        </div>

                        <!-- Bank Branch Name -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field
                                field-name="Bank_Branch_Name__c"
                                disabled={isReadOnly}>
                            </lightning-input-field>
                        </div>

                        <!-- Swift Code -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field
                                field-name="Swift_Code__c"
                                disabled={isReadOnly}>
                            </lightning-input-field>
                        </div>

                        <!-- Bank Country -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field
                                field-name="Bank_Country__c"
                                disabled={isReadOnly}>
                            </lightning-input-field>
                        </div>

                    </div>

                    <!-- Save / Cancel -->
                    <template if:false={isReadOnly}>

                        <div class="slds-m-top_medium slds-text-align_right">

                            <lightning-button
                                label="Cancel"
                                class="slds-m-right_small"
                                onclick={handleCancel}>
                            </lightning-button>

                            <lightning-button
                                type="submit"
                                variant="brand"
                                label="Save"
                                icon-name="utility:save">
                            </lightning-button>

                        </div>

                    </template>

                </lightning-record-edit-form>

            </template>

            <!-- No Account -->
            <template if:false={accountId}>

                <div class="slds-text-align_center slds-p-around_medium">

                    <lightning-icon
                        icon-name="utility:warning"
                        size="small">
                    </lightning-icon>

                    <p class="slds-m-top_small">
                        No Account is associated with this Business Process.
                    </p>

                </div>

            </template>

        </div>

    </lightning-card>

</template>
