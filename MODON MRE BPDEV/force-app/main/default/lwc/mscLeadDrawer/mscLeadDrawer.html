<template>
  <div class={layerClass} aria-hidden={hiddenAttr}>
    <div class="scrim" onclick={requestClose}></div>

    <aside class="panel" aria-label="Lead activity" onclick={stop}>
      <!-- HEADER: who, then the four facts in a labelled grid -->
      <div class="head">
        <div class="head__top">
          <span class="avatar">{initials}</span>
          <div class="head__id">
            <div class="head__name">{name}</div>
            <div class="head__status">
              <i></i><span>{statusText}</span>
              <!-- 1.13 (MSC-210): queued for handover; a word, not a badge -->
              <template lwc:if={pendingReassign}>
                <span class="handover" title="Qualified, awaiting handover to a sales associate">handover</span>
              </template>
            </div>
          </div>
          <!-- 1.14 (MSC-212): the from-lead booking entry; hidden on closed statuses -->
          <template lwc:if={canBook}>
            <button class="book" onclick={startBooking} disabled={busy}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <path d="M9 22V12h6v10"></path>
              </svg>
              <span>Book a unit</span>
            </button>
          </template>
          <button class="x" onclick={requestClose} aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div class="facts">
          <div><span>Phone</span><b class="mono">{phoneText}</b></div>
          <div><span>Email</span><b title={emailText}>{emailText}</b></div>
          <div><span>Interested in</span><b title={projectText}>{projectText}</b></div>
          <div><span>Source</span><b>{sourceText}</b></div>
        </div>
      </div>

      <!-- TASK STRIP + ACTIONS -->
      <div class="bar">
        <div class="tk">
          <template lwc:if={hasOpenTask}>
            <b class="tk__subj" title={taskSubject}>{taskSubject}</b>
            <span class="tk__due">
              <span>{taskDueLine}</span>
              <template lwc:if={taskOverdue}
                ><span class="tk__dot">&middot;</span><b class="tk__late">Overdue</b></template
              >
            </span>
          </template>
          <template lwc:elseif={noOpenTask}>
            <b class="tk__none">No call open</b>
          </template>
        </div>
        <button class={callBtnClass} onclick={toggleCall} disabled={outcomeDisabled}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path>
          </svg>
          <span>Log Call</span>
        </button>
        <button class={schedBtnClass} onclick={toggleSched}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="17" rx="2"></rect>
            <path d="M16 2.5v4M8 2.5v4M3 10h18"></path>
          </svg>
          <span>Schedule</span>
        </button>
        <button class={noteBtnClass} onclick={toggleNote}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 2v6h6"></path>
          </svg>
          <span>Note</span>
        </button>
        <!-- MSC-232: the three above act on the open call; this one ends the lead, so a
             hairline sets it apart. Absent wherever the org would refuse the status. -->
        <template lwc:if={canRetire}>
          <span class="split" aria-hidden="true"></span>
          <button class={retireBtnClass} onclick={toggleRetire}>
            <span>Retire</span>
          </button>
        </template>
      </div>

      <!-- BODY: composer above the history, never a modal -->
      <div class="body">
        <template lwc:if={showComposer}>
          <div class="comp">
            <template lwc:if={isCall}>
              <div class="blk">
                <div class="fk">Outcome</div>
                <div class="opts">
                  <template for:each={statusOptions} for:item="o">
                    <button
                      key={o.value}
                      class="opt"
                      data-value={o.value}
                      aria-pressed={o.pressed}
                      disabled={o.disabled}
                      title={o.title}
                      onclick={pickStatusHandler}
                    >{o.label}</button>
                  </template>
                </div>
              </div>
              <template lwc:if={showResponses}>
                <div class="blk">
                  <div class="fk">Response</div>
                  <div class="opts">
                    <template for:each={responseOptions} for:item="o">
                      <button
                        key={o.value}
                        class="opt"
                        data-value={o.value}
                        aria-pressed={o.pressed}
                        onclick={pickResponseHandler}
                      >{o.label}</button>
                    </template>
                  </div>
                </div>
              </template>
              <!-- MSC-195: the org makes a reason mandatory with 'Not interested' -->
              <template lwc:if={showReasons}>
                <div class="blk">
                  <div class="fk">Reason</div>
                  <div class="opts">
                    <template for:each={reasonOptions} for:item="o">
                      <button
                        key={o.value}
                        class="opt"
                        data-value={o.value}
                        aria-pressed={o.pressed}
                        onclick={pickReasonHandler}
                      >{o.label}</button>
                    </template>
                  </div>
                </div>
              </template>
            </template>

            <!-- MSC-232: the org's own Lead.RetiredReason__c values; mandatory, so the
                 confirm button stays off until one is chosen -->
            <template lwc:if={isRetire}>
              <div class="blk">
                <div class="fk">Reason</div>
                <div class="opts">
                  <template for:each={leadReasonOptions} for:item="o">
                    <button
                      key={o.value}
                      class="opt"
                      data-value={o.value}
                      aria-pressed={o.pressed}
                      onclick={pickLeadReasonHandler}
                    >{o.label}</button>
                  </template>
                </div>
              </div>
            </template>

            <template lwc:if={isSched}>
              <div class="blk three">
                <div class="f">
                  <label for="sk">Type</label>
                  <select id="sk" onchange={handleSchedKind}>
                    <template for:each={schedKindChoices} for:item="o">
                      <option key={o.value} value={o.value} selected={o.selected}>{o.value}</option>
                    </template>
                  </select>
                </div>
                <div class="f">
                  <label for="sw">Date</label>
                  <!-- 1.x UI-13: the console's picker, dd/mm/yyyy -->
                  <c-msc-date-picker label="Date" size="small" min={minDate} value={schedDate}
                                     onchange={handleSchedDate}></c-msc-date-picker>
                </div>
                <div class="f">
                  <!-- 1.5: morning books evening; optional, blank = any time that day -->
                  <label for="st">Time</label>
                  <input id="st" type="time" value={schedTime} onchange={handleSchedTime} />
                </div>
              </div>
            </template>

            <div class="blk f">
              <label for="desc">{notesLabel}</label>
              <!-- no value binding (LWC1057); cleared by hand on mode switch -->
              <textarea id="desc" class="desc-input" oninput={handleDesc}></textarea>
            </div>

            <template lwc:if={showResult}>
              <div class="res">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6"></path>
                </svg>
                <b>{resultLine}</b>
              </div>
            </template>

            <template lwc:if={showGate}>
              <div class="gate">
                <div class="fk">Required to qualify</div>
                <div class="three">
                  <div class="f">
                    <label for="g1">Project</label>
                    <select id="g1" data-field="projectId" onchange={handleGate}>
                      <option value="">Select…</option>
                      <template for:each={projectChoices} for:item="p">
                        <option key={p.id} value={p.id} selected={p.selected}>{p.name}</option>
                      </template>
                    </select>
                  </div>
                  <div class="f">
                    <label for="g2">Bedrooms</label>
                    <select id="g2" data-field="bedrooms" onchange={handleGate}>
                      <option value="">Select…</option>
                      <template for:each={bedroomChoices} for:item="o">
                        <option key={o.value} value={o.value} selected={o.selected}>{o.value}</option>
                      </template>
                    </select>
                  </div>
                  <div class="f">
                    <label for="g3">Budget</label>
                    <select id="g3" data-field="budget" onchange={handleGate}>
                      <option value="">Select…</option>
                      <template for:each={budgetChoices} for:item="o">
                        <option key={o.value} value={o.value} selected={o.selected}>{o.value}</option>
                      </template>
                    </select>
                  </div>
                  <div class="f">
                    <label for="g4">Finance</label>
                    <select id="g4" data-field="finance" onchange={handleGate}>
                      <option value="">Select…</option>
                      <template for:each={financeChoices} for:item="o">
                        <option key={o.value} value={o.value} selected={o.selected}>{o.value}</option>
                      </template>
                    </select>
                  </div>
                  <div class="f">
                    <label for="g5">Purpose</label>
                    <select id="g5" data-field="investment" onchange={handleGate}>
                      <option value="">Select…</option>
                      <template for:each={investmentChoices} for:item="o">
                        <option key={o.value} value={o.value} selected={o.selected}>{o.value}</option>
                      </template>
                    </select>
                  </div>
                </div>
              </div>
            </template>

            <template lwc:if={errorMsg}>
              <p class="err" role="alert">{errorMsg}</p>
            </template>

            <div class="cfoot">
              <button class="btn" onclick={cancel} disabled={busy}>Cancel</button>
              <button class="btn btn--pri" onclick={save} disabled={saveDisabled}>{saveLabel}</button>
            </div>
          </div>
        </template>

        <template lwc:if={showTopError}>
          <p class="err err--top" role="alert">{errorMsg}</p>
        </template>

        <p class="tlhead">History</p>
        <template lwc:if={loading}>
          <div class="sk"></div>
          <div class="sk"></div>
          <div class="sk"></div>
        </template>

        <!-- 1.7 (MSC-187): recency bands on an icon rail; rows expand in place -->
        <template for:each={bands} for:item="b">
          <div key={b.key} class="band"><span>{b.label}</span><span class="rule"></span></div>
          <div key={b.railKey} class="tl">
            <template for:each={b.items} for:item="t">
              <div key={t.key} class={t.evClass}>
                <div class="ev__icon">
                  <template lwc:if={t.iconCall}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg>
                  </template>
                  <template lwc:if={t.iconSched}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="2"></rect><path d="M16 2.5v4M8 2.5v4M3 10h18"></path></svg>
                  </template>
                  <template lwc:if={t.iconNote}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>
                  </template>
                  <template lwc:if={t.iconEmail}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
                  </template>
                  <template lwc:if={t.iconSys}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 5V3M12 21v-2M5 12H3M21 12h-2M6.6 6.6 5.2 5.2M18.8 18.8l-1.4-1.4M6.6 17.4l-1.4 1.4M18.8 5.2l-1.4 1.4"></path></svg>
                  </template>
                </div>

                <button
                  class="ev__row"
                  data-key={t.key}
                  aria-expanded={t.expandedAttr}
                  onclick={toggleItem}
                >
                  <span class="ev__t">
                    <span>{t.head}</span>
                    <template lwc:if={t.outcome}>
                      <span class="sep">&middot;</span><em>{t.outcome}</em>
                    </template>
                  </span>
                  <span class="ev__preview">{t.preview}</span>
                  <span class="ev__when">{t.when}</span>
                  <span class="ev__chev">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
                  </span>
                </button>

                <template lwc:if={t.showSubs}>
                  <div class="cluster-items">
                    <template for:each={t.subs} for:item="sub">
                      <p key={sub.key}><span>{sub.text}</span><span class="w">{sub.when}</span></p>
                    </template>
                  </div>
                </template>
                <template lwc:if={t.showDetail}>
                  <div class="ev__detail">
                    <template lwc:if={t.note}>
                      <p class="ev__note">{t.note}</p>
                    </template>
                    <div class="ev__metaline">{t.metaline}</div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <template lwc:if={hasMoreHistory}>
          <button class="more" onclick={showEarlier}>{moreHistoryLabel}</button>
        </template>
        <template lwc:if={emptyTimeline}>
          <p class="tl-empty">Nothing recorded yet.</p>
        </template>
      </div>

      <c-msc-toast></c-msc-toast>
    </aside>
  </div>
</template>
