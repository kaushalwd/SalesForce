<template>
    <div class="help">
        <nav class="subview-tabs" aria-label="Help views">
            <button class={contactTabClass} type="button" onclick={handleShowContactTab}>Contact us</button>
            <button class={casesTabClass} type="button" onclick={handleShowCasesTab}>Cases</button>
        </nav>

        <!-- ================= Contact Us ================= -->
        <template lwc:if={isContactTab}>
            <template lwc:if={isContactLoading}>
                <c-mbpr_loader label="Loading contact details"></c-mbpr_loader>
            </template>
            <template lwc:elseif={contactError}>
                <div class="state-panel">
                    <c-mbpr_empty-state
                        compact
                        kicker="Support"
                        title="Something went wrong"
                        message={contactError}
                    ></c-mbpr_empty-state>
                    <button class="help-button help-button--ghost" type="button" onclick={handleRetryContact}>
                        Try again
                    </button>
                </div>
            </template>
            <template lwc:else>
                <section class="contact" aria-label="Broker Management Team">
                    <h2 class="section-title">Broker Management Team</h2>
                    <template lwc:if={contactCard}>
                        <div class="contact-card">
                            <template lwc:if={contactCard.phone}>
                                <a class="contact-line" href={contactCard.phoneHref}>
                                    <span class="contact-line__icon" aria-hidden="true">
                                        <lightning-icon icon-name="utility:call" size="x-small" alternative-text=""></lightning-icon>
                                    </span>
                                    <span class="contact-line__body">
                                        <small>Phone</small>
                                        <strong>{contactCard.phone}</strong>
                                    </span>
                                </a>
                            </template>
                            <template lwc:if={contactCard.email}>
                                <a class="contact-line" href={contactCard.emailHref}>
                                    <span class="contact-line__icon" aria-hidden="true">
                                        <lightning-icon icon-name="utility:email" size="x-small" alternative-text=""></lightning-icon>
                                    </span>
                                    <span class="contact-line__body">
                                        <small>Email</small>
                                        <strong>{contactCard.email}</strong>
                                    </span>
                                </a>
                            </template>
                        </div>
                        <a class="whatsapp-action" href={whatsappUrl} target="_blank" rel="noopener noreferrer">
                            <span class="whatsapp-action__icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path d="M12 3.2a8.6 8.6 0 0 0-7.4 12.9L3.4 20.6l4.6-1.2A8.6 8.6 0 1 0 12 3.2Z"></path>
                                    <path d="M9.3 8.1c.2-.4.4-.4.6-.4h.5c.2 0 .4 0 .5.4.2.4.6 1.4.6 1.5.1.1.1.3 0 .4l-.3.5c-.1.2-.2.3-.1.5.2.3.7 1.1 1.5 1.7.9.7 1.6.9 1.9 1 .2.1.4 0 .5-.1l.6-.7c.1-.2.3-.2.5-.1s1.4.7 1.6.8"></path>
                                </svg>
                            </span>
                            <span>Message us on WhatsApp</span>
                        </a>
                    </template>
                    <template lwc:else>
                        <c-mbpr_empty-state
                            compact
                            kicker="Support"
                            title="No contact details available"
                            message="Contact details are not available right now. Please try again later."
                        ></c-mbpr_empty-state>
                    </template>
                </section>
            </template>
        </template>

        <!-- ================= Cases ================= -->
        <template lwc:if={isCasesTab}>
            <div class="cases-toolbar">
                <div class="cases-toolbar__search">
                    <lightning-input
                        label="Search Case"
                        variant="label-hidden"
                        placeholder="Case Number, Subject, Category, Raised By"
                        value={searchKey}
                        onchange={handleSearchChange}
                    ></lightning-input>
                </div>
                <div class="cases-toolbar__actions">
                    <button class="help-button help-button--ghost help-button--icon" type="button" title="Case Filters" onclick={toggleFilterPanel}>
                        <lightning-icon icon-name="utility:filterList" size="xx-small" alternative-text="Case Filters"></lightning-icon>
                    </button>
                    <button class="help-button help-button--ghost" type="button" onclick={handleExport}>
                        Export Cases
                    </button>
                    <button class="help-button" type="button" title="Raise case" onclick={handleOpenCreateModal}>
                        + Raise Case
                    </button>
                </div>
            </div>

            <template lwc:if={filterOpen}>
                <section class="filter-panel" aria-label="Case Filters">
                    <header class="filter-panel__head">
                        <b>Case Filters</b>
                        <button class="filter-panel__close" type="button" title="Close" aria-label="Close Case Filters" onclick={toggleFilterPanel}>
                            <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Close"></lightning-icon>
                        </button>
                    </header>
                    <div class="filter-grid">
                        <lightning-combobox
                            label="Status"
                            options={statusOptions}
                            value={statusFilter}
                            onchange={handleStatusChange}
                        ></lightning-combobox>
                        <label class="portal-date-field">
                            <span>Start Date</span>
                            <input
                                type="date"
                                value={draftStartDate}
                                onchange={handleStartDateChange}
                                />
                        </label>
                        <label class="portal-date-field">
                            <span>End Date</span>
                            <input
                                type="date"
                                value={draftEndDate}
                                onchange={handleEndDateChange}
                                />
                        </label>
                    </div>
                    <div class="filter-panel__actions">
                        <button class="help-button help-button--ghost" type="button" onclick={handleResetFilters}>Reset</button>
                        <button class="help-button" type="button" onclick={handleApplyFilters}>Apply</button>
                    </div>
                </section>
            </template>

            <template lwc:if={isCasesLoading}>
                <div class="state-panel state-panel--loading">
                    <c-mbpr_loading-state rows="5" label="Loading cases"></c-mbpr_loading-state>
                </div>
            </template>
            <template lwc:elseif={casesError}>
                <div class="state-panel">
                    <c-mbpr_empty-state
                        compact
                        kicker="Cases"
                        title="Something went wrong"
                        message={casesError}
                    ></c-mbpr_empty-state>
                    <button class="help-button help-button--ghost" type="button" onclick={handleRetryCases}>
                        Try again
                    </button>
                </div>
            </template>
            <template lwc:elseif={hasFilteredCases}>
                <ol class="case-list">
                    <template for:each={pagedCases} for:item="caseItem">
                        <li key={caseItem.id} class={caseItem.cardClass}>
                            <button
                                class="case-card__head"
                                type="button"
                                data-id={caseItem.id}
                                onclick={handleToggleExpand}
                                aria-expanded={caseItem.isExpanded}
                                title={caseItem.expandLabel}
                            >
                                <span class="case-card__identity">
                                    <strong>{caseItem.caseNumber}</strong>
                                    <small>{caseItem.subject}</small>
                                </span>
                                <c-mbpr_status-badge label={caseItem.status} tone={caseItem.statusTone}></c-mbpr_status-badge>
                                <lightning-icon
                                    icon-name={caseItem.expandIcon}
                                    size="xx-small"
                                    alternative-text=""
                                    class="case-card__chevron"
                                ></lightning-icon>
                            </button>

                            <template lwc:if={caseItem.isExpanded}>
                                <dl class="case-card__details">
                                    <div><dt>S.No</dt><dd>{caseItem.sno}</dd></div>
                                    <div><dt>Case Number</dt><dd>{caseItem.caseNumber}</dd></div>
                                    <div><dt>Status</dt><dd>{caseItem.status}</dd></div>
                                    <div><dt>Category</dt><dd>{caseItem.category}</dd></div>
                                    <div><dt>Raised By</dt><dd>{caseItem.raisedBy}</dd></div>
                                    <div class="case-card__details-full"><dt>Subject</dt><dd>{caseItem.subject}</dd></div>
                                    <div class="case-card__details-full"><dt>Description</dt><dd>{caseItem.description}</dd></div>
                                    <template lwc:if={caseItem.resolutionComments}>
                                        <div class="case-card__details-full"><dt>Resolution Comments</dt><dd>{caseItem.resolutionComments}</dd></div>
                                    </template>
                                </dl>
                            </template>

                            <template lwc:if={caseItem.isEditable}>
                                <div class="case-card__actions">
                                    <button
                                        class="case-action"
                                        type="button"
                                        data-id={caseItem.id}
                                        title="Edit Case"
                                        onclick={handleEditCase}
                                    >
                                        <lightning-icon icon-name="utility:edit" size="xx-small" alternative-text="Edit"></lightning-icon>
                                        <span>Edit</span>
                                    </button>
                                </div>
                            </template>
                        </li>
                    </template>
                </ol>

                <template lwc:if={showPagination}>
                    <nav class="cases-pagination" aria-label="Case pagination">
                        <button class="help-button help-button--ghost" type="button" disabled={disablePrev} onclick={handlePrevPage}>⟵ Prev</button>
                        <span>{pageLabel}</span>
                        <button class="help-button help-button--ghost" type="button" disabled={disableNext} onclick={handleNextPage}>Next ⟶</button>
                    </nav>
                </template>
            </template>
            <template lwc:else>
                <div class="state-panel">
                    <c-mbpr_empty-state
                        compact
                        kicker="Cases"
                        title="No cases found matching your criteria."
                        message="Raise a case and it will appear here."
                    ></c-mbpr_empty-state>
                </div>
            </template>
        </template>
    </div>

    <!-- ================= Raise / Edit Case modal ================= -->
    <template lwc:if={showModal}>
        <div class="overlay-layer" onkeydown={handleModalKeydown}>
            <section class="overlay" role="dialog" aria-modal="true" aria-label={modalTitle}>
                <header class="overlay__header">
                    <h2>{modalTitle}</h2>
                    <button class="overlay__close" type="button" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="x-small" alternative-text="Close"></lightning-icon>
                    </button>
                </header>

                <div class="overlay__body">
                    <lightning-combobox
                        label="Category"
                        data-field="CaseCategory__c"
                        placeholder="Select Category"
                        options={categoryOptions}
                        value={caseDraft.CaseCategory__c}
                        required
                        disabled={isEditMode}
                        onchange={handleDraftChange}
                    ></lightning-combobox>
                    <template lwc:if={fieldErrors.category}>
                        <p class="field-error">{fieldErrors.category}</p>
                    </template>

                    <lightning-input
                        label="Subject"
                        data-field="Subject"
                        value={caseDraft.Subject}
                        required
                        onchange={handleDraftChange}
                    ></lightning-input>
                    <template lwc:if={fieldErrors.subject}>
                        <p class="field-error">{fieldErrors.subject}</p>
                    </template>

                    <lightning-input
                        label="Description"
                        data-field="Description"
                        value={caseDraft.Description}
                        required
                        onchange={handleDraftChange}
                    ></lightning-input>
                    <template lwc:if={fieldErrors.description}>
                        <p class="field-error">{fieldErrors.description}</p>
                    </template>

                    <template lwc:if={hasCaseFiles}>
                        <div class="files-block">
                            <h3>Attached Files</h3>
                            <ul class="file-list">
                                <template for:each={caseFiles} for:item="file">
                                    <li key={file.id} class="file-chip">
                                        <lightning-icon icon-name="utility:attach" size="xx-small" alternative-text=""></lightning-icon>
                                        <span>{file.title}</span>
                                        <span class="file-chip__actions">
                                            <button
                                                class="file-chip__button"
                                                type="button"
                                                data-id={file.id}
                                                title="Preview file"
                                                onclick={handlePreviewExistingFile}
                                            >
                                                <lightning-icon icon-name="utility:preview" size="xx-small" alternative-text="Preview file"></lightning-icon>
                                            </button>
                                            <button
                                                class="file-chip__button file-chip__button--delete"
                                                type="button"
                                                data-id={file.id}
                                                title="Delete file"
                                                onclick={handleRequestDeleteFile}
                                            >
                                                <lightning-icon icon-name="utility:delete" size="xx-small" alternative-text="Delete file"></lightning-icon>
                                            </button>
                                        </span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>

                    <lightning-input
                        label="Upload New File"
                        type="file"
                        data-id="caseFileInput"
                        accept=".pdf,.jpg,.jpeg,.png"
                        onchange={handleFileSelected}
                    ></lightning-input>

                    <template lwc:if={uploadedFile}>
                        <div class="file-chip">
                            <lightning-icon icon-name="utility:attach" size="xx-small" alternative-text=""></lightning-icon>
                            <span>File to upload: {uploadedFile.name}</span>
                            <span class="file-chip__actions">
                                <button class="file-chip__button" type="button" title="Preview file" onclick={handlePreviewPendingFile}>
                                    <lightning-icon icon-name="utility:preview" size="xx-small" alternative-text="Preview file"></lightning-icon>
                                </button>
                                <button class="file-chip__button file-chip__button--delete" type="button" title="Remove file" onclick={handleRemovePendingFile}>
                                    <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Remove file"></lightning-icon>
                                </button>
                            </span>
                        </div>
                    </template>
                </div>

                <footer class="overlay__footer">
                    <button class="help-button help-button--ghost" type="button" onclick={closeModal}>Cancel</button>
                    <button class="help-button" type="button" disabled={isActionPending} onclick={handleSubmitCase}>Submit</button>
                </footer>
            </section>
        </div>
    </template>

    <!-- ================= Delete-file confirmation ================= -->
    <template lwc:if={confirmationOpen}>
        <div class="confirmation-layer" onclick={closeConfirmation}>
            <section
                class="confirmation"
                role="dialog"
                aria-modal="true"
                aria-label="Delete file"
                onclick={stopEventPropagation}
                onkeydown={handleConfirmationKeydown}
            >
                <p class="confirmation__eyebrow">Cases</p>
                <h3>Delete file</h3>
                <p>Are you sure you want to delete this file?</p>
                <div class="confirmation__actions">
                    <button class="help-button help-button--ghost" type="button" onclick={closeConfirmation}>Cancel</button>
                    <button class="help-button confirmation__action--primary" type="button" onclick={handleConfirmDeleteFile}>
                        Delete
                    </button>
                </div>
            </section>
        </div>
    </template>

    <template lwc:if={isActionPending}>
        <c-mbpr_loader label="Working"></c-mbpr_loader>
    </template>
</template>
