<template>
    <c-mbp_customspinner is-loading={isLoading}></c-mbp_customspinner>
    <c-mbp_customshowtoast></c-mbp_customshowtoast>

    <div class="case-management-container">
    
        <!-- Mobile View - Cards Layout -->
        <template if:true={isMobile}>
            <!-- Mobile Filter Section -->
            <div class="filter-wrapper mobile-filter-wrapper">
                <img src={filterIcon} class="filter-icon" alt="Filter" onclick={toggleFilterBox} />
                <div class={filterBoxClass} onmousedown={stopEvent}>
                    <div class="mobile-filter-header">
                        <span class="mobile-filter-title">Request Filters</span>
                    
                        <button class="mobile-filter-close"
                                onclick={toggleFilterBox}
                                aria-label="Close Request Filters">
                            ✕
                        </button>
                    </div>

                    <lightning-input label="Search Request" class="placeholder mb-2" data-id="searchKey"
                        value={filters.searchKey} placeholder="Request Number, Type, Sub Type, Status"
                        onchange={handleFilterChange}>
                    </lightning-input>
    
                    <lightning-combobox label="Status" class="placeholder mb-2" data-id="status" value={filters.status}
                        options={statusOptions} onchange={handleFilterChange}>
                    </lightning-combobox>
    
                    <lightning-combobox label="Type" class="placeholder mb-2" data-id="type" value={filters.type}
                        options={typeOptions} onchange={handleFilterChange}>
                    </lightning-combobox>
    
                    <lightning-combobox label="Sub Type" class="placeholder mb-2" data-id="subType" 
                        value={filters.subType} options={filteredSubTypeOptions} onchange={handleFilterChange}>
                    </lightning-combobox>
    
                    <lightning-input type="date" class="placeholder mb-2" label="Start Date" data-id="startDate"
                        value={filters.startDate} onchange={handleFilterChange}>
                    </lightning-input>
    
                    <lightning-input type="date" class="placeholder mb-2" label="End Date" data-id="endDate"
                        value={filters.endDate} onchange={handleFilterChange}>
                    </lightning-input>
    
                    <div class="button-row filter-buttons">
                        <button class="reset-btn" onclick={resetFilters}>Reset</button>
                        <button class="apply-btn" onclick={applyFilters}>Apply</button>
                    </div>
                </div>
            </div>
    
            <!-- Mobile Cards -->
            <div class="mobile-cards-container">
                <template for:each={filteredRequests} for:item="request">
                    <div key={request.Id} class="slds-card case-card">
                        <!-- Card Header -->
                        <div class="case-card-header">
                            <div class="case-header-left">
                                <h3 class="case-number">{request.Name}</h3>
                            </div>
                            <div class="case-header-right">
                                <template if:true={request.isDraft}>
                                    <lightning-button-icon
                                        icon-name="utility:edit"
                                        alternative-text="Edit Request"
                                        title="Edit Request"
                                        onclick={handleEditClick}
                                        data-id={request.Id}
                                        class="slds-m-right_small">
                                    </lightning-button-icon>
                                </template>
                                <span class="case-status {request.StatusClass}">
                                    {request.Status__c}
                                </span>
                            </div>
                        </div>
            
                        <!-- Card Body -->
                        <div class="slds-card__body slds-card__body_inner case-card-body">
                            <div class="slds-grid slds-wrap">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 case-field">
                                    <label class="slds-text-title_caps">Type:</label>
                                    <span class="slds-text-body_regular">{request.Request_Type__c}</span>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 case-field">
                                    <label class="slds-text-title_caps">Sub Type:</label>
                                    <span class="slds-text-body_regular">{request.Request_SubType__c}</span>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 case-field">
                                    <label class="slds-text-title_caps">Priority:</label>
                                    <span class={request.priorityClass}>
                                        {request.Priority__c}
                                    </span>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 case-field">
                                    <label class="slds-text-title_caps">Created Date:</label>
                                    <span class="slds-text-body_regular">{request.formattedCreatedDate}</span>
                                </div>
                                <div class="slds-col slds-size_1-of-1 case-field">
                                    <label class="slds-text-title_caps">Description:</label>
                                    <span class="slds-text-body_regular">{request.Description__c}</span>
                                </div>
                                <div class="slds-col slds-size_1-of-1 case-field">
                                    <label class="slds-text-title_caps">Created By:</label>
                                    <span class="slds-text-body_regular">{request.createdBy}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            
                <template if:true={noFilteredRequests}>
                    <div class="no-cases-message">
                        No requests found matching your criteria.
                    </div>
                </template>
            
                <!-- Bottom Buttons -->
                <div class="mobile-action-buttons-bottom">
                    <button type="button" class="slds-button slds-button_brand mobile-raise-btn" onclick={openCreateRequestModal}>
                        + Create Request
                    </button>
                    <button type="button" class="slds-button slds-button_outline-brand mobile-export-btn" onclick={handleExport}>
                        Export Requests
                    </button>
                </div>
            </div>
        </template>

        <!-- Desktop View -->
        <template if:false={isMobile}>
            <!-- Floating Filter Box -->
            <div class="filter-wrapper">
                <img src={filterIcon} class="filter-icon" alt="Filter" onclick={toggleFilterBox} />
                <div class={filterBoxClass} onmousedown={stopEvent}>
                    <b>Request Filters</b>
                    <lightning-input class="placeholder mb-2 search-input" label="Search Request" data-id="searchKey"
                        value={filters.searchKey} onchange={handleFilterChange}
                        placeholder="Request Number, Type, Sub Type, Status"></lightning-input>
                    <lightning-combobox class="placeholder mb-2" label="Status" data-id="status" value={filters.status}
                        options={statusOptions} onchange={handleFilterChange}></lightning-combobox>
                    <lightning-combobox class="placeholder mb-2" label="Type" data-id="type" value={filters.type}
                        options={typeOptions} onchange={handleFilterChange}></lightning-combobox>
                    <lightning-combobox class="placeholder mb-2" label="Sub Type" data-id="subType" 
                        value={filters.subType} options={filteredSubTypeOptions} onchange={handleFilterChange}>
                    </lightning-combobox>
                    <lightning-input type="date" class="placeholder mb-2" label="Start Date" data-id="startDate"
                        value={filters.startDate} onchange={handleFilterChange}>
                    </lightning-input>
                    <lightning-input type="date" class="placeholder mb-2" label="End Date" data-id="endDate"
                        value={filters.endDate} onchange={handleFilterChange}>
                    </lightning-input>
                    <div class="button-row filter-buttons">
                        <button class="reset-btn" onclick={resetFilters}>Reset</button>
                        <button class="apply-btn" onclick={applyFilters}>Apply</button>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="case-toolbar">
                <div class="button-container">
                    <button type="button" class="slds-button slds-button_brand" title="Create request" onclick={openCreateRequestModal}>
                        + Create Request
                    </button>
                    <lightning-button label="Export Requests" variant="brand" onclick={handleExport}></lightning-button>
                </div>
            </div>

            <!-- Data Table -->
            <c-mbp_adaptivedata-table
                title="Broker Requests"
                records={filteredRequests}
                columns={requestColumns}
                page-size="10"
                onrowaction={handleRowAction}>
            </c-mbp_adaptivedata-table>
        </template>

        <!-- Create / Edit Request Modal -->
        <template if:true={showCreateRequestModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open small-confirmation-modal">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title">{modalTitle}</h2>
                        <template if:true={isMobile}>
                            <button class="mobile-modal-close" onclick={closeCreateRequestModal} title="Close">
                                ✕
                            </button>
                        </template>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox label="Type" name="Request_Type__c"
                            value={newRequest.Request_Type__c} placeholder="Select Type"
                            options={typeOptions} onchange={handleInputChange} class="placeholder" required
                            message-when-value-missing="Please select a type">
                        </lightning-combobox>
                        <template if:true={errors.Request_Type__c}>
                            <div class="slds-form-element__help slds-text-color_error">
                                {errors.Request_Type__c}
                            </div>
                        </template>

                        <lightning-combobox label="Sub Type" name="Request_SubType__c" value={newRequest.Request_SubType__c}
                            placeholder="Select Sub Type" options={requestSubTypeOptions} onchange={handleInputChange} class="placeholder"
                            required message-when-value-missing="Please select a sub type" disabled={isSubTypeDisabled}>
                        </lightning-combobox>

                        <template if:true={errors.Request_SubType__c}>
                            <div class="error-message slds-m-top_x-small">{errors.Request_SubType__c}</div>
                        </template>

                        <lightning-textarea label="Description" name="Description__c" value={newRequest.Description__c}
                            onchange={handleInputChange} class="placeholder" required>
                        </lightning-textarea>
                        <template if:true={errors.Description__c}>
                            <div class="error-message slds-m-top_x-small">{errors.Description__c}</div>
                        </template>

                        <lightning-combobox label="Priority" name="Priority__c" value={newRequest.Priority__c}
                            placeholder="Select Priority" options={priorityOptions} onchange={handleInputChange} 
                            class="placeholder" required message-when-value-missing="Please select priority">
                        </lightning-combobox>
                        <template if:true={errors.Priority__c}>
                            <div class="error-message slds-m-top_x-small">{errors.Priority__c}</div>
                        </template>

                        <!-- File Uploads Section -->
                        <template if:true={requestFiles.length}>
                            <div class="slds-m-top_medium">
                                <h2 class="attached-files-header">Attached Files</h2>
                                <ul class="slds-list_dotted">
                                    <template for:each={requestFiles} for:item="file">
                                        <li key={file.id} class="slds-list__item">
                                            <div class="slds-file">
                                                <span class="slds-file__text">
                                                    <span class="slds-file__title">{file.title}</span>
                                                </span>
                                                <div class="file-actions">
                                                    <lightning-button-icon icon-name="utility:preview" variant="bare"
                                                        alternative-text="Preview file"
                                                        onclick={handlePreviewExistingFile} data-id={file.id}>
                                                    </lightning-button-icon>
                                                    <lightning-button-icon icon-name="utility:delete" variant="bare"
                                                        alternative-text="Delete file"
                                                        onclick={handleDeleteExistingFile} data-id={file.id}>
                                                    </lightning-button-icon>
                                                </div>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>

                        <lightning-input type="file" label="Upload New File" accept=".pdf,.jpg,.jpeg,.png"
                            onchange={handleFileUpload} class="slds-m-bottom_small">
                        </lightning-input>
                        <template if:true={uploadedFile}>
                            <div class="file-preview slds-m-top_small">
                                <span>File to upload: {uploadedFile.name}</span>
                                <lightning-button-icon icon-name="utility:preview" variant="bare"
                                    alternative-text="Preview file" onclick={previewFile}>
                                </lightning-button-icon>
                                <lightning-button-icon icon-name="utility:delete" variant="bare"
                                    alternative-text="Remove file" onclick={handleDeleteFile}>
                                </lightning-button-icon>
                            </div>
                        </template>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" variant="neutral" onclick={closeCreateRequestModal} class="mr-2">
                        </lightning-button>
                        <lightning-button label={submitButtonLabel} variant="brand" onclick={submitRequest} disabled={isLoading}
                            class="ml-2">
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
