<template>
    <lightning-card>
        <div class="slds-p-horizontal_medium slds-text-align_center slds-is-relative" style="min-height: 150px;">
            <template lwc:if={isLoading}>
                <lightning-spinner 
                    alternative-text="Booking Initiated..." 
                    size="medium"
                    variant="brand">
                </lightning-spinner>
            </template>

            <div class="slds-var-m-bottom_medium">
                <lightning-button label="Modon Pay" variant="brand" onclick={handleModonPay}></lightning-button>
            </div>
            
            <template lwc:if={countdown}>
                <div class={timerClass}>
                    <span style="font-size:2rem; font-weight:bold; font-family: monospace;">
                        {countdown}
                    </span>
                </div>
                <p class="slds-var-m-top_small slds-var-m-bottom_medium"><strong>Booking SLA End:</strong> {formattedSlaEnd}</p>
                
                <div class="slds-grid slds-wrap slds-text-align_left slds-border_top slds-var-p-top_medium">
                    
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_small">
                        <div class="slds-box slds-theme_shade">
                            <h3 class="slds-text-heading_small slds-var-m-bottom_small slds-text-color_weak">ADM & Dari Fee</h3>
                            <p><strong>Total Amount:</strong> {admDariTotalAmount}</p>
                            <p><strong>Paid Amount:</strong> {admDariPaidAmount}</p>
                            <p><strong>Balance Amount:</strong> {admDariBalanceAmount}</p>
                            <p><strong>Fee Status:</strong> <lightning-badge label={admDariFeeStatus}></lightning-badge></p>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-around_small">
                        <div class="slds-box slds-theme_shade">
                            <h3 class="slds-text-heading_small slds-var-m-bottom_small slds-text-color_weak">Down Payment</h3>
                            <p><strong>Total Amount:</strong> {downPaymentTotalAmount}</p>
                            <p><strong>Paid Amount:</strong> {downPaymentPaidAmount}</p>
                            <p><strong>Balance Amount:</strong> {downPaymentBalanceAmount}</p>
                            <p><strong>Fee Status:</strong> <lightning-badge label={downPaymentFeeStatus}></lightning-badge></p>
                        </div>
                    </div>

                </div>
            </template>

            <template lwc:else>
                <p class="slds-text-color_weak">No Data.</p>
            </template>
        </div>        
    </lightning-card>     
</template>
