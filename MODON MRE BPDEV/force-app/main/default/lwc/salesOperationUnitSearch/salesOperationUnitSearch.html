<template>
    <lightning-card title="Unit Search">
        
        <div class="slds-p-around_medium slds-align_absolute-center">
            
            <div class="slds-grid slds-gutters slds-align_absolute-center">

                <!-- Input -->
                <div>
                    <lightning-input 
                        label="Search Unit"
                        value={searchKey}
                        onchange={handleChange}>
                    </lightning-input>
                </div>

                <!-- Button -->
                <div class="slds-m-top_large">
                    <lightning-button 
                        label="Search" 
                        variant="brand"
                        onclick={handleSearch}>
                    </lightning-button>
                </div>

            </div>
        </div>

        <!-- Results -->
        <template if:true={results}>
            <template for:each={results} for:item="unit">
                <div key={unit.Id} class="slds-p-horizontal_medium">
                    
                    <!-- Clickable Link -->
                    <a href="javascript:void(0);" 
                       data-id={unit.Id} 
                       onclick={navigateToRecord}>
                        {unit.Name}
                    </a>

                </div>
            </template>
        </template>

        <!-- No Results -->
        <template if:true={noResult}>
            <div class="slds-p-around_medium">
                No results found
            </div>
        </template>

    </lightning-card>
</template>
