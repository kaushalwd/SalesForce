<template>
    <c-mbp_customspinner is-loading={isLoading}></c-mbp_customspinner>

    <c-mbp_customshowtoast lwc:ref="toast"></c-mbp_customshowtoast>
    <!-- MOBILE CONTAINER -->
    <div class="mobile-container" if:true={isMobileView}>

        <!-- Mobile tab switching is handled by the header (hamburger) menu via
             /Leads?view=leads|opportunities|eoi, so no in-page tab bar is needed. -->

        <!-- Manage Leads Tab Mobile -->
        <div if:true={isManageLeadsActive}>

            <!-- Mobile Filter Button -->
            <div class="filter-wrapper" style="margin-bottom: 15px;">
                <img src={filterIcon} alt="Filter" class="filter-icon" onclick={openMobileFilter}
                    style="position: relative; top: 0; right: 0;" />
            </div>

            <!-- Preselected Units Indicator -->
            <div if:true={hasPreselectedUnits}>
                <div class="preselected-units-indicator" style="margin: 10px 0;">
                    <lightning-badge label={preselectedUnitsLabel} class="slds-badge_lightest"></lightning-badge>
                </div>
            </div>

            <!-- Mobile Lead Cards -->
            <div if:true={mobileLeads.length}>
                <div for:each={mobileLeads} for:item="lead" key={lead.Id}>
                    <div class="mobile-lead-card">
                        <div class="mobile-lead-card-header">
                            <div class="mobile-lead-info">
                                <div class="mobile-lead-name">
                                    {lead.FirstName} {lead.LastName}
                                </div>
                                <div class="mobile-lead-contact">{lead.Email}</div>
                                <div class="mobile-lead-contact">{lead.Mobile}</div>
                                <div class="mobile-lead-id">{lead.LeadNumber}</div>
                            </div>

                            <div class="mobile-lead-actions">
                                <button class="mobile-action-btn view" data-id={lead.Id} onclick={handleMobileViewLead}>
                                    <svg class="eye-icon" viewBox="0 0 24 24">
                                        <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 
                 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z" />
                                    </svg>
                                </button>

                                <!--  <button class="mobile-action-btn edit" data-id={lead.Id} onclick={handleMobileEditLead}>
                                    <svg class="pencil-icon" viewBox="0 0 24 24">
                                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 
                                                                7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a1 
                                                                1 0 0 0-1.41 0L15.13 5.12l3.75 3.75 1.83-1.83z" />
                                    </svg>
                                </button>-->
                            </div>
                        </div>

                        <div class="mobile-lead-details">
                            <div class="mobile-detail-row">
                                <span class="mobile-detail-label">Status</span>
                                <span class="mobile-detail-value">{lead.Status}</span>
                            </div>

                            <div class="mobile-detail-row">
                                <span class="mobile-detail-label">Description</span>
                                <span class="mobile-detail-desc"
                                    style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                    {lead.Description}
                                </span>
                            </div>
                        </div>

                        <!-- In mobile-lead-card template, SIMPLY CHANGE THIS: -->
                        <div class="mobile-lead-select">
                            <label style="display: flex; align-items: center; gap: 10px;">
                                <!-- CHANGE THIS ONE LINE: checkbox → radio -->
                                <input type="radio" data-lead-id={lead.Id} onchange={handleMobileLeadSelect}
                                    checked={lead.isSelected} name="mobileLeadSelection">

                                Select for Generate Offer
                            </label>
                        </div>

                    </div>
                </div>

            </div>

            <!-- Mobile Pagination -->
            <div class="mobile-pagination">
                <button class="mobile-pagination-btn" onclick={handleMobilePrevPage} disabled={isPrevDisabled}>
                    Previous
                </button>

                <span class="mobile-pagination-info">
                    Page {mobileCurrentPage} of {mobileTotalPages}
                </span>

                <button class="mobile-pagination-btn" onclick={handleMobileNextPage} disabled={isNextDisabled}>
                    Next
                </button>
            </div>


            <!-- Mobile Action Bar -->
            <div class="mobile-bottom-buttons">
                <template if:true={showAddLeadButton}>
                    <button class="mobile-action-btn-large primary" onclick={openMobileAddLead}>
                        Add Lead
                    </button>
                </template>
                <button class="mobile-action-btn-large primary" onclick={handleExport}>
                    Export
                </button>
                <!--button class="mobile-action-btn-large primary" onclick={openMobileGenerateOffer}
                    data-disabled={isUnitSearchDisabled}>
                    Generate Offer
                </button-->

                <button class={mobileGenerateOfferBtnClass} onclick={openMobileGenerateOffer}
                    disabled={isUnitSearchDisabled}>
                    Generate Offer
                </button>
            </div>


        </div>



        <!-- Lead Details View Mobile -->
        <div if:true={showMobileLeadDetails}>
            <div class="mobile-modal-overlay">
                <div class="mobile-modal" style="max-height: 90vh; overflow-y: auto;">
                    <div class="mobile-modal-header">
                        <div class="mobile-modal-title">Lead Overview</div>
                        <button class="mobile-modal-close" onclick={closeMobileLeadDetails}>×</button>
                    </div>

                    <div class="mobile-modal-body">
                        <!-- Overview Card -->
                        <div class="mobile-overview-card">
                            <div class="mobile-overview-header">
                                <div class="mobile-overview-title">Lead Information</div>
                            </div>

                            <div class="mobile-lead-details">
                                <div class="mobile-detail-row">
                                    <span class="mobile-detail-label">Title</span>
                                    <span class="mobile-detail-value">{selectedLead.Salutation}</span>
                                </div>
                                <div class="mobile-detail-row">
                                    <span class="mobile-detail-label">First Name</span>
                                    <span class="mobile-detail-value">{selectedLead.FirstName}</span>
                                </div>
                                <div class="mobile-detail-row">
                                    <span class="mobile-detail-label">Last Name</span>
                                    <span class="mobile-detail-value">{selectedLead.LastName}</span>
                                </div>
                                <div class="mobile-detail-row">
                                    <span class="mobile-detail-label">Mobile</span>
                                    <span class="mobile-detail-value">{selectedLead.Mobile}</span>
                                </div>
                                <div class="mobile-detail-row">
                                    <span class="mobile-detail-label">Emirates ID</span>
                                    <span class="mobile-detail-value">{selectedLead.EIDNumber}</span>
                                </div>
                                <div class="mobile-detail-row">
                                    <span class="mobile-detail-label">Emirates ID Expiry</span>
                                    <span class="mobile-detail-value">{selectedLead.EmiratesIDExpiryDate}</span>
                                </div>
                                <div class="mobile-detail-row">
                                    <span class="mobile-detail-label">Passport Number</span>
                                    <span class="mobile-detail-value">{selectedLead.PassportNumber}</span>
                                </div>
                                <div class="mobile-detail-row">
                                    <span class="mobile-detail-label">Passport Expiry</span>
                                    <span class="mobile-detail-value">{selectedLead.PassportExpiryDate}</span>
                                </div>
                                <div class="mobile-detail-row">
                                    <span class="mobile-detail-label">Passport Issue Date</span>
                                    <span class="mobile-detail-value">{selectedLead.PassportIssueDate}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Lead Information Table -->
                        <div class="mobile-overview-card">
                            <div class="mobile-overview-header">
                                <div class="mobile-overview-title">Lead Records</div>
                            </div>

                            <div class="mobile-child-leads-container">
                                <div class="mobile-child-leads-container">
                                    <template if:true={processedChildLeads.length}>
                                        <template for:each={processedChildLeads} for:item="child">
                                            <div key={child.Id} class="mobile-child-lead-card">
                                                <div class="mobile-child-lead-header">
                                                    <div class="mobile-child-lead-title">
                                                        <span class={child.statusClass}>
                                                            {child.Status}
                                                        </span>
                                                    </div>
                                                    <template if:true={child.showEditButton}>
                                                        <button class="mobile-edit-button" data-id={child.Id}
                                                            onclick={handleMobileEditChildLead}>
                                                            <svg class="pencil-icon" viewBox="0 0 24 24">
                                                                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 
                                                            7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a1 
                                                            1 0 0 0-1.41 0L15.13 5.12l3.75 3.75 1.83-1.83z" />
                                                            </svg>
                                                        </button>
                                                    </template>
                                                </div>

                                                <div class="mobile-child-lead-content">

                                                    <!-- Row 1: Lead Number + Project -->
                                                    <div class="mobile-child-field-group">
                                                        <div class="mobile-child-field">
                                                            <span class="field-label">Lead Number:</span>
                                                            <span class="field-value">{child.LeadNumber}</span>
                                                        </div>
                                                        <div class="mobile-child-field">
                                                            <span class="field-label">Project:</span>
                                                            <span
                                                                class="field-value highlight">{child.formattedProject}</span>
                                                        </div>
                                                    </div>

                                                    <!-- Row 2: Unit Type -->
                                                    <div class="mobile-child-field-group">
                                                        <div class="mobile-child-field full-width">
                                                            <span class="field-label">Unit Type:</span>
                                                            <span class="field-value">{child.formattedUnitType}</span>
                                                        </div>
                                                    </div>

                                                </div>

                                            </div>
                                        </template>
                                    </template>
                                </div>
                                <template if:false={childLeads.length}>
                                    <div class="no-child-leads">
                                        <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                        <p>No child leads found</p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Manage Opportunities Tab -->
        <template if:true={isManageOppsActive}>
            <div class="overview-wrapper">
                <c-mbp_manage-opportunities></c-mbp_manage-opportunities>
            </div>
        </template>

   <template if:true={enableEOI}>
    <template if:true={isManageEOIActive}>
        <div class="overview-wrapper">
            <c-mbp-manage-expression-of-interests>
            </c-mbp-manage-expression-of-interests>
        </div>
    </template>
</template>

        <!-- Mobile Filter Modal -->
        <div if:true={showMobileFilter}>
            <div class="mobile-modal-overlay">
                <div class="mobile-filter-box">
                    <div class="mobile-filter-header">
                        <div class="mobile-modal-title">Filter Leads</div>
                        <button class="mobile-modal-close" onclick={closeMobileFilter}>×</button>
                    </div>

                    <div class="mobile-filter-body">
                        <div class="mobile-filter-field">
                            <lightning-input label="Search Lead" placeholder="Name, Mobile, Email"
                                value={filters.searchKey} onchange={handleFilterChange} data-id="searchKey">
                            </lightning-input>
                        </div>

                        <div class="mobile-filter-field">
                            <lightning-combobox label="Status" options={statusOptions} value={filters.status}
                                onchange={handleFilterChange} data-id="status">
                            </lightning-combobox>
                        </div>

                        <div class="mobile-filter-field">
                            <lightning-input type="date" label="Start Date" value={filters.startDate}
                                onchange={handleFilterChange} data-id="startDate">
                            </lightning-input>
                        </div>

                        <div class="mobile-filter-field">
                            <lightning-input type="date" label="End Date" value={filters.endDate}
                                onchange={handleFilterChange} data-id="endDate">
                            </lightning-input>
                        </div>
                    </div>

                    <div class="mobile-modal-footer">
                        <button class="mobile-action-btn-large secondary" onclick={resetFilters} style="flex: 1;">
                            Reset
                        </button>
                        <button class="mobile-action-btn-large primary" onclick={applyMobileFilters} style="flex: 1;">
                            Apply
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Add Lead Modal -->
        <!-- Mobile Add Lead Modal -->
        <div if:true={showMobileAddModal}>

            <div class="mobile-modal-overlay">
                <div class="mobile-modal" style="max-height: 100vh;">
                    <div class="mobile-modal-header">
                        <div class="mobile-modal-title">Add Lead</div>
                        <button class="mobile-modal-close" onclick={closeMobileAddLead}>×</button>
                    </div>

                    <div class="mobile-modal-body">
                        <div style="display: flex; flex-direction: column; gap:10px;">
                            <!-- Lead Information -->
                            <h3 class="section-title">Lead Information</h3>

                            <!-- Lead Type Field -->
                            <lightning-combobox label="Lead Type" name="leadType" value={leadType}
                                options={leadTypeOptions} onchange={handleChange} required>
                            </lightning-combobox>

                            <!-- Individual Lead Fields -->
                            <template if:true={isIndividual}>
                                <lightning-combobox label="Title" options={titleOptions} value={title}
                                    onchange={handleChange} name="title" required>
                                </lightning-combobox>

                                <lightning-input label="First Name" value={firstName} onchange={handleChange}
                                    name="firstName" required>
                                </lightning-input>

                                <lightning-input label="Last Name" value={lastName} onchange={handleChange}
                                    name="lastName" required>
                                </lightning-input>
                            </template>

                            <!-- Organization Lead Fields -->
                            <template if:true={isOrganization}>
                                <!-- <lightning-input label="Company" value={company} onchange={handleChange} name="company"
                                    required>
                                </lightning-input> -->


                                <lightning-input label="First Name" value={firstName} onchange={handleChange}
                                    name="firstName" required>
                                </lightning-input>

                                <lightning-input label="Last Name" value={lastName} onchange={handleChange}
                                    name="lastName" required>
                                </lightning-input>

                                <lightning-input label="Organization Name" value={orgName} onchange={handleChange}
                                    name="orgName" required>
                                </lightning-input>

                                <!--  <lightning-input label="Trade License Number" value={tradeNumber}
                                    onchange={handleChange} name="tradeNumber" required>
                                </lightning-input>-->
                                                                <lightning-input label="Trade License Number" value={unifiedNumber} onchange={handleChange}
                                    name="unifiedNumber" required>
                                </lightning-input>

                                <!-- VAT Certificate Type -->
                                <lightning-combobox label="VAT Certificate Type" name="vatCertificateType"
                                    value={vatCertificateType} options={vatCertificateOptions}
                                    onchange={handleVatCertificateTypeChange} required>
                                </lightning-combobox>

                                <!-- VAT Registration Number -->
                                <template if:true={showVatRegNumber}>
                                    <lightning-input label="UAE VAT Registration Number" value={uaevatregisternumber}
                                        onchange={handleChange} name="uaevatregisternumber" required>
                                    </lightning-input>
                                </template>

                                <!-- VAT Undertaking Template Download -->
                                <template if:true={showDummyVatLink}>
                                    <div class="kyc-download-box">
                                        <div class="kyc-download-header">
                                            <lightning-icon icon-name="doctype:pdf" alternative-text="VAT PDF"
                                                size="small" class="kyc-icon">
                                            </lightning-icon>
                                            <h2 class="kyc-title">VAT Undertaking Certificate</h2>
                                        </div>
                                        <p class="kyc-description">
                                            Please download the VAT Undertaking certificate, sign it, and upload it
                                            below.
                                        </p>
                                        <div class="kyc-download-link">
                                            <a onclick={downloadVAT} class="kyc-button">Download Template (PDF)</a>
                                        </div>
                                    </div>
                                </template>

                                <!-- VAT File Upload -->
                                <lightning-input type="file" label={vatUploadLabel} onchange={handleVatFileUpload}
                                    required>
                                </lightning-input>

                                <template if:true={uploadedVatFileName}>
                                    <div class="uploaded-file">
                                        <p class="file-name">{uploadedVatFileName}</p>
                                        <lightning-icon icon-name="utility:delete" onclick={handleDeleteVatFile}
                                            size="x-small" class="delete-icon">
                                        </lightning-icon>
                                    </div>
                                </template>

                                <template if:true={deleteVatFile}>
                                    <div class="uploaded-file">
                                        <a href={vatFileUrl} target="_blank">{vatFileName}</a>
                                        <lightning-icon icon-name="utility:delete" onclick={handleDeleteVatFile1}
                                            size="x-small" class="delete-icon">
                                        </lightning-icon>
                                    </div>
                                </template>
                            </template>

                            <!-- Email with Validation -->
                            <div class="form-btn" style="display: flex; gap: 10px; align-items: flex-end;">
                                <lightning-input label="Email" value={email} onchange={handleChange} name="email"
                                    required style="flex: 1;">
                                </lightning-input>
                                <button class="slds-button slds-button_brand" onclick={handleEmailValidation}
                                    data-disabled={emailValidating}>
                                    {emailButtonLabel}
                                </button>
                            </div>

                            <!-- Mobile with Validation -->
                            <div class="form-btn" style="display: flex; gap: 10px; align-items: flex-end;">
                                <lightning-input label="Mobile (Include country Code e.g. +971)" value={mobile}
                                    onchange={handleChange} name="mobile" required style="flex: 1;">
                                </lightning-input>
                                <button class="slds-button slds-button_brand" onclick={handleMobileValidation}
                                    data-disabled={mobileValidating}>
                                    {mobileButtonLabel}
                                </button>
                            </div>

                            <!-- Resident Status -->
                            <lightning-combobox label="UAE Resident Status" options={uaeResidentOptions}
                                value={uaeResidentStatus} onchange={handleUaeChange} name="uaeResidentStatus" required>
                            </lightning-combobox>

                            <!-- Country of Residence -->
                            <lightning-combobox label="Country of Residence" options={countryOfResidenceOptions}
                                value={countryOfResidence} onchange={handleChange} name="countryOfResidence" required>
                            </lightning-combobox>

                            <!-- Nationality -->
                            <lightning-combobox label="Nationality" options={nationalityOptions} value={nationality}
                                onchange={handleChange} name="nationality" required>
                            </lightning-combobox>

                            <!-- Description -->
                            <lightning-textarea label="Description" name="Description" value={Description}
                                placeholder="Unit number, Building Name, Project Name" onchange={handleChange}>
                            </lightning-textarea>

                            <!-- Property Details -->
                            <h3 class="section-title">Property Details</h3>

                            <!-- Sales Origin -->
                            <lightning-combobox label="Sales Origin" options={salesOriginOptions} value={salesOrigin}
                                onchange={handleChange} name="salesOrigin" required>
                            </lightning-combobox>

                            <!-- Lead Origin -->
                            <lightning-combobox label="Lead Origin" options={leadOriginOptions} value={leadOrigin}
                                onchange={handleChange} name="leadOrigin" required>
                            </lightning-combobox>

                            <!-- Sales Type -->
                            <lightning-combobox label="Sales Type" options={salesTypeOptions} value={salesType}
                                onchange={handleChange} name="salesType" required>
                            </lightning-combobox>

                            <!-- Project Name -->
                            <lightning-combobox label="Project Name" value={projectName} options={Projectoptions}
                                onchange={handleChange} name="projectName" required>
                            </lightning-combobox>

                            <!-- Number of Bedrooms -->
                            <lightning-combobox label="Number of Bedrooms" options={numberOfBedsOptions}
                                value={numberOfBeds} onchange={handleChange} name="numberOfBeds" required>
                            </lightning-combobox>

                            <!-- Unit Type -->
                            <lightning-combobox label="Unit Type" options={unitTypeOptions} value={unitType}
                                onchange={handleChange} name="unitType" required>
                            </lightning-combobox>

                            <!-- Purpose of Use -->
                            <lightning-combobox label="Purpose of Use" options={purposeOfUseOptions}
                                value={purposeOfUse} onchange={handleChange} name="purposeOfUse" required>
                            </lightning-combobox>

                            <!-- Customer Budget -->
                            <lightning-combobox label="Customer Budget" options={customerBudgetOptions}
                                value={customerBudget} onchange={handleChange} name="customerBudget" required>
                            </lightning-combobox>

                            <!-- Document Upload -->
                            <h3 class="section-title">Document Upload</h3>

                            <!-- KYC Form -->
                            <div class="kyc-download-box">
                                <div class="kyc-download-header">
                                    <lightning-icon icon-name="utility:description" alternative-text="KYC Form"
                                        size="small" class="kyc-icon">
                                    </lightning-icon>
                                    <h2 class="kyc-title">KYC Form</h2>
                                </div>
                                <p class="kyc-description">
                                    Please download the KYC form, fill it carefully and re-upload it under the
                                    <b>KYC File Upload</b> section.
                                </p>
                                <div class="kyc-download-link">
                                    <a href={kycFormUrl} download="KYC Form.docx" class="kyc-button">
                                        Download Complete KYC Form
                                    </a>
                                </div>
                            </div>

                            <!-- Emirates ID Fields (shown for UAE Residents) -->
                            <div if:true={showUaeFields}>
                                <lightning-input label="Emirates ID" value={emiratesId} onchange={handleChange}
                                    name="emiratesId" required>
                                </lightning-input>

                                <lightning-input type="date" label="Emirates ID Expiry" value={emiratesIdExpiry}
                                    onchange={handleChange} name="emiratesIdExpiry" required>
                                </lightning-input>

                                <lightning-input type="file" label="Upload Emirates ID FrontSide"
                                    onchange={handleEmiratesFileUpload} required>
                                </lightning-input>

                                <div if:true={uploadedEmiratesFileName}>
                                    <div class="uploaded-file">
                                        <p class="file-name">{uploadedEmiratesFileName}</p>
                                        <lightning-icon icon-name="utility:delete" alternative-text="Delete"
                                            title="Delete File" onclick={handleDeleteEmiratesFile} class="delete-icon"
                                            size="x-small">
                                        </lightning-icon>
                                    </div>
                                </div>

                                <lightning-input type="file" label="Upload Emirates ID BackSide"
                                    onchange={handleEmiratesFileUploadbackside} required>
                                </lightning-input>

                                <div if:true={uploadedEmiratesFileNamebackside}>
                                    <div class="uploaded-file">
                                        <p class="file-name">{uploadedEmiratesFileNamebackside}</p>
                                        <lightning-icon icon-name="utility:delete" alternative-text="Delete"
                                            title="Delete File" onclick={handleDeleteEmiratesFilebackside}
                                            class="delete-icon" size="x-small">
                                        </lightning-icon>
                                    </div>
                                </div>
                            </div>

                            <!-- Passport Fields (shown for Non-Residents) -->
                            <div if:true={showPassportFields}>
                                <lightning-input label="Passport Number" value={passportNumber} onchange={handleChange}
                                    name="passportNumber" required>
                                </lightning-input>

                                <lightning-input type="date" label="Passport Issuance Date" value={passportIssuance}
                                    onchange={handleChange} name="passportIssuance" required>
                                </lightning-input>

                                <lightning-input type="date" label="Passport Expiry Date" value={passportExpiry}
                                    onchange={handleChange} name="passportExpiry" required>
                                </lightning-input>

                                <lightning-input type="file" label="Upload Passport FrontSide"
                                    onchange={handlePassportFileUpload} required>
                                </lightning-input>

                                <div if:true={uploadedPassportFileName}>
                                    <div class="uploaded-file">
                                        <p class="file-name">{uploadedPassportFileName}</p>
                                        <lightning-icon icon-name="utility:delete" alternative-text="Delete"
                                            title="Delete File" onclick={handleDeletePassportFile} class="delete-icon"
                                            size="x-small">
                                        </lightning-icon>
                                    </div>
                                </div>

                                <lightning-input type="file" label="Upload Passport BackSide"
                                    onchange={handlePassportFileUploadbackside} required>
                                </lightning-input>

                                <div if:true={uploadedPassportFileNamebackside}>
                                    <div class="uploaded-file">
                                        <p class="file-name">{uploadedPassportFileNamebackside}</p>
                                        <lightning-icon icon-name="utility:delete" alternative-text="Delete"
                                            title="Delete File" onclick={handleDeletePassportFilebackside}
                                            class="delete-icon" size="x-small">
                                        </lightning-icon>
                                    </div>
                                </div>
                            </div>

                            <!-- KYC File Upload -->
                            <lightning-input type="file" label="Upload KYC Form" onchange={handleKycFileUpload}
                                required>
                            </lightning-input>

                            <div if:true={uploadedKycFileName}>
                                <div class="uploaded-file">
                                    <p class="file-name">{uploadedKycFileName}</p>

<!-- Enhanced Unit Search Modal -->
<template if:true={showUnitSearchModal}>
    <div class="unit-search-backdrop">
        <div class="generate-offer-modal-container">

            <div class="modal unit-search-modal" style="max-width: 100%; width: 100%; height: 100vh;">

                <!-- Header -->
                <div class="modal-header">
                    <h2>Generate Sales Offer</h2>
                    <span class="close-button" onclick={closeUnitSearch}>×</span>
                </div>

                <!-- Progress Steps -->
                <!-- Custom Progress Steps -->
                <div class="custom-progress-container">
                    <div class="custom-progress-bar">
                        <div class="custom-progress-fill" style={progressFillStyle}></div>
                    </div>

                    <div class="custom-steps">
                        <div class="custom-step" data-step="1" onclick={handleStepClick}>
                            <div class={stepOneClass}>
                                <span class="step-number">1</span>
                            </div>
                            <span class="step-label">Select Units</span>
                        </div>

                        <div class="custom-step" data-step="2" onclick={handleStepClick}>
                            <div class={stepTwoClass}>
                                <span class="step-number">2</span>
                            </div>
                            <span class="step-label">Payment Selection</span>
                        </div>

                        <div class="custom-step" data-step="3" onclick={handleStepClick}>
                            <div class={stepThreeClass}>
                                <span class="step-number">3</span>
                            </div>
                            <span class="step-label">Offer Generation</span>
                        </div>
                    </div>
                </div>

                <!-- Modal Body -->
                <div class="modal-body" style="height: calc(100% - 120px); overflow-y: auto;">

                    <!-- Step 1: Select Units -->
                    <template if:true={isStepOne}>
                        <!-- Show custom spinner when loading units -->
                        <c-mbp_customspinner is-loading={isStepOneLoading}></c-mbp_customspinner>
                        <div class="units-filter-wrapper">
                            <img src={filterIcon} alt="Filter" class="units-filter-icon"
                                onclick={toggleUnitsFilterBox} />

                            <!-- Floating Filter Box for Units -->
                            <div class={unitsFilterBoxClass}>
                                <button class="filter-close-btn" onclick={closeUnitsFilterBox} title="Close" aria-label="Close filters">✕</button>
                                <b>Unit Filters</b>

                                <!-- Search Across Multiple Fields -->
                                <lightning-input type="search" label="Search" value={unitFilters.searchKey}
                                    placeholder="Search across Unit Name, Project Name, Unit Type..."
                                    onchange={handleUnitFilterChange} class="placeholder mt-2" data-id="searchKey">
                                </lightning-input>

                                <!-- Project Name Dropdown -->
                                <lightning-combobox class="placeholder mt-2" label="Project Name" data-id="projectName"
                                    value={unitFilters.projectName} options={projectFilterOptions}
                                    onchange={handleUnitFilterChange}>
                                </lightning-combobox>

                                <!-- Unit Type Dropdown -->
                                <lightning-combobox class="placeholder mt-2" label="Unit Type" data-id="unitType"
                                    value={unitFilters.unitType} options={unitTypeFilterOptions}
                                    onchange={handleUnitFilterChange}>
                                </lightning-combobox>

                                <!-- Number of Bedrooms Dropdown -->
                                <lightning-combobox class="placeholder mt-2" label="Number of Bedrooms"
                                    data-id="bedrooms" value={unitFilters.bedrooms} options={bedroomsFilterOptions}
                                    onchange={handleUnitFilterChange}>
                                </lightning-combobox>

                                <!-- Status Dropdown -->
                                <lightning-combobox class="placeholder mt-2" label="Status" data-id="status"
                                    value={unitFilters.status} options={statusFilterOptions}
                                    onchange={handleUnitFilterChange}>
                                </lightning-combobox>

                                <!-- Buttons Row -->
                                <div class="button-row filter-buttons">
                                    <button class="reset-btn" onclick={resetUnitFilters}>Reset</button>
                                    <button class="apply-btn" onclick={applyUnitFilters}>Apply</button>
                                </div>
                            </div>
                        </div>

                        <div class="step-content">
                            <template if:true={hasUnits}>
                                <!-- Updated template using formatted data -->
                                <div class="units-table-container" style="max-height: 400px; overflow-y: auto;">
                                    <table class="html-unit-table">
                                        <thead>
                                            <tr class="table-header">
                                                <th style="width: 50px; text-align: center;">
                                                    <input type="checkbox" class="html-checkbox select-all-checkbox"
                                                        onchange={handleSelectAllUnits} checked={areAllUnitsSelected} />
                                                </th>
                                                <th>Unit Name</th>
                                                <th>Project Name</th>
                                                <th>Unit Type</th>
                                                <th>Number of Bedrooms</th>
                                                <th>Base Price (AED)</th>
                                                <th>Unit Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={formattedUnits} for:item="unit">
                                                <tr key={unit.id} class="unit-row">
                                                    <td style="text-align: center;">
                                                        <input type="checkbox" class="html-checkbox unit-checkbox"
                                                            data-id={unit.id} checked={unit.isSelected}
                                                            onchange={handleUnitSelection} />
                                                    </td>
                                                    <td>{unit.unitName}</td>
                                                    <td>{unit.projectName}</td>
                                                    <td>{unit.unitType}</td>
                                                    <td>{unit.numberOfBedrooms}</td>
                                                    <td class="number-cell price-cell">
                                                        {unit.formattedBasePrice}
                                                    </td>
                                                    <td>{unit.unitStatus}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>

                                <!-- Pagination Controls -->
                                <div class="units-pagination slds-text-body_small slds-m-top_medium ">
                                    <lightning-button variant="base" label="⟵ Prev" onclick={handleUnitsPrevPage}
                                        disabled={disableUnitsPrev} class="small-pagination-button"></lightning-button>
                                    <span class="page-info">Page {currentUnitsPage} of {totalUnitsPages}</span>
                                    <lightning-button variant="base" label="Next ⟶" onclick={handleUnitsNextPage}
                                        disabled={disableUnitsNext} class="small-pagination-button"></lightning-button>
                                </div>
                            </template>

                            <template if:true={noUnitsAvailable}>
                                <div class="slds-text-align_center slds-m-top_medium">
                                    <lightning-icon icon-name="utility:error" size="small"></lightning-icon>
                                    <p class="slds-m-top_x-small">No units available for your broker account.</p>
                                </div>
                            </template>
                        </div>

                        <div if:true={showUnitValidationError} class="validation-error-message">
                            <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                            Please select at least one unit to proceed to the next step.
                        </div>

                        <div if:true={showUnavailableUnitsError} class="validation-error-message">
                            <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                            <strong>Offer Generation is Only for Available units</strong>
                        </div>
                    </template>

                    <!-- Step 2: Payment Plan -->
                    <template if:true={isStepTwo}>
                        <div class="step-content">
                            <c-mbp_customspinner is-loading={isStepTwoLoading}></c-mbp_customspinner>
                            <!-- Payment Plan Details -->
                            <template if:true={showPaymentDetails}>
                                <div class="payment-plan-container">
                                    <c-mbp_customspinner is-loading={isStepTwoLoading}></c-mbp_customspinner>
                                    <!-- 🔹 Unit Tabs (Moved to top) -->
                                    <div class="unit-tabs-wrapper slds-m-bottom_medium">
                                        <div class="slds-tabs_default">
                                            <ul class="slds-tabs_default__nav" role="tablist">
                                                <template for:each={selectedUnitsData} for:item="unit"
                                                    for:index="index">
                                                    <li key={unit.id} class={unit.tabClass} role="presentation"
                                                        data-index={index}>
                                                        <a class="slds-tabs_default__link" href="javascript:void(0);"
                                                            role="tab" aria-selected={isActiveTab} tabindex={tabIndex}
                                                            data-index={index} onclick={handleUnitTabClick}>
                                                            {unit.name}
                                                        </a>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </div>

                                    <!-- Payment Plan Selection -->
                                    <div class="slds-grid slds-gutters slds-m-bottom_medium">
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-combobox name="paymentPlan" label="Payment Details"
                                                value={selectedPaymentPlan} options={paymentPlanOptions}
                                                onchange={handlePaymentPlanChange} placeholder="Choose a payment plan"
                                                required>
                                            </lightning-combobox>
                                        </div>

                                        <!-- Facade Style Selection for Al Naseem -->
                                        <template if:true={alNaseemSelected}>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-combobox label="Facade Style" value={selectedDesign}
                                                    options={alNaseemDesignOptions} onchange={handleDesignChange}
                                                    required>
                                                </lightning-combobox>

                                                <!-- Facade Style Validation Message -->
                                                <div if:true={showFacadeValidationError}
                                                    class="validation-error-message">
                                                    <lightning-icon icon-name="utility:error" size="x-small">
                                                    </lightning-icon>
                                                    Please select a Facade Style for Al Naseem units.
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Payment Tab Content -->
                                    <div class="slds-tabs_default__content slds-show tab-payment-content"
                                        role="tabpanel">
                                        <template if:true={activeUnitData}>
                                            <div class="payment-panel">
                                                <div
                                                    class="slds-grid slds-gutters slds-m-bottom_small payment-controls">
                                                    <div class="slds-col slds-size_1-of-1">
                                                        <!-- Optional inline combobox if needed -->
                                                    </div>
                                                </div>

                                                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                                                    <div class="slds-col slds-size_1-of-1">
                                                        <div class="payment-plan-name">{paymentPlanName}</div>
                                                    </div>
                                                </div>

                                                <!-- Installments Table -->
                                                <div class="payment-table-container">
                                                    <table class="payment-table">
                                                        <thead>
                                                            <tr>
                                                                <th>Installment #</th>
                                                                <th>Milestone</th>
                                                                <th>Installment Percentage</th>
                                                                <th>Installment Amount</th>
                                                                <th>Installment Date</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <template if:true={installments.length}>
                                                                <template for:each={installments} for:item="inst">
                                                                    <tr key={inst.Id}>
                                                                        <td>{inst.MilestoneNumber__c}</td>
                                                                        <td>{inst.MilestoneDescription__c}</td>
                                                                        <td>{inst.Milestone__c}%</td>
                                                                        <td>
                                                                            <lightning-formatted-number
                                                                                value={inst.amount}
                                                                                format-style="currency"
                                                                                currency-code="AED"
                                                                                minimum-fraction-digits="2"
                                                                                maximum-fraction-digits="2">
                                                                            </lightning-formatted-number>
                                                                        </td>
                                                                        <td>
                                                                            <lightning-formatted-date-time
                                                                                value={inst.MilestoneDate__c}
                                                                                year="numeric" month="2-digit"
                                                                                day="2-digit">
                                                                            </lightning-formatted-date-time>
                                                                        </td>
                                                                    </tr>
                                                                </template>
                                                            </template>
                                                            <template if:false={installments.length}>
                                                                <tr>
                                                                    <td colspan="5"
                                                                        class="slds-text-align_center slds-text-color_weak">
                                                                        No installments available for this payment
                                                                        plan.
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </template>

                                        <template if:false={activeUnitData}>
                                            <div
                                                class="empty-payment slds-p-around_medium slds-text-align_center slds-text-color_weak">
                                                Select a unit tab to view payment details.
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- Loading State -->
                            <template if:true={isLoading}>
                                <div class="slds-align_absolute-center slds-m-vertical_large">
                                    <lightning-spinner alternative-text="Loading payment plans"></lightning-spinner>
                                    <div class="slds-m-top_small">Loading payment details...</div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Step 3: Generate Offer -->
                    <template if:true={isStepThree}>
                        <c-mbp_customspinner is-loading={isStepThreeLoading}></c-mbp_customspinner>

                        <div class="step-content">
                            <!-- Unit Tabs for Offer Previews -->
                            <div class="unit-preview-tabs slds-m-bottom_medium">
                                <div class="slds-tabs_default">
                                    <ul class="slds-tabs_default__nav" role="tablist">
                                        <template for:each={selectedUnitsData} for:item="unit">
                                            <li key={unit.id} class={unit.previewTabClass} role="presentation">
                                                <a href="#" role="tab" data-unitid={unit.id}
                                                    onclick={handlePreviewUnitTabClick} class="slds-tabs_default__link">
                                                    {unit.name}
                                                </a>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </div>

                            <!-- Dynamic Offer Summary - Only Lead, Unit, Payment Plan, and Facade Style -->
                            <div class="review-summary slds-m-bottom_medium">
                                <div class="slds-card">
                                    <div class="slds-card__body p-10">
                                        <h4 class="slds-text-heading_small slds-m-bottom_small">
                                            <strong>Offer Summary</strong>
                                        </h4>

                                        <!-- Show summary for active preview unit -->
                                        <template if:true={activeUnitForSummary}>
                                            <div class="slds-grid slds-wrap">
                                                <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                                                    <strong>Lead:</strong> {selectedLeadName}
                                                </div>
                                                <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                                                    <strong>Unit:</strong> {activeUnitForSummary.name}
                                                </div>
                                                <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                                                    <strong>Payment Plan:</strong> {paymentPlanName}
                                                </div>

                                                <!-- ONLY show facade style if the ACTIVE PREVIEW unit is Al Naseem -->
                                                <template if:true={isActivePreviewUnitAlNaseem}>
                                                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                                                        <strong>Facade Style:</strong> {selectedDesign}
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <!-- Preview Content -->
                            <div class="slds-tabs_default__content slds-show tab-preview-content" role="tabpanel">
                                <template if:true={activePreviewUnitId}>
                                    <c-mbp_customspinner is-loading={isStepThreeLoading}></c-mbp_customspinner>

                                    <div class="slds-card__body">
                                        <div class="offer-preview-content"
                                            style="position: relative; min-height: 600px;">

                                            <div if:true={isPdfLoading} class="pdf-loading-overlay">
                                                <div class="loading-content">
                                                    <div class="spinner-container">
                                                        <div class="spinner-ring"></div>
                                                    </div>
                                                    <h3>Please wait until the preview loads...</h3>
                                                    <p>This may take up to 15 seconds</p>
                                                </div>
                                            </div>
                                            <template if:true={showActivePreview}>
                                                <iframe src={activePreviewUrl} width="100%" height="600"
                                                    style="border: 1px solid #dddbda; border-radius: 0.25rem;">
                                                </iframe>
                                            </template>

                                            <template if:false={showActivePreview}>
                                                <div class="slds-align_absolute-center slds-p-around_large">
                                                    <p class="slds-m-top_small">
                                                        Loading preview for {activePreviewUnitName}...
                                                    </p>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Generation Results -->
                            <template if:true={offerGenerationResults.length}>
                                <div class="generation-results slds-m-bottom_medium">
                                    <div class="slds-card">
                                        <div class="slds-card__header">
                                            <h3 class="slds-card__header-title">Generation Results</h3>
                                        </div>

                                        <div class="slds-card__body">
                                            <template for:each={offerGenerationResults} for:item="result">
                                                <div key={result.unitId} class={result.resultClass}>
                                                    <div class="slds-grid slds-grid_align-spread">
                                                        <div>
                                                            <strong>{result.unitName}:</strong> {result.message}
                                                        </div>

                                                        <lightning-icon icon-name={result.iconName} size="small"
                                                            class={result.iconClass}>
                                                        </lightning-icon>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div> <!-- modal-body end -->

                <!-- Footer Navigation Buttons -->
                <div class="modal-footer">
                    <div class="navigation-buttons slds-grid slds-grid_align-spread">
                        <div>
                            <button class="slds-button slds-button_outline-brand" onclick={handlePreviousStep}
                                disabled={isFirstStep}>
                                Previous
                            </button>
                        </div>

                        <div class="right-buttons">
                            <button class="slds-button slds-button_outline-brand" onclick={closeUnitSearch}>
                                Cancel
                            </button>

                            <template if:true={isNotLastStep}>
                                <button class="slds-button slds-button_brand" onclick={handleNextStep}>
                                    Next
                                </button>
                            </template>

                            <template if:true={isLastStep}>
                                <button class="slds-button slds-button_brand" onclick={handleGenerateOffer}
                                    disabled={isGenerateOfferDisabled}>
                                    <template if:true={isLoading}>
                                        <lightning-spinner alternative-text="Processing"
                                            size="small"></lightning-spinner>
                                        Generating...
                                    </template>
                                    <template if:false={isLoading}>
                                        Send Sales Offer
                                    </template>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </div> <!-- modal end -->
        </div>
    </div> <!-- backdrop end -->


</template>

</div>

</template>
