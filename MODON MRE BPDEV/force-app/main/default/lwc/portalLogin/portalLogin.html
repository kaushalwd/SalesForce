<template>
    <div class="auth-page">
        <!-- Left: sign-in form -->
        <div class="auth-left">
            <div class="auth-logo">
                <div class="logo-icon">M</div>
                <div>
                    <div class="logo-text">Modon DCT Portal</div>
                    <div class="logo-sub">3rd Party Development Control</div>
                </div>
            </div>

            <h2 class="welcome">Welcome back</h2>
            <p class="muted sub">Sign in to access your development portal</p>

            <form class="login-form" onsubmit={handleLogin}>
                <div class="form-group">
                    <label>Email Address <span class="required">*</span></label>
                    <input type="email" class="form-control" value={username} oninput={handleUser} placeholder="you@example.com" autocomplete="username" />
                </div>
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" class="form-control" value={password} oninput={handlePass} placeholder="••••••••" autocomplete="current-password" />
                </div>

                <template lwc:if={error}>
                    <div class="login-error">{error}</div>
                </template>

                <button type="submit" class="btn btn-primary btn-lg w-100" disabled={loading}>
                    <template lwc:if={loading}>Signing in…</template>
                    <template lwc:else>Sign In</template>
                </button>
            </form>

            <div class="divider">
                <p class="muted center sm">Don't have an account?</p>
                <div class="reg-grid">
                    <a href={registerOwnerUrl} class="btn btn-outline w-100">Property Owner</a>
                    <a href={registerSpUrl} class="btn btn-outline w-100">Service Provider</a>
                </div>
            </div>
        </div>

        <!-- Right: marketing panel -->
        <div class="auth-right">
            <div class="auth-right-inner">
                <div class="city">🏙️</div>
                <h2>Abu Dhabi's Premier Development Portal</h2>
                <p>Streamline your development approvals, manage properties, and collaborate with service providers — all in one secure platform.</p>
                <div class="stats">
                    <div class="stat"><div class="n">50+</div><div class="t">Service Types</div></div>
                    <div class="stat"><div class="n">24/7</div><div class="t">Online Access</div></div>
                    <div class="stat"><div class="n">🔒</div><div class="t">Secure &amp; Compliant</div></div>
                    <div class="stat"><div class="n">⚡</div><div class="t">Fast Processing</div></div>
                </div>
            </div>
        </div>
    </div>
</template>
