<template>
    <!--2.0  Component Title -->
    <div class="slds-page-header slds-page-header_record-home slds-m-bottom_small">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="standard:payment_gateway"
                            size="small">
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h1 class="slds-page-header__title slds-truncate"
                            title="Payment Search Filters">
                            Payment Search Filters
                        </h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="slds-grid slds-gutters slds-wrap slds-p-around_small">
           
        <div class="slds-col slds-size_1-of-7">
            <label class="slds-text-title_bold">Select Project</label>
            <lightning-combobox
                name="project"
                options={projectOptions}
                value={selectedProjectId}
                onchange={handleProjectChange}
                variant="label-hidden">
            </lightning-combobox>
        </div>

        <template if:true={phaseOptions}>
            <div class="slds-col slds-size_1-of-7">
                <label class="slds-text-title_bold">Select Phase</label>
                <lightning-combobox
                    name="phase"
                    options={phaseOptions}
                    value={selectedPhaseId}
                    onchange={handlePhaseChange}
                    variant="label-hidden">
                </lightning-combobox>
            </div>
        </template>

        <div class="slds-col slds-size_1-of-7">
            <label class="slds-text-title_bold">Receipt Date From</label>
            <lightning-input
                type="date"
                name="startDate"
                value={startDate}
                onchange={handleDateChange}
                variant="label-hidden">
            </lightning-input>
        </div>

        <div class="slds-col slds-size_1-of-7">
            <label class="slds-text-title_bold">Receipt Date To</label>
            <lightning-input
                type="date"
                name="endDate"
                value={endDate}
                onchange={handleDateChange}
                variant="label-hidden">
            </lightning-input>
        </div>

        <div class="slds-col slds-size_1-of-7">
            <label class="slds-text-title_bold">Transaction Date From</label>
            <lightning-input
                type="date"
                name="startDateTrans"
                value={startDateTrans}
                onchange={handleDateChange}
                variant="label-hidden">
            </lightning-input>
        </div>

        <div class="slds-col slds-size_1-of-7">
            <label class="slds-text-title_bold">Transaction Date To</label>
            <lightning-input
                type="date"
                name="endDateTrans"
                value={endDateTrans}
                onchange={handleDateChange}
                variant="label-hidden">
            </lightning-input>
        </div>

        <div class="slds-col slds-size_1-of-7">
            <label class="slds-text-title_bold">Receipt Name</label>
            <lightning-input
                type="text"
                name="ReceiptName"
                value={ReceiptName}
                onchange={handleReceipt}
                variant="label-hidden">
            </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-7">
            <label class="slds-text-title_bold">Unit Name</label>
            <lightning-input
                type="text"
                name="UnitName"
                value={UnitName}
                onchange={handleUnitName}
                variant="label-hidden">
            </lightning-input>
        </div>

    </div>
</template>
