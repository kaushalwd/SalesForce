<template>
    <div class="dashboard-section">
        <h2 class="section-title">COLLECTION & DEFAULT</h2>
        <div class="slds-grid slds-gutters">
            <template for:each={additionalFields} for:item="item">
                <div class="slds-col" key={item.label}>
                    <div class="field-label">{item.label}</div>
                    <div class="field-value">0</div>
                </div>
            </template>
        </div>
        <br/>
        <h2 class="section-title">ACCOUNT STATUS</h2>
        <template if:true={loadUI}>
            <div class="slds-grid slds-gutters">
                <template for:each={groupedFields} for:item="field">
                    <div class="slds-col" key={field.label}>
                        <div class="field-label">{field.label}</div>
                        <lightning-formatted-rich-text class="field-value" value={field.value}></lightning-formatted-rich-text>
                    </div>
                </template>
            </div>
        </template>
        <template if:false={loadUI}>
            <p class="no-data">Account Data not available.</p>
        </template>
    </div>
</template>
