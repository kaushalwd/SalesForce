<template>
    <section class="hero">
        <template lwc:if={hasHeroImage}>
            <picture>
                <template lwc:if={hasHeroMobile}><source media="(orientation: portrait)" srcset={heroImageMobile} /></template>
                <img class="hero__media" src={heroImage} alt={heroAlt} loading="eager" />
            </picture>
        </template>
        <div class={tintClass} aria-hidden="true"></div>
        <template lwc:if={isCentred}>
            <div class="lockup">
                <template lwc:if={hasLogo}>
                    <img class="lockup__logo" src={logoImage} alt={logoAlt} />
                </template>
                <template lwc:if={hasTagline}>
                    <p class="tagline">{tagline}</p>
                </template>
            </div>
            <div class="hero__cta">
                <template lwc:if={hasCtaLine}>
                    <p class="eoi-line">{ctaLine}</p>
                </template>
                <button class="cta" type="button" onclick={handleBegin}>
                    {buttonLabel}&nbsp;<span class="arr" aria-hidden="true">&#10230;</span>
                </button>
            </div>
        </template>
        <template lwc:if={isProject}>
            <!-- MEOI-HERO: the modon.com project-page hero (same measurements as eoiWadeemGardens) -->
            <template lwc:if={hasModonLogo}>
                <header class="project__hdr"><div class="project__hdr-wrap"><img class="project__modon" src={modonLogoImage} alt="Modon" loading="eager" /></div></header>
            </template>
            <div class="project">
                <div class="project__wrap">
                <div class="project__content">
                    <template lwc:if={hasLogo}>
                        <div class="project__brand"><img class="project__logo" src={logoImage} alt={logoAlt} /></div>
                    </template>
                    <template lwc:if={hasTitle}><h1 class="project__title">{title}</h1></template>
                    <template lwc:if={hasTagline}><p class="project__tagline">{tagline}</p></template>
                    <template lwc:if={hasCtaLine}><p class="project__line">{ctaLine}</p></template>
                    <div class="project__btns">
                        <button class="project__btn" type="button" onclick={handleBegin}>{buttonLabel}</button>
                    </div>
                </div>
                </div>
            </div>
        </template>
    </section>
</template>
