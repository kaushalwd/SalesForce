<template>
  <main class={pageClass}>
    <section class="ai-stage">

      <!-- Empty state: hero greeting (hidden once a conversation starts) -->
      <template lwc:if={hasConversation}>
        <div class="ai-convo-head">
          <span class="ai-tag">MODON CONCIERGE</span>
          <button class="ai-clear" title="New conversation" onclick={handleClear}>＋ New chat</button>
        </div>

        <!-- Conversation thread -->
        <div class="ai-thread" onscroll={handleThreadScroll}>
          <template for:each={messages} for:item="m">
            <div key={m.id} class={m.cssClass}>
              <div class="ai-msg-body">
                <template lwc:if={m.isUser}>
                  <div class="ai-bubble">{m.text}</div>
                </template>
                <template lwc:else>
                  <div class="ai-bubble ai-bubble--rich" data-id={m.id} lwc:dom="manual"></div>
                </template>

                <div class="ai-msg-meta">
                  <span class="ai-time">{m.time}</span>
                  <template lwc:if={m.isAssistant}>
                    <button class="ai-copy" data-id={m.id} onclick={handleCopy} title="Copy answer">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="11" height="11" rx="2"/>
                        <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
                      </svg>
                    </button>
                  </template>
                </div>
              </div>
            </div>
          </template>

          <!-- Typing indicator -->
          <template lwc:if={isLoading}>
            <div class="ai-msg ai-msg--assistant">
              <div class="ai-msg-body">
                <div class="ai-bubble ai-typing">
                  <span></span><span></span><span></span>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Jump-to-latest -->
        <template lwc:if={showScrollDown}>
          <button class="ai-scroll-down" title="Jump to latest" onclick={scrollToBottom}>&darr;</button>
        </template>
      </template>

      <template lwc:else>
        <div class="ai-tag">MODON CONCIERGE</div>
        <h1 class="ai-greet">{greeting}, <span>{firstName}</span>.</h1>
        <p class="ai-prompt">Ask about your leads, opportunities, sales orders, commissions, agency or agents. Speak or type.</p>
      </template>

      <!-- Ask bar -->
      <div class="ai-bar">
        <input
          type="text"
          placeholder="Ask Concierge…"
          value={queryText}
          disabled={inputDisabled}
          onkeydown={handleKeydown}
          oninput={handleInput} />
        <button class="ai-bar-icon" title="Voice" onclick={handleVoice}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </button>
        <button class="ai-bar-icon" title="Attach" onclick={handleAttach}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <button class="ai-bar-send" title="Send" disabled={sendDisabled} onclick={handleSend}>→</button>
      </div>

      <!-- Quick prompts (empty state only) -->
      <template lwc:if={hasConversation}>
        <p class="ai-context-note">Concierge keeps context for this conversation</p>
      </template>
      <template lwc:else>
        <div class="ai-quick">
          <template for:each={suggestions} for:item="s">
            <button key={s.id} data-prompt={s.text} class="ai-chip" onclick={handleChip}>
              {s.label}
            </button>
          </template>
        </div>

        <div class="ai-foot-row">
          <span class="dot-online"></span>
          <span>Concierge online · answers from your live data</span>
        </div>
      </template>
    </section>

    <!-- Custom toast -->
    <template lwc:if={showToast}>
      <div class={toastClass}>{toastMessage}</div>
    </template>
  </main>
</template>
