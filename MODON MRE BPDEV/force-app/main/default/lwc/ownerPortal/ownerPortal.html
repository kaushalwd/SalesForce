<template>
    <div class="portal">
        <div class="topbar">
            <div class="appbar">
                <button class="burger" onclick={toggleMenu} title="Menu">☰</button>
                <span class="appbar-title">Owner Portal</span>
                <div class={navClass}>
                    <template for:each={tabs} for:item="tab">
                        <button key={tab.id} class={tab.cssClass} data-id={tab.id} onclick={handleTab}>{tab.label}</button>
                    </template>
                </div>
                <div class="appbar-actions">
                    <div class="hdr-item">
                        <button class="icon-btn" onclick={toggleNotif} title="Notifications">🔔</button>
                        <div class={notifMenuClass}>
                            <div class="dd-head">Notifications</div>
                            <template for:each={notifications} for:item="n">
                                <div key={n.id} class="dd-notif">
                                    <div class="nt">{n.title}</div>
                                    <div class="nm">{n.message}</div>
                                    <div class="nd">{n.date}</div>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="hdr-item">
                        <button class="icon-btn" onclick={toggleProfile} title="Profile">👤</button>
                        <div class={profileMenuClass}>
                            <button class="menu-item" onclick={goProfile}>👤&nbsp;&nbsp;Profile</button>
                            <button class="menu-item" onclick={handleLogout}>↩&nbsp;&nbsp;Logout</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page">

            <!-- DASHBOARD -->
            <template lwc:if={isDashboard}>
                <div class="alert alert-success">
                    <span>✓</span>
                    <span>Registration fee paid — full portal access enabled.</span>
                </div>
                <div class="page-header">
                    <div>
                        <div class="eyebrow">Owner Portal</div>
                        <h1>Welcome back, Ahmed Al Mansouri</h1>
                        <div class="page-subtitle">Al Mansouri Properties LLC</div>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-primary" onclick={goRaise}>+ Raise a Service Request</button>
                    </div>
                </div>

                <div class="stat-grid">
                    <div class="stat-card"><div class="stat-icon green">🏗️</div><div><div class="stat-value">2</div><div class="stat-label">Plots</div></div></div>
                    <div class="stat-card"><div class="stat-icon orange">⏳</div><div><div class="stat-value">2</div><div class="stat-label">Pending Requests</div></div></div>
                    <div class="stat-card"><div class="stat-icon green">✓</div><div><div class="stat-value">1</div><div class="stat-label">Approved</div></div></div>
                    <div class="stat-card"><div class="stat-icon gold">📋</div><div><div class="stat-value">3</div><div class="stat-label">Total Requests</div></div></div>
                </div>

                <div class="grid-2 mt">
                    <div class="card">
                        <div class="card-header"><h3>Recent Service Requests</h3><span class="count">Last 5</span></div>
                        <table>
                            <thead><tr><th>Tracking #</th><th>Service</th><th>Plot</th><th>Status</th><th>Submitted</th></tr></thead>
                            <tbody>
                                <template for:each={requests} for:item="r">
                                    <tr key={r.id}>
                                        <td data-label="Tracking #"><span class="cell-link">{r.tracking}</span></td>
                                        <td data-label="Service">{r.service}</td>
                                        <td data-label="Plot">{r.plot}</td>
                                        <td data-label="Status"><span class={r.statusClass}>{r.status}</span></td>
                                        <td data-label="Submitted">{r.date}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>My Plots</h3></div>
                        <div class="card-body">
                            <template for:each={plots} for:item="p">
                                <div key={p.id} class="plot-row">
                                    <div class="plot-ico">🏗️</div>
                                    <div>
                                        <div class="plot-name">{p.name}</div>
                                        <div class="text-muted text-sm">{p.location}</div>
                                    </div>
                                    <span class={p.statusClass}>{p.status}</span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- MY PLOTS -->
            <template lwc:if={isPlots}>
                <div class="page-header">
                    <div><div class="eyebrow">Owner Portal</div><h1>My Plots</h1><div class="page-subtitle">Plots registered to your account</div></div>
                    <div class="header-actions"><button class="btn btn-primary">+ Add New Plot</button></div>
                </div>
                <div class="card">
                    <table>
                        <thead><tr><th>Plot Number</th><th>Location</th><th class="num">Area (m²)</th><th>Usage</th><th>Status</th><th></th></tr></thead>
                        <tbody>
                            <template for:each={plots} for:item="p">
                                <tr key={p.id}>
                                    <td data-label="Plot Number"><span class="cell-link">{p.name}</span></td>
                                    <td data-label="Location">{p.location}</td>
                                    <td data-label="Area (m²)" class="num">{p.area}</td>
                                    <td data-label="Usage">{p.usage}</td>
                                    <td data-label="Status"><span class={p.statusClass}>{p.status}</span></td>
                                    <td data-label=""><button class="btn btn-outline btn-sm" onclick={goRaise}>Raise Request</button></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- SERVICE REQUESTS -->
            <template lwc:if={isRequests}>
                <div class="page-header">
                    <div><div class="eyebrow">Owner Portal</div><h1>Service Requests</h1><div class="page-subtitle">All requests across your plots</div></div>
                    <div class="header-actions"><button class="btn btn-primary" onclick={goRaise}>+ New Request</button></div>
                </div>
                <div class="card">
                    <table>
                        <thead><tr><th>Tracking #</th><th>Service</th><th>Category</th><th>Plot</th><th>Status</th><th class="num">Fee</th><th>Submitted</th></tr></thead>
                        <tbody>
                            <template for:each={requests} for:item="r">
                                <tr key={r.id}>
                                    <td data-label="Tracking #"><span class="cell-link">{r.tracking}</span></td>
                                    <td data-label="Service">{r.service}</td>
                                    <td data-label="Category">{r.category}</td>
                                    <td data-label="Plot">{r.plot}</td>
                                    <td data-label="Status"><span class={r.statusClass}>{r.status}</span></td>
                                    <td data-label="Fee" class="num">{r.price}</td>
                                    <td data-label="Submitted">{r.date}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- RAISE A REQUEST -->
            <template lwc:if={isRaise}>
                <div class="page-header">
                    <div><div class="eyebrow">Owner Portal</div><h1>Raise a Service Request</h1><div class="page-subtitle">Submit a new development control request</div></div>
                </div>

                <template lwc:if={submitted}>
                    <div class="alert alert-success">
                        <span>✓</span>
                        <span>Request submitted. Tracking number <strong>DCT-48230341</strong> — you'll be notified as the status changes.</span>
                    </div>
                </template>

                <div class="steps">
                    <div class="step done"><div class="step-circle">✓</div><div class="step-label">Concept Design</div></div>
                    <div class="step active"><div class="step-circle">2</div><div class="step-label">Request Details</div></div>
                    <div class="step"><div class="step-circle">3</div><div class="step-label">Documents</div></div>
                    <div class="step"><div class="step-circle">4</div><div class="step-label">Review &amp; Confirm</div></div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="alert alert-info">
                            <span>ℹ️</span>
                            <span>Service descriptions and fees are shown before submission so you know what each request involves.</span>
                        </div>
                        <form onsubmit={handleSubmit}>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Plot <span class="required">*</span></label>
                                    <select class="form-control" required>
                                        <option>PLT-001-2024 — Yas Island</option>
                                        <option>PLT-002-2024 — Al Reem Island</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Service Category <span class="required">*</span></label>
                                    <select class="form-control" required>
                                        <option>SPA &amp; Ownership</option>
                                        <option>Building Design</option>
                                        <option>Site Works</option>
                                        <option>NOCs</option>
                                        <option>Planning</option>
                                        <option>Others</option>
                                    </select>
                                </div>
                                <div class="form-group full">
                                    <label>Service Type <span class="required">*</span></label>
                                    <select class="form-control" required>
                                        <option>GFA Verification Review — AED 2,000</option>
                                        <option>Elevation and Perspectives NOC — AED 1,500</option>
                                        <option>Hoarding — AED 800</option>
                                        <option>Height Increase — AED 3,000</option>
                                    </select>
                                    <div class="form-hint">Fee shown is the standard price; Concept Design fees are set manually after review.</div>
                                </div>
                                <div class="form-group full">
                                    <label>Description</label>
                                    <textarea class="form-control" placeholder="Describe the request…"></textarea>
                                </div>
                                <div class="form-group">
                                    <label>Urgency</label>
                                    <select class="form-control"><option>Normal</option><option>Urgent</option></select>
                                </div>
                                <div class="form-group">
                                    <label>Preferred Date</label>
                                    <input type="date" class="form-control" />
                                </div>
                                <div class="form-group full">
                                    <div class="file-drop">
                                        <div class="drop-icon">📎</div>
                                        <p><strong>Upload documents</strong> or drag &amp; drop — or pick from your Document Library</p>
                                    </div>
                                </div>
                                <div class="form-group full">
                                    <label class="checkrow"><input type="checkbox" required /> <span>I confirm the information is accurate and accept the terms &amp; conditions.</span></label>
                                </div>
                            </div>
                            <div class="spread">
                                <button type="button" class="btn btn-secondary">Save as Draft</button>
                                <button type="submit" class="btn btn-primary btn-lg">Confirm &amp; Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </template>

            <!-- DOCUMENTS -->
            <template lwc:if={isDocuments}>
                <div class="page-header">
                    <div><div class="eyebrow">Owner Portal</div><h1>Document Library</h1><div class="page-subtitle">Upload once, reuse across requests</div></div>
                    <div class="header-actions"><button class="btn btn-primary">+ Upload Document</button></div>
                </div>
                <div class="card">
                    <table>
                        <thead><tr><th>Document</th><th>Type</th><th>Plot</th><th>Uploaded</th><th></th></tr></thead>
                        <tbody>
                            <template for:each={documents} for:item="d">
                                <tr key={d.id}>
                                    <td data-label="Document"><span class="cell-link">{d.name}</span></td>
                                    <td data-label="Type">{d.type}</td>
                                    <td data-label="Plot">{d.plot}</td>
                                    <td data-label="Uploaded">{d.date}</td>
                                    <td data-label=""><button class="btn btn-outline btn-sm">Download</button></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- PAYMENTS -->
            <template lwc:if={isPayments}>
                <div class="page-header">
                    <div><div class="eyebrow">Owner Portal</div><h1>Payments</h1><div class="page-subtitle">Fees, receipts and payment history</div></div>
                    <div class="header-actions"><button class="btn btn-primary" onclick={handleTopUp}>Top up</button></div>
                </div>
                <template lwc:if={topUpBanner}>
                    <div class={topUpBanner.cssClass}><span>{topUpBanner.icon}</span><span>{topUpBanner.text}</span></div>
                </template>
                <div class="card">
                    <table>
                        <thead><tr><th>Reference</th><th>For</th><th class="num">Amount</th><th>Method</th><th>Status</th><th>Date</th><th></th></tr></thead>
                        <tbody>
                            <template for:each={payments} for:item="pay">
                                <tr key={pay.id}>
                                    <td data-label="Reference">{pay.ref}</td>
                                    <td data-label="For">{pay.type}</td>
                                    <td data-label="Amount" class="num">{pay.amount}</td>
                                    <td data-label="Method">{pay.method}</td>
                                    <td data-label="Status"><span class={pay.statusClass}>{pay.status}</span></td>
                                    <td data-label="Date">{pay.date}</td>
                                    <td data-label=""><button class="btn btn-outline btn-sm">Receipt</button></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <template lwc:if={showTopUp}>
                    <div class="modal-overlay">
                        <div class="modal">
                            <div class="modal-head">Top up</div>
                            <div class="modal-body">
                                <div class="form-group">
                                    <label>Amount (AED) <span class="required">*</span></label>
                                    <input type="number" min="1" step="0.01" class="form-control" value={topUpAmount} oninput={handleAmountChange} placeholder="0.00" />
                                    <div class="form-hint">You'll be redirected to our secure payment page and returned here afterward.</div>
                                    <template lwc:if={topUpError}><div class="err">{topUpError}</div></template>
                                </div>
                            </div>
                            <div class="modal-foot">
                                <button class="btn btn-secondary" onclick={closeTopUp} disabled={paying}>Cancel</button>
                                <button class="btn btn-primary" onclick={startPayment} disabled={paying}>{payLabel}</button>
                            </div>
                        </div>
                    </div>
                </template>
            </template>

            <!-- MANAGE USERS -->
            <template lwc:if={isUsers}>
                <div class="page-header">
                    <div><div class="eyebrow">Owner Portal</div><h1>Manage Users</h1><div class="page-subtitle">Search and tag a Service Provider to your plots</div></div>
                    <div class="header-actions"><button class="btn btn-primary">+ Create Service Provider</button></div>
                </div>
                <div class="alert alert-info"><span>ℹ️</span><span>Tagging a Service Provider to a plot requires Modon (DCT) approval before they get access.</span></div>
                <div class="filter-bar">
                    <input type="search" class="form-control" placeholder="Search by company, TRN, trade license or Emirates ID…" />
                </div>
                <div class="card">
                    <table>
                        <thead><tr><th>Company</th><th>TRN</th><th>Trade License</th><th>Plot</th><th>Status</th><th></th></tr></thead>
                        <tbody>
                            <template for:each={serviceProviders} for:item="sp">
                                <tr key={sp.id}>
                                    <td data-label="Company"><span class="cell-link">{sp.company}</span></td>
                                    <td data-label="TRN">{sp.trn}</td>
                                    <td data-label="Trade License">{sp.license}</td>
                                    <td data-label="Plot">{sp.plot}</td>
                                    <td data-label="Status"><span class={sp.statusClass}>{sp.status}</span></td>
                                    <td data-label=""><button class="btn btn-outline btn-sm">Tag to Plot</button></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- PROFILE -->
            <template lwc:if={isProfile}>
                <div class="page-header">
                    <div><div class="eyebrow">Owner Portal</div><h1>Profile</h1><div class="page-subtitle">Your account details</div></div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Account Details</h3></div>
                    <div class="card-body">
                        <div class="form-row">
                            <div class="form-group"><label>Full Name</label><input class="form-control" value="Ahmed Al Mansouri" disabled /></div>
                            <div class="form-group"><label>Company</label><input class="form-control" value="Al Mansouri Properties LLC" disabled /></div>
                            <div class="form-group"><label>Email</label><input class="form-control" value="owner@demo.ae" disabled /></div>
                            <div class="form-group"><label>Phone</label><input class="form-control" value="+971 50 123 4567" disabled /></div>
                            <div class="form-group"><label>Emirates ID</label><input class="form-control" value="784-XXXX-XXXXXXX-X" disabled /></div>
                            <div class="form-group"><label>Payment Status</label><input class="form-control" value="Paid" disabled /></div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Change Password</h3></div>
                    <div class="card-body">
                        <div class="form-row">
                            <div class="form-group"><label>New Password</label><input type="password" class="form-control" placeholder="••••••••" /></div>
                            <div class="form-group"><label>Confirm Password</label><input type="password" class="form-control" placeholder="••••••••" /></div>
                        </div>
                        <div class="spread"><span></span><button class="btn btn-primary">Update Password</button></div>
                    </div>
                </div>
            </template>

        </div>
    </div>
</template>
