<template>
    <div class="slds-p-around_medium">
        <template lwc:if={isLoading}>
            <div class="slds-align_absolute-center slds-p-vertical_large">
                <lightning-spinner alternative-text="Processing..." size="small"></lightning-spinner>
                <span class="slds-p-left_small">Blocking account...</span>
            </div>
        </template>

        <template lwc:else>
            <div class="slds-box slds-theme_warning slds-m-bottom_medium">
                <p class="slds-text-heading_small slds-m-bottom_x-small">
                    <lightning-icon icon-name="utility:warning" size="x-small" variant="inverse"
                                    class="slds-m-right_x-small"></lightning-icon>
                    Block this account?
                </p>
                <p class="slds-text-body_regular">
                    This will set <b>Agency Status</b> to <b>Inactive</b>.
                    All related agents will be deactivated and their portal users will be frozen.
                </p>
                <p class="slds-text-body_small slds-m-top_x-small">
                    This action cannot be undone automatically — you will need to click <i>Unblock Account</i> to reverse it.
                </p>
            </div>

            <div class="slds-align_absolute-center">
                <lightning-button label="Cancel"
                                  onclick={handleCancel}
                                  class="slds-m-right_x-small"></lightning-button>
                <lightning-button label="Block Account"
                                  variant="destructive"
                                  onclick={handleConfirm}></lightning-button>
            </div>
        </template>
    </div>
</template>
