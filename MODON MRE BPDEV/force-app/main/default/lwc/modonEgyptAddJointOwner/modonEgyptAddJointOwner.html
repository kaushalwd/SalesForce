<template>
    <lightning-card title="Select Joint Owners">

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" variant="brand"></lightning-spinner>
        </template>

        <div if:false={isRecordFound} class="slds-p-around_medium">
            <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                <span class="slds-assistive-text">warning</span>
                No joint owners are available for the related opportunity.
                Please add joint owners to the opportunity first.
            </div>
        </div>

        <div if:true={isRecordFound} class="slds-p-around_medium">
            <div class="slds-m-bottom_medium slds-box slds-theme_default">
                <lightning-datatable
                    key-field="Id"
                    data={data}
                    columns={columns}
                    onrowselection={handleRowSelection}
                    oncellchange={handleCellChange}
                    draft-values={draftValues}
                    show-row-number-column
                    suppress-bottom-bar>
                </lightning-datatable>
            </div>

            <div class="slds-box slds-theme_shade slds-text-align_center slds-m-bottom_medium">
                <div class="slds-text-title_caps slds-m-bottom_small">
                    Ownership Allocation Summary
                </div>
                <div class="slds-text-heading_small">
                    Selected Joint Owners: <strong>{totalOwnership}%</strong>
                </div>
                <div class="slds-text-heading_small slds-m-top_x-small">
                    Primary Owner: <strong>{primaryOwnership}%</strong>
                </div>
                <div lwc:if={totalExistingOwnership} class="slds-text-heading_small slds-m-top_x-small">
                    Existing Joint Owners: <strong>{totalExistingOwnership}%</strong>
                </div>
            </div>

            <template if:true={isOwnershipExceed}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">warning</span>
                    {warningMsg}
                </div>
            </template>

            <!-- ACTIONS -->
            <div class="slds-p-around_medium slds-align_absolute-center slds-grid slds-grid_align-end slds-gutters_small">
                <lightning-button label="Cancel" onclick={closeAction}></lightning-button>

                <lightning-button 
                    variant="brand"
                    label="Save"
                    onclick={handleSave}
                    disabled={isSaveDisabled}
                    class="slds-m-left_small">
                </lightning-button>
            </div>
        </div>

    </lightning-card>
</template>
