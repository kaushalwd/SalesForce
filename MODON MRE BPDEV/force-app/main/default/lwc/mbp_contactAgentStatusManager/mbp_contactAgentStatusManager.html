<template>

    <template if:true={isLoading}>
        <div class="spinner-overlay">
            <lightning-spinner
                alternative-text="Saving"
                size="medium">
            </lightning-spinner>
        </div>
    </template>

    <div class="agent-status-wrapper">

        <div class="title-section">
            <h2>Agent Status Management</h2>
            <p>Update the agent status and provide a reason.</p>
        </div>

        <div class="field-section">

            <lightning-combobox
                label="Agent Status"
                value={selectedStatus}
                placeholder="Select Agent Status"
                options={statusOptions}
                onchange={handleStatusChange}
                required>
            </lightning-combobox>

        </div>

        <div class="field-section">

            <lightning-textarea
                label="Status Reason"
                value={reason}
                placeholder="Enter detailed reason..."
                onchange={handleReasonChange}
                required>
            </lightning-textarea>

        </div>

        <div class="button-section">

            <lightning-button
                label="Cancel"
                onclick={closeModal}>
            </lightning-button>

            <lightning-button
                variant="brand"
                label="Update Status"
                onclick={handleSubmit}>
            </lightning-button>

        </div>

    </div>

</template>
