<template>

    <template if:true={showSummary}>

        <section class="pe-summary-card gradient-bg slds-m-around_medium slds-p-around_medium slds-card">

            <div class="slds-grid slds-grid_align-spread slds-p-bottom_small">
                <h3 class="slds-text-heading_small">
                    Payment Extension Summary
                </h3>
            </div>

            <div class="white-underline"></div>

        <div class="pe-summary-container">

            <!-- ================================================= -->
            <!-- MILESTONE INFORMATION -->
            <!-- ================================================= -->

            <template if:true={showMilestoneInfo}>

            <div class="pe-table-wrapper">

                <h4 class="pe-table-title">
                    Milestone Information
                </h4>

                <table class="slds-table slds-table_bordered slds-table_cell-buffer pe-summary-table">

                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">Milestone Number</th>
                            <th scope="col">SPA Date</th>
                            <th scope="col">Extended Date</th>
                            <th scope="col">AED</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>{milestoneNumber}</td>

                            <td>
                                <lightning-formatted-date-time
                                    value={spaDate}>
                                </lightning-formatted-date-time>
                            </td>

                            <td>
                                <lightning-formatted-date-time
                                    value={extendedDate}>
                                </lightning-formatted-date-time>
                            </td>

                            <td>
                                <lightning-formatted-number
                                    value={installmentAmount}
                                    format-style="currency"
                                    currency-code="AED">
                                </lightning-formatted-number>
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

            </template>

        </div>

        </section>

    </template>

</template>
