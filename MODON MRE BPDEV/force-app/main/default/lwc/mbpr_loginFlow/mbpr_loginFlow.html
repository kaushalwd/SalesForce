<template>
    <section class="login-shell" aria-label="Modon Broker Portal sign in">
        <main class="login-main">
            <div class="login-stack">
                <div class="brand-mark">
                    <c-mbpr_brand-mark class="brand-logo"></c-mbpr_brand-mark>
                    <span class="brand-divider" aria-hidden="true">|</span>
                    <span class="brand-label">{brandLabel}</span>
                </div>
                <p class="brand-subtitle">Sign in to continue</p>

                <c-mbpr_login-card
                    view={view}
                    username={username}
                    password={password}
                    reset-username={resetUsername}
                    otp-code={otpCode}
                    otp-sent-email-address={otpSentEmailAddress}
                    otp-counter={otpCounter}
                    can-resend-otp={canResendOtp}
                    privacy-accepted={privacyAccepted}
                    privacy-url={privacyPolicyUrl}
                    registration-url={registrationUrl}
                    resume-url={resumeUrl}
                    loading={loading}
                    feedback-message={feedbackMessage}
                    feedback-variant={feedbackVariant}
                    onfieldchange={handleFieldChange}
                    onlogin={handleLogin}
                    onshowreset={handleShowReset}
                    onresetrequest={handleResetRequest}
                    onbacklogin={handleBackToLogin}
                    onverifyotp={handleVerifyOtp}
                    onresendotp={handleResendOtp}
                ></c-mbpr_login-card>
            </div>
        </main>

        <c-mbpr_login-footer
            year={currentYear}
            terms-url={termsandcondtions}
            privacy-url={privacyPolicyUrl}
        ></c-mbpr_login-footer>
    </section>
</template>
