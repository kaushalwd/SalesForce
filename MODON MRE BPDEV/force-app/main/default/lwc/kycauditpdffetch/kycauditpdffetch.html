<template>
    <!-- Only render if this is a KYC Reference document -->
    <template if:true={isKycRecord}>
        <lightning-card title="KYC Audit PDF" icon-name="doctype:pdf">
            <div class="slds-p-around_medium">

                <!-- Error -->
                <template if:true={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                        <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                        {errorMessage}
                    </div>
                </template>

                <!-- Success -->
                <template if:true={successMessage}>
                    <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_small" role="alert">
                        <lightning-icon icon-name="utility:success" size="small" class="slds-m-right_x-small"></lightning-icon>
                        {successMessage}
                    </div>
                </template>

                <!-- Profile list -->
                <template if:true={profilesLoaded}>
                    <div class="slds-box slds-box_x-small slds-m-bottom_small slds-theme_shade">
                        <p class="slds-text-title_caps slds-m-bottom_x-small">
                            Sales Order: {salesOrderName}
                        </p>
                        <template for:each={profileList} for:item="p">
                            <div key={p.profileId} class="slds-grid slds-grid_vertical-align-center slds-m-top_xx-small">
                                <lightning-icon
                                    icon-name={p.statusIcon}
                                    size="x-small"
                                    variant={p.statusVariant}
                                    class="slds-m-right_x-small">
                                </lightning-icon>
                                <span class="slds-text-body_small">
                                    <strong>{p.name}</strong> ({p.role}) — <em>{p.statusLabel}</em>
                                </span>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Spinner -->
                <template if:true={isLoading}>
                    <div class="slds-align_absolute-center slds-m-bottom_small">
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        <span class="slds-m-left_small slds-text-body_small">{loadingMessage}</span>
                    </div>
                </template>

                <!-- Show two buttons — one for enabled state, one fake for disabled state -->
                <template if:true={buttonDisabled}>
                    <lightning-button
                        label="Fetch KYC Audit PDF from Maxsight"
                        icon-name="utility:download"
                        variant="neutral"
                        onclick={handleDisabledClick}>
                    </lightning-button>
                </template>
                <template if:false={buttonDisabled}>
                    <lightning-button
                        label="Fetch KYC Audit PDF from Maxsight"
                        icon-name="utility:download"
                        variant="brand"
                        onclick={handleFetch}>
                    </lightning-button>
                </template>

            </div>
        </lightning-card>
    </template>
</template>
