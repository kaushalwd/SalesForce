<template>

    <template lwc:if={isLoading}>
        <div class="full-page-spinner slds-is-fixed" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.75); z-index: 9001;">
            <div role="status" class="slds-spinner slds-spinner_large slds-spinner_inline slds-align_absolute-center" style="top: 50%;">
                <span class="slds-assistive-text">Loading</span>
                <div class="slds-spinner__dot-a"></div>
                <div class="slds-spinner__dot-b"></div>
            </div>
        </div>
    </template>

    <article class="slds-card" style="min-height: 400px; display: flex; flex-direction: column;">
        <!-- Header Section -->
        <div class="slds-card__header slds-grid slds-p-around_medium" style="background-color: #f3f3f3; border-bottom: 1px solid #dddbda;">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                
                <div class="slds-media__body slds-align_absolute-center">
                    <h2 class="slds-card__header-title slds-text-heading_medium">
                        Initiate Business Process
                    </h2>
                </div>
            </header>
        </div>
        <!-- Main Content - Centered and Clean -->
        <div class="slds-card__body slds-card__body_inner" style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <div style="max-width: 600px; margin: 0 auto; width: 100%;">
                    <div class="slds-grid slds-grid_align-spread slds-wrap slds-gutters">
                        <div class="slds-col slds-size_2-of-3">
                            <c-generic-lookup-lwc 
                                objname="Process_Flow__c" 
                                iconname="standard:account" 
                                onlookupselectedname={handleProcessFlowSelectionName}
                                onlookupselected={handleProcessFlowSelection} 
                                onclearlookup={handleProcessFlowClear}>
                            </c-generic-lookup-lwc>
                        </div>
                        
                        <div class="slds-col slds-size_1-of-3 slds-grid slds-grid_vertical-align-center">
                            <lightning-button 
                                variant="brand" 
                                label="Initiate Process" 
                                title="Initiate Process" 
                                onclick={handleClick}
                                style="width: 100%; min-width: 150px;"
                                disabled={isLoading}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>
    </article>
</template>
