<template>
	<template if:false={showFileUpload}>
		<lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
	</template>
	<template if:true={showFileUpload}>
		<div class="slds-card">
			<div class="slds-box slds-theme_shade slds-theme_alert-texture">
				<p align="justify" font-family= "Times New Roman, Times, serif">The merged PDF size exceeds <strong>3MB</strong>.
					In a few seconds, the merged PDF will start downloading automatically or
					it will prompt you to save it. After saving it locally,
					please reupload it using the upload button below.
				</p>
				<lightning-file-upload 
					record-id={recordId} 
					accept={acceptedFormats} 
					name="fileUploader" 
					class="file-selector-large" 
					title="The tooltip for the file uploader"
					onuploadfinished={handleUploadFinished}>
				</lightning-file-upload>
			</div>
		</div>
	</template>
</template>
