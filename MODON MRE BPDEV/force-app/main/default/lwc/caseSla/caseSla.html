<template>
    <lightning-card>
        <div class="wrapper">

            <!-- Title -->
            <h2 class="title">
                <span class="case-text">Case</span> SLA Time
            </h2>

            <!-- TIMER -->
            <div class="time-text">
                {formattedRemainingTime}
            </div>

            <!-- PROGRESS BAR -->
            <div class="progress-container">
                <div class="progress-bar" style={progressStyle}></div>
            </div>

            <!-- SLA DETAILS -->
            <div class="details">
                <p><b>SLA Start:</b> {formattedStartTime}</p>
                <p><b>SLA End:</b> {formattedDueTime}</p>
                <p><b>Respond Before:</b> {formattedRespondBefore}</p>
            </div>

        </div>
    </lightning-card>
</template>
