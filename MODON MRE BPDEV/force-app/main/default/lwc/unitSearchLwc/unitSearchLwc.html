<template>
    <div class="spinner">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" variant="brand" size="large">
            </lightning-spinner>
        </template>
    </div>
    <template if:true={salesOrderExist}>
        <lightning-card title="Sales order already exist for this opportunity."></lightning-card>
    </template>

    <template if:true={showMainUnitSearchUi}>
        <article class="slds-card slds-p-around_x-small">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:groups" size="medium" alternative-text="Unit Search">
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <a href="javascript:void(0);" class="slds-card__header-link slds-truncate" title="Unit Search">
                                <span>Unit Search</span>
                            </a>
                        </h2>
                    </div>
                </header>
    
                <template if:false={disablePath}>
                    <lightning-button name="BACK" label="Back" icon-name="utility:back" slot="actions"
                        disabled={disableBack} onclick={handleMenuAction}></lightning-button>
                        &nbsp;
                    <lightning-button name="FORWARD" label="Proceed" icon-name="utility:forward"
                        slot="actions" icon-position="right" disabled={disableProceed}
                        onclick={handleMenuAction}></lightning-button>
    
                </template>
                <template if:true={disablePath}>
                    <template if:true={showBtnGroup}>
                        <div class="slds-no-flex">
                            <div class="slds-button-group" role="group">
                                <template lwc:if={showRequestBlock}>
                                    <lightning-button name="BOOKING" label="Book Unit/s" icon-name="utility:entitlement"
                                        slot="actions" onclick={handleMenuAction}
                                        disabled={disableOffer}></lightning-button>
                                    &nbsp;
                                    <lightning-button name="BLOCKREQUESTEGYPT" label="Request a Block"
                                        icon-name="utility:entitlement" slot="actions" onclick={handleMenuAction}
                                        disabled={disableOffer1}></lightning-button>
                                </template>
                                <template lwc:else>
                                <lightning-button name="OFFER" label="Generate Offer" icon-name="utility:pdf_ext"
                                    slot="actions" onclick={handleMenuAction} disabled={disableOffer}></lightning-button>
                                    
                                <!-- &nbsp;
                                <lightning-button name="MEMO" label="Generate Memo" icon-name="utility:edit_form"
                                    slot="actions" onclick={handleMenuAction} disabled={disableOffer}></lightning-button> -->
                                &nbsp;
                                <lightning-button name="BOOKING" label="Book Unit/s" icon-name="utility:entitlement"
                                    slot="actions" onclick={handleMenuAction} disabled={disableOffer}></lightning-button>
                                    &nbsp;
                                <lightning-button name="BLOCKREQUEST" label="Request a Block" icon-name="utility:entitlement"
                                    slot="actions" onclick={handleMenuAction} disabled={disableOffer}></lightning-button>
                                </template>

                                <template lwc:if={showRequestBlockWithFeesButton}>

                                    &nbsp;

                                    <lightning-button name="BLOCKREQUESTWITHFEES" label="Request Block with Fees"

                                        icon-name="utility:entitlement" slot="actions" onclick={handleMenuAction}

                                        disabled={disableOffer1}></lightning-button>
                                     &nbsp;
                                    <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" title="Refresh" onclick={handleRefresh}>
                                    </lightning-button-icon>
                               </template>
                            </div>
                        </div>
                    </template>
                </template>
            </div>
            <template if:false={disablePath}>
                <br />
                <lightning-progress-indicator current-step={pageNumber} type="path" variant="base">
    
                    <template for:each={steps} for:item="step">
                        <lightning-progress-step label={step.label} value={step.value} key={step.label}>
                        </lightning-progress-step>
                    </template>
    
                </lightning-progress-indicator>
                <br />
            </template>
            <template if:true={showPage1}>
                <div class="slds-card__body">
                    <div class="slds-grid slds-wrap slds-container--fluid slds-gutters slds-grid_vertical-align-end">
                        <!-- <div class="filter-col slds-col slds-size_5-of-12">
                            <lightning-input aria-label="hidden" type="text" name="Search Unit" label="Search Unit" value={searchText} onchange={handleUnitChange}></lightning-input>
                        </div> -->
                        <div
                            class="filter-col slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-large-size_3-of-12">
                            <lightning-combobox dropdown-alignment="auto" name="Projects" label="Projects"
                                value={selectedProject} options={projectList} onchange={handleProjectChange}>
                           </lightning-combobox>
                        </div>
                        <div
                            class="filter-col slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-large-size_3-of-12">
                            <lightning-combobox dropdown-alignment="auto" name="Phase" label="Phase"
                                value={selectedBuilding} options={buildingList} onchange={handleBuildingChange}>
                           </lightning-combobox>
                        </div>
                        <template lwc:if={showRequestBlock}>
                            <div
                                class="filter-col slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-large-size_3-of-12">
                                <lightning-combobox dropdown-alignment="auto" name="Unit Type" label="Unit Type"
                                    value={selectedUnitType} options={unitTypeList} onchange={handleUnitTypeChange}>
                                </lightning-combobox>
                            </div>
                            <div
                                class="filter-col slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-large-size_3-of-12">
                                <lightning-combobox dropdown-alignment="auto" name="Quality Type" label="Quality Type"
                                    value={selectQuality} options={qualityTypeList} onchange={handleQualityTypeChange}>
                                </lightning-combobox>
                            </div>
                            <div
                                class="filter-col slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-large-size_3-of-12">
                                <lightning-combobox dropdown-alignment="auto" name="Number of Bedrooms"
                                    label="Number of Bedrooms" value={selectedNoOfBedrooms} options={bedroomsList}
                                    onchange={handleBedroomChange}>
                                </lightning-combobox>
                            </div>
                            <div
                                class="filter-col slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-large-size_3-of-12">
                                <lightning-combobox dropdown-alignment="auto" name="GFA (Gross Floor Area)"
                                    label="GFA (Gross Floor Area)" value={selectedFloorArea} options={areaList}
                                    onchange={handleAreaChange}>
                                </lightning-combobox>
                            </div>
                            <div
                                class="filter-col slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-large-size_3-of-12">
                                <lightning-combobox dropdown-alignment="auto" name="Floor" label="Floor"
                                    value={selectedFloor} options={floorList} onchange={handleFloorChange}>
                                </lightning-combobox>
                            </div>
                            <div
                                class="filter-col slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-large-size_3-of-12">
                                <lightning-input label="Unit Name" value={unitCode} placeholder="Enter Unit Name"
                                    onchange={handleUnitCodeChange}></lightning-input>
                            </div>
                        </template>
                    </div>
                    <template if:true={unitLst}>
                        <div class="slds-p-around_x-small slds-table_edit_container slds-scrollable" style="padding-left: 0">
                            <div class="slds-table_edit_container slds-is-relative">
                                <table aria-multiselectable="true" class="slds-table slds-no-row-hover slds-table_bordered slds-table_col-bordered slds-table_edit " role="grid">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th class="" scope="col"
                                                style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                            </th>
                                            <th scope="col" style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                Unit Name
                                            </th>
                                            <th scope="col" style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                Plot Area
                                            </th>
                                            <!-- <template lwc:if={alNaseemSelected}> -->
                                                <th scope="col" style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                    No. of Bedrooms
                                                </th>
                                                <th scope="col" style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                    Typology
                                                </th>
                                                <th scope="col" style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                    Total Price
                                                </th>
                                            <!-- </template> -->
<!--
                                            <template if:true={isWadeemProject}>
                                                -->
                                                <th scope="col" style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                    Block Comment
                                                </th>
                                                <!-- Arvind v12.02 - Added Bucket and Blocked For columns -->
<th scope="col" style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
    Bucket
</th>
<th scope="col" style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
    Blocked For
</th>
                                                <!--
                                            </template>
                                            -->
                                            <template if:true={showRequestBlock}>
                                                <th scope="col" style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                    Gross Floor Area(GFA)
                                                </th>
                                            </template>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={unitLst} for:item="item" for:index="indexVar">
                                            <tr key={item.Id} aria-selected="false" class="slds-hint-parent">
                                                <td class="slds-cell-edit" role="gridcell" tabindex="0">
                                                    <lightning-input class="rowSelector" type="checkbox"
                                                        data-id={item.Id}
                                                        data-unit-name={item.Name}
                                                        onchange={handleRowSelect} checked={item.isSelected}
                                                        value={item.isSelected}></lightning-input>
                                                </td>
                                                <td class="slds-cell-edit" role="gridcell" tabindex="0">
                                                    <span class="slds-grid slds-grid_align-spread">
                                                        {item.Name}
                                                    </span>
                                                </td>
                                                <td class="slds-cell-edit" role="gridcell" tabindex="0">
                                                    <span class="slds-grid slds-grid_align-spread">
                                                        {item.totalArea}
                                                    </span>
                                                </td>
                                                <!-- <template lwc:if={alNaseemSelected}> -->
                                                    <td class="slds-cell-edit" role="gridcell" tabindex="0">
                                                        <span class="slds-grid slds-grid_align-spread">
                                                            {item.Number_of_Bedrooms__c}
                                                        </span>
                                                    </td>
                                                    <td class="slds-cell-edit" role="gridcell" tabindex="0">
                                                        <span class="slds-grid slds-grid_align-spread">
                                                            {item.Typology__c}
                                                        </span>
                                                    </td>
                                                    <td class="slds-cell-edit" role="gridcell" tabindex="0">
                                                        <span class="slds-grid slds-grid_align-spread">
                                                            <lightning-formatted-number format-style="currency" class="table-input" value={item.TotalPrice__c} minimum-fraction-digits="2" maximum-fraction-digits="2" ></lightning-formatted-number>
                                                        </span>
                                                    </td>
                                                <!-- </template> -->
                                                <!--<template if:true={isWadeemProject}>-->
                                                    <td>
                                                        <span class="slds-grid slds-grid_align-spread">
                                                            {item.BlockComment__c}
                                                        </span>
                                                    </td>
                                                <!--</template>-->
                                                <!-- Arvind v12.02 - Bucket and Blocked For, corrected to match header order.
                                                     Uses precomputed null-safe bucketName/blockedForName (see unitSearchLwc.js
                                                     populateUnitData) instead of dotting into Bucket__r.Name / BlockedFor__r.Name
                                                     directly, since those lookups are often null and threw
                                                     "Cannot read properties of undefined (reading 'Name')". -->
                                                <td class="slds-cell-edit" role="gridcell" tabindex="0">
                                                    <span class="slds-grid slds-grid_align-spread">
                                                        {item.bucketName}
                                                    </span>
                                                </td>
                                                <td class="slds-cell-edit" role="gridcell" tabindex="0">
                                                    <span class="slds-grid slds-grid_align-spread">
                                                        {item.blockedForName}
                                                    </span>
                                                </td>
                                                <template lwc:if={showRequestBlock}> 
                                                    <td class="slds-cell-edit" role="gridcell" tabindex="0">
                                                        <span class="slds-grid slds-grid_align-spread"> 
                                                            {item.GrossFloorAreaGFA__c}
                                                         </span>
                                                    </td>
                                                </template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:true={showPage2}>
                <div class="slds-card__body">
                    <div class="slds-grid slds-container--fluid slds-gutters slds-grid_vertical-align-top">
                        <div class="filter-col slds-col slds-size_12-of-12">
                            <lightning-tabset variant="scoped">
                                <template for:each={selectedUnitList} for:item="item">
                                    <lightning-tab key={item.unitId} label={item.unitName} value={item.unitId} onactive={handlePaymentUnitSelect}>
                                        <div class="slds-grid slds-wrap slds-p-around_small" style="padding-left: unset;">
                                            <div class="filter-col slds-col slds-size_12-of-12" style="padding-left: unset;">
                                                <template if:true={item.paymentDetails}>
                                                    <div class="slds-grid slds-wrap custom-margin"  style="padding-left: unset;">
                                                        <!-- <div class="filter-col slds-col slds-size_2-of-12" style="padding-left: unset;">
                                                            <span><b>Payment Details</b></span>
                                                        </div> -->
                                                        <!-- <div class="filter-col slds-col slds-size_1-of-12" style="padding-left: unset;">
                                                            &nbsp;
                                                        </div> -->
                                                        <div class="filter-col slds-col slds-size_3-of-12" style="padding-left: unset;">
                                                            <template if:true={item.paymentDetails}>
                                                                <template if:true={item.paymentDetails.availablePaymentPlans}>
                                                                        <lightning-combobox dropdown-alignment="auto" name={item.unitId} 
                                                                                placeholder="Select Payment Plan" value={item.paymentDetails.selectedPayment}
                                                                                options={item.paymentDetails.availablePaymentPlans} label="Payment Details"
                                                                                onchange={selectPaymentPlan} data-record-id={item.unitId} class="selectedPaymentPlan"></lightning-combobox>
                                                                </template>
                                                                
                                                            </template>
                                                        </div>
                                                        <!-- Arvind v19.0 (24 Sep 2026) - Pre-Approval Number next to the payment plan.
                                                             EOI with number -> read-only; pre-approval plan without EOI number -> required input.
                                                             Switching to a normal plan hides the input (not required). -->
                                                        <template lwc:if={item.showEoiPreApproval}>
                                                            <div class="filter-col slds-col slds-size_3-of-12" style="padding-left: unset;">
                                                                <lightning-input label="Pre-Approval Number (from EOI)"
                                                                    value={item.preApprovalNumber} disabled></lightning-input>
                                                            </div>
                                                        </template>
                                                        <template lwc:if={item.showManualPreApproval}>
                                                            <div class="filter-col slds-col slds-size_3-of-12" style="padding-left: unset;">
                                                                <lightning-input label="Pre-Approval Number" required
                                                                    placeholder="Enter Pre-Approval Number"
                                                                    value={item.manualPreApprovalNumber}
                                                                    onchange={handleManualPreApprovalChange}
                                                                    data-record-id={item.unitId}
                                                                    class="manualPreApprovalNumber"></lightning-input>
                                                            </div>
                                                        </template>
                                                        <!-- Arvind v19.0 - END -->
                                                        <!-- Arvind v18.0 (23 Sep 2026) - no payment plan after pre-approval filtering -->
                                                        <template lwc:if={item.paymentPlanError}>
                                                            <div class="filter-col slds-col slds-size_3-of-12 slds-p-top_large slds-text-color_error" style="padding-left: unset;">
                                                                {item.paymentPlanError}
                                                            </div>
                                                        </template>
                                                        <!-- Arvind v18.0 - END -->
                                                        <!-- Arvind changes for EOI v2.0 - START -->
                                                        <!-- EOI Selection dropdown: visible only for non-Modon Egypt BOOKING when Completed EOIs exist. -->
                                                        <!-- isBookingSelectedWithEOI (JS getter) controls visibility.                                  -->
                                                        <!-- availableEOIs and selectedEOIId are injected by selectedUnitList getter in JS.             -->
                                                        <!-- Modon Egypt users are completely unaffected - this block never renders for them.           -->
                                                        <template lwc:if={isBookingSelectedWithEOI}>
                                                            <div class="filter-col slds-col slds-size_3-of-12" style="padding-left: unset;">
                                                                <lightning-combobox
                                                                    dropdown-alignment="auto"
                                                                    name={item.unitId}
                                                                    label="Select EOI *"
                                                                    placeholder="Select Expression of Interest"
                                                                    value={item.selectedEOIId}
                                                                    options={item.availableEOIs}
                                                                    onchange={handleEOISelection}
                                                                    data-record-id={item.unitId}
                                                                    required>
                                                                </lightning-combobox>
                                                                <!-- Arvind v18.0 (23 Sep 2026) - Pre-Approval Number of the selected EOI -->
                                                                <template lwc:if={item.preApprovalNumber}>
                                                                    <div class="slds-text-body_small slds-p-top_xx-small">
                                                                        Pre-Approval No: {item.preApprovalNumber} (from EOI - saved on the Sales Order)
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                        <!-- Arvind changes for EOI v2.0 - END -->
                                                        <!-- Arvind v17.0 (23 Sep 2026) - Facade Style (Phase.Facade_Style__c = true).
                                                             Shown for Generate Offer AND Book Unit/s. Options from Facade_Style_c__mdt.
                                                             One option = auto-selected; none = booking blocked. -->
                                                        <template lwc:if={item.facadeStyleHasOptions}>
                                                            <div class="filter-col slds-col slds-size_3-of-12" style="padding-left: unset;">
                                                                <lightning-combobox dropdown-alignment="auto" name={item.unitId}
                                                                    label="Facade Style" placeholder="Select Facade Style"
                                                                    value={item.selectedFacadeStyle} options={item.facadeStyleOptions}
                                                                    onchange={handleFacadeStyleSelection} data-record-id={item.unitId}
                                                                    class="facadeStyleSelect" required>
                                                                </lightning-combobox>
                                                            </div>
                                                        </template>
                                                        <template lwc:if={item.facadeStyleNoOptions}>
                                                            <div class="filter-col slds-col slds-size_3-of-12 slds-p-top_large slds-text-color_error" style="padding-left: unset;">
                                                                No Facade Style is configured for this phase. Booking is not allowed.
                                                            </div>
                                                        </template>
                                                        <!-- Arvind v17.0 - END -->
                                                        <template if:true={item.unitOptionDetails}>
                                                            <!-- <div class="filter-col slds-col slds-size_1-of-12" style="padding-left: unset;">&nbsp;</div> -->
                                                            
                                                            <div class="filter-col slds-col slds-size_3-of-12" style="padding-left: unset;">
                                                                <template if:true={item.unitOptionDetails}>
                                                                    <template if:true={item.unitOptionDetails.availableUnitOptions}>
                                                                            <lightning-combobox dropdown-alignment="auto" name={item.unitId} 
                                                                                    placeholder="Select Unit Option" value={item.unitOptionDetails.selectedUnitOption}
                                                                                    options={item.unitOptionDetails.availableUnitOptions} label="Unit Options"
                                                                                    onchange={selectUnitOption} data-record-id={item.unitId} class="selectedUnitOption"></lightning-combobox>
                                                                    </template>
                                                                    
                                                                </template>
                                                            </div> 
                                                        </template>
                                                        <!--Al Naseem Select Design-->
                                                        <template if:true={isOfferSelected}>
                                                            <!-- Arvind v17.0 - legacy picker only when the phase does NOT drive Facade Style -->
                                                            <template if:false={item.facadeStyleRequired}>
                                                            <template if:true={alNaseemSelected}>
                                                            <div class="filter-col slds-col slds-size_3-of-12" style="padding-left: unset;">
                                                                <lightning-combobox dropdown-alignment="auto" name="SelectDesign" 
                                                                            placeholder="Facade Style" value={selectedDesign}
                                                                            options={alNaseemDesignOptions} label="Facade Style" onchange={handleAlNaseemDesignChange}
                                                                        class="selectedDesign"></lightning-combobox>
                                                            </div>
                                                            </template>
                                                            </template>
                                                        </template>
                                                        <template if:false={item.unitOptionDetails}>
                                                            <div class="filter-col slds-col slds-size_3-of-12" style="padding-left: unset;">&nbsp;</div>
                                                        </template>
                                                        <div class="filter-col slds-col slds-size_6-of-12" style="padding-left: unset;"></div>
                                                        <br/>
                                                        <template if:false={isOfferSelected}>
                                                            <template if:true={alNaseemSelected}>
                                                            <!-- Arvind v17.0 - unit Facade Style hidden when the phase drives it -->
                                                            <template if:false={item.facadeStyleRequired}>
                                                            <lightning-input dropdown-alignment="auto" name="SelectDesign" class="slds-m-right_small"
                                                                placeholder="Facade Style" value={item.facadeStyle} label="Facade Style" disabled></lightning-input>
                                                            </template>

                                                            <lightning-input dropdown-alignment="auto" name="SelectDesign"  class="slds-m-right_small"
                                                                placeholder="Interior" value={item.interior} label="Interior" disabled></lightning-input>
                                                            </template>
                                                            <template if:true={item.allUnitOptions}>
                                                                <template for:each={item.allUnitOptions} for:item="unitOption" for:index="installmentItemIndexVar">
                                                                    <div key={unitOption.fieldApiName} class="filter-col slds-col slds-size_3-of-12" style="padding-left: unset;">
                                                                        <lightning-combobox dropdown-alignment="auto" name={item.unitId} 
                                                                            placeholder="" value={unitOption.selectedValue} required="true" onchange={handleUnitOptionSelection}
                                                                            options={unitOption.unitOptions} data-index={installmentItemIndexVar} label={unitOption.fieldLabel}
                                                                            data-record-id={item.unitId} class="picklistUnitOption"></lightning-combobox>
                                                                    </div>
                                                                </template>
                                                            </template>
                                                        </template>
                                                        
                                                        <div class="filter-col slds-col slds-size_12-of-12" style="padding-left: unset;">
                                                            <lightning-card variant="Narrow" title="">
                                                                <div class="slds-p-bottom_small slds-scrollable">
                                                                    <div class="slds-text-heading_xx-small slds-p-bottom_xx-small table-title slds-scrollable">
                                                                    <b>{paymentTypeName} </b></div>
    
                                                                    <table aria-multiselectable="true"
                                                                            class="slds-table slds-no-row-hover slds-table_bordered slds-table_col-bordered slds-table_edit "
                                                                            role="grid">
                                                                            <thead>
                                                                                <tr class="slds-line-height_reset">
                                                                                    <th scope="col"
                                                                                        style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                                                        Installment #
                                                                                    </th>
                                                                                    <th scope="col"
                                                                                        style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                                                        Milestone
                                                                                    </th>
                                                                                    <th scope="col"
                                                                                        style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                                                        Installment Percentage
                                                                                    </th>
                                                                                    <template if:true={isModonEgyptProfile}>
                                                                                        <th scope="col"
                                                                                            style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
                                                                                            Maintenance Fees
                                                                                        </th>
                                                                                    </template>
                                                                                    <th scope="col"
                                                                                        style="padding: var(--lwc-tableCellSpacing,0.25rem 0.5rem);">
