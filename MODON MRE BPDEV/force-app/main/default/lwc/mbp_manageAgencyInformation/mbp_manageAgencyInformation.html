        <div class="field-block">
          <span class="label">Agency Name:</span>
          <span class="value">{account.Name}</span>
        </div>
        <div class="field-block">
          <span class="label">Phone:</span>
          <span class="value">{account.Phone}</span>
        </div>
        <div class="field-block">
          <span class="label">Email:</span>
          <span class="value">{account.Company_Email_Address__c}</span>
        </div>
      </div>
      <div class="field-row">
        <div class="field-block">
          <span class="label">City:</span>
          <span class="value">{account.BillingCity}</span>
        </div>
        <div class="field-block">
          <span class="label">Country:</span>
          <span class="value">{account.BillingCountry}</span>
        </div>
        <div class="field-block">

        </div>
      </div>
      <div class="field-row">
        <div class="field-block">
          <span class="label">Region:</span>
          <span class="value">{account.Agency_Region__c}</span>
        </div>
      </div>
    </div>
  </template>
  <c-mbp_customspinner is-loading={isLoading}></c-mbp_customspinner>


 
  <!-- VAT Info Section -->
  <template if:true={showVatSection}>
  <h2 class="section-title">
  VAT Information
  <span class="help-icon" tabindex="0">
    <img src={guidelinesIcon} alt="Help" class="info-icon" />
    <div class="tooltip">
      <ul>
        <li>VAT number must match your VAT registration document exactly.</li>
        <li>Start and expiry dates must be valid and within the active VAT period.</li>
        <li>Upload a scanned PDF of the VAT certificate or undertaking (max 5MB).</li>
        <li>
          Use file name format:
          <em>VAT_Certificate_AgencyName.pdf</em> or
          <em>VAT_Undertaking_AgencyName.pdf</em>
        </li>
      </ul>
    </div>
  </span>
 </h2>

    <div class="info-card">
      <div class="field-row">
        <div class="field-block">
          <span class="label">VAT Type:</span>
          <span class="value">{vatCertificateType}</span>
        </div>
        <template if:false={isVatUndertakingSelected}>
        <div class="field-block">
          <span class="label">VAT Registration Number:</span>
          <span class="value">{vatNumber}</span>
        </div>
        <div class="field-block">
          <span class="label">VAT Start Date:</span>
          <span class="value">{vatStartDate}</span>
        </div>
        </template>
      </div>
      <div class="field-row">
        <div class="field-block file-block">
          <label class="label">VAT Document:</label>
          <template if:true={vatDownloadUrl}>
            <a href={vatDownloadUrl} target="_blank"> {vatDocumentLabel} </a>
          </template>
          <template if:false={vatDownloadUrl}>
            <span class="file-missing">No VAT File Available</span>
          </template>
        </div>
        <div class="field-block btn-align">
          <template if:true={canShowVatButton}>
            <div class="btn-footer align-right">
              <button class="slds-button slds-button_brand" onclick={openVatModal}> Update VAT Details </button>
            </div>
          </template>
        <template if:true={vatRejectionComment}>
                <div class="rejection-comment">
                    <p><strong class="rejection-text">Rejection Comment:</strong> {vatRejectionComment}</p>
                </div>
            </template>

          <template if:true={vatSubmitted}>
            <div class="approval-msg error-msg"> ⚠️ Your VAT info update is under approval. You cannot make further changes until it is completed. </div>
