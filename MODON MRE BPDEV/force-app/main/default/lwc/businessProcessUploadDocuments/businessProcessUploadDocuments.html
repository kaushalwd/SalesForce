<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template>

    <template if:false={isLoading}>
        <template if:false={showConfirmation}>
            
            <lightning-card title="Business Process Documents" icon-name="standard:document">
                <div class="slds-m-around_medium">
                    <div class="slds-grid slds-gutters slds-m-bottom_small slds-align_absolute-center">
                        <lightning-input class="slds-col slds-size_3-of-4"
                                         label="New Document Name"
                                         value={newDocName}
                                         onchange={handleInputChange}
                                         placeholder="Enter document name">
                        </lightning-input>
                        <lightning-button-icon class="slds-col slds-size_1-of-4 slds-m-top_large"
                                               icon-name="utility:add"
                                               variant="brand"
                                               alternative-text="Add Document"
                                               onclick={handleAdd}>
                        </lightning-button-icon>
                    </div>

                    <div class="table-container">
                        <lightning-datatable
                            key-field="Id"
                            data={bussinessProcessDocuments}
                            columns={columns}
                            onrowselection={handleRowSelection}
                            onrowaction={handleRowAction}>
                        </lightning-datatable>
                    </div>

                    <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                        <lightning-button variant="brand"
                                          label="Next"
                                          icon-name="utility:forward"
                                          icon-position="right"
                                          onclick={handleNext}>
                        </lightning-button>
                    </div>
                </div>
            </lightning-card>

        </template>
    </template>

    <template if:true={showConfirmation}>
        <section role="dialog">
            <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Upload Documents..</h2>
                </header>
            <!--<div class="slds-modal__container"> -->
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{confirmationMessage}</p>
            <template if:true={hasOutstanding}>
                <div class="slds-text-color_error slds-text-body_small slds-m-top_small">
                    ⚠️ Outstanding amount exists for this booking.
                </div>
            </template>
                </div>
            <!--</div>-->
             <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" 
                                      label="No" 
                                      onclick={handleCancelConfirmation}>
                    </lightning-button>
                    <lightning-button variant="brand" 
                                      label="Yes" 
                                      onclick={handleConfirmSend}>
                    </lightning-button>
                </footer>
        </section>
    </template>
