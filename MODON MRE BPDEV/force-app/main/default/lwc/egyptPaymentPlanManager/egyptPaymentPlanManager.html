<template>
  <lightning-layout multiple-rows="true" vertical-align="end" class="slds-gutters" style="padding-left: unset;">

    <lightning-layout-item size="12" medium-device-size="12" large-device-size="12"
      class="slds-p-horizontal_small slds-p-bottom_medium">
      <lightning-radio-group name={unit.unitId} label={egyptConstants.PAYMENT_PLAN_MANAGER_LABEL_MODE}
        options={planTypeOptions} value={currentPlanType} onchange={handlePlanTypeChange} type="button"
        variant="label-hidden">
      </lightning-radio-group>
    </lightning-layout-item>

    <template if:true={isStandardPlan}>
      <lightning-layout-item size="12" medium-device-size="12" large-device-size="12" class="slds-p-horizontal_small">
        <c-egypt-standard-payment-plan unit-data={unit} is-modon-operation-profile={isModonOperationProfile}
          onstandardplanready={handleStandardPlanReady}>
        </c-egypt-standard-payment-plan>
      </lightning-layout-item>
    </template>

    <template if:true={isFlexiblePlan}>
      <lightning-layout-item size="12" medium-device-size="12" large-device-size="12" class="slds-p-horizontal_small">
        <c-egypt-flexible-payment-plan unit-id={unit.unitId} onflexibleplanready={handleFlexiblePlanReady}
          is-modon-operation-profile={isModonOperationProfile} exact-booking-date={exactBookingDate}
          ondisableproceedbuttonevent={handleDisableProceedBtn} class="slds-size_1-of-1">
        </c-egypt-flexible-payment-plan>
      </lightning-layout-item>
    </template>

  </lightning-layout>
</template>
