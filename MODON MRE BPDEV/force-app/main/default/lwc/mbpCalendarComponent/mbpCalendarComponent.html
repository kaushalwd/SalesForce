<template>
    <div class="header">
        <div class="calendar-filter">
            <lightning-combobox
                name="typeFilter"
                label="Filter by Type"
                value={typeFilter}
                placeholder="All Types"
                options={typeOptions}
                onchange={handleTypeChange}
                class="type-filter">
            </lightning-combobox>
        </div>
    </div>

    
    
    <div class="main-container">
        <!-- Left Side Calendar -->
       
        <div class="calendar-section">
            
            <div class="content">
                <template if:true={isLoading}>
                    <div class="loading-container">
                        <lightning-spinner alternative-text="Loading events" size="large"></lightning-spinner>
                        <p class="loading-text">Loading events...</p>
                    </div>
                </template>
                <div class="panel">
                    <h3 class="table-title">Calendar</h3>
                    <div class="calendar-container" lwc:dom="manual"></div>
                </div>
                <template if:false={isLoading}>
                    <div class="no-events" if:true={hasNoEvents}>
                        <lightning-icon icon-name="utility:event" size="large"></lightning-icon>
                        <h2>No Events Available</h2>
                        <p>There are no events scheduled for your agency at this time.</p>
                    </div>
                </template>
            </div>
        </div>

        <!-- Right Side Event Tables -->
        <div class="events-tables-section">
            <!-- Today's Events Table -->
            <div class="compact-table-section">
                <h3 class="table-title">Today's Occurrences</h3>
                <template if:true={hasTodayEvents}>
                    <c-mbp_adaptivedata-table 
                        records={filteredTodayEvents} 
                        columns={todayColumns} 
                        onrowaction={handleRowAction}
                        show-row-number-column="false"
                        hide-checkbox-column="true"
                        page-size="5">
                    </c-mbp_adaptivedata-table>
                </template>
                <template if:false={hasTodayEvents}>
                    <p class="no-data-message">No Events for Today</p>
                </template>
            </div>

            <!-- Upcoming Events Table -->
            <div class="compact-table-section">
                <h3 class="table-title">Upcoming Occurrences</h3>
                <template if:true={hasFutureEvents}>
                    <c-mbp_adaptivedata-table 
                        records={filteredFutureEvents} 
                        columns={futureColumns} 
                        onrowaction={handleRowAction}
                        show-row-number-column="false"
                        hide-checkbox-column="true"
                        page-size="5">
                    </c-mbp_adaptivedata-table>
                </template>
                <template if:false={hasFutureEvents}>
                    <p class="no-data-message">No Upcoming Events</p>
                </template>
            </div>

            <!-- Previous Events Table -->
            <div class="compact-table-section">
                <h3 class="table-title">Previous Occurrences</h3>
                <template if:true={hasPastEvents}>
                    <c-mbp_adaptivedata-table 
                        records={filteredPastEvents} 
                        columns={pastColumns} 
                        onrowaction={handleRowAction}
                        show-row-number-column="false"
                        hide-checkbox-column="true"
                        page-size="5">
                    </c-mbp_adaptivedata-table>
                </template>
                <template if:false={hasPastEvents}>
                    <p class="no-data-message">No Previous Events</p>
                </template>
            </div>
        </div>
    </div>
