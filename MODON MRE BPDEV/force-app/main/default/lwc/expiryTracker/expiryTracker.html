<template>
    <lightning-card>
        <h3 slot="title" class="slds-card__header-title">
            <lightning-icon icon-name="standard:bell" size="small" class="slds-m-right_small"></lightning-icon>
           <span style="display: block; text-align: center;font-weight:bold;padding:3px">Identification Documents Expiry Status</span>
        </h3>

        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>

            <template if:false={isLoading}>
                <ul class="slds-list_vertical slds-has-dividers_top-space">
                    <!-- Emirates ID -->
                    <li class="slds-item">
                        <div class="slds-media custom-media-item">
                            <div class="slds-media__figure">
                                <span class={emiratesIdStatus.iconContainerClass} title="Emirates ID">
                                    <lightning-icon icon-name="utility:user" alternative-text="Emirates ID" size="small"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body">
                                <p class="item-title">Emirates ID</p>
                                <p class={emiratesIdStatus.className}>{emiratesIdStatus.message}</p>
                            </div>
                        </div>
                    </li>

                    <!-- Passport -->
                    <li class="slds-item">
                        <div class="slds-media custom-media-item">
                            <div class="slds-media__figure">
                                <span class={passportStatus.iconContainerClass} title="Passport">
                                    <lightning-icon icon-name="utility:coupon_codes" alternative-text="Passport" size="small"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body">
                                <p class="item-title">Passport</p>
                                <p class={passportStatus.className}>{passportStatus.message}</p>
                            </div>
                        </div>
                    </li>
                    
                    <!-- KYC Form -->
                    <li class="slds-item">
                        <div class="slds-media custom-media-item">
                            <div class="slds-media__figure">
                                <span class={kycStatus.iconContainerClass} title="KYC Form">
                                    <lightning-icon icon-name="utility:file" alternative-text="KYC Form" size="small"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body">
                                <p class="item-title">KYC Form</p>
                                <p class={kycStatus.className}>{kycStatus.message}</p>
                            </div>
                        </div>
                    </li>
                </ul>
            </template>

            <template if:true={error}>
                <div class="slds-text-color_error slds-p-around_small">
                    <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_xx-small"></lightning-icon>
                    {error}
                </div>
            </template>
        </div>
    </lightning-card>
</template>
