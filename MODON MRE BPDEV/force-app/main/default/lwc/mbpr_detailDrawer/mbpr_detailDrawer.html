<template>
    <template lwc:if={open}>
        <div class={layerClass} onclick={handleOverlayClick}>
            <aside
                class={drawerClass}
                role="dialog"
                aria-modal="true"
                aria-labelledby="drawer-title"
                aria-describedby="drawer-subtitle"
                onclick={stopPropagation}
                onkeydown={handleKeydown}
            >
                <button class="drawer__close" type="button" onclick={handleClose} aria-label={closeLabel}>
                    <lightning-icon icon-name="utility:close" size="x-small" alternative-text=""></lightning-icon>
                </button>

                <div class="drawer__ambient" aria-hidden="true">
                    <span class="drawer__orb drawer__orb--one"></span>
                    <span class="drawer__orb drawer__orb--two"></span>
                </div>

                <div class="drawer__header">
                    <template lwc:if={eyebrow}>
                        <p class="drawer__eyebrow">{eyebrow}</p>
                    </template>
                    <h2 id="drawer-title" class="drawer__title">{title}</h2>
                    <template lwc:if={subtitle}>
                        <p id="drawer-subtitle" class="drawer__subtitle">{subtitle}</p>
                    </template>
                    <slot name="header-extra"></slot>
                </div>

                <div class="drawer__media">
                    <slot name="media"></slot>
                </div>

                <div class="drawer__body">
                    <slot></slot>
                </div>

                <div class="drawer__footer">
                    <slot name="footer"></slot>
                </div>
            </aside>
        </div>
    </template>
</template>
