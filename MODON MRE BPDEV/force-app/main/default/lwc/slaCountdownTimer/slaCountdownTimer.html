<template>
    <lightning-card>
        <div class="slds-text-align_center">
            <span style="font-weight:bold; font-size:1rem;">SLA Time </span>
            <span style="color:#1a73e8; font-weight:bold; font-size:1rem;">{team}</span>
        </div>

        <div class="slds-p-horizontal_medium slds-text-align_center">
            <template if:true={countdown}>
                <div class={timerClass}>
                    <span style="font-size:2rem; font-weight:bold;">
                        {countdown} {timeStatus}
                    </span>
                </div>

                <p><strong>SLA Start:</strong> {formattedSlaStart}</p>
                <p><strong>SLA End:</strong> {formattedSlaEnd}</p>
            </template>
            <template if:false={countdown}>
                <p>No SLA Data</p>
            </template>
        </div>
    </lightning-card>
</template>
