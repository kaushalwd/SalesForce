<template>
    <div class="so-card">

        <!-- Header -->
        <div class="so-header">
            <div class="so-title-row">
                <div class="so-icon">
                    <lightning-icon icon-name="standard:orders" size="x-small"></lightning-icon>
                </div>
                <p class="so-title">Sales Orders</p>
            </div>
            <div>
                <p class="so-total-num">{totalCount}</p>
                <p class="so-total-label">total orders</p>
            </div>
        </div>

        <!-- Status Rows -->
        <div class="so-rows">

            <div class="so-row">
                <div class="so-row-left">
                    <span class="so-dot d-green"></span>
                    <span class="so-row-name">Completed</span>
                </div>
                <span class="so-count-badge badge-green">{completedCount}</span>
            </div>

            <div class="so-row">
                <div class="so-row-left">
                    <span class="so-dot d-amber"></span>
                    <span class="so-row-name">In Progress</span>
                </div>
                <span class="so-count-badge badge-amber">{inProgressCount}</span>
            </div>

            <div class="so-row">
                <div class="so-row-left">
                    <span class="so-dot d-blue"></span>
                    <span class="so-row-name">New</span>
                </div>
                <span class="so-count-badge badge-blue">{newCount}</span>
            </div>

            <div class="so-divider"></div>

            <!-- Total Row -->
            <div class="so-total-row">
                <span class="so-total-row-label">Total</span>
                <span class="so-total-row-val">{totalCount}</span>
            </div>

        </div>

    </div>
</template>
