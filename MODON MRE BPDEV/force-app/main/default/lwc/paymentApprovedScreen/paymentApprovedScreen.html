<template>
   

    <lightning-card title="Receipt Sync Manager">
        <!-- Filters Section -->
        <div class="slds-grid slds-wrap slds-m-bottom_medium">
            <div class="slds-col ">
                <c-payment-approved-condition-filter onfilterchange={handleFilterChange} > </c-payment-approved-condition-filter>
            </div>

        </div>
        <div class="slds-grid slds-wrap slds-m-bottom_medium">
            <div class="slds-col slds-size_2-of-2">
                <c-payment-approved-search-filter onsearchchange={handleSearchChange}></c-payment-approved-search-filter>
            </div>
        </div>
        <!-- Data Table -->
         <template if:true={filteredReceipts}>
            <c-payment-approved-receipt-data-table  onsave={handleSave} onrefreshdata={handleRefreshData}  onselectedrows={handleSelectedRows}  records={filteredReceipts} ></c-payment-approved-receipt-data-table>
         </template>
        

        <!-- Pagination -->
        <!--<div class="slds-m-top_medium">
            <c-payment-approved-pagination-control></c-payment-approved-pagination-control>
        </div>-->

    </lightning-card>

    <!-- PDF Viewer Modal -->
    <!--<template if:true={showPdfModal}>
        <c-payment-approved-pdf-viewer file-id={selectedPdfId} onclose={handleModalClose} ></c-payment-approved-pdf-viewer>
    </template>-->


    
</template>
