<template>
    <div class="public-header">
        <div class="ph-logo">
            <div class="m">M</div>
            <div>
                <div class="t">Modon DCT Portal</div>
                <div class="s">3rd Party Development Control</div>
            </div>
        </div>
        <div class="ph-nav">
            <a class="btn btn-outline btn-sm" href={loginUrl}>Sign In</a>
            <a class="btn btn-primary btn-sm" href={registerOwnerUrl}>Register as Owner</a>
        </div>
    </div>

    <section class="hero">
        <h1>Streamline Your Development Approvals</h1>
        <p>A centralized digital portal for property owners and service providers to manage development control processes across Modon's communities.</p>
        <div class="cta">
            <a class="btn btn-lg btn-white" href={registerOwnerUrl}>Register as Owner</a>
            <a class="btn btn-lg btn-ghost" href={registerSpUrl}>Register as Service Provider</a>
            <a class="btn btn-lg btn-ghost" href={loginUrl}>Sign In</a>
        </div>
    </section>

    <section class="section">
        <h2>Everything in one place</h2>
        <p class="lead">A single, secure workspace for plots, requests, documents and payments across the development lifecycle.</p>
        <div class="features">
            <template for:each={features} for:item="feature">
                <div key={feature.id} class="feature">
                    <div class="fi">{feature.icon}</div>
                    <h3>{feature.title}</h3>
                    <p>{feature.desc}</p>
                </div>
            </template>
        </div>
    </section>

    <section class="svc-bg">
        <div class="section">
            <h2>Services Available</h2>
            <p class="lead">A wide range of development control services, digitally</p>
            <div class="svc-grid">
                <template for:each={services} for:item="svc">
                    <div key={svc.id} class="svc">
                        <div class="h">{svc.heading}</div>
                        <template for:each={svc.items} for:item="item">
                            <div key={item.id} class="i">{item.name}</div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <div class="lp-footer">© 2026 Modon Holding. Development Control Portal — demo.</div>
</template>
