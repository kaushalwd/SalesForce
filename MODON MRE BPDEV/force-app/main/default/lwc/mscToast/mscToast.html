<template>
    <!-- Kept out of the document flow entirely: the card below carries on
         reflowing as fields turn read-only, and the toast must not move with it.
         aria-live, so a rep on a screen reader hears the confirmation the sighted
         rep sees - it is the only report that the save landed. -->
    <template lwc:if={hasMessage}>
        <div class="toast__layer" role="status" aria-live="polite">
            <div class={toastClass}>
                <c-modon-icon name={iconName} size="15" color={iconColour}></c-modon-icon>
                <span class="toast__text">{message}</span>
                <button
                    class="toast__close"
                    type="button"
                    title="Dismiss"
                    aria-label="Dismiss"
                    onclick={handleDismiss}
                >
                    <c-modon-icon name="x" size="13" color="currentColor"></c-modon-icon>
                </button>
            </div>
        </div>
    </template>
</template>
