<template>
    <div class="training">
        <template lwc:if={hasVideo}>
            <div class="training__stage">
                <!-- Only when our own layer is doing the enlarging; browser
                     fullscreen paints its own backdrop. -->
                <template lwc:if={maximised}>
                    <div class="max-scrim" onclick={handleMinimise}></div>
                </template>

                <div class={playerClass} onkeydown={handleMaxKeydown}>
                    <template lwc:if={isFrame}>
                        <iframe
                            class="player__media"
                            src={mediaSrc}
                            title="Training video"
                            loading="lazy"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                            onload={handleFrameLoad}
                        ></iframe>
                    </template>

                    <template lwc:elseif={isFile}>
                        <!-- eslint-disable-next-line -->
                        <video
                            class="player__media"
                            src={mediaSrc}
                            controls
                            autoplay
                            playsinline
                            preload="metadata"
                            onerror={handleMediaError}
                        ></video>
                    </template>

                    <template lwc:else>
                        <template lwc:if={hasPoster}>
                            <img
                                class="player__poster"
                                src={posterSrc}
                                onerror={handlePosterError}
                                alt=""
                                aria-hidden="true"
                            />
                        </template>
                        <button
                            class="poster__play"
                            type="button"
                            onclick={handlePlay}
                            aria-label="Play the training video"
                            title="Play"
                        >
                            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                <path d="M8 5.5v13l11-6.5z"></path>
                            </svg>
                        </button>
                    </template>

                    <template lwc:if={maximised}>
                        <button
                            class="max-close"
                            type="button"
                            onclick={handleMinimise}
                            aria-label="Close the enlarged video"
                            title="Close"
                        >
                            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18"></path>
                            </svg>
                        </button>
                    </template>
                </div>

                <!-- BP-075 (13 Sep 2026): failure message hidden at business request; restore by uncommenting.
                <template lwc:if={mediaFailed}>
                    <p class="notice" role="status">
                        <span class="notice__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M12 3.6 2.6 20h18.8L12 3.6Z"></path>
                                <path d="M12 10v4"></path>
                                <path d="M12 17.2h.01"></path>
                            </svg>
                        </span>
                        <span>This video cannot play here. Open it in a new tab.</span>
                    </p>
                </template>
                -->
            </div>

            <!-- BP-075 (13 Sep 2026): footer with the Open in new tab button hidden at business request; restore by uncommenting.
            <div class="training__actions">
                <template lwc:if={showEnlarge}>
                    <button class="training-button" type="button" onclick={handleEnlarge} title="Enlarge">
                        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                            <path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"></path>
                        </svg>
                        <span>Enlarge</span>
                    </button>
                </template>

                <button
                    class="training-button training-button--primary"
                    type="button"
                    onclick={handleOpenInNewTab}
                    title="Open in new tab"
                >
                    <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                        <path d="M14 4h6v6"></path>
                        <path d="M20 4l-8.5 8.5"></path>
                        <path d="M18 14.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V7.5A1.5 1.5 0 0 1 5 6h4.5"></path>
                    </svg>
                    <span>Open in new tab</span>
                </button>
            </div>
            -->
        </template>

        <template lwc:else>
            <div class="training__empty">
                <c-mbpr_empty-state
                    compact
                    kicker="Training"
                    title="No training video yet"
                    message="It will appear here once it is published."
                ></c-mbpr_empty-state>
            </div>
        </template>
    </div>
</template>
