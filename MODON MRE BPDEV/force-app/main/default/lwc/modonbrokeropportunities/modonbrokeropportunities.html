<template>

    <template if:true={isLoading}>
    <div class="custom-spinner-container">
        <div class="custom-loader-box">
            <div class="spinner-ring"></div>
            <div class="spinner-text">Loading Opportunities...</div>
        </div>
    </div>
</template>


    <template if:false={isLoading}>
    <template if:false={showOverview}>
        <div class="overview-wrapper">
                    <div class="tree-grid-wrapper">
                        <div class="filter-bar">
    
</div>
 <!-- 
    <div class="filter-panel">
        <lightning-input label="Opportunity Name" value={filters.name} onchange={handleFilterChange} data-id="name" class="placeholder ms-2" ></lightning-input>
        <lightning-input label="Opportunity Status" value={filters.status} onchange={handleFilterChange} data-id="status" class="placeholder ms-2" ></lightning-input>
       <lightning-input label="Resident Status" value={filters.residentStatus} onchange={handleFilterChange} data-id="residentStatus"></lightning-input> 
        <div class="filter-actions">
            <button class="slds-button slds-button_brand m-2" onclick={applyFilters}>Search</button>
        </div>
    </div>
    -->


            <c-dynamiclwcdatatable
                title="Broker Agency Opportunities"
                records={opportunities}
                columns={columns}
                onrowaction={handleRowAction}>
            </c-dynamiclwcdatatable>

            <template if:true={showPagination}>
                            <div class="custom-pagination">
                                <button class="nav-btn" onclick={handlePrevPage} disabled={disablePrev}>
                                    ⬅ Previous
                                </button>
                                <span class="page-info">Page {currentPage} of {totalPages}</span>
                                <button class="nav-btn" onclick={handleNextPage} disabled={disableNext}>
                                    Next ➡
                                </button>
                            </div>
                        </template>
                        </div>
                    </div>
       
    </template>

    <template if:true={showOverview}>
        <div class="overview-wrapper"> 
            <a class="back-link" onclick={handleBack}>← Back to Manage Opportunities</a>

            <!-- Overview Section -->
            <div class="overview-card">
                <h2 class="section-title">Overview</h2>
                <div class="overview-grid">
                    <div><strong>Opportunity Name:</strong> <span>{selectedOpportunity.Name}</span></div>

<div><strong>Agency Name:</strong> <span>{brokerAgencyName}</span></div>
<div><strong>Project Name:</strong> <span>{projectName}</span></div>
<div><strong>Agent Name:</strong> <span>{brokerAgentName}</span></div>
<div><strong>Sales Manager Name:</strong> <span>{salesManagerName}</span></div>
<div><strong>UAE Resident Status:</strong> <span>{selectedOpportunity.UAE_Resident_Status__c}</span></div>
    </div>
            </div>

            <!-- Sales Orders Section -->
            <div class="overview-card">
                <h2 class="section-title">Sales Orders</h2>
                <c-dynamiclwcdatatable
                    title="Sales Orders"
                    records={salesOrders}
                    columns={salesOrderColumns}>
                </c-dynamiclwcdatatable>
            </div>
        </div>
    </template>
    </template>
</template>
