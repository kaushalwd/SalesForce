<template>
    <div class="apple-card ">
        <template if:true={pagedData}>
            <div class="datatable-wrapper slds-scrollable_x slds-text-body_small">
            <lightning-datatable            
                key-field="Id"
                data={pagedData}
                columns={columns}              
                class="responsive-datatable"
                hide-checkbox-column
                onrowaction={handleRowAction}
                default-sort-direction={defaultSortDirection}
    sorted-direction={sortDirection}
    sorted-by={sortBy}
    onsort={handleSort}
                variant="standard">
            </lightning-datatable></div>
        </template>

        <template if:true={noData}>
            <p class="no-records">No records found.</p>
        </template>

        <div class="custom-pagination slds-text-body_small">
            <lightning-button label="⟵ Prev" onclick={handlePrevious} variant="base" disabled={disablePrev} class="small-pagination-button"></lightning-button>
            <span class="page-info">Page {currentPage} of {totalPages}</span>
            <lightning-button label="Next ⟶" onclick={handleNext} variant="base" disabled={disableNext} class="small-pagination-button"></lightning-button>
        </div>
    </div>
</template>
