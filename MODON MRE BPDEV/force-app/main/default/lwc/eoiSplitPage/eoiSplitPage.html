<template>
    <div class="page">
        <div class="shellwrap">
            <aside class={brandClass}>
                <template lwc:if={hasPoster}>
                    <img class="brand__media" src={posterImage} alt={posterAlt} loading="eager" />
                </template>
                <div class="brand__tint" aria-hidden="true"></div>
                <svg class="contour" viewBox="0 0 600 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
                    <g fill="none" stroke="#C9BC8F" stroke-width="1" opacity=".3">
                        <path d="M-10,300 C 120,270 220,330 340,300 C 460,270 540,320 610,296"/>
                        <path d="M-10,330 C 130,300 240,360 360,330 C 470,302 560,350 610,326"/>
                        <path d="M-10,360 C 140,332 250,388 370,360 C 480,334 570,378 610,356"/>
                    </g>
                </svg>
                <template lwc:if={hasModonLogo}>
                    <!-- MEOI-MODON (13 Sep 2026): MODON's logo on the EOI pages too - left of the lockup on
                         phones, above it on tablet/desktop, as on the Wadeem Gardens landing page -->
                    <img class="brand__modon" src={modonLogoImage} alt="Modon" loading="eager" />
                </template>
                <div class="brand__word">
                    <template lwc:if={hasLogo}>
                        <img class="brand__logo" src={logoImage} alt={logoAlt} loading="eager" />
                    </template>
                    <template lwc:elseif={hasWordmark}>
                        <span class="brand__wordtext">{wordmark}<small>{wordmarkSub}</small></span>
                    </template>
                    <template lwc:if={hasTagline}>
                        <p class="brand__line">{tagline}</p>
                    </template>
                </div>
                <template lwc:if={hasCaption}>
                    <p class="brand__trust">{caption}</p>
                </template>
            </aside>
            <div class="body">
                <div class="inner">
                    <slot></slot>
                </div>
            </div>
        </div>
        <c-eoi-footer copyright-text={copyrightText}></c-eoi-footer>
    </div>
</template>
