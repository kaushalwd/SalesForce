<template>
    <div class="slds-p-around_medium">
        <template lwc:if={isLoading}>
            <div class="slds-align_absolute-center slds-p-vertical_large">
                <lightning-spinner alternative-text="Processing..." size="small"></lightning-spinner>
                <span class="slds-p-left_small">Unblocking account...</span>
            </div>
        </template>

        <template lwc:else>
            <div class="slds-box slds-theme_success slds-m-bottom_medium">
                <p class="slds-text-heading_small slds-m-bottom_x-small">
                    <lightning-icon icon-name="utility:success" size="x-small" variant="inverse"
                                    class="slds-m-right_x-small"></lightning-icon>
                    Unblock this account?
                </p>
                <p class="slds-text-body_regular">
                    This will set <b>Agency Status</b> to <b>Active</b>.
                    All related agents will be reactivated and their portal users will be unfrozen.
                </p>
            </div>

            <div class="slds-align_absolute-center">
                <lightning-button label="Cancel"
                                  onclick={handleCancel}
                                  class="slds-m-right_x-small"></lightning-button>
                <lightning-button label="Unblock Account"
                                  variant="brand"
                                  onclick={handleConfirm}></lightning-button>
            </div>
        </template>
    </div>
</template>
