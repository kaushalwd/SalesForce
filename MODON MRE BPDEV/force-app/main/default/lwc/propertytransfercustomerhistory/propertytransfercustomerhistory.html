<template>
    <lightning-card title="Account Update History">
        <template if:true={historyData}>
            <lightning-datatable
                key-field="changedDate"
                data={historyData}
                columns={columns}>
            </lightning-datatable>
        </template>
        <template if:false={historyData}>
            <p>No history found</p>
        </template>
        <template if:true={error}>
            <p>Error loading history</p>
        </template>
    </lightning-card>
</template>
