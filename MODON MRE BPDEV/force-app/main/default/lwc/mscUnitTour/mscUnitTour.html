<template>
  <!-- Phone: collapsible band, so the form keeps its room. -->
  <template lwc:if={isAccordion}>
    <div class="tour-accordion">
      <button class="tour-toggle" onclick={toggle} aria-expanded={open}>
        <c-modon-icon name={toggleIcon} size="14" color="currentColor"></c-modon-icon>
        <span>{toggleLabel}</span>
      </button>
      <template lwc:if={showFrame}>
        <div class={frameClass}>
          <iframe
            src={frameSrc}
            title={frameTitle}
            class="tour-iframe"
            loading="lazy"
            referrerpolicy="no-referrer"
          ></iframe>
        </div>
      </template>
    </div>
  </template>

  <!-- Tablet and up: fills its container. -->
  <template lwc:else>
    <template lwc:if={showFrame}>
      <div class={frameClass}>
        <iframe
          src={frameSrc}
          title={frameTitle}
          class="tour-iframe"
          loading="lazy"
          referrerpolicy="no-referrer"
        ></iframe>
      </div>
    </template>
    <template lwc:else>
      <div class="tour-frame tour-empty">
        <c-modon-icon name="home" size="26" color="currentColor"></c-modon-icon>
        <p class="tour-empty-text">{emptyText}</p>
      </div>
    </template>
  </template>
</template>
