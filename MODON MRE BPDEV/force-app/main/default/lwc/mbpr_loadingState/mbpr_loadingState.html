<template>
    <section class={stateClass} role="status" aria-label={label}>
        <span class="sr-only">{label}</span>
        <template lwc:if={isHero}>
            <div class="loading__hero"></div>
            <div class="loading__line loading__line--wide"></div>
            <div class="loading__line"></div>
        </template>
        <template lwc:else>
            <template for:each={rowsArray} for:item="row">
                <div key={row} class="loading__row">
                    <span class="loading__avatar"></span>
                    <span class="loading__stack">
                        <span class="loading__line loading__line--wide"></span>
                        <span class="loading__line"></span>
                    </span>
                </div>
            </template>
        </template>
    </section>
</template>
