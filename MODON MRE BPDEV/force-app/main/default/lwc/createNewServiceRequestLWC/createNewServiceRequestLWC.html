<template>
  <template if:true={isModel}>
   
    <lightning-quick-action-panel header="Service Request ">
      <template if:true={issrType}>
        <lightning-combobox name="Service Request Type" label="Service Request Type" value={value}
        placeholder="Select Category" options={srRecordTypes}
        onchange={handleChange}></lightning-combobox>  
        <div slot="footer">
          <lightning-button
            variant="neutral"
            label="Cancel"
            onclick={closeAction}
          ></lightning-button>
          <lightning-button variant="brand" label="Next" onclick={handleNext}></lightning-button>
        </div> 
      </template>
        <template if:true={isNext}>
          <c-fetch-service-request-fields-lwc onresult={handlePopUp} sobjectname={sObjectName} selectedrt={selectedRtVal} selectedrecmap={selectedRecTypMap} currentrecid={recordId}></c-fetch-service-request-fields-lwc>
`
        </template>
      </lightning-quick-action-panel>
   </template>
</template>
