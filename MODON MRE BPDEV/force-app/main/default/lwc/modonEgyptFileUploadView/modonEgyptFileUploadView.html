<template>
    <lightning-card>
        <lightning-file-upload name="fileUploader" accept={acceptedFormats} record-id={recordId}
            onuploadfinished={handleActionFinished} multiple>
        </lightning-file-upload>

        <template if:true={files.data}>
            <c-modon-egypt-file-list files={files.data} onfiledelete={handleActionFinished}></c-modon-egypt-file-list>
        </template>
    </lightning-card>
</template>
