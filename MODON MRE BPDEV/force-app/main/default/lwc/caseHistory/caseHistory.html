<template>
    <div class="case-summary-container">
        <div class="summary-title">Case Summary</div>

        <template if:true={loadUI}>
            <div class="summary-grid">
                <template for:each={groupedFields} for:item="field">
                    <div key={field.label} class="summary-item" data-filter={field.filterType} onclick={handleCardClick}>
                        <div class="summary-label">{field.label}</div>
                        <div class={field.badgeClass}>{field.value}</div>
                    </div>
                </template>
            </div>
        </template>

        <template if:false={loadUI}>
            <p class="no-data">No case history available.</p>
        </template>
    </div>
</template>
