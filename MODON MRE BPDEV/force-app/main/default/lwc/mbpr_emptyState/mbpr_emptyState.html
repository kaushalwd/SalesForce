<template>
    <section class={stateClass} aria-live={ariaLiveValue}>
        <template lwc:if={showGraphic}>
            <div class="empty__graphic" aria-hidden="true">
                <svg viewBox="0 0 160 118" class="empty__svg">
                    <path class="empty__halo" d="M26 72 C28 35 53 14 88 18 C119 22 139 44 136 73 C132 104 101 113 69 107 C42 102 24 92 26 72 Z"></path>
                    <path class="empty__panel" d="M44 36 H116 C122 36 126 40 126 46 V86 C126 92 122 96 116 96 H44 C38 96 34 92 34 86 V46 C34 40 38 36 44 36 Z"></path>
                    <path class="empty__line empty__line--one" d="M50 52 H87"></path>
                    <path class="empty__line empty__line--two" d="M50 66 H108"></path>
                    <path class="empty__line empty__line--three" d="M50 80 H74"></path>
                    <circle class="empty__dot empty__dot--one" cx="112" cy="52" r="5"></circle>
                    <circle class="empty__dot empty__dot--two" cx="101" cy="80" r="5"></circle>
                    <path class="empty__spark" d="M128 25 L132 33 L140 37 L132 41 L128 49 L124 41 L116 37 L124 33 Z"></path>
                </svg>
            </div>
        </template>

        <template lwc:if={kicker}>
            <p class="empty__kicker">{kicker}</p>
        </template>
        <h3 class="empty__title">{title}</h3>
        <template lwc:if={message}>
            <p class="empty__message">{message}</p>
        </template>

        <template lwc:if={hasActions}>
            <div class="empty__actions">
                <template lwc:if={primaryLabel}>
                    <button class="empty__action empty__action--primary" type="button" onclick={handlePrimary}>
                        {primaryLabel}
                    </button>
                </template>
                <template lwc:if={secondaryLabel}>
                    <button class="empty__action empty__action--secondary" type="button" onclick={handleSecondary}>
                        {secondaryLabel}
                    </button>
                </template>
            </div>
        </template>
    </section>
</template>
