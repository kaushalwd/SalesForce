<template>
    <lightning-card title="Lead Task Info">
        <template if:true={pageData}>
            <lightning-datatable
                key-field="leadId"
                data={pageData}
                columns={columns}
                onsort={handleSort}
                sorted-by={sortedBy}
                sorted-direction={sortedDirection}
                hide-checkbox-column="true"
            ></lightning-datatable>
        </template>

        <div class="slds-m-top_medium slds-align_absolute-center">
            <lightning-button
                label="Previous"
                onclick={handlePrevious}
                disabled={isPreviousDisabled}
                class="slds-m-right_small"
            ></lightning-button>
            <span>Page {currentPage} of {totalPages}</span>
            <lightning-button
                label="Next"
                onclick={handleNext}
                disabled={isNextDisabled}
                class="slds-m-left_small"
            ></lightning-button>
        </div>
    </lightning-card>
</template>
