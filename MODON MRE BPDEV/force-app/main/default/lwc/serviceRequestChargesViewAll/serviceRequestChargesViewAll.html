<template>
    <lightning-card title="All Charges" icon-name="utility:list">
        <template if:true={charges}>
            <lightning-datatable key-field="Id" data={charges} columns={columns} hide-checkbox-column="true" onrowaction={handleRowAction}></lightning-datatable>
        </template>
        <template if:true={error}>
            <p>Error loading charges</p>
        </template>
    </lightning-card>
</template>
