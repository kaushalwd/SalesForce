<!-- convertLeadKYC.html -->
<template>
    <div class="cvt-root">

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="cvt-loading">
                <div class="cvt-spinner"></div>
                <span>Checking for existing accounts...</span>
            </div>
        </template>

        <template if:false={isLoading}>

            <!-- Already converted -->
            <template if:true={state.isConverted}>
                <div class="cvt-notice cvt-notice--warn">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 5v4M8 10.5v.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                    This lead has already been converted.
                </div>
            </template>

            <!-- Pending approval -->
            <template if:true={isPendingApproval}>
                <div class="cvt-notice cvt-notice--warn">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 5v4M8 10.5v.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                    A new account exception is pending approval. Please wait before converting.
                </div>
            </template>

            <!-- Rejected -->
            <template if:true={isRejected}>
                <div class="cvt-notice cvt-notice--error">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                    Exception rejected. Please use <strong>Verify Existing Account</strong> to select an account before converting.
                </div>
            </template>

            <!-- Main panel -->
            <template if:true={showMainPanel}>

                <!-- ── CASE 0: Account already mapped — just confirm ── -->
                <template if:true={alreadyMapped}>
                    <div class="cvt-summary cvt-summary--ok">
                        <div class="cvt-summary-icon cvt-summary-icon--ok">
                            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                                <path d="M4 10l4 4 8-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div>
                            <p class="cvt-summary-title">Existing account will be reused</p>
                            <p class="cvt-summary-sub">Account already verified — no new account will be created on conversion.</p>
                        </div>
                    </div>
                </template>

                <!-- ── CASE 1: Matches found — selection required ── -->
                <template if:true={hasMatches}>
                    <div class="cvt-section-label">
                        <span class="cvt-match-badge">{matchCountLabel}</span>
                        <span class="cvt-section-hint">Select the correct account to use on conversion</span>
                    </div>

                    <div class="cvt-accounts">
                        <template for:each={enrichedAccounts} for:item="acc">
                            <label key={acc.accountId} class={acc.cardClass} for={acc.radioId}>
                                <div class="cvt-radio-col">
                                    <input type="radio"
                                        id={acc.radioId}
                                        name="cvtAccount"
                                        value={acc.accountId}
                                        checked={acc.isSelected}
                                        onchange={handleRadioChange}
                                        class="cvt-radio-input"/>
                                    <span class="cvt-radio-custom"></span>
                                </div>
                                <div class="cvt-acc-body">
                                    <div class="cvt-acc-top">
                                        <span class="cvt-acc-name">{acc.name}</span>
                                        <span class="cvt-match-pill">Matched on: {acc.matchedOn}</span>
                                    </div>
                                    <div class="cvt-acc-fields">
                                        <div class="cvt-field">
                                            <span class="cvt-fl">Emirates ID</span>
                                            <span class="cvt-fv">{acc.eidDisplay}</span>
                                        </div>
                                        <div class="cvt-field">
                                            <span class="cvt-fl">Passport</span>
                                            <span class="cvt-fv">{acc.passportDisplay}</span>
                                        </div>
                                        <div class="cvt-field">
                                            <span class="cvt-fl">Email</span>
                                            <span class="cvt-fv">{acc.emailDisplay}</span>
                                        </div>
                                        <div class="cvt-field">
                                            <span class="cvt-fl">Mobile</span>
                                            <span class="cvt-fv">{acc.mobileDisplay}</span>
                                        </div>
                                        <div class="cvt-field">
                                            <span class="cvt-fl">Sales orders</span>
                                            <span class="cvt-fv">
                                                <span class="cvt-count">{acc.salesOrderCount}</span>
                                            </span>
                                        </div>
                                        <div class="cvt-field">
                                            <span class="cvt-fl">Created</span>
                                            <span class="cvt-fv">{acc.createdDateFormatted}</span>
                                        </div>
                                    </div>
                                </div>
                            </label>
                        </template>
                    </div>

                    <!-- Validation error -->
                    <template if:true={showSelectionError}>
                        <p class="cvt-validation-error">
                            <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M7 4.5v3M7 9v.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                            Please select an existing account before converting.
                        </p>
                    </template>

                    <!-- Exception option — hidden if approval already pending -->
                    <template if:false={isPendingApproval}>
                        <template if:false={showExceptionForm}>
                            <button class="cvt-exc-btn" onclick={toggleException}>
                                <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
                                    <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                                </svg>
                                None of these — request exception to create new account
                            </button>
                        </template>
                        <template if:true={showExceptionForm}>
                            <div class="cvt-exc-form">
                                <p class="cvt-exc-label">Reason for creating a new account</p>
                                <textarea class="cvt-textarea"
                                    value={exceptionReason}
                                    onchange={handleReasonChange}
                                    placeholder="e.g. Customer has new contact details, different individual..."></textarea>
                                <div class="cvt-exc-acts">
                                    <button class="cvt-btn cvt-btn--ghost" onclick={toggleException}>Cancel</button>
                                    <button class="cvt-btn cvt-btn--warn"
                                        onclick={handleSubmitException}
                                        disabled={isSaving}>
                                        Submit for approval
                                    </button>
                                </div>
                            </div>
                        </template>
                    </template>
                    <template if:true={isPendingApproval}>
                        <div class="cvt-notice cvt-notice--warn" style="margin-top:8px">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 5v4M8 10.5v.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                            Approval already pending — awaiting manager decision before you can convert.
                        </div>
                    </template>

                </template>

                <!-- ── CASE 2: No match — new account ── -->
                <template if:true={noMatches}>
                    <div class="cvt-summary cvt-summary--info">
                        <div class="cvt-summary-icon cvt-summary-icon--info">
                            <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 18c0-4.418 3.134-6 7-6s7 1.582 7 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                        </div>
                        <div>
                            <p class="cvt-summary-title">No matching account found</p>
                            <p class="cvt-summary-sub">A new person account will be created automatically from this lead's details.</p>
                        </div>
                    </div>
                </template>

                <!-- ── CASE 3: Org account — match found or not ── -->
                <template if:true={state.isOrgAccount}>
                    <div class={orgSummaryClass}>
                        <div class={orgIconClass}>
                            <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 7h14M3 10h14M3 13h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><rect x="1.5" y="3.5" width="17" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/></svg>
                        </div>
                        <div>
                            <p class="cvt-summary-title">{summaryTitle}</p>
                            <p class="cvt-summary-sub">{summarySub}</p>
                        </div>
                    </div>
                    <template if:true={orgMatch}>
                        <div class="cvt-acc-fields" style="margin-top:10px">
                            <div class="cvt-field">
                                <span class="cvt-fl">Unified Number</span>
                                <span class="cvt-fv">{orgMatch.unifiedNumber}</span>
                            </div>
                            <div class="cvt-field">
                                <span class="cvt-fl">Trade License</span>
                                <span class="cvt-fv">{orgTradeLicenseDisplay}</span>
                            </div>
                            <div class="cvt-field">
                                <span class="cvt-fl">Email</span>
                                <span class="cvt-fv">{orgEmailDisplay}</span>
                            </div>
                            <div class="cvt-field">
                                <span class="cvt-fl">Mobile</span>
                                <span class="cvt-fv">{orgMobileDisplay}</span>
                            </div>
                        </div>
                    </template>
                </template>

                <!-- ── Exception approved ── -->
                <template if:true={isExceptionApproved}>
                    <div class="cvt-summary cvt-summary--ok">
                        <div class="cvt-summary-icon cvt-summary-icon--ok">
                            <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                        <div>
                            <p class="cvt-summary-title">Exception approved — new account will be created</p>
                            <p class="cvt-summary-sub">Your request to create a new account despite an existing match has been approved.</p>
                        </div>
                    </div>
                </template>

                <!-- Footer -->
                <div class="cvt-footer">
                    <button class="cvt-btn cvt-btn--ghost" onclick={handleCancel}>Cancel</button>
                    <button class="cvt-btn cvt-btn--primary"
                        onclick={handleConvert}
                        disabled={isConvertDisabled}>
                        <template if:true={isConverting}>
                            <span class="cvt-btn-spinner"></span>
                            Converting...
                        </template>
                        <template if:false={isConverting}>
                            Convert Lead
                            <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </template>
                    </button>
                </div>

            </template>

        </template>
    </div>
</template>
