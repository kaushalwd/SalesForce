<template>
    <h2 class="chart-title">Unit Type Insights</h2>
    <div class="chart-container">       
        <!-- Spinner while loading -->
        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Loading Chart..."
                size="medium"
                class="chart-spinner">
            </lightning-spinner>
        </template>

        <!-- Chart -->
        <template if:true={showChart}>
            <div class="chart-wrapper">
                <canvas class="chart-canvas"></canvas>
            </div>

            <!-- 🔹 Custom Legend -->
            <div class="chart-legend">
    <label>Units Summary</label><br /><br />

    <template for:each={legendData} for:item="item">
        <div key={item.label} class="legend-item">
            <span class="legend-color" style={item.style}></span>
            <span class="legend-label">{item.label}:</span>
            <span class="legend-value">{item.details}</span>
        </div>
    </template>
</div>
        </template>

        <!-- No Data Message -->
        <template if:true={noData}>
            <div class="no-data-text">No data available for Unit Type Insights</div>
        </template>
    </div>
</template>
