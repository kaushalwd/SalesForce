<template>
    <div class="dashboard-section">
        <h2 class="section-title">PURCHASE INFORMATION</h2>
        <div class="section-content" lwc:if={loadUI}>
            <template for:each={groupedFields} for:item="field">

                <!-- Owned Properties Field with Popup -->
                <template if:true={field.isOwnedProperties}>
                    <div key={field.title} class="field-item">
                        <span class="field-label">{field.label}: </span>
                        <span
                            class="field-value owned-hover"
                            data-tooltip={field.tooltipData}
                            data-label={field.label}
                            onclick={handleClick}
                        >
                            {field.value}
                            <template if:true={field.showPopup}>
                                <div class="popup-card">
                                    <div class="popup-header">
                                        <span class="popup-close" onclick={handleClosePopup}>×</span>
                                    </div>
                                    <div class="popup-arrow"></div>
                                    <div class="popup-content" lwc:dom="manual"></div>
                                    </div>
                            </template>
                        </span>
                    </div>
                </template>
                <!-- Collected Amount Field with Popup -->
                <template if:true={field.isCollectedAmount}>
                    <div key={field.title} class="field-item">
                        <span class="field-label">{field.label}: </span>
                        <span
                            class="field-value owned-hover"
                            data-tooltip={field.tooltipData}
                            data-label={field.label}
                            onclick={handleClick}
                        >
                            {field.value}
                            <template if:true={field.showPopup}>
                                <div class="popup-card">
                                    <div class="popup-header">
                                        <span class="popup-close" onclick={handleClosePopup}>×</span>
                                    </div>
                                    <div class="popup-arrow"></div>
                                    <div class="popup-content" lwc:dom="manual"></div>
                                </div>
                            </template>
                        </span>
                    </div>
                </template>
                
                <!-- Outstanding Amount field with Popup-->
                <template if:true={field.isOutstandingAmount}>
                    <div key={field.title} class="field-item">
                        <span class="field-label">{field.label}: </span>
                        <span
                            class="field-value owned-hover"
                            data-tooltip={field.tooltipData}
                            data-label={field.label}
                            onclick={handleClick}
                        >
                            {field.value}
                            <template if:true={field.showPopup}>
                                <div class="popup-card">
                                    <div class="popup-header">
                                        <span class="popup-close" onclick={handleClosePopup}>×</span>
                                    </div>
                                    <div class="popup-arrow"></div>
                                    <div class="popup-content" lwc:dom="manual"></div>
                                </div>
                            </template>
                        </span>
                    </div>
                </template>
                

                <!-- All other fields -->
                <template if:true={field.shouldRender}>
                    <div key={field.title} class="field-item">
                        <span class="field-label">{field.label}: &nbsp;</span>
                        <span class="field-value"> {field.value}</span>
                    </div>
                </template>
                

            </template>
        </div>
    </div>
</template>
