                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate hover-pointer" name="plotNo" onclick={sortData}>
                                                Plot No
                                                <template if:true={sortbyPlotNo}>
                                                    <lightning-icon icon-name={sortingIcon} size="x-small"
                                                        class="sorting-icon"></lightning-icon>
                                                </template>
                                            </div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate hover-pointer" name="bucket" onclick={sortData}>
                                                Bucket
                                                <template if:true={sortbyBucket}>
                                                    <lightning-icon icon-name={sortingIcon} size="x-small" class="sorting-icon"></lightning-icon>
                                                </template>
                                            </div>
                                        </th>
                                        
                                        <template if:true={rejectedListViewSelected}>
                                            <th class="" scope="col">
                                                <div class="slds-truncate">Rejected</div>
                                            </th>
                                        </template>

                                        <template if:true={showReleasedInventories}>
                                            <th class="" scope="col">
                                                <div class="slds-truncate hover-pointer" name="blockFor"
                                                    onclick={sortData}>
                                                    Assigned For
                                                <template if:true={sortbyBlockFor}>
                                                        <lightning-icon icon-name={sortingIcon} size="x-small"
                                                            class="sorting-icon"></lightning-icon>
                                                </template>
                                                </div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate hover-pointer" name="blockUntil"
                                                    onclick={sortData}>
                                                    Block until
                                                <template if:true={sortbyBlockUntil}>
                                                        <lightning-icon icon-name={sortingIcon} size="x-small"
                                                            class="sorting-icon"></lightning-icon>
                                                    </template>
                                                </div>
                                            </th>

                                            <th class="" scope="col">
                                                <div class="slds-truncate hover-pointer" name="blockBy"
                                                    onclick={sortData}>
                                                    Block By
                                                    <template if:true={sortbyBlockBy}>
                                                        <lightning-icon icon-name={sortingIcon} size="x-small"
                                                            class="sorting-icon"></lightning-icon>
                                                </template>
                                                </div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate hover-pointer" name="blockFor"
                                                    onclick={sortData}>
                                                    Blocked Time
                                                    <template if:true={sortbyBlockFor}>
                                                        <lightning-icon icon-name={sortingIcon} size="x-small"
                                                            class="sorting-icon"></lightning-icon>
                                                </template>
                                                </div>
                                            </th>
                                        </template>
                                         <!--th class="" scope="col">
                                            <div class="slds-truncate hover-pointer" name="type">
                                                Facade Style
                                            </div>
                                    </th-->
                                    <!--th class="" scope="col">
                                            <div class="slds-truncate hover-pointer" name="unitClassification">
                                                Unit Classification
                                            </div>
                                    </th-->
                                    </tr>
                                   
                                </thead>
                                <tbody>
                                    <template for:each={checkboxUnitLst} for:item="unitObj" for:index="index">
                                        <tr class="slds-hint-parent" key={unitObj.Id}>
                                            <td data-label="checkbox selection">
                                                <template lwc:if={unitObj.Phase__c}>
                                                    <!-- For Released Inventories-->
                                                    <template lwc:if={showReleasedInventories}>
                                                        <!-- If Blocked it can be revoked-->
                                                        <template lwc:if={unitObj.BlockUntil__c}>
                                                                <!-- 2.2 - Arvind - 28 Jun 2026 - added disabled={unitObj.isDisabled} -->
                                                                <lightning-input class="rowSelector" type="checkbox"
                                                                data-index={index} data-id={unitObj.Id}
                                                                data-unit-name={unitObj.Name} onchange={handleRowSelect}
                                                                checked={unitObj.isSelected}
                                                                disabled={unitObj.isDisabled}
                                                                value={unitObj.isSelected}></lightning-input>
                                                        </template>
                                                        <!-- Otherewise Sales Order is present-->
                                                        <template lwc:else>
                                                            <template lwc:if={unitObj.IsUnitAvailable__c}>
                                                                    <!-- 2.2 - Arvind - 28 Jun 2026 - added disabled={unitObj.isDisabled} -->
                                                                    <lightning-input class="rowSelector" type="checkbox"
                                                                    data-index={index} data-id={unitObj.Id}
                                                                    data-unit-name={unitObj.Name}
                                                                    onchange={handleRowSelect}
                                                                    checked={unitObj.isSelected}
                                                                    disabled={unitObj.isDisabled}
                                                                    value={unitObj.isSelected}></lightning-input>
                                                            </template>
                                                            <template lwc:else>
                                                                <lightning-input class="rowSelector" type="checkbox"
                                                                    disabled>
                                                                </lightning-input>
                                                            </template>
                                                        </template>
                                                    </template>
                                                    <template lwc:else>
                                                            <!-- 2.2 - Arvind - 28 Jun 2026 - added disabled={unitObj.isDisabled} -->
                                                            <lightning-input class="rowSelector" type="checkbox"
                                                            data-index={index} data-id={unitObj.Id}
                                                            data-unit-name={unitObj.Name} onchange={handleRowSelect}
                                                            checked={unitObj.isSelected}
                                                            disabled={unitObj.isDisabled}
                                                            value={unitObj.isSelected}></lightning-input>
                                                    </template>
                                                    
                                                </template>
                                                <template lwc:else>
                                                    <lightning-input class="rowSelector" type="checkbox" disabled="true"
                                                        value={unitObj.isSelected}></lightning-input>
                                                </template>
                                            </td>
                                            <template if:true={hideProjectcolume}>
                                            <td data-hidden={hideProjectvalue} data-label="Project Name"> 
                                                    {unitObj.Project_Name__c}
                                            </td>
                                        </template>
                                            <td data-label="Account Name">
                                                <!-- <div class="slds-truncate" title="Cloudhub">{unitObj.Name}</div> -->
                                                <a href="javascript:void(0);" data-id={unitObj.Id}
                                                    onclick={handleLinkClick}>
                                                    {unitObj.Name}
                                                </a>
                                            </td>
                                            <td data-label="Account Name">
                                                <div class="slds-truncate" title="Cloudhub">
                                                    {unitObj.Number_of_Bedrooms__c}</div>
                                            </td>
                                            <td data-label="Account Name">
                                                <template lwc:if={unitObj.Phase__c}>
                                                    <div class="slds-truncate" title="Cloudhub">{unitObj.Phase__r.Name}
                                                    </div>
                                                </template>
                                                <template lwc:else>
                                                    <b>Phase not available</b>
                                                </template>
                                            </td>
                                            <td data-label="Account Name">
                                                <!-- <div class="slds-truncate" title="Cloudhub">{unitObj.TotalPrice__c}</div> -->
                                                <div class="slds-truncate" title="Cloudhub">
                                                    <lightning-formatted-number value={unitObj.TotalPrice__c}
                                                        format-style="currency"
                                                        currency-code="AED"></lightning-formatted-number>
                                                </div>                                                
                                            </td>
                                           <template if:true={isWadeemProject}>
                                                <td data-label="Account Name" class="slds-truncate" title="Cloudhub">
                                                    <lightning-formatted-number value={unitObj.UAE_Citizen_Price__c}
                                                        format-style="currency"
                                                        currency-code="AED"></lightning-formatted-number>
                                                </td>
                                            </template>
                                            <!-- <td data-label="Account Name">
                                                <div class="slds-truncate" title="Cloudhub">{unitObj.BlockComment__c}
                                                </div>
                                            </td> -->
                                            
                                            <td data-label="Account Name">
                                                    <div class="slds-truncate" title="Cloudhub">{unitObj.BlockComment__c}
                                                    </div>
                                                </td>
                                            <td data-label="Account Name">
                                                <!-- start Reserved payment progress badge -->
                                                <!-- status + badge inline via inner flex, so the td stays a normal cell and columns align -->
                                                <div class="mi-status-cell">
                                                    <div class="slds-truncate" title="Cloudhub">{unitObj.Status__c}</div>
                                                    <!-- 2.4 - a unit being paid for still reads "Available", so say why its checkbox is greyed out -->
                                                    <template lwc:if={unitObj.isPaymentInProgress}>
                                                        <span class="slds-badge">Payment in progress</span>
                                                    </template>
                                                    <!-- reserved but only part-paid -->
                                                    <template lwc:if={unitObj.isPartiallyPaid}>
                                                        <span class="slds-badge mi-badge_partial">{unitObj.paidPercent}% paid</span>
                                                    </template>
                                                    <!-- start Partial booking approval -->
                                                    <!-- tick to approve this unit for partial booking; one bulk button approves all ticked -->
                                                    <template lwc:if={unitObj.canApprovePartial}>
                                                        <lightning-input type="checkbox" variant="label-hidden" label="Approve partial booking"
                                                            data-id={unitObj.Id} checked={unitObj.approvalSelected}
                                                            onchange={handleApprovalSelect} class="mi-approve-check"></lightning-input>
                                                    </template>
                                                    <template lwc:if={unitObj.partialApproved}>
                                                        <span class="slds-badge mi-badge_approved">Approved</span>
                                                        <a href="javascript:void(0);" data-id={unitObj.Id} onclick={handleRevokePartial}>Revoke</a>
                                                    </template>
                                                    <!-- end Partial booking approval -->
                                                </div>
                                                <!-- end Reserved payment progress badge -->
                                            </td>
                                            <!-- <td class="" scope="col">
                                                <div class="slds-truncate">
                                                    <lightning-formatted-date-time value={unitObj.Status_Change_Time__c}
                                                        year="numeric" month="long" day="numeric" hour="2-digit"
                                                        minute="2-digit" second="2-digit" hour12>
                                                    </lightning-formatted-date-time>
                                                </div>
                                            </td> -->
                                            <td data-label="Account Name" style="display:flex;">
                                                <span class="aging-pill" style={unitObj.colorStyle}></span>
                                                <div class="slds-truncate" title="Cloudhub">{unitObj.Aging__c}</div>
                                            </td>
                                            <td data-label="Account Name">
                                                <div class="slds-truncate" title="Cloudhub">{unitObj.PlotAreasqm__c}
                                                </div>
                                            </td>
                                            <td data-label="Account Name">
                                                <div class="slds-truncate" title="Cloudhub">{unitObj.PlotNo__c}</div>
                                            </td>

                                            <td data-label="Bucket">
                                                <template lwc:if={unitObj.Bucket__r}>
                                                    <div class="slds-truncate" title="Bucket">{unitObj.Bucket__r.Name}</div>
                                                </template>
                                                <template lwc:else>
                                                    <div class="slds-truncate">N/A</div>
                                                </template>
                                            </td>
                                            
                                            <template if:true={rejectedListViewSelected}>
                                                <td class="" scope="col">
                                                    <div class="slds-truncate">{unitObj.RejectionComment__c}</div>
                                                </td>
                                            </template>
                                            <template if:true={showReleasedInventories}>
                                                <td class="" scope="col">
                                                    <template if:true={unitObj.BlockedFor__r}>
                                                        <div class="slds-truncate">{unitObj.BlockedFor__r.Name}</div>
                                                    </template>
                                                    <template if:false={unitObj.BlockedFor__r}>
                                                        <template if:true={unitObj.Allocate_to_Agency__r}>
                                                            <div class="slds-truncate">{unitObj.Allocate_to_Agency__r.Name}</div>
                                                        </template>
                                                        <template if:false={unitObj.Allocate_to_Agency__r}>
                                                            <div class="slds-truncate">N/A</div>
                                                        </template>
                                                    </template>
                                                </td>
                                                <td class="" scope="col">
                                                    <div class="slds-truncate">
                                                        <lightning-formatted-date-time value={unitObj.BlockUntil__c}
                                                            year="numeric" month="long" day="numeric" hour="2-digit"
                                                            minute="2-digit" second="2-digit" hour12>
                                                        </lightning-formatted-date-time>
                                                    </div>
                                                </td>
                                                <td data-label="Block By">
                                                    <template if:true={unitObj.BlockedBy__r}>
                                                        <div class="slds-truncate">{unitObj.BlockedBy__r.Name}</div>
                                                    </template>
                                                    <template if:false={unitObj.BlockedBy__r}>
                                                        <div class="slds-truncate">N/A</div>
                                                    </template>
                                                </td>
                                                <td data-label="Assigned For">
                                                    <template if:true={unitObj.Blocked_Time__c}>
                                                        <div class="slds-truncate">
                                                            <lightning-formatted-date-time
                                                                value={unitObj.Blocked_Time__c} year="numeric"
                                                                month="long" day="numeric" hour="2-digit"
                                                                minute="2-digit" second="2-digit" hour12>
                                                            </lightning-formatted-date-time>
                                                        </div>
                                                    </template>
                                                    <template if:false={unitObj.Blocked_Time__c}>
                                                        <div class="slds-truncate">N/A</div>
                                                    </template>
                                                </td>
                                            </template>
                                             <!--td  data-label="Type"> 
                                                    {unitObj.Type__c}
                                            </td>
                                             <td data-label="UnitClassification"> 
                                                    {unitObj.UnitClassification__c}
                                            </td-->
                                             <!--td data-label="facadeStyle"> 
                                                    {unitObj.FacadeStyle__c}
                                            </td-->
                                        </tr>
                                    </template>

                                    <template if:true={isScrollLoading}>
                                        <div class="slds-p-around_medium slds-align_absolute-center">
                                            <lightning-spinner size="small"></lightning-spinner>
                                        </div>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="slds-grid slds-wrap">
                            <div class="slds-size_1-of-1">
                                No units available with this criteria.
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </article>
    

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="close" class="slds-button__icon slds-button__icon_large"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Select an Option</h2>
                </header>

                <!-- Modal/Popup Body -->
                <div class="slds-modal__content slds-p-around_small" id="modal-content-id-1">
                    <template if:true={errorMessageonpopup}>
                        <div class="slds-text-color_error slds-m-bottom_small">{errorMessage}</div>
                    </template>
                    <div class="slds-card__body">
                        <div class="slds-grid slds-wrap slds-grid_vertical-align-top">
                            <template lwc:if={isShowBucketSelection}>
                                <c-manage-bucket-lwc toggle-manage-inventory="true" direct-save-bucket={directSaveBucket} previous-bucket-selection={selectedBucketId} onbucketselect={handleBucketSelection} class="slds-col slds-size_12-of-12" ></c-manage-bucket-lwc>
                            </template>
                            <template lwc:if={showReleaseOption}>
                                <div class="slds-col slds-size_12-of-12" style="padding-left: unset;">
                                    <b>Selected Bucket :</b> {selectedBucketName}
                                </div>

                                <template if:false={isUnReleaseModalOpen}>
                                    <div class="slds-col slds-size_12-of-12" style="padding-left: unset;">
                                        <lightning-combobox label="Status" value={selectedOption} options={picklistOptions} disabled={isdisabled} onchange={handlePicklistChange}></lightning-combobox>
                                    </div>
                                    <div lwc:if={showBlockRequestModal} class="slds-col slds-size_12-of-12" style="padding-left: unset;">
                                        <!-- <label data-main-label="true" class="slds-form-element__label"><span>Block for</span></label> -->
                                        <!-- <lightning-record-picker label="Select a user" placeholder="Search..." object-api-name="User" value={selectedBlockingUser} onchange={handleChange} class="customer-name-input blockDetails" required="true" variant="label-hidden" filter={userIdFilter} ></lightning-record-picker>    -->
                                        <lightning-combobox name="user" label="Block for" options={userOptions} value={selectedUserId} onchange={handleUserChange}> </lightning-combobox>
                                    </div>
                                    <div  lwc:if={showBlockRequestModal} class="slds-col slds-size_12-of-12" style="padding-left: unset;">
                                        <template if:true={showBlockingHours}>
                                            <label data-main-label="true" class="slds-form-element__label"><span>Select Blocking Hours</span></label>
                                            <lightning-combobox dropdown-alignment="auto" label="" placeholder="Select Blocking Hours" value={selectedBlockingHours} options={blockingHourOptions} variant="label-hidden" onchange={manageBlockingHours} class="selectedBlockingHours blockDetails"></lightning-combobox>
                                        </template>                        
                                    </div>
                                    <div lwc:if={showBlockRequestModal} class="slds-col slds-size_12-of-12" style="padding-left: unset;">
                                        <label data-main-label="true" class="slds-form-element__label"><span>Comment</span></label>
                                        <lightning-textarea label="Comment" required="true" type="text-area" class="customer-name-input blockDetails" data-target-type="input" variant="label-hidden" value={commentValue} onchange={updateCommentValue}></lightning-textarea>  
                                    </div>
                                </template>
                            </template>
                            
                        </div>
                    </div>
                </div>
                <!-- Modal/Popup Footer -->
                <template lwc:if={showReleaseOption}>
                    <template if:false={isTransferModelOpen}>
                        <footer class="slds-modal__footer">
                            <div class="slds-grid slds-grid_align-center">
                                <template if:false={releaseOptionOfUnreleased}>
                                    <lightning-button variant="neutral" class="slds-m-right_small" label="<<Back" onclick={handleBack}></lightning-button>
                                </template>
                                <lightning-button variant="neutral" class="slds-m-right_small" label="Cancel" onclick={closeModal}></lightning-button>
                                <lightning-button variant="brand" name="Submit" label="Submit" onclick={handleButtonAction}></lightning-button>
                                <!-- <lightning-button variant="neutral" class="slds-m-right_small" label="Cancel" onclick={closeModal}></lightning-button>
                                <lightning-button variant="brand" name="Submit" label="Submit" onclick={handleButtonAction}></lightning-button> -->
                            </div>
                        </footer>
                    </template>
                    <template if:true={isTransferModelOpen}>
                        <footer class="slds-modal__footer">
                            <div class="slds-grid slds-grid_align-center">
                                <lightning-button variant="neutral" class="slds-m-right_small" label="Cancel" onclick={closeModal}></lightning-button>
                                <lightning-button variant="neutral" class="slds-m-right_small" label="Transfer Bucket" onclick={handleTransferBucket}></lightning-button>
                            </div>
                        </footer>
                    </template>
                </template>
                
            </div>
         </section>
         <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
