<template>
    <lightning-card title="Contact Details" icon-name="standard:contact">
        <div class="custom-container">
            <template if:true={contact}>
                <!-- Contact Name on a single line -->
                <div class="slds-grid slds-wrap slds-gutters ">
                    <div class="slds-col slds-size_12-of-12 custom-row">

                        <p class="slds-text-title_bold">Name</p>
                    <p>{contact.Name}</p>
                    </div>
                </div>

                <!-- Remaining details in two rows -->
                <div class="slds-grid slds-wrap slds-gutters ">
                    <div class="slds-col slds-size_6-of-12 custom-row">
                         <p class="slds-text-title_bold">Title</p>
                    <p>{contact.Title}</p>
                    </div>
                    <div class="slds-col slds-size_6-of-12 custom-row">
                         <p class="slds-text-title_bold">Account Name</p>
                    <p>
                        <a href={contact.AccountId}>{contact.Account.Name}</a>
                    </p>
                    </div>
                </div>

                <div class="slds-grid slds-wrap slds-gutters ">
                        <div class="slds-col slds-size_6-of-12 custom-row">
                       <p class="slds-text-title_bold">Phone</p>
                    <p>
                        <a href="tel:{contact.Phone}">{contact.Phone}</a>
                    </p>
                    </div>

                    <div class="slds-col slds-size_6-of-12 custom-row ">
                        <p class="slds-text-title_bold">Email</p>
                    <p>
                        <a href="mailto:{contact.Email}">{contact.Email}</a>
                    </p>
                    </div>
                    
                </div>
            </template>
            <template if:false={contact}>
                <p>No Contact Details Found.</p>
            </template>
        </div>
    </lightning-card>
</template>
