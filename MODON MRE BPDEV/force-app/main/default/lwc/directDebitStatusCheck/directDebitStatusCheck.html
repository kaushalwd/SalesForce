<template>
    <lightning-card title="Direct Debit Status" icon-name="standard:account">

        <template if:true={isLoaded}>

            <!-- NO DIRECT DEBIT -->
            <template if:false={hasDirectDebit}>
                <div class={containerClass}>
                    ❌ No Direct Debit Request found for this Sales Order.
                </div>
            </template>

            <!-- DIRECT DEBIT EXISTS -->
            <template if:true={hasDirectDebit}>

                <div class={containerClass}>

                    <div>
                        <b>Direct Debit:</b>
                        <a href={ddUrl} target="_blank">
                            {ddName}
                        </a>
                    </div>

                    <div class="slds-m-top_small">
                        Status:
                        <span class={statusClass}>
                            <b>
                                <template if:true={isActive}>
                                    ACTIVE
                                </template>
                                <template if:false={isActive}>
                                    INACTIVE
                                </template>
                            </b>
                        </span>
                    </div>

                </div>

            </template>

        </template>

        <!-- ERROR -->
        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_medium">
                Error loading Direct Debit data
            </div>
        </template>

    </lightning-card>
</template>
