<template>
    <div
        class={cardClass}
        role="button"
        tabindex="0"
        aria-pressed={ariaSelected}
        onclick={handleClick}
        onkeydown={handleKeyDown}>

        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start">
            <p class="slds-text-title_caps slds-text-color_weak process-type">{step.processTypeName}</p>
            <span class={statusClass}>{step.status}</span>
        </div>

        <h3 class="slds-text-heading_small step-name">{step.stepName}</h3>
        <p class="slds-text-body_small slds-text-color_weak bp-name">{step.businessProcessName}</p>

        <template if:true={hasContext}>
            <ul class="slds-list_horizontal slds-wrap context-list">
                <template if:true={step.accountName}>
                    <li class="slds-item context-item">
                        <lightning-icon icon-name="utility:company" size="xx-small"></lightning-icon>
                        <span>{step.accountName}</span>
                    </li>
                </template>
                <template if:true={step.salesOrderName}>
                    <li class="slds-item context-item">
                        <lightning-icon icon-name="utility:record" size="xx-small"></lightning-icon>
                        <span>{step.salesOrderName}</span>
                    </li>
                </template>
                <template if:true={step.unitName}>
                    <li class="slds-item context-item">
                        <lightning-icon icon-name="utility:home" size="xx-small"></lightning-icon>
                        <span>{step.unitName}</span>
                    </li>
                </template>
                <template if:true={step.projectName}>
                    <li class="slds-item context-item">
                        <lightning-icon icon-name="utility:building" size="xx-small"></lightning-icon>
                        <span>{step.projectName}</span>
                    </li>
                </template>
            </ul>
        </template>

        <p class="slds-text-body_small slds-text-color_weak assigned-date">
            {displayDateLabel}
            <lightning-formatted-date-time
                value={displayDate}
                year="numeric"
                month="short"
                day="2-digit">
            </lightning-formatted-date-time>
        </p>
    </div>
</template>
