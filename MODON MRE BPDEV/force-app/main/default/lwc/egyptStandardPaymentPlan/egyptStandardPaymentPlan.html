<template>
  <lightning-layout multiple-rows="true" class="slds-p-bottom_medium slds-grid_pull-padded-small">
    <template if:true={isPaymentDetailsAvailable}>

    <lightning-layout-item size="12" medium-device-size="6" large-device-size="4" class="slds-p-horizontal_small slds-col">
        <lightning-combobox dropdown-alignment="auto" name={unitId}
          placeholder={egyptConstants.STANDARD_PLAN_PLACEHOLDER_SELECT_PAYMENT_PLAN}
          value={paymentDetails.selectedPayment} options={paymentDetails.availablePaymentPlans}
          label={egyptConstants.STANDARD_PLAN_LABEL_PAYMENT_DETAILS} onchange={handlePlanChange}
          class="selectedPaymentPlan">
        </lightning-combobox>
      </lightning-layout-item>
      
      <lightning-layout-item size="12" medium-device-size="6" large-device-size="4" class="slds-p-horizontal_small slds-col">
        <lightning-input type="date" label={egyptConstants.STANDARD_PLAN_LABEL_EXACT_BOOKING_DATE}
        name={egyptConstants.STANDARD_PLAN_INPUT_NAME_EXACT_BOOKING_DATE} max={todayDate} value={exactBookingDate}
        onchange={handleDateChange} disabled={isExactBookingDateReadOnly}>
      </lightning-input>
    </lightning-layout-item>

  </template>

  </lightning-layout>

  <lightning-layout multiple-rows="true">

    <lightning-layout-item size="12" class="slds-text-heading_xx-small slds-p-bottom_small table-title">
      <b>{paymentTypeName} </b>
    </lightning-layout-item>

    <lightning-layout-item size="12" >
      <lightning-datatable class="slds-scrollable" key-field="Id" data={paymentInstallments}
        columns={standardPlanColumns} hide-checkbox-column>
      </lightning-datatable>
    </lightning-layout-item>

  </lightning-layout>

</template>
