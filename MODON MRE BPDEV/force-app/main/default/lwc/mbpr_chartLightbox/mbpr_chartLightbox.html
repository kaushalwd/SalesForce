<template>
    <template lwc:if={open}>
        <div class="lightbox-layer" onclick={handleOverlayClick}>
            <section
                class="lightbox"
                role="dialog"
                aria-modal="true"
                aria-label={title}
                onclick={stopPropagation}
                onkeydown={handleKeydown}
            >
                <header class="lightbox__head">
                    <div class="lightbox__titles">
                        <template lwc:if={eyebrow}>
                            <p class="lightbox__eyebrow">{eyebrow}</p>
                        </template>
                        <h2 class="lightbox__title">{title}</h2>
                        <template lwc:if={subtitle}>
                            <p class="lightbox__subtitle">{subtitle}</p>
                        </template>
                    </div>
                    <div class="lightbox__actions">
                        <template lwc:if={screenshotSupported}>
                            <button
                                class="lightbox__screenshot"
                                type="button"
                                title="Screenshot"
                                aria-label="Save a screenshot of this chart"
                                onclick={handleScreenshot}
                            >
                                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                    <path d="M4 8.4h3.2l1.6-2.2h6.4l1.6 2.2H20v10H4Z"></path>
                                    <circle cx="12" cy="13.1" r="3.1"></circle>
                                </svg>
                            </button>
                        </template>
                        <button class="lightbox__close" type="button" aria-label={closeLabel} onclick={handleClose}>
                            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                <path d="M6 6l12 12M18 6 6 18"></path>
                            </svg>
                        </button>
                    </div>
                </header>
                <div class="lightbox__body">
                    <slot></slot>
                </div>
            </section>
        </div>
    </template>
</template>
