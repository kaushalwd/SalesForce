<template>
    <lightning-card title="Hudayriyat Sales Centre" icon-name="standard:lead">
        <div class="form-container">
            <lightning-spinner if:true={isLoading} alternative-text="Loading" size="medium"></lightning-spinner>
            <lightning-combobox
                name="visitorType"
                label="Visitor Type"
                placeholder="Select Visitor Type"
                options={visitorTypeOptions}
                value={visitorType}
                onchange={handleChange}
                required
                class="form-item"
            ></lightning-combobox>

            <lightning-input
                name="firstName"
                label="First Name"
                value={firstName}
                onchange={handleChange}
                required
                class="form-item"
            ></lightning-input>

            <lightning-input
                name="lastName"
                label="Last Name"
                value={lastName}
                onchange={handleChange}
                required
                class="form-item"
            ></lightning-input>

            <lightning-input
                name="mobileNumber"
                label="Mobile Number"
                value={mobileNumber}
                onchange={handleChange}
                required
                pattern="^\+\d{6,14}$"
                message-when-pattern-mismatch="Mobile number must start with '+' and contain 6 to 14 digits."
                class="form-item"
            ></lightning-input>

            <lightning-input
                name="emailAddress"
                label="Email Address"
                type="email"
                value={emailAddress}
                onchange={handleChange}
                required
                class="form-item"
            ></lightning-input>

            <lightning-combobox
                name="adName"
                label="Where Did You Hear About Us? *"
                placeholder="Select Ad Name"
                options={adNameOptions}
                value={adName}
                onchange={handleChange}
                required
                class="form-item"
            ></lightning-combobox>

            <lightning-combobox
                name="salesExecutive"
                label="Sales Executive"
                options={salesExecutiveOptions}
                value={salesExecutive}
                onchange={handleChange}
                class="form-item"
            ></lightning-combobox>

            <lightning-textarea
                name="description"
                label="Description"
                value={description}
                onchange={handleChange}
                class="form-item"
            ></lightning-textarea>

            <div class="form-footer">
                
                <lightning-button
                    label="Save"
                    variant="brand"
                    onclick={handleSubmit}
                    class="save-button"
                ></lightning-button> 
                &nbsp;
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancel}
                    class="cancel-button"
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
