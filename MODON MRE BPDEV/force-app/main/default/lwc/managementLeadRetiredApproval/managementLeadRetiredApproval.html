<template>
  <template if:true={isLoading}>
    <div class="loading-backdrop">
      <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </div>
  </template>

  <lightning-card>
    <div class="slds-p-around_medium">

      <div class="slds-grid slds-grid_align-spread slds-m-bottom_small slds-wrap">
        <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
          <!-- Created Date filter -->
          <lightning-combobox
            class="slds-m-right_small"
            name="dateRange"
            label="Created Date"
            value={selectedDateRange}
            options={dateRangeOptions}
            onchange={handleDateRangeChange}>
          </lightning-combobox>

          <!-- Unit search (uses change + keyup, not input) -->
        <div class="slds-grid slds-grid_vertical-align-center slds-m-top_x-small">
          <lightning-input
            class="slds-m-right_x-small"
            type="search"
            label="Search by Unit"
            placeholder="Type unit name… e.g., Unit 2 or 2"
            value={unitSearch}
            onchange={handleUnitSearchChange}
            onkeyup={handleUnitSearchKeyup}>
          </lightning-input>
        </div>
        </div>

        <div class="slds-grid slds-grid_vertical-align-center">
          <lightning-button variant="success" label="Approve Selected" onclick={approveSelected} class="slds-m-right_x-small"></lightning-button>
          <lightning-button variant="destructive" label="Reject Selected" onclick={rejectSelected}></lightning-button>
        </div>
      </div>

      <lightning-datatable
        key-field="Id"
        data={pagedData}
        columns={columns}
        onrowaction={handleRowAction}
        onrowselection={handleRowSelection}
        selected-rows={selectedRowsForTable}>
      </lightning-datatable>

      <div class="slds-grid slds-grid_align-spread slds-m-top_small slds-align_absolute-center">
        <div class="slds-text-body_small">Showing {startRow} - {endRow} of {totalRows}&nbsp;&nbsp;</div>
        <div class="slds-grid slds-grid_vertical-align-center">
          <lightning-button variant="neutral" label="Previous" onclick={prevPage} disabled={isFirstPage} class="slds-m-right_x-small"></lightning-button>
          <div class="slds-p-horizontal_small">Page {currentPage} / {totalPages}</div>
          <lightning-button variant="neutral" label="Next" onclick={nextPage} disabled={isLastPage} class="slds-m-left_x-small"></lightning-button>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
