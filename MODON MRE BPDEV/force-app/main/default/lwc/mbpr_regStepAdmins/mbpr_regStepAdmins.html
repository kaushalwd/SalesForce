<template>
    <div class="regf">
        <h3 class="regf__section-title">Agency Admin Information</h3>

        <template for:each={memberViews} for:item="staffMember">
            <article key={staffMember.id} class="regf-member">
                <div class="regf-member__head">
                    <h4 class="regf-member__title">{staffMember.label}</h4>
                </div>

                <!-- Name + nationality -->
                <div class="regf__grid">
                    <label class={staffMember.cls.firstname}>
                        <span class="regf-field__label">First Name</span>
                        <input class="regf-field__control" type="text" name="firstname"
                            value={staffMember.firstname} data-id={staffMember.id}
                            disabled={isDisabled} onchange={handleFieldChange} />
                        <template lwc:if={staffMember.err.firstname}>
                            <p class="regf-field__error" role="alert">{staffMember.err.firstname}</p>
                        </template>
                    </label>
                    <label class={staffMember.cls.lastname}>
                        <span class="regf-field__label">Last Name</span>
                        <input class="regf-field__control" type="text" name="lastname"
                            value={staffMember.lastname} data-id={staffMember.id}
                            disabled={isDisabled} onchange={handleFieldChange} />
                        <template lwc:if={staffMember.err.lastname}>
                            <p class="regf-field__error" role="alert">{staffMember.err.lastname}</p>
                        </template>
                    </label>
                    <label class={staffMember.cls.nationality}>
                        <span class="regf-field__label">Nationality</span>
                        <select class="regf-field__control" name="nationality"
                            data-id={staffMember.id} disabled={isDisabled} onchange={handleFieldChange}>
                            <option value="">Select an Option</option>
                            <template for:each={countryOptionsList} for:item="country">
                                <option key={country.value} value={country.value}>{country.label}</option>
                            </template>
                        </select>
                        <template lwc:if={staffMember.err.nationality}>
                            <p class="regf-field__error" role="alert">{staffMember.err.nationality}</p>
                        </template>
                    </label>
                    <label class={staffMember.cls.residentStatus}>
                        <span class="regf-field__label">Resident Status</span>
                        <select class="regf-field__control" name="residentStatus"
                            data-id={staffMember.id} disabled={isDisabled} onchange={handleResidentStatusChange}>
                            <option value="" disabled>Select an Option</option>
                            <template for:each={residentStatusOptions} for:item="statusOption">
                                <option key={statusOption.value} value={statusOption.value}>{statusOption.label}</option>
                            </template>
                        </select>
                        <template lwc:if={staffMember.err.residentStatus}>
                            <p class="regf-field__error" role="alert">{staffMember.err.residentStatus}</p>
                        </template>
                    </label>
                </div>

                <!-- Mobile + Loqate validate -->
                <div class="regf-validate-row">
                    <label class={staffMember.cls.mobileNum}>
                        <span class="regf-field__label">Country Code</span>
                        <select class="regf-field__control" name="mobileNum"
                            data-id={staffMember.id} disabled={isDisabled} onchange={handleFieldChange}>
                            <option value="">Select</option>
                            <template for:each={mobCountryOptions} for:item="code">
                                <option key={code.value} value={code.value}>{code.label}</option>
                            </template>
                        </select>
                        <template lwc:if={staffMember.err.mobileNum}>
                            <p class="regf-field__error" role="alert">{staffMember.err.mobileNum}</p>
                        </template>
                    </label>
                    <label class={staffMember.cls.mobile}>
                        <span class="regf-field__label">Mobile Number</span>
                        <input class="regf-field__control" type="text" name="mobile" inputmode="numeric"
                            value={staffMember.mobile} data-id={staffMember.id}
                            disabled={isDisabled} onchange={handleFieldChange} onblur={handleNumericInput} />
                        <template lwc:if={staffMember.err.mobile}>
                            <p class="regf-field__error" role="alert">{staffMember.err.mobile}</p>
                        </template>
                        <p class="regf-field__help">Enter a valid mobile number (e.g., +12025550123 or 9876543210, 8-15 digits)</p>
                    </label>
                    <button type="button" class="regf-button" data-id={staffMember.id}
                        disabled={staffMember.phoneBtnDisabled} onclick={handleValidatePhoneClick}>{staffMember.validatePhone}</button>
                </div>

                <!-- Email + Loqate validate -->
                <div class="regf-validate-row">
                    <label class={staffMember.cls.email}>
                        <span class="regf-field__label">Email</span>
                        <input class="regf-field__control" type="email" name="email"
                            value={staffMember.email} data-id={staffMember.id}
                            disabled={isDisabled} onchange={handleFieldChange} />
                        <template lwc:if={staffMember.err.email}>
                            <p class="regf-field__error" role="alert">{staffMember.err.email}</p>
                        </template>
                    </label>
                    <button type="button" class="regf-button" data-id={staffMember.id}
                        disabled={staffMember.emailBtnDisabled} onclick={handleValidateEmailClick}>{staffMember.validateEmail}</button>
                </div>

                <!-- Passport -->
                <div class="regf__grid">
                    <label class={staffMember.cls.passportNumber}>
                        <span class="regf-field__label">Passport Number</span>
                        <input class="regf-field__control" type="text" name="passportNumber"
                            value={staffMember.passportNumber} data-id={staffMember.id}
                            disabled={isDisabled} onchange={handleFieldChange} />
                        <template lwc:if={staffMember.err.passportNumber}>
                            <p class="regf-field__error" role="alert">{staffMember.err.passportNumber}</p>
                        </template>
                    </label>
                    <label class={staffMember.cls.passportIssueDate}>
                        <span class="regf-field__label">Passport Issue Date</span>
                        <input class="regf-field__control" type="date" name="passportIssueDate"
                            value={staffMember.passportIssueDate} data-id={staffMember.id}
                            disabled={isDisabled} onchange={handleFieldChange} />
                        <template lwc:if={staffMember.err.passportIssueDate}>
                            <p class="regf-field__error" role="alert">{staffMember.err.passportIssueDate}</p>
                        </template>
                    </label>
                    <label class={staffMember.cls.passportExpiryDate}>
                        <span class="regf-field__label">Passport Expiry Date</span>
                        <input class="regf-field__control" type="date" name="passportExpiryDate"
                            value={staffMember.passportExpiryDate} data-id={staffMember.id}
                            disabled={isDisabled} onchange={handleFieldChange} />
                        <template lwc:if={staffMember.err.passportExpiryDate}>
                            <p class="regf-field__error" role="alert">{staffMember.err.passportExpiryDate}</p>
                        </template>
                    </label>
                </div>

                <!-- Emirates ID (UAE Broker registration AND this admin is a UAE resident) -->
                <template lwc:if={staffMember.showEid}>
                    <div class="regf__grid">
                        <label class={staffMember.cls.eidNumber}>
                            <span class="regf-field__label">Emirates ID Number</span>
                            <input class="regf-field__control" type="text" name="eidNumber"
                                value={staffMember.eidNumber} data-id={staffMember.id}
                                placeholder="784-XXXX-XXXXXXX-X"
                                disabled={isDisabled} onchange={handleFieldChange1} />
                            <template lwc:if={staffMember.err.eidNumber}>
                                <p class="regf-field__error" role="alert">{staffMember.err.eidNumber}</p>
                            </template>
                        </label>
                        <label class={staffMember.cls.eidIssueDate}>
                            <span class="regf-field__label">EID Issue Date</span>
                            <input class="regf-field__control" type="date" name="eidIssueDate"
                                value={staffMember.eidIssueDate} data-id={staffMember.id}
                                disabled={isDisabled} onchange={handleFieldChange} />
                            <template lwc:if={staffMember.err.eidIssueDate}>
                                <p class="regf-field__error" role="alert">{staffMember.err.eidIssueDate}</p>
                            </template>
                        </label>
                        <label class={staffMember.cls.eidExpiryDate}>
                            <span class="regf-field__label">EID Expiry Date</span>
                            <input class="regf-field__control" type="date" name="eidExpiryDate"
                                value={staffMember.eidExpiryDate} data-id={staffMember.id}
                                disabled={isDisabled} onchange={handleFieldChange} />
                            <template lwc:if={staffMember.err.eidExpiryDate}>
                                <p class="regf-field__error" role="alert">{staffMember.err.eidExpiryDate}</p>
                            </template>
                        </label>
                    </div>
                </template>

                <!-- POA Name / Email / Document moved to the Owner
                     Information step so they sit against the Owner record. -->

                <label class={staffMember.cls.isPrimaryagencyadmin}>
                    <input type="checkbox" name="isPrimaryagencyadmin"
                        checked={staffMember.isPrimaryagencyadmin} data-id={staffMember.id}
                        disabled={isDisabled} onchange={handleFieldChange1} />
                    <span>Is Primary Agency Admin</span>
                </label>
                <template lwc:if={staffMember.err.isPrimaryagencyadmin}>
                    <p class="regf-field__error" role="alert">{staffMember.err.isPrimaryagencyadmin}</p>
                </template>

                <!-- Documents -->
                <div class="regf__grid">
                    <template lwc:if={staffMember.isPassportFirstPageUploaded}>
                        <div class="regf-chip">
                            <span class="regf-chip__label">Passport First Page</span>
                            <button type="button" class="regf-chip__name" data-id={staffMember.id}
                                data-label="Passport_First_Page" onclick={handlePreview}>{staffMember.passportFrontfileName}</button>
                            <button type="button" class="regf-chip__action" title="Preview Passport First Page"
                                data-id={staffMember.id} data-label="Passport_First_Page" onclick={handlePreview}>
                                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5c-3 0-5.4 1.9-6.5 4.5C2.6 10.6 5 12.5 8 12.5s5.4-1.9 6.5-4.5C13.4 5.4 11 3.5 8 3.5zm0 7.2A2.7 2.7 0 1 1 8 5.3a2.7 2.7 0 0 1 0 5.4zm0-1.4a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg>
                            </button>
                            <template lwc:if={showDeleteIcon}>
                                <button type="button" class="regf-chip__action regf-chip__action--danger" title="Remove Passport First Page"
                                    data-id={staffMember.id} data-label="Passport_First_Page" onclick={handleRemoveFile}>
                                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l.5 1H14v1.3H2V3h3.5L6 2zm-2.5 3.5h9L12 14a1 1 0 0 1-1 .9H5A1 1 0 0 1 4 14l-.5-8.5zM6.3 7v6h1.2V7H6.3zm2.2 0v6h1.2V7H8.5z"/></svg>
                                </button>
                            </template>
                        </div>
                    </template>
                    <template lwc:else>
                        <label class={staffMember.cls.Passport_First_Page}>
                            <span class="regf-upload__title">Passport First Page</span>
                            <span class="regf-upload__hint">PDF or JPG, up to 2 MB</span>
                            <input type="file" class="regf-upload__input" accept=".pdf,.jpg"
                                data-id={staffMember.id} data-label="Passport_First_Page"
                                disabled={isDisabled} onchange={handleFileChange} />
                            <template lwc:if={staffMember.err.Passport_First_Page}>
                                <p class="regf-field__error" role="alert">{staffMember.err.Passport_First_Page}</p>
                            </template>
                        </label>
                    </template>

                    <template lwc:if={staffMember.isPassportSignaturePageUploaded}>
                        <div class="regf-chip">
                            <span class="regf-chip__label">Passport Signature Page</span>
                            <button type="button" class="regf-chip__name" data-id={staffMember.id}
                                data-label="Passport_Signature_Page" onclick={handlePreview}>{staffMember.passportFinalfileName}</button>
                            <button type="button" class="regf-chip__action" title="Preview Passport Signature Page"
                                data-id={staffMember.id} data-label="Passport_Signature_Page" onclick={handlePreview}>
                                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5c-3 0-5.4 1.9-6.5 4.5C2.6 10.6 5 12.5 8 12.5s5.4-1.9 6.5-4.5C13.4 5.4 11 3.5 8 3.5zm0 7.2A2.7 2.7 0 1 1 8 5.3a2.7 2.7 0 0 1 0 5.4zm0-1.4a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg>
                            </button>
                            <template lwc:if={showDeleteIcon}>
                                <button type="button" class="regf-chip__action regf-chip__action--danger" title="Remove Passport Signature Page"
                                    data-id={staffMember.id} data-label="Passport_Signature_Page" onclick={handleRemoveFile}>
                                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l.5 1H14v1.3H2V3h3.5L6 2zm-2.5 3.5h9L12 14a1 1 0 0 1-1 .9H5A1 1 0 0 1 4 14l-.5-8.5zM6.3 7v6h1.2V7H6.3zm2.2 0v6h1.2V7H8.5z"/></svg>
                                </button>
                            </template>
                        </div>
                    </template>
                    <template lwc:else>
                        <label class={staffMember.cls.Passport_Signature_Page}>
                            <span class="regf-upload__title">Passport Signature Page</span>
                            <span class="regf-upload__hint">PDF or JPG, up to 2 MB</span>
                            <input type="file" class="regf-upload__input" accept=".pdf,.jpg"
                                data-id={staffMember.id} data-label="Passport_Signature_Page"
                                disabled={isDisabled} onchange={handleFileChange} />
                            <template lwc:if={staffMember.err.Passport_Signature_Page}>
                                <p class="regf-field__error" role="alert">{staffMember.err.Passport_Signature_Page}</p>
                            </template>
                        </label>
                    </template>

                    <template lwc:if={staffMember.showEidFront}>
                        <template lwc:if={staffMember.isEmiratesIdFrontUploaded}>
                            <div class="regf-chip">
                                <span class="regf-chip__label">Emirates ID Front</span>
                                <button type="button" class="regf-chip__name" data-id={staffMember.id}
                                    data-label="Emirates_ID_Front" onclick={handlePreview}>{staffMember.eidFrontfileName}</button>
                                <button type="button" class="regf-chip__action" title="Preview Emirates ID Front"
                                    data-id={staffMember.id} data-label="Emirates_ID_Front" onclick={handlePreview}>
                                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5c-3 0-5.4 1.9-6.5 4.5C2.6 10.6 5 12.5 8 12.5s5.4-1.9 6.5-4.5C13.4 5.4 11 3.5 8 3.5zm0 7.2A2.7 2.7 0 1 1 8 5.3a2.7 2.7 0 0 1 0 5.4zm0-1.4a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg>
                                </button>
                                <template lwc:if={showDeleteIcon}>
                                    <button type="button" class="regf-chip__action regf-chip__action--danger" title="Remove Emirates ID Front"
                                        data-id={staffMember.id} data-label="Emirates_ID_Front" onclick={handleRemoveFile}>
                                        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l.5 1H14v1.3H2V3h3.5L6 2zm-2.5 3.5h9L12 14a1 1 0 0 1-1 .9H5A1 1 0 0 1 4 14l-.5-8.5zM6.3 7v6h1.2V7H6.3zm2.2 0v6h1.2V7H8.5z"/></svg>
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template lwc:else>
                            <label class={staffMember.cls.Emirates_ID_Front}>
                                <span class="regf-upload__title">Emirates ID Front</span>
                                <span class="regf-upload__hint">PDF or JPG, up to 2 MB</span>
                                <input type="file" class="regf-upload__input" accept=".pdf,.jpg"
                                    data-id={staffMember.id} data-label="Emirates_ID_Front"
                                    disabled={isDisabled} onchange={handleFileChange} />
                                <template lwc:if={staffMember.err.Emirates_ID_Front}>
                                    <p class="regf-field__error" role="alert">{staffMember.err.Emirates_ID_Front}</p>
                                </template>
                            </label>
                        </template>
                    </template>

                    <template lwc:if={staffMember.showEid}>
                        <template lwc:if={staffMember.isEmiratesIdBackUploaded}>
                            <div class="regf-chip">
                                <span class="regf-chip__label">Emirates ID Back</span>
                                <button type="button" class="regf-chip__name" data-id={staffMember.id}
                                    data-label="Emirates_ID_Back" onclick={handlePreview}>{staffMember.eidBackfileName}</button>
                                <button type="button" class="regf-chip__action" title="Preview Emirates ID Back"
                                    data-id={staffMember.id} data-label="Emirates_ID_Back" onclick={handlePreview}>
                                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5c-3 0-5.4 1.9-6.5 4.5C2.6 10.6 5 12.5 8 12.5s5.4-1.9 6.5-4.5C13.4 5.4 11 3.5 8 3.5zm0 7.2A2.7 2.7 0 1 1 8 5.3a2.7 2.7 0 0 1 0 5.4zm0-1.4a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg>
                                </button>
                                <template lwc:if={showDeleteIcon}>
                                    <button type="button" class="regf-chip__action regf-chip__action--danger" title="Remove Emirates ID Back"
                                        data-id={staffMember.id} data-label="Emirates_ID_Back" onclick={handleRemoveFile}>
                                        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l.5 1H14v1.3H2V3h3.5L6 2zm-2.5 3.5h9L12 14a1 1 0 0 1-1 .9H5A1 1 0 0 1 4 14l-.5-8.5zM6.3 7v6h1.2V7H6.3zm2.2 0v6h1.2V7H8.5z"/></svg>
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template lwc:else>
                            <label class={staffMember.cls.Emirates_ID_Back}>
                                <span class="regf-upload__title">Emirates ID Back</span>
                                <span class="regf-upload__hint">PDF or JPG, up to 2 MB</span>
                                <input type="file" class="regf-upload__input" accept=".pdf,.jpg"
                                    data-id={staffMember.id} data-label="Emirates_ID_Back"
                                    disabled={isDisabled} onchange={handleFileChange} />
                                <template lwc:if={staffMember.err.Emirates_ID_Back}>
                                    <p class="regf-field__error" role="alert">{staffMember.err.Emirates_ID_Back}</p>
                                </template>
                            </label>
                        </template>

                        <template lwc:if={staffMember.isVisaPageUploaded}>
                            <div class="regf-chip">
                                <span class="regf-chip__label">Visa Page</span>
                                <button type="button" class="regf-chip__name" data-id={staffMember.id}
                                    data-label="Visa_Page" onclick={handlePreview}>{staffMember.visabasefileName}</button>
                                <button type="button" class="regf-chip__action" title="Preview Visa Page"
                                    data-id={staffMember.id} data-label="Visa_Page" onclick={handlePreview}>
                                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5c-3 0-5.4 1.9-6.5 4.5C2.6 10.6 5 12.5 8 12.5s5.4-1.9 6.5-4.5C13.4 5.4 11 3.5 8 3.5zm0 7.2A2.7 2.7 0 1 1 8 5.3a2.7 2.7 0 0 1 0 5.4zm0-1.4a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg>
                                </button>
                                <template lwc:if={showDeleteIcon}>
                                    <button type="button" class="regf-chip__action regf-chip__action--danger" title="Remove Visa Page"
                                        data-id={staffMember.id} data-label="Visa_Page" onclick={handleRemoveFile}>
                                        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l.5 1H14v1.3H2V3h3.5L6 2zm-2.5 3.5h9L12 14a1 1 0 0 1-1 .9H5A1 1 0 0 1 4 14l-.5-8.5zM6.3 7v6h1.2V7H6.3zm2.2 0v6h1.2V7H8.5z"/></svg>
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template lwc:else>
                            <label class={staffMember.cls.Visa_Page}>
                                <span class="regf-upload__title">Visa Page</span>
                                <span class="regf-upload__hint">PDF or JPG, up to 2 MB</span>
                                <input type="file" class="regf-upload__input" accept=".pdf,.jpg"
                                    data-id={staffMember.id} data-label="Visa_Page"
                                    disabled={isDisabled} onchange={handleFileChange} />
                                <template lwc:if={staffMember.err.Visa_Page}>
                                    <p class="regf-field__error" role="alert">{staffMember.err.Visa_Page}</p>
                                </template>
                            </label>
                        </template>
                    </template>

                </div>
            </article>
        </template>

        <template lwc:if={isLoading}>
            <c-mbpr_loader veil></c-mbpr_loader>
        </template>
    </div>
</template>
