<template>

    <div class={cardClass}>

        <div class="main-header">
            <div class={headerIconClass}>
                {headerIcon}
            </div>

            <h2>Agency Key Contacts</h2>
        </div>

        <div class="sections">

            <!-- PRIMARY OWNER -->

            <div class={ownerSectionClass}>

                <div class="section-title">
                    Primary Agency Owner
                </div>

                <template if:true={ownerData.hasPrimaryOwner}>

                    <div class="owner-details">

                        <div class="field">
                            <span class="label">Name</span>
                            <span class="value">{ownerData.ownerName}</span>
                        </div>

                        <div class="field">
                            <span class="label">Email</span>
                            <span class="value">{ownerData.ownerEmail}</span>
                        </div>

                        <div class="field">
                            <span class="label">Mobile</span>
                            <span class="value">{ownerData.ownerMobile}</span>
                        </div>

                    </div>

                </template>

                <template if:false={ownerData.hasPrimaryOwner}>

                    <div class="warning-content">

                        <div class="warning-title">
                            ⚠ Primary Owner Not Assigned
                        </div>

                        <p class="warning-text">
                            The Primary Agency Owner is required for:
                        </p>

                        <ul>
                            <li>Ownership changes</li>
                            <li>Compliance approvals</li>
                            <li>Bank account updates</li>
                            <li>Critical communications</li>
                            <li>Agency governance activities</li>
                        </ul>

                        <div class="action-text">
                            Please assign a Primary Agency Owner immediately.
                        </div>

                    </div>

                </template>

            </div>

            <!-- PRIMARY AGENCY ADMIN -->

            <div class={adminSectionClass}>

                <div class="section-title">
                    Primary Agency Admin
                </div>

                <template if:true={ownerData.hasPrimaryAdmin}>

                    <div class="owner-details">

                        <div class="field">
                            <span class="label">Name</span>
                            <span class="value">{ownerData.adminName}</span>
                        </div>

                        <div class="field">
                            <span class="label">Email</span>
                            <span class="value">{ownerData.adminEmail}</span>
                        </div>

                        <div class="field">
                            <span class="label">Mobile</span>
                            <span class="value">{ownerData.adminMobile}</span>
                        </div>

                    </div>

                </template>

                <template if:false={ownerData.hasPrimaryAdmin}>

                    <div class="warning-content">

                        <div class="warning-title">
                            ⚠ Primary Agency Admin Not Assigned
                        </div>

                        <p class="warning-text">
                            The Primary Agency Admin is responsible for:
                        </p>

                        <ul>
                            <li>Portal administration</li>
                            <li>User management</li>
                            <li>Operational activities</li>
                            <li>Agency coordination</li>
                            <li>Business administration tasks</li>
                        </ul>

                        <div class="action-text">
                            Please assign a Primary Agency Admin.
                        </div>

                    </div>

                </template>

            </div>

        </div>

    </div>

</template>
