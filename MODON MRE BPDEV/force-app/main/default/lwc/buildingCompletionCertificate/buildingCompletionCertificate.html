<template>
    <div class="slds-p-around_medium">

        <div class="slds-m-bottom_medium">
        
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <h2 class="slds-text-heading_medium">
                    Send Building Completion Certificate
                </h2>
        
                <div if:true={selectedCount} class="slds-text-title_bold">
                    Selected Units: {selectedCount}
                </div>
            </div>
        
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                Select the units for which the Building Completion Certificate should be sent.
            </p>
        
        </div>

        <!-- Datatable -->
        <div style="height: 450px;">
            <template if:true={data}>
                <lightning-datatable
                    key-field="Id"
                    data={data}
                    columns={columns}
                    onrowselection={handleRowSelection}
                    max-row-selection="100">
                </lightning-datatable>
            </template>

            <template if:true={error}>
                <div class="slds-text-color_error slds-p-around_medium">
                    {error}
                </div>
            </template>
        </div>

        <!-- Footer Buttons -->
        <div class="slds-align_absolute-center slds-m-top_large">

            <lightning-button
                label="Close"
                variant="destructive"
                onclick={handleCancel}
                class="slds-m-right_small">
            </lightning-button>

            <lightning-button
                label="Send Mass BCC Letter"
                variant="brand"
                icon-name="utility:email"
                onclick={handleSend}
                disabled={disableSendButton}>
            </lightning-button>

        </div>

    </div>
</template>
