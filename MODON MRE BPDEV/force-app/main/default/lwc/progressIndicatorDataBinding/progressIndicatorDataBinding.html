<template>
    
    <!-- Render Timeline Badge -->
    <template if:true={isTimelineBadge}> 
        <div class={timelineBadgeCss} >{timelineBadgeData}</div> 
    </template>
<div>
    <!-- Render Step name as link -->
    <template if:true={renderStepName}>
        <template if:true={isOpen}>
            <template if:false={nextstep}>
            <a class={stepNameCss} onclick={handleClick}>{stepSummary}</a>
        </template>
        </template>
        <template if:true={nextstep}>
            <span class={stepNameCss}>{stepSummary}</span>
        </template>
        <template if:false={isOpen}>
            <span class={stepNameCss}>{stepSummary}</span>
        </template>
    </template>
</div>
    <!-- Render check icon -->
    <template if:true={showCheckIcon}>
        
        <lightning-icon class="tickcolor" style="margin-top: 4px;" icon-name="utility:check" size="x-small" alternative-text="Closed" ></lightning-icon><br>
        <!--<span class="closeDate">{closedDate}</span> -->
        <template if:true={closedDate}>
            <lightning-formatted-date-time value={closedDate} year="numeric" month="numeric" day="numeric"></lightning-formatted-date-time> 
        </template>
    </template>

</template>
