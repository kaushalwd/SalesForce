<template>
    <template if:true={visible}>
        <div class="toast-backdrop">
            <div class="toast-content" style={toastStyle}>
                <lightning-icon
                    icon-name={iconName}
                    alternative-text="Toast Icon"
                    size="small"
                    class="toast-icon">
                </lightning-icon>
                <span class="toast-text">{message}</span>
            </div>
        </div>
    </template>
</template>
