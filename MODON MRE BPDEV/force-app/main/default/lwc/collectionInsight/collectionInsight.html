<template>
    <h2 class="chart-title">Collection Insight</h2>

    <!-- ✅ No data -->
    <template if:true={noData}>
        <div class="no-data-text">
            No data available for collection insight
        </div>
    </template>

    <!-- ✅ Charts -->
    <template if:false={noData}>
        <div class="gauge-wrapper">
            <canvas class="gauge-canvas gauge-outer"></canvas>
            <canvas class="gauge-canvas gauge-inner"></canvas>
             <div class="between-label" style={betweenLabelStyle}>{betweenLabelText}</div>
        </div>
    </template>

    <!-- ✅ Legend -->
    <template if:true={showLegendBlock}>
        <div class="chart-legend">
            <label>Collection Summary</label><br /><br />

            <div class="legend-item">
                <span class="legend-color" style={totalStyle}></span>
                <span class="legend-label">Amount Billed:</span>
                <span class="legend-value">{billedValue}</span>
            </div>

            <div class="legend-item">
                <span class="legend-color" style={paidStyle}></span>
                <span class="legend-label">Collected Amt:</span>
                <span class="legend-value">{collectedValue}</span>
            </div>

            <div class="legend-item">
                <span class="legend-color" style={pendingStyle}></span>
                <span class="legend-label">Outstanding Amt:</span>
                <span class="legend-value">{outstandingValue}</span>
            </div>

            <div class="legend-item">
                <span class="legend-color" style={futureStyle}></span>
                <span class="legend-label">Future Collection:</span>
                <span class="legend-value">{futureValue}</span>
            </div>
        </div>
    </template>
</template>
