<template>
    <template lwc:if={recordId}>
        <div class="spinner">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" variant="brand" size="large">
                </lightning-spinner>
            </template>
        </div>
        <template lwc:if={showButton}>
            <lightning-button class="slds-float_right" name="Submit Lead" label="Submit Lead" slot="actions"
                                onclick={onSubmitLead} style="position: fixed; z-index: 1000; right: 15px;"></lightning-button>
        </template>
    </template>
    
</template>
