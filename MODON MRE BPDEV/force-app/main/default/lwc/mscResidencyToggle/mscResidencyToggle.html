<template>
    <div class="res-grid" role="radiogroup" aria-label="Residency">
        <template for:each={options} for:item="o">
            <button
                key={o.key}
                class={o.cls}
                type="button"
                role="radio"
                aria-checked={o.selected}
                data-key={o.key}
                disabled={disabled}
                onclick={handleSelect}
            >
                <span class="res-card__top">
                    <span class="res-card__title">{o.title}</span>
                    <template lwc:if={o.selected}>
                        <c-modon-icon
                            name="check-circle"
                            size="16"
                            color="var(--step-done, #16a34a)"
                        ></c-modon-icon>
                    </template>
                </span>
                <!-- The consequence, stated up front rather than discovered later. -->
                <span class="res-card__hint">{o.hint}</span>
            </button>
        </template>
    </div>
</template>
