<template>
    <div class="page">
        <template lwc:if={hasPoster}>
            <img class="page__media" src={posterImage} alt={posterAlt} loading="eager" />
        </template>
        <div class={scrimClass} aria-hidden="true"></div>
        <template lwc:if={hasModonLogo}>
            <img class="page__modon" src={modonLogoImage} alt="Modon" loading="eager" />
        </template>
        <svg class="page__contour" viewBox="0 0 600 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
            <g fill="none" stroke="#C9BC8F" stroke-width="1" opacity=".3">
                <path d="M-10,300 C 120,270 220,330 340,300 C 460,270 540,320 610,296"/>
                <path d="M-10,330 C 130,300 240,360 360,330 C 470,302 560,350 610,326"/>
                <path d="M-10,360 C 140,332 250,388 370,360 C 480,334 570,378 610,356"/>
            </g>
        </svg>

        <template lwc:if={hasLogo}>
            <div class="page__brand">
                <img class="page__logo" src={logoImage} alt={logoAlt} loading="eager" />
            </div>
        </template>

        <div class="page__stage">
            <div class="page__msg">
                <template lwc:if={hasEyebrow}>
                    <p class="page__eyebrow">{eyebrow}</p>
                </template>
                <template lwc:if={hasHeading}>
                    <h1 class="page__h1">{heading}</h1>
                </template>
                <template lwc:if={hasMessage}>
                    <p class="page__sub">{message}</p>
                </template>
            </div>
        </div>

        <template lwc:if={hasCopyright}>
            <div class="page__foot"><span>{copyrightText}</span></div>
        </template>
    </div>
</template>
