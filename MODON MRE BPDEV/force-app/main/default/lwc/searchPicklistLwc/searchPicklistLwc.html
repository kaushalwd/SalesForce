<template>
  <div class="slds-form-element">
    <template if:true={label}>
      <label class="slds-form-element__label" for="search-input">
        {label}123
        <template if:true={required}>
          <abbr class="slds-required" title="required">*</abbr>
        </template>
      </label>
    </template>

    <div class={containerClass} data-dropdown>
      <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
        <input
          id="search-input"
          class="slds-input"
          type="text"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded={expanded}
          aria-haspopup="listbox"
          aria-controls="picklist-listbox"
          aria-activedescendant={activeOptionId}
          placeholder={placeholder}
          value={inputValue}
          oninput={handleInput}
          onfocus={open}
          onkeydown={handleKeydown}
          onblur={handleBlur}
          disabled={disabled}
        />
        <lightning-icon
          icon-name="utility:down"
          size="x-small"
          class="slds-input__icon slds-input__icon_right"
        ></lightning-icon>
      </div>

      <div
    class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid picklist-dropdown"
    role="listbox"
    id="picklist-listbox"
    if:true={expanded}
  >
        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
          <template if:true={filteredOptions.length}>
            <template for:each={filteredOptions} for:item="opt" for:index="index">
              <li key={opt.id} role="presentation" class="slds-listbox__item" data-index={index}>
                <div
                  id={opt.id}
                  role="option"
                  tabindex="-1"
                  aria-selected={opt.ariaSelected}
                  class={opt.className}
                  onmousedown={handleOptionMouseDown}   
                  onclick={handleClick}
                >
                  <span class="slds-truncate" title={opt.label}>{opt.label}</span>
                </div>
              </li>
            </template>
          </template>

          <template if:false={filteredOptions.length}>
            <li class="slds-listbox__item" role="presentation">
              <div class="slds-listbox__option slds-listbox__option_plain" role="option" tabindex="-1">
                <span class="slds-truncate" title="No results">No results</span>
              </div>
            </li>
          </template>
        </ul>
      </div>
    </div>

    <template if:true={errorMessage}>
      <div class="slds-form-element__help">{errorMessage}</div>
    </template>
  </div>
</template>
