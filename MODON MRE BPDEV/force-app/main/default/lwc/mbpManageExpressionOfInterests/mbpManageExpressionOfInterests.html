<template if:true={showVoidModal}>

<section
    role="dialog"
    tabindex="-1"
    class="slds-modal slds-fade-in-open cleanVoidModal">

    <div class="cleanVoidContainer">

        <!-- CLOSE -->

        <button
            class="simpleCloseBtn"
            onclick={closeVoidModal}>

            ✕

        </button>

        <!-- ICON -->

        <div class="voidIconWrap">

            <div class="voidIcon">
                !
            </div>

        </div>

        <!-- TITLE -->

        <div class="voidTitle">

            Void EOI

        </div>

        <!-- SUB TEXT -->

        <div class="voidSubText">

            Please enter the reason before continuing.

        </div>

        <!-- TEXTAREA -->

        <textarea
            class="cleanTextarea"
            placeholder="Enter void reason..."
            value={voidReason}
            onchange={handleVoidReason}
            maxlength="500">
        </textarea>

        <!-- INFO CARD -->

        <div class="mildInfoCard">

            <div>
                EOI will become inactive after confirmation.
            </div>

           

        </div>

        <!-- ACTIONS -->

        <div class="voidActions">

            <button
                class="lightCancelBtn"
                onclick={closeVoidModal}>

                Cancel

            </button>

            <button
                class="dangerVoidBtn"
                onclick={handleVoidEOI}>

                Confirm Void

            </button>

        </div>

    </div>

</section>

<div class="cleanBackdrop"></div>

</template>

                Customer Information

        </div>

        <div class="formGrid">

            <!-- TYPE -->

            <lightning-combobox
                label="Type"
                value={leadType}
                options={typeOptions}
                onchange={handleChange}
                data-field="leadType"
                required
                message-when-value-missing="Please select Type">
            </lightning-combobox>

            <!-- TITLE -->

            <lightning-combobox
                label="Title"
                value={title}
                options={titleOptions}
                onchange={handleChange}
                data-field="title"
                required
                message-when-value-missing="Please select Title">
            </lightning-combobox>

            <template if:true={isOrganization}>

                <lightning-input
                    label="Organization Name"
                    value={company}
                    onchange={handleChange}
                    data-field="company"
                    required={isOrganization}
                    message-when-value-missing="Please enter Organization Name">
                </lightning-input>

            </template>

            <!-- FIRST NAME -->

            <lightning-input
                label="First Name"
                value={firstName}
                onchange={handleChange}

            <lightning-input
                label="Last Name"
                value={lastName}
                onchange={handleChange}
                data-field="lastName"
                required
                message-when-value-missing="Please enter Last Name">
            </lightning-input>

            <lightning-input
                type="email"
                label="Email"
                value={email}
                onchange={handleChange}
                data-field="email"
                required
                placeholder="example@gmail.com"
                message-when-value-missing="Please enter Email"
                message-when-type-mismatch="Please enter valid Email">
            </lightning-input>

<lightning-input
    type="tel"
    label="Mobile"
    value={mobile}
    onchange={handleChange}
    data-field="mobile"

    placeholder="+971 56XXXXXXXX"
    pattern="^\+[1-9]{1}[0-9]{6,14}$"
    message-when-value-missing="Please enter Mobile Number"
    message-when-pattern-mismatch="Enter valid mobile number with country code">
</lightning-input>

            <!-- RESIDENT STATUS -->

</lightning-input>

<template if:true={isStep2}>
    <section class="verification-card">
                            <h2>Verify Your Identity</h2>
                            <p>Please select your preferred method to receive a verification code to ensure the security of your corporate account.</p>

                            <div class="verification-options">
                             
                                <button class={emailVerificationClass} data-method="email" onclick={handleVerificationMethod}>
                                    <span class="verification-icon">
                                        <lightning-icon icon-name="utility:email" size="small" alternative-text="Email"></lightning-icon>
                                    </span>
                                    <span>
                                        <strong>Email Verification</strong>
                                        <small>Sent to your registered official email</small>
                                    </span>
                                
                                    <template if:true={showEmailVerificationLoader}>
                                        <lightning-spinner class="verification-option-spinner" alternative-text="Sending email verification code" size="small"></lightning-spinner>
                                    </template>
                                    <template if:true={isEmailVerificationSelected}>
                                        <lightning-icon class="verification-check" icon-name="utility:check" size="x-small" alternative-text="Selected"></lightning-icon>
                                    </template>
                                </button>
                                <button class={smsVerificationClass} data-method="sms" onclick={handleVerificationMethod}>
                                    <span class="verification-icon">
                                        <lightning-icon icon-name="utility:phone_portrait" size="small" alternative-text="SMS"></lightning-icon>
                                    </span>
                                    <span>
                                        <strong>SMS Verification</strong>
                                        <small>Sent to the registered mobile number</small>
                                    </span>
                                    <template if:true={showSmsVerificationLoader}>
                                        <lightning-spinner class="verification-option-spinner" alternative-text="Sending SMS verification code" size="small"></lightning-spinner>
                                    </template>
                                    <template if:true={isSmsVerificationSelected}>
                                        <lightning-icon class="verification-check" icon-name="utility:check" size="x-small" alternative-text="Selected"></lightning-icon>
                                    </template>
                                </button>
                            </div>

                            <template if:true={showVerificationCode}>
                                <div class="verification-code-section">
                                    <h3>Enter Verification Code</h3>
                                    <p>{verificationDestinationText}</p>
                                  
                                    <div class="otp-inputs">
                                        <template for:each={verificationDigits} for:item="digit">
                                            <input key={digit.key} class="otp-input" value={digit.value} maxlength="1" inputmode="numeric" pattern="[0-9]" data-otp-index={digit.index} oninput={handleVerificationCodeInput} aria-label="Verification code digit" />
                                        </template>
                                    </div>
                                    <p class="resend-text">
                                        Didn't receive the code?
                                        <template if:true={showResendAction}>
                                            <button class="text-button" onclick={handleVerificationResend} disabled={isResendDisabled}>{resendButtonLabel}</button>
                                        </template>
                                    </p>
                                    <template if:true={isSendingVerification}>
                                        <div class="field-loader">
                                            <lightning-spinner alternative-text="Sending verification code" size="xx-small"></lightning-spinner>
                                            <span>Sending verification code...</span>
                                        </div>
                                    </template>
                                    <template if:true={verificationMessage}>
                                        <div class="message info">{verificationMessage}</div>
                                    </template>
                                    <template if:true={errorMessage}>
                                        <div class="message error">{errorMessage}</div>
                                    </template>
                                </div>
                            </template>

                            <div class="verification-note">
                                <div>
                                    <lightning-icon icon-name="utility:info" size="x-small" alternative-text="Info"></lightning-icon>
                                    <span>Verification codes are valid for 5 minutes.</span>
                                </div>
                                <div>
                                    <lightning-icon icon-name="utility:help" size="x-small" alternative-text="Help"></lightning-icon>
                                    <span>If you don't receive a code, please check your spam folder or contact system administration.</span>
                                </div>
                            </div>
                        </section>

                        <!--footer class="modal-actions verification-actions">
                            <button class="secondary-button" onclick={handleBack} disabled={isBackDisabled}>Back</button>
                            <button class="primary-button verification-continue" onclick={handleVerificationNext} disabled={isVerificationNextDisabled}>
                                Verify & Continue
                                <lightning-icon icon-name="utility:forward" size="x-small"></lightning-icon>
                            </button>
                        </footer-->
</template>

<textarea
