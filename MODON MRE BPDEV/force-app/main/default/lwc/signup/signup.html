<template> 
    <c-custom-toast></c-custom-toast>
    <template if:true={isLoading}>
        <div class="spinner-backdrop">
            <lightning-spinner alternative-text="Loading..." size="large"></lightning-spinner>
        </div>
    </template>
    <template if:false={isMobile}>
        <header class="header slds-grid slds-grid_align-spread slds-p-around_medium slds-box">
        <div class="slds-col">
        <img src={logowhiteUrl} onclick={homepage} class="logo" alt="Modon Logo" />
        </div>
        </header>
        <br />
        </template>
        <template if:true={isMobile}>
        <header class=" slds-box slds-theme_shade slds-p-around_small slds-text-align_center" style="background-color: black;">
        <div>
        <img src={logowhiteUrl} class="logo-mobile" onclick={homepage} alt="Modon Logo" />
        </div>
        </header>
        <br />
        </template>
   <div class="login-container">
       <div class="login-box"> 
           <div class="info-card">
               <div class="logo-container">
                 <img src={logoUrl} alt="Modon Logo" class="logo"/>
               </div>
               <h2>Customer Portal</h2>
               <p class="description">Welcome</p>
               <p class="description">
                Please sign up with your email and mobile number to explore Modon World.
               </p>
           </div>

           <div class="login-card">
               <lightning-input type="text" label="First Name" placeholder="Enter your Name" value={firstName} onchange={handleChange} required></lightning-input>
               <lightning-input type="text" label="Last Name" placeholder="Enter your Name" value={lastName} onchange={handleChange} required></lightning-input>
               <lightning-input type="text" label="Email" placeholder="Enter your email" value={email} onchange={handleChange} required></lightning-input>
               <lightning-input type="text" label="Mobile" placeholder="+(000)00000000" value={mobile} onchange={handleChange} required></lightning-input>
            
               <div class="button-container">
                   <lightning-button class="full-width-button" variant="brand" label="Sign Up" onclick={handleSignUp}></lightning-button>&nbsp; &nbsp; 
                   <lightning-button class="full-width-button" variant="Neutral" label="Back" onclick={handleSignIn}></lightning-button>
               </div>

               <template if:true={errorCheck}>
                   <div class="error slds-var-p-around_x-small slds-var-p-top_small" role="alert">
                       <span>{errorMessage}</span>
                   </div>
               </template>
              
           </div>
       </div>
   </div>
   <footer class="footer">
    <p style="float:left">© Modon 2025 — All rights reserved</p>
    <div class="slds-grid slds-wrap slds-text-body_small">
  
      <div class="slds-col slds-size_1-of-6 slds-p-around_x-small slds-text-color_inverse ">
          <img src={instagramUrl} alt="Instagram" class="slds-icon" onclick={handleinstagram} />
      </div>
      <div class="slds-col slds-size_1-of-6 slds-p-around_x-small slds-text-color_inverse ">
          <img src={youtubeiconUrl} alt="Youtube" class="slds-icon" onclick={handleyoutube}/>
      </div>
      <div class="slds-col slds-size_1-of-6 slds-p-around_x-small slds-text-color_inverse ">
          <img src={linkediniconUrl} alt="Ln" class="slds-icon" onclick={handlelinkedin}/>
      </div>
      <div class="slds-col slds-size_1-of-6 slds-p-around_x-small slds-text-color_inverse ">
          <img src={facebookUrl} alt="Facebook" class="slds-icon" onclick={handlefacebook}/>
      </div>
      <div class="slds-col slds-size_1-of-6 slds-p-around_x-small slds-text-color_inverse ">
          <img src={twitterxUrl} alt="X" class="slds-icon" onclick={handletwitterx}/>
      </div>

  </div>
</footer>
</template>
