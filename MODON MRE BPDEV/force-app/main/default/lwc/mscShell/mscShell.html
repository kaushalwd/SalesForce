<template>
  <div class="app" style={rootStyle}>
    <div class="bg" style={bgStyle}></div>
    <div class="bg-overlay"></div>

    <div class="shell">
      <c-msc-app-bar
        show-nav={showNav}
        user-name={displayName}
        brand-label={brandLabel}
        theme={theme}
        context-label={contextLabel}
        onnavigate={handleNavigate}
        onthemetoggle={handleThemeToggle}
      ></c-msc-app-bar>

      <div class={bodyClass}>
        <template lwc:if={isLogin}>
          <c-msc-site-login onnavigate={handleNavigate}></c-msc-site-login>
        </template>
        <template lwc:else>
          <c-msc-workspace
            user-name={displayName}
            theme={theme}
            card={card}
            booking-id={bookingId}
            lead-id={leadId}
            opportunity-id={opportunityId}
            step={step}
            onnavigate={handleNavigate}
            oncontextchange={handleContextChange}
            onleadschanged={handleLeadsChanged}
          ></c-msc-workspace>
        </template>
      </div>

      <c-msc-footer></c-msc-footer>
    </div>
  </div>
</template>
