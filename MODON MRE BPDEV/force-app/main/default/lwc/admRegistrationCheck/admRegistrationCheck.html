<template>
    <lightning-card title="ADM Registration Check" icon-name="standard:task">

        <!-- LOADED -->
        <template if:true={isLoaded}>

            <!-- ADM EXISTS -->
            <template if:true={hasADM}>
                <div class={containerClass}>

                    <lightning-icon 
                        icon-name="utility:warning" 
                        size="small" 
                        class="slds-m-right_small">
                    </lightning-icon>

                    <span>
                        <b>ADM Registration already exists</b>
                    </span>

                    <div class="slds-m-top_small">
                        <a href={admUrl} target="_blank">
                            {admName}
                        </a>
                    </div>

                    <div class="slds-m-top_x-small">
                        Status: 
                        <span class={statusClass}>
                            <b>{status}</b>
                        </span>
                    </div>

                </div>
            </template>

            <!-- NO ADM -->
            <template if:false={hasADM}>
                <div class={containerClass}>

                    <lightning-icon 
                        icon-name="utility:success" 
                        size="small" 
                        class="slds-m-right_small">
                    </lightning-icon>

                    <span>
                        No ADM Registration Service Request found for this Sales Order.
                    </span>

                </div>
            </template>

        </template>

        <!-- ERROR -->
        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_medium">
                Error loading ADM data
            </div>
        </template>

    </lightning-card>
</template>
