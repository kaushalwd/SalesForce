<template>
    <div class="chart-container">
        <h2 class="chart-title">Project Wise Insights</h2>

        <!-- Spinner while loading -->
        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Loading Chart..."
                size="medium"
                class="chart-spinner">
            </lightning-spinner>
        </template>

        <!-- Chart -->
        <template if:true={showChart}>
            <div class="chart-container">
           <div class="">
             <div class="chart-wrapper">
            <canvas class="chart-canvas "></canvas></div> </div>
  </div>

            <label>Projects Summary</label><br><br>
            <!--<div class="chart-legend">
                <template for:each={legendData} for:item="item">
                    <div class="legend-item" key={item.label}>
                        <span class="legend-color" style={item.style}></span>
                        <span class="legend-label"><strong>{item.label}: </strong> {item.value}</span>
                    </div>
                </template>
            </div>-->
            <div class="chart-legend">
                <template for:each={legendData} for:item="item">
                    <div class="legend-item" key={item.label}>
                        <span class="legend-color" style={item.style}></span>

                        <span class="legend-label">{item.label}:</span>
                        <span class="legend-value">{item.value}</span>
                    </div>
                </template>
            </div>
        </template>

        <!-- No data -->
        <template if:true={noData}>
            <div class="no-data-text">No data available for Project Wise Insights</div>
                    <!-- <p>There is no Projects data to display.</p> -->
        </template>
    </div>
</template>
