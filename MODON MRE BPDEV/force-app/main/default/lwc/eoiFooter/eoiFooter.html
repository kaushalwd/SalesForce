<template>
    <footer class="foot">
        <span class="copy">{copyrightText}</span>
        <div class="links">
            <!-- MEOI-FOOT (10 Sep): the legal links go to modon.com's own pages, not a local modal -->
            <a class="link" href={termsUrl} target="_blank" rel="noopener noreferrer">{termsLabel}</a>
            <span class="dot" aria-hidden="true">&middot;</span>
            <a class="link" href={privacyUrl} target="_blank" rel="noopener noreferrer">{privacyLabel}</a>
        </div>
    </footer>

    <template lwc:if={isDocOpen}>
        <div class="doc-overlay" onclick={handleOverlayClick}>
            <section class="doc-modal" role="dialog" aria-modal="true" aria-label={docTitle}>
                <div class="doc-head">
                    <h2 class="doc-title">{docTitle}</h2>
                    <button class="doc-close" type="button" title="Close" onclick={closeDoc}>&times;</button>
                </div>
                <div class="doc-body">
                    <template for:each={docParas} for:item="para">
                        <p class="doc-para" key={para.key}>{para.text}</p>
                    </template>
                </div>
            </section>
        </div>
    </template>
</template>
