<template>

    <lightning-card title="Send Default Letter">

        <div class="slds-p-around_medium">

            <lightning-combobox
                name="letterType"
                label="Select Letter"
                value={selectedType}
                options={options}
                onchange={handleChange}>
            </lightning-combobox>

            <div class="slds-m-top_medium">

                <lightning-button
                    variant="brand"
                    label="Send Letter"
                    onclick={sendLetter}
                    disabled={isSendDisabled}
                    >
                </lightning-button>

            </div>

        </div>

    </lightning-card>

</template>
