<template>
    <div class="slds-box" style="background-color: #fff;">
        <div class="slds-m-bottom_large">
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-path">
                    <div class="slds-grid slds-path__track">
                        <div class="slds-grid slds-path__scroller-container">
                            <div class="slds-path__scroller" role="application">
                                <div class="slds-path__scroller_inner">
                                    <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal">
                                        
                                        <!-- Project Step -->
                                        <li class={projectPathCSS} role="presentation" data-identifier="pathstage" data-key="Project">
                                            <a aria-selected="false" class="slds-path__link" role="option" tabindex="-1" 
                                               onclick={handlePathClick} data-path-index="1">
                                                <span class="slds-path__stage">    
                                                    <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                                    <span class="slds-assistive-text">Stage Complete</span>
                                                </span>
                                                <span class="slds-path__title">Project</span>
                                            </a>
                                        </li>

                                        <!-- Phase Step -->
                                        <li class={phasePathCSS} role="presentation" data-identifier="pathstage" data-key="Phase">
                                            <a aria-selected="false" class="slds-path__link" role="option" tabindex="-1" 
                                               onclick={handlePathClick} data-path-index="2">
                                                <span class="slds-path__stage">    
                                                    <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                                    <span class="slds-assistive-text">Stage Complete</span>
                                                </span>
                                                <span class="slds-path__title">Phase</span>
                                            </a>
                                        </li>

                                        <!-- Zone Step -->
                                        <li class={zonePathCSS} role="presentation" data-identifier="pathstage" data-key="Zone">
                                            <a aria-selected="false" class="slds-path__link" role="option" tabindex="-1" 
                                               onclick={handlePathClick} data-path-index="3">
                                                <span class="slds-path__stage">    
                                                    <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                                    <span class="slds-assistive-text">Stage Complete</span>
                                                </span>
                                                <span class="slds-path__title">Zone</span>
                                            </a>
                                        </li>

                                        <!-- Unit Step -->
                                        <li class={unitPathCSS} role="presentation" data-identifier="pathstage" data-key="Unit">
                                            <a aria-selected="false" class="slds-path__link" role="option" tabindex="-1" 
                                               onclick={handlePathClick} data-path-index="4">
                                                <span class="slds-path__stage">    
                                                    <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                                    <span class="slds-assistive-text">Stage Complete</span>
                                                </span>
                                                <span class="slds-path__title">Unit</span>
                                            </a>
                                        </li>
                                        
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Projects List View -->
        <template if:true={showProjectsList}>
            <lightning-layout multiple-rows="true" pull-to-boundary="small">
                <template for:each={filteredProjects} for:item="project">
                    <lightning-layout-item key={project.id} size="12" small-device-size="6" 
                                          medium-device-size="4" large-device-size="3" 
                                          class="slds-var-p-around_x-small slds-m-bottom_large" 
                                          style="text-align:center;">
                        <div onclick={handleProjectClick} data-project-id={project.id} class="Project-button"> 
                            <img src={project.logoUrl} class="Logo-Image" alt={project.name}/>
                        </div>
                        <div class="project-text">{project.name}</div>
                    </lightning-layout-item>
                </template>
            </lightning-layout>
        </template>

        <!-- Phases List View -->
        <template if:true={showPhasesList}>
            <lightning-layout multiple-rows="true" pull-to-boundary="small">
                <template for:each={filteredPhases} for:item="phase">
                    <lightning-layout-item key={phase.id} size="12" small-device-size="6" 
                                          medium-device-size="4" large-device-size="3" 
                                          class="slds-var-p-around_x-small slds-m-bottom_large" 
                                          style="text-align:center;">
                        <div onclick={handlePhaseClick} data-phase-id={phase.id} class="Project-button"> 
                            <img src={phase.logoUrl} class="Logo-Image" alt={phase.name}/>
                        </div>
                        <div class="project-text">{phase.name}</div>
                    </lightning-layout-item>
                </template>
            </lightning-layout>
        </template>

        <!-- Zones List View -->
        <template if:true={showZonesList}>
            <lightning-layout multiple-rows="true" pull-to-boundary="small">
                <template for:each={filteredZones} for:item="zone">
                    <lightning-layout-item key={zone.name} size="12" small-device-size="6" 
                                          medium-device-size="4" large-device-size="3" 
                                          class="slds-var-p-around_x-small slds-m-bottom_large" 
                                          style="text-align:center;">
                        <div onclick={handleZoneClick} data-zone-id={zone.name} class="Project-button">
                            <img src={zone.logoUrl} class="Logo-Image" alt={zone.name}/>
                        </div>
                        <div class="project-text">{zone.name}</div>
                        </lightning-layout-item>
                </template>
            </lightning-layout>
        </template>
        
        <!-- Loading Spinner -->
        <template if:true={showSpinner}>
            <lightning-spinner variant="brand" alternative-text="Loading" size="large"></lightning-spinner>
        </template>
        
        <!-- Units List View -->
        <template if:true={showUnitsList}>
            <div class="unit-list">
                <template for:each={displayedUnits} for:item="unit">
                    <div key={unit.Id} class="unit-item custom-unit-card">
                        <div class="unit-card">
                            <div class="unit-card-content">
                                <!-- Left Side: Unit Image -->
                                <div class="left-side">
                                    <div class="carousel">
                                        <img src={unit.UnitImageUrl} alt={unit.UnitType} />
                                    </div>
                                </div>
                        
                                <!-- Right Side: Unit Details -->
                                <div class="right-side">
                                    <div class="unit-details">
                                        <div class="unit-price">
                                            <lightning-formatted-number 
                                                value={unit.DisplayPrice} 
                                                format-style="currency" 
                                                currency-code={unit.DisplayCurrency} 
                                                minimum-fraction-digits="2">
                                            </lightning-formatted-number>
                                        </div>
                                        <div class="unit-description" style="font-size: 20px; font-weight: bold;">{unit.Name}</div>
                                        <div class="unit-description">Phase: {unit.PhaseName}</div>
                                        <div class="unit-description">Zone: {unit.ZoneName}</div>
                                        <template if:true={unit.BuildingNo}>
                                            <div class="unit-description">Building: {unit.BuildingNo}</div>
                                        </template>
                                        <div class="unit-description">Type: {unit.UnitType}</div>
                                        <div class="unit-description">Area: {unit.GrossFloorArea} m²</div>
                                        <div class="unit-description">Bedrooms: {unit.NumberOfBedrooms}</div>
                                        <template if:true={unit.FloorNumber}>
                                            <div class="unit-description">Floor: {unit.FloorNumber}</div>
                                        </template>
                                        
                                    </div>
                        
                                    <!-- Button Group -->
                                    <div class="button-group">
                                        <lightning-button 
                                            onclick={handleLinkClick} 
                                            label="View" 
                                            title="View Unit Details" 
                                            icon-name="utility:preview" 
                                            data-unit-id={unit.Id} 
                                            icon-position="right" 
                                            class="slds-m-left_x-small">
                                        </lightning-button>
                                        
                                        <template if:true={recordId}>
                                            <lightning-button 
                                               onclick={handleSelectClick} 
                                               data-unit-id={unit.Id} 
                                               data-unit-name={unit.Name}
                                               variant={unit.selectButtonVariant}
                                               label={unit.selectButtonLabel}
                                               title={unit.selectButtonLabel}
                                               icon-name={unit.selectButtonIcon}
                                               icon-position="right" 
                                               class="slds-m-left_x-small">
                                            </lightning-button>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            
            <!-- Pagination -->
            <div class="pagination-container slds-align_absolute-center slds-m-top_large">
                <lightning-button 
                    label="Previous" 
                    icon-name="utility:chevronleft" 
                    onclick={previousHandler}
                    disabled={isPreviousDisable}>
                </lightning-button>
                
                <span class="slds-badge slds-badge_lightest  pagination-info" style="margin-right: 10px;margin-left: 10px;">
                    Displaying {startingRecord} to {endingRecord} of {totalRecountCount} records. Page {page} of {totalPage}.
                </span>
                
                <lightning-button 
                    label="Next" 
                    icon-name="utility:chevronright" 
                    icon-position="right" 
                    onclick={nextHandler}
                    disabled={isNextDisable}>
                </lightning-button>
            </div>
        </template>
    </div>
</template>
