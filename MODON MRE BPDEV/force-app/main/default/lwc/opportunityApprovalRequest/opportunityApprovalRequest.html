<template>
    <template lwc:if={showPopup}>
        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
        <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
        <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
        </svg>
        <span class="slds-assistive-text">Cancel and close</span>
        </button>
        <div class="slds-modal__header">
        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Submit for Approval</h1>
        </div>
        <!-- <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1"> -->
            <div class="slds-m-top_medium slds-m-bottom_x-large">
        
                <!-- Default/basic -->
                <div class="slds-p-around_medium lgc-bg">
                    <lightning-textarea type="text" label="Comments" max-length="50000" value={comments} onchange={handleComments}></lightning-textarea>
                </div>
            </div>
        <!-- </div> -->
        <div class="slds-modal__footer">
        <button class="slds-button slds-button_neutral" onclick={navigateToRecordPage}>Cancel</button>
        <button class="slds-button slds-button_brand" onclick={checkCondsAndSubmitApprovalCallout}>Submit</button>
        </div>
    </template>
</template>
