<template>
    <template lwc:if={showPopup}>
        <div class="slds-modal__header">
        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Submit EOI</h1>
        </div>
        <!-- <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1"> -->
            <div class="slds-m-top_medium slds-m-bottom_x-large">
        
                <!-- Default/basic -->
                <div class="slds-p-around_medium lgc-bg">
                    <lightning-textarea class="custom-textarea" type="text" label="Comments" max-length="50000" value={comments} onchange={handleComments} style="height: 250px !important;"></lightning-textarea>
                </div>
            </div>
        <!-- </div> -->
        <div class="slds-modal__footer">
        <button class="slds-button slds-button_neutral" onclick={navigateToRecordPage}>Cancel</button>
        <button class="slds-button slds-button_brand" onclick={submitEoiCallout}>Submit</button>
        </div>
    </template>
</template>
