<template>
    <div class="container">

        <!-- 🔥 3D Floating Button -->
        <button class="ai-btn" onclick={openModal}>
            ✨ Create Lead
        </button>

        <!-- 🔥 MODAL -->
        <template if:true={isModalOpen}>
            <div class="backdrop"></div>

            <div class="modal">

                <h2>🤖 AI Lead Creator</h2>

                <textarea
                    placeholder="Describe customer requirement..."
                    value={userInput}
                    onchange={handleChange}>
                </textarea>

                <button class="send-btn" onclick={handleSend} disabled={isLoading}>
                    <template if:false={isLoading}>
                        🚀 Send Request
                    </template>
                    <template if:true={isLoading}>
                        <span class="loader"></span>
                    </template>
                </button>

                <span class="close" onclick={closeModal}>✖</span>
            </div>
        </template>

        <!-- 🔥 CUSTOM TOAST -->
        <template if:true={showToast}>
            <div class="toast success">
                ✅ Lead Created Successfully
            </div>
        </template>

    </div>
</template>
