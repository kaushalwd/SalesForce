<template>
  <template lwc:if={errorMsg}>
    <div class="err">{errorMsg}</div>
  </template>

  <template lwc:if={ready}>
    <template lwc:if={hasAnything}>
      <!-- ACTION REQUIRED: approvals stay individual; overdue calls digest at 4+ -->
      <template lwc:if={hasAction}>
        <p class="sec">Action required</p>

        <template for:each={approvals} for:item="a">
          <button key={a.key} class="card" data-target={a.targetId} onclick={handleOpenRecord}>
            <span class="ic ic--hot">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"></path>
                <path d="M22 4 12 14l-3-3"></path>
              </svg>
            </span>
            <span class="c-main">
              <span class="c-t">Approval pending</span>
              <span class="c-s">{a.sub}</span>
            </span>
            <span class="c-go">Review</span>
          </button>
        </template>

        <template lwc:if={overdueAsDigest}>
          <button class="card" onclick={handleOverdueDigest}>
            <span class="ic ic--hot">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" aria-hidden="true">
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path>
              </svg>
            </span>
            <span class="c-main">
              <span class="c-t">{overdueDigest.title}</span>
              <span class="c-s">{overdueDigest.sub}</span>
            </span>
            <span class="c-go">View all</span>
          </button>
        </template>
        <template for:each={overdueRows} for:item="c">
          <button key={c.key} class="card" data-lead={c.leadId} onclick={handleLeadRow}>
            <span class="ic ic--hot">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" aria-hidden="true">
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path>
              </svg>
            </span>
            <span class="c-main">
              <span class="c-t">{c.name}</span>
              <span class="c-s">{c.sub}</span>
            </span>
            <span class="c-go">Open</span>
          </button>
        </template>
      </template>

      <!-- DUE TODAY -->
      <template lwc:if={hasToday}>
        <p class="sec">Due today</p>
        <template lwc:if={todayAsDigest}>
          <button class="card" onclick={handleTodayDigest}>
            <span class="ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4.5" width="18" height="17" rx="2"></rect>
                <path d="M16 2.5v4M8 2.5v4M3 10h18"></path>
              </svg>
            </span>
            <span class="c-main">
              <span class="c-t">{todayDigest.title}</span>
              <span class="c-s">{todayDigest.sub}</span>
            </span>
            <span class="c-go">View all</span>
          </button>
        </template>
        <template for:each={todayRows} for:item="c">
          <button key={c.key} class="card" data-lead={c.leadId} onclick={handleLeadRow}>
            <span class="ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4.5" width="18" height="17" rx="2"></rect>
                <path d="M16 2.5v4M8 2.5v4M3 10h18"></path>
              </svg>
            </span>
            <span class="c-main">
              <span class="c-t">{c.name}</span>
              <span class="c-s">{c.sub}</span>
            </span>
            <span class="c-go">Open</span>
          </button>
        </template>
      </template>

      <!-- OTHER TASKS: non-lead work, rare for reps -->
      <template lwc:if={hasOther}>
        <p class="sec">Other tasks</p>
        <template for:each={otherTasks} for:item="t">
          <button
            key={t.key}
            class="card"
            data-target={t.targetId}
            data-opp={t.opportunityId}
            data-so={t.salesOrderId}
            data-ref={t.bookingRef}
            data-unit={t.unitName}
            data-customer={t.customerName}
            onclick={handleOtherTask}
          >
            <span class="ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <path d="M14 2v6h6"></path>
              </svg>
            </span>
            <span class="c-main">
              <span class="c-t">{t.title}</span>
              <span class="c-s">{t.sub}</span>
            </span>
            <span class="c-go">Open</span>
          </button>
        </template>
      </template>

    </template>

    <template lwc:if={isEmpty}>
      <div class="empty">
        <span class="ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
          </svg>
        </span>
        <p class="empty__t">All caught up</p>
        <p class="empty__s">No pending approvals or overdue calls.</p>
      </div>
    </template>
  </template>

  <!-- the wait is shown and blocked: c-msc-loader covers the viewport -->
  <template lwc:if={loading}>
    <c-msc-loader></c-msc-loader>
  </template>
</template>
