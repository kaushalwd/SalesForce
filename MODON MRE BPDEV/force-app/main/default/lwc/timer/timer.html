<template>
     <lightning-card title="Sales Order Timer" icon-name="standard:orders">
        <div class="slds-p-around_medium">
                        
                <div style="display:flex;align-items:center;justify-content:flex-start;">
                    <div >
                        
                        <template if:true={graphicMode}>
                            <lightning-progress-ring
                            value={ringValue}
                            direction="drain"
                            variant={variant}
                            size="large"
                            ></lightning-progress-ring>
                        </template>
                    </div>
                    <div if:false={showTimer} style="font-size:26px;font-weight:700;margin-left:10px;color:#cc3300;">
                        {formattedTime}
                    </div>
                    <div if:true={showTimer} style="font-size:26px;font-weight:700;margin-left:10px;color:#15aa01;">
                        {formattedTime}
                    </div>
                </div>
        </div>
    </lightning-card> 

</template>
