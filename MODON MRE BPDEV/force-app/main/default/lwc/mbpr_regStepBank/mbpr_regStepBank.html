<template>
    <div class="regf">
        <template lwc:if={isLoading}>
            <c-mbpr_loader veil></c-mbpr_loader>
        </template>

        <!-- BP-036: after the final save the success screen replaces the form -->
        <template lwc:if={showSuccess}>
        <section class="regf__section regf-success" role="status" aria-live="polite">
            <span class="regf-success__mark" aria-hidden="true">✓</span>
            <h2 class="regf-success__title">Registration Successful</h2>
            <p class="regf-success__copy">Your registration has been successfully completed. We will now proceed with the next steps.</p>
            <p class="regf-success__copy">An email has been sent to your primary email address with further instructions.</p>
            <template lwc:if={hasSrNumber}>
                <p class="regf-success__sr">SR Number: {srNumber}</p>
            </template>
            <button type="button" class="regf-button regf-button--primary regf-success__done" onclick={handleDone}>Done</button>
        </section>
        </template>

        <template lwc:else>
        <section class="regf__section">
            <h3 class="regf__section-title">Bank Information</h3>
            <div class="regf__grid">
                <label class={bankNameFieldClass}>
                    <span class="regf-field__label">Bank Name</span>
                    <input
                        class="regf-field__control"
                        type="text"
                        name="Bank_Name__c"
                        data-field="Bank_Name__c"
                        value={bankNameValue}
                        disabled={isDisabled}
                        required
                        oninput={handleFieldChange}
                    />
                    <template lwc:if={bankNameError}>
                        <p class="regf-field__error" role="alert">{bankNameError}</p>
                    </template>
                </label>

                <label class={ibanNumberFieldClass}>
                    <span class="regf-field__label">IBAN Number</span>
                    <input
                        class="regf-field__control"
                        type="text"
                        name="IBAN_Country_Bank_Code__c"
                        data-field="IBAN_Country_Bank_Code__c"
                        value={ibanNumberValue}
                        placeholder="AE00 0000 0000 0000 0000 000"
                        disabled={isDisabled}
                        required
                        oninput={handleFieldChange}
                    />
                    <template lwc:if={ibanNumberError}>
                        <p class="regf-field__error" role="alert">{ibanNumberError}</p>
                    </template>
                </label>

                <label class={accountNumberFieldClass}>
                    <span class="regf-field__label">Account Number</span>
                    <input
                        class="regf-field__control"
                        type="text"
                        name="Account_Number__c"
                        data-field="Account_Number__c"
                        value={accountNumberValue}
                        disabled={isDisabled}
                        inputmode="numeric"
                        required
                        oninput={handleFieldChange}
                        onblur={handleNumericInput}
                    />
                    <template lwc:if={accountNumberError}>
                        <p class="regf-field__error" role="alert">{accountNumberError}</p>
                    </template>
                </label>

                <label class={swiftFieldClass}>
                    <span class="regf-field__label">SWIFT</span>
                    <input
                        class="regf-field__control"
                        type="text"
                        name="SWIFT_Sort_Code__c"
                        data-field="SWIFT_Sort_Code__c"
                        value={swiftValue}
                        placeholder="ABCDAE2AXXX"
                        disabled={isDisabled}
                        required
                        oninput={handleFieldChange}
                    />
                    <template lwc:if={swiftError}>
                        <p class="regf-field__error" role="alert">{swiftError}</p>
                    </template>
                </label>

                <label class={beneficiaryNameFieldClass}>
                    <span class="regf-field__label">Beneficiary Name</span>
                    <input
                        class="regf-field__control"
                        type="text"
                        name="Beneficiary_Name__c"
                        data-field="Beneficiary_Name__c"
                        value={beneficiaryNameValue}
                        disabled={isDisabled}
                        required
                        oninput={handleFieldChange}
                    />
                    <template lwc:if={beneficiaryNameError}>
                        <p class="regf-field__error" role="alert">{beneficiaryNameError}</p>
                    </template>
                </label>

                <label class={bankBranchNameFieldClass}>
                    <span class="regf-field__label">Bank Branch Name</span>
                    <input
                        class="regf-field__control"
                        type="text"
                        name="Bank_Branch_Name__c"
                        data-field="Bank_Branch_Name__c"
                        value={bankBranchNameValue}
                        disabled={isDisabled}
                        required
                        oninput={handleFieldChange}
                    />
                    <template lwc:if={bankBranchNameError}>
                        <p class="regf-field__error" role="alert">{bankBranchNameError}</p>
                    </template>
                </label>

                <label class={bankBranchTypeFieldClass}>
                    <span class="regf-field__label">Bank Branch Type</span>
                    <select
                        class="regf-field__control"
                        name="Bank_Branch_Type__c"
                        data-field="Bank_Branch_Type__c"
                        disabled={isDisabled}
                        required
                        onchange={handleFieldChange}
                    >
                        <option value="">--Select--</option>
                        <template for:each={bankBranchTypeOptions} for:item="opt">
                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                        </template>
                    </select>
                    <template lwc:if={bankBranchTypeError}>
                        <p class="regf-field__error" role="alert">{bankBranchTypeError}</p>
                    </template>
                </label>

                <label class={bankCountryFieldClass}>
                    <span class="regf-field__label">Bank Country</span>
                    <select
                        class="regf-field__control"
                        name="Bank_Country__c"
                        data-field="Bank_Country__c"
                        disabled={isDisabled}
                        required
                        onchange={handleFieldChange}
                    >
                        <option value="">--Select--</option>
                        <template for:each={countryOptions} for:item="opt">
                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                        </template>
                    </select>
                    <template lwc:if={bankCountryError}>
                        <p class="regf-field__error" role="alert">{bankCountryError}</p>
                    </template>
                </label>
            </div>
        </section>

        <section class="regf__section">
            <h3 class="regf__section-title">Documents</h3>
            <div class="regf__grid">
                <template lwc:if={showIbanUpload}>
                    <label class={ibanUploadClass}>
                        <span class="regf-upload__title">IBAN Copy</span>
                        <span class="regf-upload__hint">PDF or JPG, up to 5MB</span>
                        <input
                            type="file"
                            class="regf-upload__input"
                            data-field="IBAN_Copy"
                            accept=".pdf,.jpg"
                            disabled={isDisabled}
                            onchange={handleIbanChange}
                        />
                        <template lwc:if={ibanUploadError}>
                            <p class="regf-field__error" role="alert">{ibanUploadError}</p>
                        </template>
                    </label>
                </template>

                <template lwc:if={isIbanUploaded}>
                    <div class="regf-chip">
                        <span class="regf-chip__label">IBAN Copy</span>
                        <button
                            type="button"
                            class="regf-chip__name"
                            title="Preview IBAN Copy"
                            onclick={openIbanPreviewPopup}
                        >{ibanFileName}</button>
                        <button
                            type="button"
                            class="regf-chip__action"
                            title="Preview IBAN Copy"
                            onclick={openIbanPreviewPopup}
                        >
                            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5c-3 0-5.4 1.9-6.5 4.5C2.6 10.6 5 12.5 8 12.5s5.4-1.9 6.5-4.5C13.4 5.4 11 3.5 8 3.5zm0 7.2A2.7 2.7 0 1 1 8 5.3a2.7 2.7 0 0 1 0 5.4zm0-1.4a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg>
                        </button>
                        <template lwc:if={showDeleteIcon}>
                            <button
                                type="button"
                                class="regf-chip__action regf-chip__action--danger"
                                title="Remove IBAN Copy"
                                onclick={handleRemoveIban}
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l.5 1H14v1.3H2V3h3.5L6 2zm-2.5 3.5h9L12 14a1 1 0 0 1-1 .9H5A1 1 0 0 1 4 14l-.5-8.5zM6.3 7v6h1.2V7H6.3zm2.2 0v6h1.2V7H8.5z"/></svg>
                            </button>
                        </template>
                    </div>
                </template>

                <template lwc:if={isOtherUploaded}>
                    <div class="regf-chip">
                        <span class="regf-chip__label">Other Related Document</span>
                        <button
                            type="button"
                            class="regf-chip__name"
                            title="Preview Other Related Document"
                            onclick={openOtherPreviewPopup}
                        >{otherFileName}</button>
                        <button
                            type="button"
                            class="regf-chip__action"
                            title="Preview Other Related Document"
                            onclick={openOtherPreviewPopup}
                        >
                            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5c-3 0-5.4 1.9-6.5 4.5C2.6 10.6 5 12.5 8 12.5s5.4-1.9 6.5-4.5C13.4 5.4 11 3.5 8 3.5zm0 7.2A2.7 2.7 0 1 1 8 5.3a2.7 2.7 0 0 1 0 5.4zm0-1.4a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg>
                        </button>
                        <template lwc:if={showDeleteIcon}>
                            <button
                                type="button"
                                class="regf-chip__action regf-chip__action--danger"
                                title="Remove Other Related Document"
                                onclick={handleRemoveOther}
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l.5 1H14v1.3H2V3h3.5L6 2zm-2.5 3.5h9L12 14a1 1 0 0 1-1 .9H5A1 1 0 0 1 4 14l-.5-8.5zM6.3 7v6h1.2V7H6.3zm2.2 0v6h1.2V7H8.5z"/></svg>
                            </button>
                        </template>
                    </div>
                </template>
            </div>
        </section>
        </template>
    </div>

    <!-- Consent modal (blocking, as legacy: Accept is the only way out) -->
    <template lwc:if={showConfirmationModal}>
        <div class="regf-modal-layer" role="presentation">
            <section class="regf-modal" role="dialog" aria-modal="true" aria-label="Consent">
                <header class="regf-modal__header">
                    <h3 class="regf-modal__title">Consent</h3>
                </header>
                <div class="regf-modal__body">
                    <p>Your broker registration will proceed based on the following terms:</p>
                    <ul>
                        <li>This submission is final - please ensure all information is accurate.</li>
                        <li>Bank and document details must be correct - incomplete or invalid data may lead to disqualification.</li>
                        <li>Only one registration is allowed per entity.</li>
                        <li>Fake or misleading uploads will result in blacklisting.</li>
                        <li>Modon will review all registrations.</li>
                        <li>Any data mismatch will delay the approval process.</li>
                        <li>We may contact you for additional details, if required.</li>
                        <li>Please ensure your email address is active and accessible - all decisions and updates will be communicated via email.</li>
                    </ul>
                </div>
                <footer class="regf-modal__footer">
                    <button type="button" class="regf-button regf-button--primary" onclick={handleAcceptTerms}>Accept</button>
                </footer>
            </section>
        </div>
    </template>

    <!-- OTP modal -->
    <template lwc:if={showOtpModal}>
        <div class="regf-modal-layer" role="presentation">
            <section class="regf-modal" role="dialog" aria-modal="true" aria-label="Verify OTP">
                <header class="regf-modal__header">
                    <h3 class="regf-modal__title">Verify OTP</h3>
                </header>
                <div class="regf-modal__body">
                    <p>Enter the 6-digit OTP sent to your email: <strong>{sentToEmail}</strong></p>
                    <label class="regf-field regf-otp">
                        <span class="regf-field__label">One-time password</span>
                        <input
                            lwc:ref="otpInput"
                            class="regf-field__control"
                            type="text"
                            name="otp"
                            maxlength="6"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            placeholder="••••••"
                            value={enteredOtp}
                            oninput={handleOtpChange}
                            onkeydown={handleOtpKeydown}
                            disabled={isVerifyingOtp}
                        />
                    </label>
                    <template lwc:if={otpError}>
                        <p class="regf-field__error" role="alert">{otpError}</p>
                    </template>
                </div>
                <footer class="regf-modal__footer">
                    <button type="button" class="regf-button regf-button--ghost" onclick={closeOtpModal} disabled={isVerifyingOtp}>Cancel</button>
                    <button type="button" class="regf-button regf-button--primary" onclick={verifyOtp} disabled={isVerifyDisabled}>
                        <template lwc:if={isVerifyingOtp}>
                            <span class="regf-button__spinner" aria-hidden="true"></span>
                        </template>
                        <span>{verifyOtpLabel}</span>
                    </button>
                </footer>
            </section>
        </div>
    </template>

    <!-- Celebration overlay -->
    <template lwc:if={showCelebration}>
        <div class="regf-celebrate-layer" role="status">
            <template lwc:if={isDraftMode}>
                <div class="regf-celebrate">
                    <h2 class="regf-celebrate__title">📝 Draft Saved Successfully</h2>
                    <p class="regf-celebrate__copy">Your registration draft has been completed and saved successfully.</p>
                    <p class="regf-celebrate__copy">The next steps in the process will be shared with you via email shortly.</p>
                    <p class="regf-celebrate__sr">SR Number: {srNumber}</p>
                </div>
            </template>
            <template lwc:else>
                <div class="regf-celebrate">
                    <h2 class="regf-celebrate__title">🎉 Registration Successful!</h2>
                    <p class="regf-celebrate__copy">Your registration has been successfully completed. We will now proceed with the next steps.</p>
                    <p class="regf-celebrate__copy">An email has been sent to your primary email address with further instructions.</p>
                    <p class="regf-celebrate__sr">SR Number: {srNumber}</p>
                </div>
            </template>
            <canvas class="regf-celebrate__canvas"></canvas>
        </div>
    </template>
</template>
