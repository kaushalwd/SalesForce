  <!-- searchFilter.html -->
<template>
   <!--2.0  Component Title -->
    <div class="slds-page-header slds-page-header_record-home slds-m-bottom_small">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="standard:search"
                            size="small">
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h1 class="slds-page-header__title slds-truncate"
                            title="Search the Data Table Results">
                             Search the Data Table Results
                        </h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
  <div class="c-container">
      <lightning-layout vertical-align="center" class="x-large" >
        <lightning-layout-item flexibility="auto" padding="around-small" >
            <lightning-input
              label="Unit"
              value={unit}
              onchange={handleUnitChange}>
            </lightning-input>
        </lightning-layout-item>
        <lightning-layout-item flexibility="auto" padding="around-small">
            <lightning-input
              label="Customer Name"
              value={customerName}
              onchange={handleCustomerNameChange}>
            </lightning-input>
        </lightning-layout-item> 
        <lightning-layout-item flexibility="auto" padding="around-small" >
            <lightning-input
              label="Receipt Number"
              value={receiptNo}
              onchange={handleReceiptNoChange}>
            </lightning-input>
        </lightning-layout-item>  
        <lightning-layout-item flexibility="auto" padding="around-small" >
            <lightning-input
              label="Receipt Amount"
              value={receiptAmt}
              onchange={handleReceiptAmtChange}>
            </lightning-input>
        </lightning-layout-item>  
        <lightning-layout-item flexibility="auto" padding="around-small" >
            <lightning-input
              label="Maturity Date"
              value={maturityDate}
              onchange={handleMaturityDateChange}>
            </lightning-input>
        </lightning-layout-item>   
        <lightning-layout-item flexibility="auto" padding="around-small">
            <lightning-input
              label="Cheque / Transaction No"
              value={chequeTransNo}
              onchange={handleChequeTransNoChange}>
            </lightning-input>
        </lightning-layout-item>                           
      </lightning-layout>
    </div>
</template>
