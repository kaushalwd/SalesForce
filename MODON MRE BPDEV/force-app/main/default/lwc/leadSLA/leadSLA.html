<template>
    <lightning-card title="Active Task SLA Timer">
        <template if:true={remainingTime}>
            <div class="slds-text-heading_large">
                <template if:true={isOverdue}>
                    ⏰ <span class="slds-text-color_error">Overdue!</span>
                </template>
                <template if:false={isOverdue}>
                    ⏳ {remainingTime} remaining
                </template>
            </div>
        </template>
        <template if:false={remainingTime}>
            <div>No active task.</div>
        </template>
    </lightning-card>
</template>
