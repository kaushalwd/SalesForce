<template>
    <section class={salesConsoleClass} aria-label={salesConsoleAriaLabel}>
        <template lwc:if={showBootLoadingState}>
            <c-mbpr_loader label="Loading sales workspace"></c-mbpr_loader>
        </template>

        <template lwc:elseif={showBootErrorState}>
            <c-mbpr_empty-state
                kicker="Sales"
                title="Sales workspace unavailable"
                message="Refresh the workspace and try again."
                tone="error"
                primary-label="Refresh"
                onprimary={bootstrap}
            ></c-mbpr_empty-state>
        </template>

        <template lwc:else>
            <template lwc:if={showStandardWorkspace}>
            <!-- In EOI-only mode this bar would hold nothing but Refresh,
                 which lives in the EOI toolbar instead - so the bar hides. -->
            <div lwc:if={showConsoleBar} class="sales-console__bar">
                <div lwc:if={showSalesTabs} class="sales-tabs" role="tablist" aria-label="Sales sections">
                    <template for:each={salesTabs} for:item="tab">
                        <button
                            key={tab.key}
                            class={tab.className}
                            type="button"
                            role="tab"
                            aria-selected={tab.ariaSelected}
                            data-tab={tab.key}
                            onclick={handleTab}
                        >
                            <span>{tab.label}</span>
                            <template lwc:if={tab.hasCount}>
                                <strong>{tab.count}</strong>
                            </template>
                        </button>
                    </template>
                </div>
                <div class="sales-console__actions">
                    <button lwc:if={showGuidedOfferAction} class="sales-primary-action sales-primary-action--compact" type="button" onclick={handleOpenGuidedOffer}>
                        <lightning-icon icon-name="utility:email" size="x-small" alternative-text=""></lightning-icon>
                        <span>Generate Offer</span>
                    </button>
                    <button class="sales-icon-action sales-icon-action--compact" type="button" onclick={refreshActiveTab}>
                        <lightning-icon icon-name="utility:refresh" size="x-small" alternative-text=""></lightning-icon>
                        <span>Refresh</span>
                    </button>
                </div>
            </div>

            <template lwc:if={isPerformanceTab}>
                <section class="sales-section" aria-label="Performance">
                    <c-mbpr_lead-performance
                        broker-type={brokerType}
                        account-id={accountId}
                        contact-id={contactId}
                        chrome-hosted
                        onchromestate={handlePerfChromeState}
                    ></c-mbpr_lead-performance>
                </section>
            </template>

            <template lwc:elseif={isLeadsTab}>
                <section class="sales-section" aria-label="Leads">
                    <div class="sales-toolbar">
                        <label class="sales-search">
                            <lightning-icon icon-name="utility:search" size="xx-small" alternative-text=""></lightning-icon>
                            <input type="search" value={leadSearch} placeholder="Search leads" oninput={handleLeadSearch} />
                        </label>
                        <div class={leadFilterPanelClass}>
                            <button
                                class={leadFilterButtonClass}
                                type="button"
                                onclick={toggleLeadFilterPanel}
                                aria-expanded={isLeadFilterPanelOpen}
                                aria-controls="lead-filter-panel"
                            >
                                <lightning-icon icon-name="utility:filterList" size="xx-small" alternative-text=""></lightning-icon>
                                <span>Filters</span>
                                <template lwc:if={hasLeadActiveFilters}>
                                    <strong>{leadActiveFilterCount}</strong>
                                </template>
                            </button>
                            <template lwc:if={isLeadFilterPanelOpen}>
                                <div class="sales-filter-scrim" aria-hidden="true" onclick={closeLeadFilterPanel}></div>
                                <section id="lead-filter-panel" class="sales-filter-popover" role="dialog" aria-label="Filter leads">
                                    <div class="sales-filter-popover__head">
                                        <div>
                                            <p>Refine leads</p>
                                            <h4>Filters</h4>
                                        </div>
                                        <button class="sales-filter-popover__close" type="button" onclick={closeLeadFilterPanel} aria-label="Close lead filters">
                                            <lightning-icon icon-name="utility:close" size="xx-small" alternative-text=""></lightning-icon>
                                        </button>
                                    </div>
                                    <div class="sales-filter-popover__grid">
                                        <label class="sales-filter-field">
                                            <span>Period</span>
                                            <select data-filter="period" value={pendingLeadPeriod} onchange={handlePendingLeadFilterChange}>
                                                <template for:each={leadPeriodSelectOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Status</span>
                                            <select data-filter="status" value={pendingLeadStatusFilter} onchange={handlePendingLeadFilterChange}>
                                                <template for:each={leadStatusFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Project</span>
                                            <select data-filter="project" value={pendingLeadProjectFilter} onchange={handlePendingLeadFilterChange}>
                                                <template for:each={leadProjectFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Unit type</span>
                                            <select data-filter="unitType" value={pendingLeadUnitTypeFilter} onchange={handlePendingLeadFilterChange}>
                                                <template for:each={leadUnitTypeFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Owner</span>
                                            <select data-filter="agent" value={pendingLeadAgentFilter} onchange={handlePendingLeadFilterChange}>
                                                <template for:each={leadAgentFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Start Date</span>
                                            <input type="date" data-filter="startDate" value={pendingLeadStartDate} onchange={handlePendingLeadFilterChange} />
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>End Date</span>
                                            <input type="date" data-filter="endDate" value={pendingLeadEndDate} onchange={handlePendingLeadFilterChange} />
                                        </label>
                                    </div>
                                    <template lwc:if={leadDateRangeHint}>
                                        <p class="sales-filter-popover__hint">{leadDateRangeHint}</p>
                                    </template>
                                    <div class="sales-filter-popover__footer">
                                        <button class="sales-filter-popover__secondary" type="button" onclick={clearLeadFilters}>Clear</button>
                                        <button class="sales-filter-popover__primary" type="button" onclick={applyLeadFilters} disabled={isLeadDateRangeInvalid}>Apply</button>
                                    </div>
                                </section>
                            </template>
                        </div>
                        <button class="sales-icon-action sales-refresh-touch" type="button" onclick={refreshActiveTab} aria-label="Refresh">
                            <lightning-icon icon-name="utility:refresh" size="x-small" alternative-text=""></lightning-icon>
                        </button>
                        <button class="sales-icon-action sales-export-action" type="button" onclick={handleExportLeads} disabled={isLeadsLoading}>
                            <lightning-icon icon-name="utility:download" size="x-small" alternative-text=""></lightning-icon>
                            <span>Export</span>
                        </button>
                        <template lwc:if={canCreateLead}>
                            <button class="sales-primary-action" type="button" onclick={handleOpenLeadForm}>
                                <lightning-icon icon-name="utility:add" size="x-small" alternative-text=""></lightning-icon>
                                <span>New lead</span>
                            </button>
                        </template>
                    </div>
                    <template lwc:if={hasLeadActiveFilters}>
                        <div class="sales-applied-filters" aria-label="Applied lead filters">
                            <template for:each={leadAppliedFilterChips} for:item="chip">
                                <span key={chip.key} class="sales-filter-chip">{chip.label}</span>
                            </template>
                            <button type="button" onclick={clearLeadFilters}>Clear</button>
                        </div>
                    </template>

                    <template lwc:if={isLeadsLoading}>
                        <c-mbpr_loading-state rows="5" label="Loading leads"></c-mbpr_loading-state>
                    </template>
                    <template lwc:elseif={leadsError}>
                        <c-mbpr_empty-state
                            compact
                            title="Leads unavailable"
                            message="Refresh to try again."
                            tone="error"
                            primary-label="Refresh"
                            onprimary={loadLeads}
                        ></c-mbpr_empty-state>
                    </template>
                    <template lwc:elseif={hasFilteredLeads}>
                        <div class="record-table record-table--leads">
                            <div class="record-table__head" aria-hidden="true">
                                <span>Customer</span>
                                <span>Email</span>
                                <span>Phone</span>
                                <span>Project Name</span>
                                <span>Unit Type</span>
                                <span>Status</span>
                                <span>Owner</span>
                                <span>Created</span>
                            </div>
                            <ol class="record-table__body">
                                <template for:each={paginatedLeadRows} for:item="lead">
                                    <li key={lead.key} class="record-table__item" style={lead.rowStyle}>
                                        <button class="record-row" type="button" data-id={lead.id} onclick={handleOpenLead}>
                                            <span class="record-identity" data-label="Customer">
                                                <span class="record-avatar" aria-hidden="true">{lead.initials}</span>
                                                <span>
                                                    <strong>{lead.name}</strong>
                                                    <small>{lead.LeadNumber}</small>
                                                </span>
                                            </span>
                                            <span class="record-meta record-meta--wrap" data-label="Email">
                                                <small>{lead.emailLabel}</small>
                                            </span>
                                            <span class="record-meta" data-label="Phone">
                                                <small>{lead.mobileLabel}</small>
                                            </span>
                                            <span class="record-meta" data-label="Project Name">
                                                <strong>{lead.projectLabel}</strong>
                                            </span>
                                            <span class="record-meta" data-label="Unit Type">
                                                <strong>{lead.unitTypeLabel}</strong>
                                            </span>
                                            <span data-label="Status">
                                                <c-mbpr_status-badge label={lead.statusLabel} tone={lead.statusTone} size="small"></c-mbpr_status-badge>
                                            </span>
                                            <span class="record-meta" data-label="Owner">
                                                <strong>{lead.agentLabel}</strong>
                                            </span>
                                            <span class="record-meta" data-label="Created">
                                                <strong>{lead.createdLabel}</strong>
                                            </span>
                                        </button>
                                    </li>
                                </template>
                            </ol>
                        </div>
                        <div class="sales-pagination">
                            <span>{leadPageLabel}</span>
                            <button type="button" onclick={handlePreviousLeads} disabled={isFirstLeadPage}>Previous</button>
                            <button type="button" onclick={handleNextLeads} disabled={isLastLeadPage}>Next</button>
                        </div>
                    </template>
                    <template lwc:else>
                        <c-mbpr_empty-state
                            compact
                            title="No leads found"
                            message="Change the filters or refresh the list."
                        ></c-mbpr_empty-state>
                    </template>
                </section>
            </template>

            <template lwc:elseif={isOpportunitiesTab}>
                <section class="sales-section" aria-label="Opportunities">
                    <div class="sales-toolbar">
                        <label class="sales-search">
                            <lightning-icon icon-name="utility:search" size="xx-small" alternative-text=""></lightning-icon>
                            <input type="search" value={opportunitySearch} placeholder="Search opportunities" oninput={handleOpportunitySearch} />
                        </label>
                        <div class={opportunityFilterPanelClass}>
                            <button
                                class={opportunityFilterButtonClass}
                                type="button"
                                onclick={toggleOpportunityFilterPanel}
                                aria-expanded={isOpportunityFilterPanelOpen}
                                aria-controls="opportunity-filter-panel"
                            >
                                <lightning-icon icon-name="utility:filterList" size="xx-small" alternative-text=""></lightning-icon>
                                <span>Filters</span>
                                <template lwc:if={hasOpportunityActiveFilters}>
                                    <strong>{opportunityActiveFilterCount}</strong>
                                </template>
                            </button>
                            <template lwc:if={isOpportunityFilterPanelOpen}>
                                <div class="sales-filter-scrim" aria-hidden="true" onclick={closeOpportunityFilterPanel}></div>
                                <section id="opportunity-filter-panel" class="sales-filter-popover" role="dialog" aria-label="Filter opportunities">
                                    <div class="sales-filter-popover__head">
                                        <div>
                                            <p>Refine opportunities</p>
                                            <h4>Filters</h4>
                                        </div>
                                        <button
                                            class="sales-filter-popover__close"
                                            type="button"
                                            onclick={closeOpportunityFilterPanel}
                                            aria-label="Close opportunity filters"
                                        >
                                            <lightning-icon icon-name="utility:close" size="xx-small" alternative-text=""></lightning-icon>
                                        </button>
                                    </div>
                                    <div class="sales-filter-popover__grid">
                                        <label class="sales-filter-field">
                                            <span>Stage</span>
                                            <select data-filter="stage" value={pendingOpportunityStageFilter} onchange={handlePendingOpportunityFilterChange}>
                                                <template for:each={opportunityStageFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Project</span>
                                            <select data-filter="project" value={pendingOpportunityProjectFilter} onchange={handlePendingOpportunityFilterChange}>
                                                <template for:each={opportunityProjectFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Resident</span>
                                            <select
                                                data-filter="residentStatus"
                                                value={pendingOpportunityResidentStatusFilter}
                                                onchange={handlePendingOpportunityFilterChange}
                                            >
                                                <template for:each={opportunityResidentStatusFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Broker agent</span>
                                            <select
                                                data-filter="brokerAgent"
                                                value={pendingOpportunityBrokerAgentFilter}
                                                onchange={handlePendingOpportunityFilterChange}
                                            >
                                                <template for:each={opportunityBrokerAgentFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Sales manager</span>
                                            <select
                                                data-filter="salesManager"
                                                value={pendingOpportunitySalesManagerFilter}
                                                onchange={handlePendingOpportunityFilterChange}
                                            >
                                                <template for:each={opportunitySalesManagerFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Start Date</span>
                                            <input type="date" data-filter="startDate" value={pendingOpportunityStartDate} onchange={handlePendingOpportunityFilterChange} />
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>End Date</span>
                                            <input type="date" data-filter="endDate" value={pendingOpportunityEndDate} onchange={handlePendingOpportunityFilterChange} />
                                        </label>
                                    </div>
                                    <template lwc:if={opportunityDateRangeHint}>
                                        <p class="sales-filter-popover__hint">{opportunityDateRangeHint}</p>
                                    </template>
                                    <div class="sales-filter-popover__footer">
                                        <button class="sales-filter-popover__secondary" type="button" onclick={clearOpportunityFilters}>Clear</button>
                                        <button class="sales-filter-popover__primary" type="button" onclick={applyOpportunityFilters} disabled={isOpportunityDateRangeInvalid}>Apply</button>
                                    </div>
                                </section>
                            </template>
                        </div>
                        <button class="sales-icon-action sales-refresh-touch" type="button" onclick={refreshActiveTab} aria-label="Refresh">
                            <lightning-icon icon-name="utility:refresh" size="x-small" alternative-text=""></lightning-icon>
                        </button>
                        <button class="sales-icon-action sales-export-action" type="button" onclick={handleExportOpportunities} disabled={isOpportunitiesLoading}>
                            <lightning-icon icon-name="utility:download" size="x-small" alternative-text=""></lightning-icon>
                            <span>Export</span>
                        </button>
                    </div>
                    <template lwc:if={hasOpportunityActiveFilters}>
                        <div class="sales-applied-filters" aria-label="Applied opportunity filters">
                            <template for:each={opportunityAppliedFilterChips} for:item="chip">
                                <span key={chip.key} class="sales-filter-chip">{chip.label}</span>
                            </template>
                            <button type="button" onclick={clearOpportunityFilters}>Clear</button>
                        </div>
                    </template>

                    <template lwc:if={isOpportunitiesLoading}>
                        <c-mbpr_loading-state rows="5" label="Loading opportunities"></c-mbpr_loading-state>
                    </template>
                    <template lwc:elseif={opportunitiesError}>
                        <c-mbpr_empty-state
                            compact
                            title="Opportunities unavailable"
                            message="Refresh to try again."
                            tone="error"
                            primary-label="Refresh"
                            onprimary={loadOpportunities}
                        ></c-mbpr_empty-state>
                    </template>
                    <template lwc:elseif={hasFilteredOpportunities}>
                        <div class="record-table record-table--opportunities">
                            <div class="record-table__head" aria-hidden="true">
                                <span>Opportunity</span>
                                <span>Email</span>
                                <span>Mobile</span>
                                <span>Project</span>
                                <span>Resident Status</span>
                                <span>Stage</span>
                                <span>Broker Name</span>
                                <span>Modon Rep</span>
                            </div>
                            <ol class="record-table__body">
                                <template for:each={paginatedOpportunityRows} for:item="opp">
                                    <li key={opp.key} class="record-table__item" style={opp.rowStyle}>
                                        <button class="record-row" type="button" data-id={opp.id} onclick={handleOpenOpportunity}>
                                            <span class="record-meta" data-label="Opportunity">
                                                <strong>{opp.name}</strong>
                                            </span>
                                            <span class="record-meta record-meta--wrap" data-label="Email">
                                                <small>{opp.emailLabel}</small>
                                            </span>
                                            <span class="record-meta" data-label="Mobile">
                                                <small>{opp.mobileLabel}</small>
                                            </span>
                                            <span class="record-meta" data-label="Project">
                                                <strong>{opp.projectName}</strong>
                                            </span>
                                            <span class="record-meta" data-label="Resident Status">
                                                <strong>{opp.residentStatus}</strong>
                                            </span>
                                            <span data-label="Stage">
                                                <c-mbpr_status-badge label={opp.stageLabel} tone={opp.statusTone} size="small"></c-mbpr_status-badge>
                                            </span>
                                            <span class="record-meta" data-label="Broker Name">
                                                <strong>{opp.brokerAgentName}</strong>
                                            </span>
                                            <span class="record-meta" data-label="Modon Rep">
                                                <strong>{opp.salesManagerName}</strong>
                                            </span>
                                        </button>
                                    </li>
                                </template>
                            </ol>
                        </div>
                        <div class="sales-pagination">
                            <span>{opportunityPageLabel}</span>
                            <button type="button" onclick={handlePreviousOpportunities} disabled={isFirstOpportunityPage}>Previous</button>
                            <button type="button" onclick={handleNextOpportunities} disabled={isLastOpportunityPage}>Next</button>
                        </div>
                    </template>
                    <template lwc:else>
                        <c-mbpr_empty-state
                            compact
                            title="No opportunities found"
                            message="Change the filters to review a different set."
                        ></c-mbpr_empty-state>
                    </template>
                </section>
            </template>

            <template lwc:elseif={isEoiTab}>
                <section class="sales-section" aria-label="Expressions of Interest">
                    <div class="sales-toolbar">
                        <label class="sales-search">
                            <lightning-icon icon-name="utility:search" size="xx-small" alternative-text=""></lightning-icon>
                            <input type="search" value={eoiSearch} placeholder="Search EOI" oninput={handleEoiSearch} disabled={isEoiActionBusy} />
                        </label>
                        <div class={eoiFilterPanelClass}>
                            <button
                                class={eoiFilterButtonClass}
                                type="button"
                                onclick={toggleEoiFilterPanel}
                                disabled={isEoiActionBusy}
                                aria-expanded={isEoiFilterPanelOpen}
                                aria-controls="eoi-filter-panel"
                            >
                                <lightning-icon icon-name="utility:filterList" size="xx-small" alternative-text=""></lightning-icon>
                                <span>Filters</span>
                                <template lwc:if={hasEoiActiveFilters}>
                                    <strong>{eoiActiveFilterCount}</strong>
                                </template>
                            </button>
                            <template lwc:if={isEoiFilterPanelOpen}>
                                <div class="sales-filter-scrim" aria-hidden="true" onclick={closeEoiFilterPanel}></div>
                                <section id="eoi-filter-panel" class="sales-filter-popover" role="dialog" aria-label="Filter EOI records">
                                    <div class="sales-filter-popover__head">
                                        <div>
                                            <p>Refine EOI</p>
                                            <h4>Filters</h4>
                                        </div>
                                        <button class="sales-filter-popover__close" type="button" onclick={closeEoiFilterPanel} aria-label="Close EOI filters">
                                            <lightning-icon icon-name="utility:close" size="xx-small" alternative-text=""></lightning-icon>
                                        </button>
                                    </div>
                                    <div class="sales-filter-popover__grid">
                                        <label class="sales-filter-field">
                                            <span>Status</span>
                                            <select data-filter="status" value={pendingEoiStatusFilter} onchange={handlePendingEoiFilterChange}>
                                                <template for:each={eoiStatusFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Project</span>
                                            <select data-filter="project" value={pendingEoiProjectFilter} onchange={handlePendingEoiFilterChange}>
                                                <template for:each={eoiProjectFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Phase</span>
                                            <select data-filter="phase" value={pendingEoiPhaseFilter} onchange={handlePendingEoiFilterChange}>
                                                <template for:each={eoiPhaseFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Unit type</span>
                                            <select data-filter="unitType" value={pendingEoiUnitTypeFilter} onchange={handlePendingEoiFilterChange}>
                                                <template for:each={eoiUnitTypeFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <label class="sales-filter-field">
                                            <span>Bedrooms</span>
                                            <select data-filter="bedrooms" value={pendingEoiBedroomsFilter} onchange={handlePendingEoiFilterChange}>
                                                <template for:each={eoiBedroomsFilterOptions} for:item="option">
                                                    <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                    </div>
                                    <div class="sales-filter-popover__footer">
                                        <button class="sales-filter-popover__secondary" type="button" onclick={clearEoiFilters} disabled={isEoiActionBusy}>Clear</button>
                                        <button class="sales-filter-popover__primary" type="button" onclick={applyEoiFilters} disabled={isEoiActionBusy}>Apply</button>
                                    </div>
                                </section>
                            </template>
                        </div>
                        <button class="sales-icon-action sales-refresh-touch" type="button" onclick={refreshActiveTab} aria-label="Refresh" disabled={isEoiActionBusy}>
                            <lightning-icon icon-name="utility:refresh" size="x-small" alternative-text=""></lightning-icon>
                        </button>
                        <button class="sales-icon-action sales-export-action" type="button" onclick={handleExportEois} disabled={isEoiBusyOrLoading}>
                            <lightning-icon icon-name="utility:download" size="x-small" alternative-text=""></lightning-icon>
                            <span>Export</span>
                        </button>
                        <template lwc:if={eoiOnly}>
                            <button class="sales-icon-action sales-icon-action--compact" type="button" onclick={refreshActiveTab} disabled={isEoiActionBusy}>

                                <span>Project</span>
                                <span>Unit Type</span>
                                <span>Bedrooms</span>

                                <span>Amount</span>
                                <span>Actions</span>

                                                <small class="eoi-card-name">{eoi.customerName}</small>
                                            </span>
                                            <span class="record-meta" data-label="Payment (CP) Number">
                                                <strong>{eoi.paymentNameLabel}</strong>
                                            </span>
                                            <span class="record-meta" data-label="Customer">
                                                <strong>{eoi.customerName}</strong>
                                            </span>
                                            <span class="record-meta" data-label="Project">
                                                <strong>{eoi.projectName}</strong>
                                            </span>
                                            <span class="record-meta" data-label="Unit Type">
                                                <strong>{eoi.unitType}</strong>
                                            </span>
                                            <span class="record-meta" data-label="Bedrooms">
                                                <strong>{eoi.bedrooms}</strong>
                                            </span>
                                            <span data-label="Status">
                                                <c-mbpr_status-badge label={eoi.statusLabel} tone={eoi.statusTone} size="small"></c-mbpr_status-badge>
                                            </span>
                                            <span class="record-meta" data-label="Amount">
                                                <strong>{eoi.amountLabel}</strong>
                                            </span>
                                            <span class={eoi.rowActionClass} data-label="Actions">
                                                <template lwc:if={eoi.hasRowAction}>
                                                    <button
                                                        class={eoi.rowActionButtonClass}
                                                        type="button"
                                                        data-id={eoi.paymentRecordId}
                                                        data-action={eoi.rowAction}
                                                        disabled={isEoiActionBusy}
                                                        onclick={handleEoiRowAction}
                                                    >
                                                        <template lwc:if={eoi.rowActionBusy}>
                                                            <span class="button-spinner" aria-hidden="true"></span>
                                                        </template>
                                                        <span>{eoi.rowActionLabel}</span>
                                                    </button>
                                                </template>
                                            </span>

                                </template>

                        </div>
                        <div class="sales-pagination">
                            <span>{eoiPageLabel}</span>
                            <button type="button" onclick={handlePreviousEois} disabled={isEoiPreviousDisabled}>Previous</button>

                    <template lwc:else>
                        <c-mbpr_empty-state
                            compact
                            title="No EOI records found"
                            message="Change the filters or refresh the list."
                        ></c-mbpr_empty-state>
                    </template>
                </section>
            </template>

            <div lwc:if={showTouchActionBar} class="sales-touch-actionbar">
                <template lwc:if={showTouchNewLead}>
                    <button class="sales-primary-action" type="button" onclick={handleOpenLeadForm}>
                        <lightning-icon icon-name="utility:add" size="x-small" alternative-text=""></lightning-icon>
                        <span>New lead</span>
                    </button>
                </template>
                <template lwc:if={showTouchNewEoi}>
                    <button class="sales-primary-action" type="button" onclick={handleOpenEoiForm}>
                        <lightning-icon icon-name="utility:add" size="x-small" alternative-text=""></lightning-icon>
                        <span>New EOI</span>
                    </button>
                </template>
                <button lwc:if={showGuidedOfferAction} class="sales-icon-action" type="button" onclick={handleOpenGuidedOffer}>
                    <lightning-icon icon-name="utility:email" size="x-small" alternative-text=""></lightning-icon>
                    <span>Generate Offer</span>
                </button>
            </div>

            </template>
        </template>

        <template lwc:if={isDrawerOpen}>
            <c-mbpr_detail-drawer
                open={isDrawerOpen}
                variant={salesDrawerVariant}
                title={drawerTitle}
                eyebrow={drawerEyebrow}
                subtitle={drawerSubtitle}
                tone="accent"
                onclose={closeDrawer}
            >
                <button slot="header-extra" class="sales-drawer-focus drawer-hidden-focus" type="button" onclick={closeDrawer}>
                    Close
                </button>

                <template lwc:if={isLeadDetailDrawer}>
                    <section class="drawer-section">
                        <div class="drawer-hero drawer-hero--split">
                            <c-mbpr_status-badge label={selectedLead.statusLabel} tone={selectedLead.statusTone}></c-mbpr_status-badge>
                            <div class="drawer-actions drawer-actions--compact">
                                <template lwc:if={selectedLead.canGenerateOffer}>
                                    <button class="sales-primary-action" type="button" data-lead-id={selectedLead.id} onclick={handleOpenGuidedOffer}>Generate Offer</button>
                                </template>
                                <template lwc:if={selectedLead.canManage}>
                                    <button class="sales-primary-action" type="button" onclick={handleEditSelectedLead}>Edit lead</button>
                                </template>
                                <button class="sales-icon-action" type="button" onclick={loadSelectedLeadDocuments}>Refresh documents</button>
                            </div>
                        </div>
                        <dl class="detail-grid">
                            <div>
                                <dt>Email</dt>
                                <dd>{selectedLead.emailLabel}</dd>
                            </div>
                            <div>
                                <dt>Phone</dt>
                                <dd>{selectedLead.mobileLabel}</dd>
                            </div>
                            <div>
                                <dt>Project</dt>
                                <dd>{selectedLeadRequirementLabel}</dd>
                            </div>
                            <div>
                                <dt>Agent</dt>
                                <dd>{selectedLead.agentLabel}</dd>
                            </div>
                            <div>
                                <dt>Created</dt>
                                <dd>{selectedLead.createdLabel}</dd>
                            </div>
                        </dl>

                        <section class="document-list" aria-label="Lead documents">
                            <h4>Documents</h4>
                            <template lwc:if={isDocumentsLoading}>
                                <c-mbpr_loading-state rows="2" label="Loading documents"></c-mbpr_loading-state>
                            </template>
                            <template lwc:elseif={documentsError}>
                                <p class="sales-inline-message sales-inline-message--error">Documents could not be loaded.</p>
                            </template>
                            <template lwc:elseif={hasSelectedLeadDocuments}>
                                <ul>
                                    <template for:each={leadDocumentRows} for:item="doc">
                                        <li key={doc.key}>
                                            <a href={doc.downloadUrl} target="_blank" rel="noopener noreferrer">{doc.documentType}</a>
                                            <span>{doc.title}</span>
                                            <template lwc:if={selectedLead.canManage}>
                                                <template lwc:if={doc.isConfirmingDelete}>
                                                    <span class="doc-confirm" role="alertdialog" aria-label="Confirm document deletion">
                                                        <span class="doc-confirm__question">Delete this file?</span>
                                                        <button class="doc-confirm__yes" type="button" data-document={doc.documentType} onclick={handleConfirmDeleteLeadDocument}>Delete</button>
                                                        <button class="doc-confirm__no" type="button" onclick={handleCancelDeleteLeadDocument}>Cancel</button>
                                                    </span>
                                                </template>
                                                <template lwc:else>
                                                    <button type="button" data-key={doc.key} onclick={handleRequestDeleteLeadDocument}>Delete</button>
                                                </template>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="sales-inline-message">No uploaded documents found for this lead.</p>
                            </template>
                        </section>
                    </section>
                </template>

                <template lwc:elseif={isLeadFormDrawer}>
                    <section class="drawer-section">
                        <div class="segmented-control" role="group" aria-label="Lead type">
                            <template for:each={leadTypeOptions} for:item="option">
                                <button
                                    key={option.value}
                                    class={option.className}
                                    type="button"
                                    data-type={option.value}
                                    aria-pressed={option.ariaPressed}
                                    disabled={isLeadFormBusy}
                                    onclick={handleLeadType}
                                >
                                    {option.label}
                                </button>
                            </template>
                        </div>

                        <template lwc:if={isOrganizationLead}>
                            <h4 class="form-subsection">Owner's Details</h4>
                        </template>
                        <div class="sales-form-grid">
                            <label class="sales-field">
                                <span>Salutation</span>
                                <select value={leadForm.Salutation} data-field="Salutation" onchange={handleLeadFormChange}>
                                    <option value="">Select</option>
                                    <template for:each={salutationOptions} for:item="option">
                                        <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                    </template>
                                </select>
                            </label>
                            <label class="sales-field">
                                <span>First name</span>
                                <input value={leadForm.FirstName} data-field="FirstName" onchange={handleLeadFormChange} required />
                            </label>
                            <label class="sales-field">
                                <span>Last name</span>
                                <input value={leadForm.LastName} data-field="LastName" onchange={handleLeadFormChange} required />
                            </label>
                            <label class="sales-field">
                                <span>Email</span>
                                <input type="email" value={leadForm.Email} data-field="Email" onchange={handleLeadFormChange} onblur={handleLeadEmailBlur} required />
                                <template lwc:if={showLeadEmailStatus}>
                                    <small class={leadEmailStatusClass} role="status" aria-live="polite">
                                        <template lwc:if={isLeadEmailChecking}>
                                            <i class="button-spinner" aria-hidden="true"></i>
                                        </template>
                                        {leadEmailStatusText}
                                    </small>
                                </template>
                            </label>
                            <label class="sales-field">
                                <span>Mobile</span>
                                <input type="tel" value={leadForm.MobilePhone} data-field="MobilePhone" placeholder="+971 5X XXX XXXX" onchange={handleLeadFormChange} onblur={handleLeadMobileBlur} required />
                                <template lwc:if={showLeadMobileStatus}>
                                    <small class={leadMobileStatusClass} role="status" aria-live="polite">
                                        <template lwc:if={isLeadMobileChecking}>
                                            <i class="button-spinner" aria-hidden="true"></i>
                                        </template>
                                        {leadMobileStatusText}
                                    </small>
                                </template>
                            </label>
                            <label class="sales-field">
                                <span>Resident status</span>
                                <select value={leadForm.UAEResidentStatus__c} data-field="UAEResidentStatus__c" onchange={handleLeadFormChange} required>
                                    <option value="">Select</option>
                                    <template for:each={residentStatusOptions} for:item="option">
                                        <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                    </template>
                                </select>
                            </label>
                            <label class="sales-field">
                                <span>Country</span>
                                <select value={leadForm.CountryOfResidence__c} data-field="CountryOfResidence__c" onchange={handleLeadFormChange} required>
                                    <option value="">Select</option>
                                    <template for:each={countryOptions} for:item="option">
                                        <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                    </template>
                                </select>
                            </label>
                            <label class="sales-field">
                                <span>Nationality</span>
                                <select value={leadForm.Nationality__c} data-field="Nationality__c" onchange={handleLeadFormChange} required>
                                    <option value="">Select</option>
                                    <template for:each={nationalityOptions} for:item="option">
                                        <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                    </template>
                                </select>
                            </label>
                            <template lwc:if={isResidentLead}>
                                <label class="sales-field">
                                    <span>Emirates ID</span>
                                    <input value={leadForm.EIDNumber__c} data-field="EIDNumber__c" placeholder="784-XXXX-XXXXXXX-X" onchange={handleLeadFormChange} required />
                                </label>
                                <label class="sales-field">
                                    <span>Emirates ID expiry</span>
                                    <input type="date" value={leadForm.EmiratesIDExpiryDate__c} data-field="EmiratesIDExpiryDate__c" onchange={handleLeadFormChange} required />
                                </label>
                            </template>
                            <template lwc:elseif={isNonResidentLead}>
                                <label class="sales-field">
                                    <span>Passport number</span>
                                    <input value={leadForm.PassportNumber__c} data-field="PassportNumber__c" onchange={handleLeadFormChange} required />
                                </label>
                                <label class="sales-field">
                                    <span>Passport issue date</span>
                                    <input type="date" value={leadForm.PassportIssueDate__c} data-field="PassportIssueDate__c" onchange={handleLeadFormChange} />
                                </label>
                                <label class="sales-field">
                                    <span>Passport expiry</span>
                                    <input type="date" value={leadForm.PassportExpiryDate__c} data-field="PassportExpiryDate__c" onchange={handleLeadFormChange} required />
                                </label>
                            </template>
                            <label class="sales-field">
                                <span>Project name</span>
                                <select value={leadForm.ProjectInterest__c} data-field="ProjectInterest__c" onchange={handleLeadFormChange} required>
                                    <option value="">Select</option>
                                    <template for:each={projectInterestOptions} for:item="option">
                                        <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                    </template>
                                </select>
                            </label>
                            <label class="sales-field">
                                <span>Unit type</span>
                                <select value={leadForm.UnitType__c} data-field="UnitType__c" onchange={handleLeadFormChange} required>
                                    <option value="">Select</option>
                                    <template for:each={unitTypeOptions} for:item="option">
                                        <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                    </template>
                                </select>
                            </label>
                            <label class="sales-field sales-field--wide">
                                <span>Notes</span>
                                <textarea value={leadForm.Description} data-field="Description" onchange={handleLeadFormChange}></textarea>
                            </label>
                        </div>

                        <!-- Company Details renders only for organization leads. It is a
                             SEPARATE.sales-form-grid, not a heading dropped inside the
                             owner grid, so each section resolves its own dangling-last-field
                             rule (.sales-form-grid >.sales-field:last-child:nth-child(odd))
                             and neither can shift the other's column parity. Individual
                             leads render no heading and no second grid, so that path is
                             byte-for-byte what it was. -->
                        <template lwc:if={isOrganizationLead}>
                            <h4 class="form-subsection">Company Details</h4>
                            <div class="sales-form-grid">
                                <label class="sales-field">
                                    <span>Organization name</span>
                                    <input value={leadForm.Name} data-field="Name" onchange={handleLeadFormChange} required />
                                </label>
                                <label class="sales-field">
                                    <span>Unified number</span>
                                    <input value={leadForm.UnifiedNumber__c} data-field="UnifiedNumber__c" onchange={handleLeadFormChange} required />
                                </label>
                                <label class="sales-field">
                                    <span>VAT certificate type</span>
                                    <select value={leadForm.vatCertificateType} data-field="vatCertificateType" onchange={handleLeadFormChange}>
                                        <option value="">Select</option>
                                        <template for:each={vatCertificateTypeOptions} for:item="option">
                                            <option key={option.value} value={option.value} selected={option.isSelected}>{option.label}</option>
                                        </template>
                                    </select>
                                </label>
                                <label class="sales-field">
                                    <span>VAT number</span>
                                    <input value={leadForm.UAEVATRegisterNumber__c} data-field="UAEVATRegisterNumber__c" onchange={handleLeadFormChange} required={isVatRegistrationCertificate} />
                                </label>
                                <template lwc:if={showVatTemplateDownload}>
                                    <div class="vat-template sales-field--wide">
                                        <div class="vat-template__copy">
                                            <strong>VAT Undertaking Certificate</strong>
                                            <p>Please download the VAT Undertaking certificate, sign it, and upload it below.</p>
                                        </div>
                                        <a class="vat-template__link" href={vatTemplateUrl} download="VAT_Undertaking_Certificate.docx">
                                            <lightning-icon icon-name="utility:download" size="xx-small" alternative-text=""></lightning-icon>
                                            <span>Download Template (PDF)</span>
                                        </a>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <p class="drawer-helper-text">
                            Upload options follow the selected lead type and residency, matching the legacy lead process.
                        </p>
                        <template lwc:if={showKycTemplateDownload}>
                            <div class="doc-template">
                                <div class="doc-template__copy">
                                    <strong>KYC Form</strong>
                                    <p>Please download the KYC form, fill it carefully, and upload it under Complete KYC Form below.</p>
                                </div>
                                <a class="doc-template__link" href={kycTemplateUrl} download="KYC_Form.docx">
                                    <lightning-icon icon-name="utility:download" size="xx-small" alternative-text=""></lightning-icon>
                                    <span>Download KYC Form</span>
                                </a>
                            </div>
                        </template>
                        <!-- BP-015 - on edit a card that already holds a file shows it
                             (open + delete) and stays locked until that file is deleted,
                             so the same slot can never collect duplicates. -->
                        <template lwc:if={documentsError}>
                            <p class="sales-inline-message sales-inline-message--error document-grid-note" role="alert">
                                <span>Uploaded files could not be loaded, so uploads are paused.</span>
                                <button class="doc-confirm__no" type="button" onclick={handleRetryLeadDocuments}>Retry</button>
                            </p>
                        </template>
                        <section class="document-input-grid" aria-label="Lead document uploads">
                            <template for:each={leadDocumentInputs} for:item="doc">
                                <template lwc:if={doc.isLocked}>
                                    <div key={doc.key} class="document-input document-input--locked" aria-busy={isDocumentsLoading}>
                                        <span>{doc.label}</span>
                                        <template for:each={doc.existingFiles} for:item="file">
                                            <div key={file.key} class="document-input__file">
                                                <a href={file.downloadUrl} target="_blank" rel="noopener noreferrer" title={file.title}>{file.title}</a>
                                                <template lwc:if={file.isConfirmingDelete}>
                                                    <span class="doc-confirm" role="alertdialog" aria-label="Confirm file deletion">
                                                        <span class="doc-confirm__question">Delete this file?</span>
                                                        <button class="doc-confirm__yes" type="button" data-file-id={file.key} onclick={handleConfirmDeleteLeadFile} disabled={isLeadFileActionDisabled}>Delete</button>
                                                        <button class="doc-confirm__no" type="button" onclick={handleCancelDeleteLeadFile} disabled={isLeadFileActionDisabled}>Cancel</button>
                                                    </span>
                                                </template>
                                                <template lwc:else>
                                                    <button class="document-input__remove" type="button" data-file-id={file.key} onclick={handleRequestDeleteLeadFile} disabled={isLeadFileActionDisabled}>Delete</button>
                                                </template>
                                            </div>
                                        </template>
                                        <small>{doc.lockedHint}</small>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <label key={doc.key} class="document-input">
                                        <span>{doc.label}</span>
                                        <small>{doc.fileName}</small>
                                        <span class="document-input__button">
                                            <lightning-icon icon-name="utility:upload" size="xx-small" alternative-text=""></lightning-icon>
                                            Upload Files
                                        </span>
                                        <input class="document-input__native" type="file" data-document={doc.slotKey} accept=".pdf,.png,.jpg,.jpeg" onchange={handleLeadFile} multiple={doc.multiple} required={doc.required} />
                                    </label>
                                </template>
                            </template>
                        </section>
                    </section>
                    <div slot="footer" class="form-action-rail">
                        <template lwc:if={leadFormHasMessage}>
                            <p class={leadFormMessageClass} role="alert" aria-live="polite">{leadFormMessage}</p>
                        </template>
                        <div class="drawer-footer-actions">
                            <button class="sales-icon-action" type="button" onclick={closeDrawer}>Cancel</button>
                            <button class="sales-primary-action" type="button" onclick={handleSaveLead} disabled={isLeadFormBusy}>
                                <template lwc:if={isLeadFormBusy}>
                                    <span class="button-spinner" aria-hidden="true"></span>
                                </template>
                                <span>{leadSaveButtonLabel}</span>
                            </button>
                        </div>
                    </div>
                </template>

                <template lwc:elseif={isOpportunityDrawer}>
                    <section class="drawer-section">
                        <dl class="detail-grid">
                            <div>
                                <dt>Email</dt>
                                <dd>{selectedOpportunity.emailLabel}</dd>
                            </div>
                            <div>
                                <dt>Phone</dt>
                                <dd>{selectedOpportunity.mobileLabel}</dd>
                            </div>
                            <div>
                                <dt>Project</dt>
                                <dd>{selectedOpportunity.projectName}</dd>
                            </div>
                            <div>
                                <dt>Broker agent</dt>
                                <dd>{selectedOpportunity.brokerAgentName}</dd>
                            </div>
                            <div>
                                <dt>Sales manager</dt>
                                <dd>{selectedOpportunity.salesManagerName}</dd>
                            </div>
                        </dl>
                        <section class="sales-order-list" aria-label="Related sales orders">
                            <h4>Related sales orders</h4>
                            <template lwc:if={isSalesOrdersLoading}>
                                <c-mbpr_loading-state rows="2" label="Loading sales orders"></c-mbpr_loading-state>
                            </template>
                            <template lwc:elseif={salesOrdersError}>
                                <p class="sales-inline-message sales-inline-message--error">Sales orders could not be loaded.</p>
                            </template>
                            <template lwc:elseif={hasSalesOrders}>
                                <ul>
                                    <template for:each={salesOrders} for:item="order">
                                        <li key={order.key}>
                                            <div>
                                                <strong>{order.name}</strong>
                                                <span>{order.projectName} / {order.unitName}</span>
                                                <span class="sales-order-rooms">No Of Rooms: {order.bedrooms}</span>
                                            </div>
                                            <c-mbpr_status-badge label={order.statusLabel} tone={order.statusTone} size="small"></c-mbpr_status-badge>
                                            <span>{order.totalAmountLabel}</span>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="sales-inline-message">No related sales orders returned for this opportunity.</p>
                            </template>
                        </section>
                    </section>
                </template>

                <template lwc:elseif={isEoiDetailDrawer}>
                    <section class="drawer-section">
                        <div class="drawer-hero drawer-hero--split">
                            <c-mbpr_status-badge label={selectedEoi.statusLabel} tone={selectedEoi.statusTone}></c-mbpr_status-badge>
                            <template lwc:if={selectedEoi.hasRowAction}>
                                <button
                                    class={selectedEoi.rowActionButtonClass}
                                    type="button"

                            <dd>{eoiCancelRow.eoiNumber}</dd>
                        </div>
                        <div>
                            <dt>Customer</dt>
                            <dd>{eoiCancelRow.customerName}</dd>
                        </div>
                        <div>
                            <dt>Amount</dt>
                            <dd>{eoiCancelRow.amountLabel}</dd>
                        </div>
                    </dl>
                    <div class="eoi-confirm__foot">
                        <button class="eoi-confirm__no" type="button" onclick={handleEoiCancelDismiss} disabled={isEoiActionBusy}>Cancel</button>
                        <button class="eoi-confirm__yes" type="button" onclick={handleEoiCancelConfirm} disabled={isEoiActionBusy}>
                            <template lwc:if={isEoiActionBusy}>
                                <span class="button-spinner" aria-hidden="true"></span>
                            </template>
                            <span>Proceed</span>
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </section>
</template>
