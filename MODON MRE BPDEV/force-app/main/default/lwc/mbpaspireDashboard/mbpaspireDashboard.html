<template>
    <section class="mbp-hero">
        <div class="mbp-hero-inner">
            <div class="mbp-hero-card">
                <div class="mbp-aspire-logo-wrap">
                    <img src={aspireLogo} alt="Aspire by Modon" />
                </div>

                <div class="mbp-user-block">
                    <div class="mbp-avatar-lg-circle">
                        <template if:true={hasPhoto}>
                            <img src={userPhotoUrl} alt="User Photo" class="mbp-avatar-photo" />
                        </template>
                        <template if:false={hasPhoto}>
                            <span>{userInitials}</span>
                        </template>
                    </div>
                    <div>
                        <h2 class="mbp-user-name">{userName}</h2>
                        <!--      <p class="mbp-user-agency">{agencyName}</p>-->
                    </div>
                </div>

                <div class="mbp-stats-block">
                    <template if:true={showHeroBadge}>
                        <div class="mbp-circle-wrap">
                            <img src={heroBadgeImg} alt={heroBadgeText} class="mbp-circle-img" />
                        </div>
                    </template>

                    <div class="mbp-stats-info">
                        <span class={badgeClass}>{badgeLabel}</span>

                        <div class="mbp-stat-row">
                            <div class="mbp-stat-item">
                                <p class="mbp-stat-label">CURRENT SALES</p>
                                <p class="mbp-stat-value">
                                    <img src={currencyIcon} alt="" class="mbp-dirham-icon" />
                                    <span class="mbp-stat-number">{currentSales}</span>
                                </p>
                            </div>
                            <div class="mbp-stat-item">
                                <p class="mbp-stat-label">NEXT MILESTONE</p>
                            <p class="mbp-stat-value">
                                <img src={currencyIcon} alt="" class="mbp-dirham-icon" />
                                <span class="mbp-stat-number">
                                    {nextMilestoneValue}
                                </span>
                            </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <main class="mbp-main">
        <aside class="mbp-sidebar">
            <div class="mbp-menu">
                <a href="#overview" class="mbp-menu-item mbp-menu-item-active" onclick={handleNavClick}>Tier
                    Overview</a>
                <a href="#privileges" class="mbp-menu-item" onclick={handleNavClick}>Partner Privileges</a>
                <a href="#events" class="mbp-menu-item" onclick={handleNavClick}>Engagement &amp; Events</a>
                <a href="#resources" class="mbp-menu-item" onclick={handleNavClick}>Resources &amp; Guidelines</a>
                <a href="#rules" class="mbp-menu-item" onclick={handleNavClick}>Programme Rules</a>
            </div>
        </aside>

        <div class="mbp-content">
            <section data-id="overview" class="mbp-card">
                <h3 class="mbp-section-title">Tier Overview</h3>
                <div class="mbp-tier-grid">
                    <!-- Principal Card -->
                    <div class={principalCardClass}>
                        <template if:true={isPrincipal}>
                            <div class="mbp-tier-active-badge">Your Tier</div>
                        </template>
                        <div class="mbp-tier-badge-wrap">
                            <img src={principalBadgeImg} alt="Principal Badge" />
                        </div>
                        <h4 class="mbp-tier-name">Principal</h4>
                        <p class="mbp-tier-range">Unlocked at: AED 60M – 200M in Sales Value</p>
                        <div class="mbp-tier-section">
                            <p class="mbp-tier-section-title">Recognition</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Active and growing Modon
                                partner</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Building consistent sales
                                performance</p>
                        </div>
                        <div class="mbp-tier-section mbp-tier-section-mt">
                            <p class="mbp-tier-section-title">Partner Privileges</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Access to project launches
                            </p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Standard unit allocation</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Selected broker event
                                invitations</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Marketing support resources
                            </p>
                        </div>
                    </div>

                    <!-- Maestro Card -->
                    <div class={maestroCardClass}>
                        <template if:true={isMaestro}>
                            <div class="mbp-tier-active-badge">Your Tier</div>
                        </template>
                        <div class="mbp-tier-badge-wrap">
                            <img src={maestroBadgeImg} alt="Maestro Badge" />
                        </div>
                        <h4 class="mbp-tier-name">Maestro</h4>
                        <p class="mbp-tier-range">Unlock at: AED 200M – 500M in Sales Value</p>
                        <div class="mbp-tier-section">
                            <p class="mbp-tier-section-title">Recognition</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Elite Modon partner status
                            </p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Demonstrated high-volume
                                sales performance</p>
                        </div>
                        <div class="mbp-tier-section mbp-tier-section-mt">
                            <p class="mbp-tier-section-title">Partner Privileges</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Priority project launch
                                access</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Enhanced unit allocation</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Exclusive broker event
                                invitations</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Premium marketing support</p>
                        </div>
                    </div>

                    <!-- Ambassador Card -->
                    <div class={ambassadorCardClass}>
                        <template if:true={isAmbassador}>
                            <div class="mbp-tier-active-badge">Your Tier</div>
                        </template>
                        <div class="mbp-tier-badge-wrap">
                            <img src={ambassadorBadgeImg} alt="Ambassador Badge" />
                        </div>
                        <h4 class="mbp-tier-name">Ambassador</h4>
                        <p class="mbp-tier-range">Unlock at: AED 500M+ in Sales Value</p>
                        <div class="mbp-tier-section">
                            <p class="mbp-tier-section-title">Recognition</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Pinnacle Modon partner status
                            </p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Top-performing partner
                                recognition</p>
                        </div>
                        <div class="mbp-tier-section mbp-tier-section-mt">
                            <p class="mbp-tier-section-title">Partner Privileges</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> First access to all project
                                launches</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Premium unit allocation</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> All exclusive event
                                invitations</p>
                            <p class="mbp-tier-item"><span class="mbp-check-icon">✓</span> Full co-branding &amp;
                                marketing support</p>
                        </div>
                    </div>
                </div>
            </section>

            <section data-id="privileges" class="mbp-card">
                <h3 class="mbp-section-title">Partner Privileges</h3>
                <div class="mbp-privilege-grid">
                    <div class="mbp-privilege-card">
                        <img src={pp1} class="mbp-privilege-img" alt="Private pre-launch access" />
                        <h5 class="mbp-privilege-title">Private pre-launch access</h5>
                        <p class="mbp-privilege-desc">Gain early access to selected Modon projects before public
                            release, with dedicated inventory allocation.</p>
                    </div>
                    <div class="mbp-privilege-card">
                        <img src={pp2} class="mbp-privilege-img" alt="Priority access to sales events" />
                        <h5 class="mbp-privilege-title">Priority access to sales events</h5>
                        <p class="mbp-privilege-desc">Receive priority invitations and premium seating at Modon sales
                            events and product launches.</p>
                    </div>
                    <div class="mbp-privilege-card">
                        <img src={pp3} class="mbp-privilege-img" alt="International roadshows" />
                        <h5 class="mbp-privilege-title">Dedicated allocation for international roadshows</h5>
                        <p class="mbp-privilege-desc">Selected partners may be invited to participate in Modon
                            international roadshows and global market showcases.</p>
                    </div>
                    <div class="mbp-privilege-card">
                        <img src={pp4} class="mbp-privilege-img" alt="Networking events" />
                        <h5 class="mbp-privilege-title">Invitations to private Modon engagements and networking events
                        </h5>
                        <p class="mbp-privilege-desc">Connect with Modon leadership and fellow top-performing partners
                            through exclusive engagements.</p>
                    </div>
                    <div class="mbp-privilege-card">
                        <img src={pp5} class="mbp-privilege-img" alt="Local events support" />
                        <h5 class="mbp-privilege-title">Bespoke support for local events</h5>
                        <p class="mbp-privilege-desc">Receive tailored support and resources to host client events,
                            activations, and local showcases.</p>
                    </div>
                    <div class="mbp-privilege-card">
                        <img src={pp6} class="mbp-privilege-img" alt="Development workshops" />
                        <h5 class="mbp-privilege-title">Personalised development workshops</h5>
                        <p class="mbp-privilege-desc">Access curated workshops designed to enhance market knowledge and
                            sales performance.</p>
                    </div>
                </div>
            </section>

            <section data-id="events" class="mbp-card">
                <h3 class="mbp-section-title">Engagement &amp; Events</h3>
                <div class="mbp-events-grid">
                    <template if:true={formattedEvents.length}>
                        <template for:each={formattedEvents} for:item="evt">
                            <div key={evt.id} class="mbp-event-card" data-id={evt.id} data-title={evt.title}
                                onclick={handleEventClick}>
                                <img src={event1} class="mbp-event-img" alt="Event" />
                                <div class="mbp-event-info">
                                    <h5 class="mbp-event-title">{evt.title}</h5>

                                    <!-- Event Type Badge -->
                                    <template if:true={evt.type}>
                                        <span class="mbp-event-type">{evt.type}</span>
                                    </template>

                                    <!-- Event Date Range -->
                                    <p class="mbp-event-meta">
                                        📅 {evt.startDate}
                                        <template if:true={evt.showEndDateRange}>
                                            - {evt.endDate}
                                        </template>
                                        | {evt.startTime}
                                        <template if:true={evt.endTime}>
                                            - {evt.endTime}
                                        </template>
                                    </p>

                                    <!-- End Date specific line (if needed separately) -->
                                    <!--       <template if:true={evt.endDate}>
                                        <p class="mbp-event-meta mbp-event-enddate">
                                            📅 Ends: {evt.endDate}
                                        </p>
                                    </template>-->

                                    <!-- Location -->
                                    <p class="mbp-event-meta">📍 {evt.location}</p>

                                    <!-- Register Button (optional - keep if needed) -->
                         <!--  <button class="slds-button slds-button_brand" onclick={openAddLeadModal}>Register Now</button>-->

                                    <!-- Navigation Hint -->
                                    <!-- <p class="mbp-event-click-hint">Click to view details in Events tab →</p>-->
                                </div>
                            </div>
                        </template>
                    </template>
                    <template if:false={formattedEvents.length}>
                        <p>No upcoming events available</p>
                    </template>
                </div>
            </section>

            <section data-id="resources" class="mbp-card">
                <h3 class="mbp-section-title">Resources &amp; Guidelines</h3>
                <div class="mbp-resources-grid">
                    <div class="mbp-resource-card">
                        <span class="mbp-resource-tag">Template</span>
                        <h5 class="mbp-resource-title">Co-Branding Templates</h5>
                        <p class="mbp-resource-meta">PSD, AI • 15.8 MB</p>
                    </div>
                    <div class="mbp-resource-card">
                        <span class="mbp-resource-tag">Documentation</span>
                        <h5 class="mbp-resource-title">Programme Handbook</h5>
                        <p class="mbp-resource-meta">PDF • 15.8 MB</p>
                    </div>
                    <div class="mbp-resource-card">
                        <span class="mbp-resource-tag">Marketing</span>
                        <h5 class="mbp-resource-title">Social Media Assets</h5>
                        <p class="mbp-resource-meta">PSD, AI • 15.8 MB</p>
                    </div>
                    <div class="mbp-resource-card">
                        <span class="mbp-resource-tag">Presentations</span>
                        <h5 class="mbp-resource-title">Project Sales Decks</h5>
                        <p class="mbp-resource-meta">PPTX • 15.8 MB</p>
                    </div>
                </div>
            </section>

            <section data-id="rules" class="mbp-card">
                <h3 class="mbp-section-title">Programme Rules</h3>
                <div class="mbp-rules-grid">
                    <div class="mbp-rule-card">
                        <h5 class="mbp-rule-title">Tier Qualification</h5>
                        <p class="mbp-rule-item"><span class="mbp-arrow-icon">›</span> Principal tier requires AED
                            60–200 million in total sales</p>
                        <p class="mbp-rule-item"><span class="mbp-arrow-icon">›</span> Sales performance is calculated
                            on a rolling 12-month basis</p>
                        <p class="mbp-rule-item"><span class="mbp-arrow-icon">›</span> Only registered and verified
                            sales count toward tier progression</p>
                        <p class="mbp-rule-item"><span class="mbp-arrow-icon">›</span> Sales must be completed
                            transactions, not pending deals</p>
                    </div>
                    <div class="mbp-rule-card">
                        <h5 class="mbp-rule-title">Tier Maintenance</h5>
                        <p class="mbp-rule-item"><span class="mbp-arrow-icon">›</span> Status is reviewed quarterly
                            based on sales performance</p>
                        <p class="mbp-rule-item"><span class="mbp-arrow-icon">›</span> Members have a 90-day grace
                            period if sales drop below tier minimum</p>
                        <p class="mbp-rule-item"><span class="mbp-arrow-icon">›</span> Continuous engagement with Modon
                            events is encouraged</p>
                        <p class="mbp-rule-item"><span class="mbp-arrow-icon">›</span> Tier upgrades take effect
                            immediately upon reaching new threshold</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

</template>
