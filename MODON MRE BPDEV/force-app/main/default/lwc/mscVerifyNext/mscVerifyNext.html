<template>
    <!-- no answer, no bar; no fallback sentence -->
    <template lwc:if={show}>
        <div class={barClass}>
            <div class="vn__text">
                <p class="vn__k">{s.label}</p>
                <p class="vn__v">{s.headline}</p>
            </div>
            <template lwc:if={hasButton}>
                <button
                    class="btn btn-primary btn-sm vn__go"
                    type="button"
                    disabled={disabled}
                    onclick={handleAct}
                >{s.buttonLabel}</button>
            </template>
        </div>
    </template>
</template>
