<template>
    <lightning-spinner if:true={isLoading} alternative-text="Loading..." size="medium"></lightning-spinner>

    <div class="checklist-wrapper">

 

        <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
          
           <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
            <div class="slds-col slds-size_2-of-6">
                <b>Booking:</b> 
            </div>
            <div class="slds-col slds-size_4-of-6">
                <b> <a href={bookingUrl} target="_blank" class="slds-text-link">{bookingName}</a></b> 
            </div>



            <div class="slds-col slds-size_2-of-6">
                <b> Unit:</b> 
            </div>
            <div class="slds-col slds-size_4-of-6">
                <b><a href={unitUrl} target="_blank" class="slds-text-link">{unitName}</a></b> 
            </div>

              <div class="slds-col slds-size_2-of-6">
                <b> CheckList Name:</b> 
            </div>
            <div class="slds-col slds-size_4-of-6">
                <b>{checkListName}</b> 
            </div>
        </div>
        </div>





        <div class="checklist-header slds-text-heading_medium">Maker-Checker Checklist</div>

        <template for:each={checklistItems} for:item="item">
            <div key={item.id} class="checklist-section slds-box slds-theme_default slds-m-bottom_medium">
                <div class="slds-grid slds-wrap slds-gutters slds-p-around_small">

                    <!-- <div class="slds-col slds-size_1-of-1">
                        <b><pre>{item.name}</pre></b>
                    </div> -->

                    <lightning-formatted-rich-text value={item.name} class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                    </lightning-formatted-rich-text>
                    <!-- Column 1: All dropdowns -->
                    <div class="slds-col slds-size_1-of-2">
                        <div class="slds-grid slds-wrap slds-gutters">

                            <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                                <lightning-combobox
                                    label="Maker"
                                    value={item.makerStatus}
                                    options={picklistOptions.maker}
                                    onchange={handleMakerStatusChange}
                                    data-id={item.id}
                                    class="large-combobox"
                                    disabled={item.isMakerDisabled}>
                                </lightning-combobox>
                            </div>
                            <template if:true={item.showMakerRejectionReason}>
                                <div class="slds-col slds-size_1-of-1">
                                    <lightning-combobox
                                        label="Rejection Reason"
                                        value={item.makerRejectionReason}
                                        options={picklistOptions.rejectionReasons}
                                        onchange={handleMakerRejectionReasonChange}
                                        data-id={item.id}
                                        class="large-combobox"
                                        disabled={item.isMakerDisabled}>
                                    </lightning-combobox>
                                </div>
                            </template>

                            <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                                <lightning-combobox
                                    label="Checker"
                                    value={item.checkerStatus}
                                    options={picklistOptions.checker}
                                    onchange={handleCheckerStatusChange}
                                    data-id={item.id}
                                    class="large-combobox"
                                    disabled={item.isCheckerDisabled}>
                                </lightning-combobox>
                            </div>

                            <template if:true={item.showChekerRejectionReason}>
                                <div class="slds-col slds-size_1-of-1">
                                    <lightning-combobox
                                        label="Rejection Reason"
                                        value={item.checkerRejectionReason}
                                        options={picklistOptions.rejectionReasons}
                                        onchange={handleCheckerRejectionReasonChange}
                                        data-id={item.id}
                                        class="large-combobox"
                                        disabled={item.isCheckerDisabled}>
                                    </lightning-combobox>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Column 2: Text Areas -->
                    <div class="slds-col slds-size_1-of-2">
                        <div class="slds-grid slds-wrap slds-gutters">

                            <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                                <lightning-textarea
                                    label="Maker Comments"
                                    value={item.makerComments}
                                    onchange={handleMakerCommentChange}
                                    data-id={item.id}
                                    disabled={item.isMakerDisabled}>
                                </lightning-textarea>
                            </div>

                            <div class="slds-col slds-size_1-of-1">
                                <lightning-textarea
                                    label="Checker Comments"
                                    value={item.checkerComments}
                                    onchange={handleCheckerCommentChange}
                                    data-id={item.id}
                                    disabled={item.isCheckerDisabled}>
                                </lightning-textarea>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </template>
   

        <div class="slds-m-top_large slds-align_absolute-center">
            <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isLoading}></lightning-button>
        </div>
    </div>
</template>
