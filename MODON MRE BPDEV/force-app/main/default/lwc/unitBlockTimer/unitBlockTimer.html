<template>

    <template if:true={showTimesUpModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
             <!-- modal header start -->
               <header class="slds-modal__header">
                  <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" name="Close" onclick={closeModalHandler}>
                     <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                     <span class="slds-assistive-text">Close</span>
                  </button>
                  <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Unit Block Time Has Run Out</h2>
               </header>
           
               <!-- modal body start -->
               <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                     <p>Your unit has been released!</p>
               </div>
     
               <!-- modal footer start-->
               
               <footer class="slds-modal__footer">
                    <lightning-button variant="brand" class="slds-m-left_x-small" label="OK" onclick={actionHandler}> </lightning-button>
               </footer>
            
            </div>
         </section>
         <div class="slds-backdrop slds-backdrop_open"></div>
      </template>
      <!-- modal end -->
      <div class="slds-card slds-p-around_medium">
        <div style="font-weight: 800;font-size:18px;margin:5px;">
            Time Remaining:
        </div>
        <div style="display:flex;align-items:center;justify-content:flex-start;">
            <div >
                <!-- progress ring start -->
                <template if:true={graphicMode}>
                    <lightning-progress-ring
                    value={ringValue}
                    direction="drain"
                    variant={variant}
                    size="large"
                    ></lightning-progress-ring>
                </template>
            </div>
            <div if:true={timerWarning} style="font-size:16px;font-weight:700;margin-left:10px;color:#cc3300;">
                {timer}
            </div>
            <div if:false={timerWarning} style="font-size:16px;font-weight:700;margin-left:10px">
                {timer}
            </div>
        </div>
    </div>
    <!-- progress ring end -->

</template>
