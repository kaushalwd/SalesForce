<template>
    <template if:true={hasComments}>
        <lightning-card title="Existing Reviewer Comments">
            <lightning-datatable
                key-field="commentId"
                data={rows}
                columns={columns}
                hide-checkbox-column
                show-row-number-column
                onrowaction={handleRowAction}>
            </lightning-datatable>
        </lightning-card>
    </template>
</template>
