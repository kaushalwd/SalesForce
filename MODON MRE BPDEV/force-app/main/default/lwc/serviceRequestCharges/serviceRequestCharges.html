<template>
    <lightning-card title="Charge" icon-name="custom:custom63">
        <div class="slds-p-around_medium">
            <template if:true={charges}>
                <lightning-datatable
                    key-field="Id"
                    data={charges}
                    columns={columns}
                    hide-checkbox-column="true"
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>
            <template if:true={error}>
                <p class="slds-text-color_error">Error loading charges.</p>
            </template>
        </div>
        <div slot="footer" class="slds-text-align_right">
            <lightning-button label="View All" onclick={handleViewAll}></lightning-button>
        </div>
    </lightning-card>
</template>
