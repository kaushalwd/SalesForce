<template>
    <lightning-card title="Lead Search" icon-name="standard:lead">
        <div class="slds-p-around_medium">

            <!-- Search Bar -->
            <div class="slds-grid slds-gutters slds-align_absolute-center">
                <div class="slds-col slds-size_8-of-12">
                    <lightning-input
                        type="search"
                        label="Lead Number"
                        placeholder="Enter exact Lead Number"
                        value={term}
                        onchange={handleChange}
                        onkeyup={handleKeyUp}
                    ></lightning-input>
                </div>

                <div class="slds-col slds-size_4-of-12 slds-m-top_large">
                    <lightning-button
                        variant="brand"
                        label="Search"
                        onclick={handleSearch}
                        disabled={isSearchDisabled}
                        class="slds-m-right_small"
                    ></lightning-button>

                    <lightning-button
                        variant="neutral"
                        label="Clear"
                        onclick={handleClear}
                        disabled={isLoading}
                    ></lightning-button>
                </div>
            </div>

            <!-- Loader -->
            <template if:true={isLoading}>
                <div class="slds-m-top_medium slds-align_absolute-center">
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </div>
            </template>

            <!-- Result -->
            <template if:true={hasResult}>
                <div class="slds-m-top_large slds-box slds-theme_shade result-card">
                    <p class="slds-text-title_caps slds-text-color_weak">Lead Number</p>
                    <p class="slds-text-heading_medium">{selectedLeadNumber}</p>

                    <div class="slds-m-top_medium">
                        <lightning-icon icon-name={statusIcon} size="small" class="slds-m-right_x-small"></lightning-icon>
                        <span class="slds-text-body_regular">{statusMessage}</span>
                    </div>
                </div>
            </template>

            <!-- No Result -->
            <template if:true={noResults}>
                <div class="slds-m-top_large slds-text-align_center slds-text-color_weak">
                    No Lead found (or not eligible as per admin configuration).
                </div>
            </template>

        </div>
    </lightning-card>
</template>
