<template>
    <lightning-card title="Update Leave Information">
        <div class="slds-grid slds-grid_align-space slds-grid_vertical-align-center">
            <!-- Radio Group -->
            <div>
                <lightning-radio-group
                    options={roleOptions}
                    value=''
                    direction="horizontal"
                    onchange={handleRoleChange}>
                </lightning-radio-group>
            </div>
            
            <!-- Update Leaves Button -->
            <div>
                <lightning-button
                    label="Update Leaves"
                    variant="brand"
                    onclick={openModal}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
    
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Update Leaves</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-wrap">
                       
                        <template if:true={isManagerRole}>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <lightning-input label="Application Type" value="Service Cloud" disabled></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <lightning-combobox label="User" value={selectedUserId} placeholder="Select a User" options={userOptions} onchange={handleUserChange}></lightning-combobox>
                            </div>
                        </template>
                        <template if:true={isUserRole}>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <lightning-input label="Application Type" value="Service Cloud" disabled></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <lightning-input label="User" value={currentUser.Name} disabled></lightning-input>
                            </div>
                        </template>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                            <lightning-input label="From Date" type="date" value={fromDate} onchange={handleFieldChange} disabled={leaveToday}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                            <lightning-input label="To Date" type="date" value={toDate} onchange={handleFieldChange} disabled={leaveToday}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                            <lightning-input type="checkbox" label="Leave Today" checked={leaveToday} onchange={handleCheckboxChange}></lightning-input>
                        </div>

                        <!-- Cancel Leave Checkbox -->
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                            <lightning-input type="checkbox" label="Cancel Leave" checked={cancelLeave} onchange={handleCancelLeaveChange}></lightning-input>
                        </div>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={saveRecord}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
                 
</template>
