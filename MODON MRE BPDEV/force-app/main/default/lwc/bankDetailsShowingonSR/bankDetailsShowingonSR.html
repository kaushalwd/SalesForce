<template>
    <lightning-card title="Bank Details" icon-name="standard:account">

        <template if:true={isLoaded}>

            <div class={containerClass}>

                <!-- NO DATA -->
                <template if:false={hasData}>
                    ❌ No Bank Details found on related Sales Order.
                </template>

                <!-- DATA EXISTS -->
                <template if:true={hasData}>

                    <div>
                        <b>Account Name:</b>
                        <a href={soUrl} target="_blank">
                            {salesOrderName}
                        </a>
                    </div>

                    <div class="slds-m-top_small"><b>Bank Name:</b> {bankName}</div>
                    <div><b>Branch Name:</b> {branchName}</div>
                    <div><b>Bank Country:</b> {bankCountry}</div>

                    <div class="slds-m-top_small"><b>Beneficiary:</b> {beneficiaryName}</div>
                    <div><b>Account No:</b> {accountNumber}</div>
                    <div><b>IBAN:</b> {ibanNumber}</div>
                    <div><b>Swift Code:</b> {swiftCode}</div>

                </template>

            </div>

        </template>

        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_medium">
                Error loading Bank Details
            </div>
        </template>

    </lightning-card>
</template>
