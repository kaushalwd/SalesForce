<template>
    <lightning-card>
        <div class="slds-text-align_center">
            <span style="font-weight:bold; font-size:1rem;">PDC SLA Time </span>
        </div>

        <div class="slds-p-horizontal_medium slds-text-align_center">
            <template if:true={countdown}>
                <div class={timerClass}>
                    <span style="font-size:2rem; font-weight:bold;">
                        {countdown}
                    </span>
                </div>

                <p><strong>PDC SLA End:</strong> {formattedSlaEnd}</p>
                <template if:false={isIsPDCSLAExtensionRequired}>
                    <lightning-button label="Request for SLA Extension" variant="brand" onclick={handlePDCClick}></lightning-button>
                </template>                
            </template>
            <template if:false={countdown}>
                <p>No SLA Data</p>
            </template>
        </div>        
    </lightning-card>
     <!-- ================= MODAL ================= -->
    <template if:true={isModalOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        SLA Extension Request
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea
                        label="Comments"
                        value={comments}
                        onchange={handleCommentChange}
                        required
                        message-when-value-missing="Comments are mandatory">
                    </lightning-textarea>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeModal}>
                    </lightning-button>

                    <lightning-button
                        label="Submit"
                        variant="brand"
                        onclick={submitRequest}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
