<template>
    <!-- Card: not yet published — clickable, opens the wizard -->
    <template if:false={isPublished}>
        <div class="stub-card" onclick={openWizard} role="button" tabindex="0" onkeydown={handleKeydown}>
            <div class="stub-card__body">
                <div class="stub-card__icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 12h16M4 12l4-4M4 12l4 4" stroke="#2F6F6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="18" cy="12" r="2.4" stroke="#2F6F6B" stroke-width="1.6"/>
                    </svg>
                </div>
                <div class="stub-card__text">
                    <h3 class="stub-card__title">Assign agencies</h3>
                    <p class="stub-card__sub">
                        <span class={statusPillClass}></span>{subLabel}
                    </p>
                </div>
            </div>
            <button class="stub-card__cta" onclick={openWizard} title="Assign agencies">Get started</button>
        </div>
    </template>

    <!-- Card: published — informational only, no action needed -->
    <template if:true={isPublished}>
        <div class="stub-card_published">
            <div class="stub-card__badge-row">
                <div class="stub-card__success-badge">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12.5l4.5 4.5L19 7" stroke="#1E7B34" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Published successfully</span>
                </div>
                <template if:true={communicationSent}>
                    <div class="stub-card__email-badge">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="5" width="18" height="14" rx="2" stroke="#2F6F6B" stroke-width="1.6"/>
                            <path d="M4 6.5l8 6 8-6" stroke="#2F6F6B" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                        <span>Email sent</span>
                    </div>
                </template>
            </div>

            <div class="stub-card__published-body">
                <div class="stub-card__published-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3.5" y="5" width="17" height="15" rx="2.5" stroke="#2F6F6B" stroke-width="1.6"/>
                        <path d="M3.5 9.5h17M8 3v3M16 3v3" stroke="#2F6F6B" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </div>

                <div class="stub-card__published-info">
                    <h3 class="stub-card__event-name">{eventName}</h3>
                    <p class="stub-card__event-time">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="8" stroke="#9CA3AF" stroke-width="1.6"/>
                            <path d="M12 8v4l3 2" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        {dateRangeLabel}
                    </p>
                </div>

                <div class="stub-card__timer-block">
                    <span class={timerClass}>{countdownLabel}</span>
                    <template if:true={showProgress}>
                        <div class="stub-card__progress-track">
                            <div class="stub-card__progress-fill" style={progressStyle}></div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- Modal wizard: one self-contained overlay -->
    <template if:true={showWizard}>
        <div class="wizard-overlay">
            <div class="wizard-backdrop" onclick={closeWizard}></div>

            <div class="wizard-card" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="wizard-heading">

                <template if:true={isFinalizing}>
                    <div class="wizard-card__overlay">
                        <lightning-spinner alternative-text={finalizingLabel} size="medium"></lightning-spinner>
                        <p class="wizard-card__overlay-text">{finalizingLabel}</p>
                    </div>
                </template>

                <header class="wizard-header">
                    <button class="wizard-header__close" title="Close" onclick={closeWizard}>
                        <lightning-icon icon-name="utility:close" size="x-small" alternative-text="Close"></lightning-icon>
                    </button>
                    <h2 id="wizard-heading" class="wizard-header__title">Assign agencies</h2>
                    <p class="wizard-header__sub">{eventTypeLabel}</p>
                </header>

                <!-- Path -->
                <div class="wizard-path">
                    <template for:each={steps} for:item="step">
                        <div key={step.key} class={step.pathClass}>{step.label}</div>
                    </template>
                </div>

                <div class="wizard-content">

                    <template if:true={isLoadingContext}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>

                    <!-- STEP 1: Agency mapping -->
                    <template if:true={isAgencyStep}>
                        <div class="filters-row">
                            <lightning-combobox name="typeFilter" label="Agency Type" value={selectedType}
                                options={typeOptions} onchange={handleTypeChange}>
                            </lightning-combobox>

                            <template if:true={showCountryFilter}>
                                <lightning-combobox name="countryFilter" label="Country" value={selectedCountry}
                                    options={bankCountryOptions} onchange={handleCountryChange}>
                                </lightning-combobox>
                            </template>

                            <template if:true={showEmirateFilter}>
                                <lightning-combobox name="emirateFilter" label="Emirate" value={selectedEmirate}
                                    options={emirateOptions} onchange={handleEmirateChange}>
                                </lightning-combobox>
                            </template>

                            <lightning-input type="search" label="Search" placeholder="Search agencies..."
                                value={searchTerm} onchange={handleSearchChange}>
                            </lightning-input>
                        </div>

                        <template if:true={isLoadingAgencies}>
                            <lightning-spinner alternative-text="Loading agencies" size="medium"></lightning-spinner>
                        </template>

                        <template if:false={isLoadingAgencies}>
                            <lightning-dual-listbox name="agencySelector" label="Select agencies" source-label="Available"
                                selected-label="Selected" options={agencyOptions} value={selectedAgencyIds}
                                onchange={handleSelectionChange}>
                            </lightning-dual-listbox>
                        </template>
                    </template>

                    <!-- STEP 2: Communication -->
                    <template if:true={isCommunicationStep}>
                        <div class="comms-toggle">
                            <lightning-input type="toggle" label="Notify agencies by email" checked={sendCommunication}
                                message-toggle-active="On" message-toggle-inactive="Off" onchange={handleSendToggle}>
                            </lightning-input>
                            <p class="comms-toggle__hint">
                                {selectedAgencyIds.length} agencies selected. Turn this on to compose an email now, or skip straight to the next step.
                            </p>
                        </div>

                        <template if:true={sendCommunication}>
                            <lightning-checkbox-group name="brokerTypeFilter" label="Send to" options={brokerTypeOptions}
                                value={selectedBrokerTypes} onchange={handleBrokerTypeChange}>
                            </lightning-checkbox-group>

                            <lightning-input label="Subject" value={emailSubject} required onchange={handleEmailSubjectChange}>
                            </lightning-input>

                            <lightning-combobox name="fromAddress" label="From address" value={selectedFromAddress}
                                options={fromAddressOptions} onchange={handleFromAddressChange} required>
                            </lightning-combobox>

                            <lightning-input label="CC" value={emailCC} onchange={handleEmailCCChange}
                                placeholder="email1@example.com, email2@example.com">
                            </lightning-input>

                            <lightning-input label="BCC" value={emailBCC} onchange={handleEmailBCCChange}
                                placeholder="email1@example.com, email2@example.com">
                            </lightning-input>

                            <label class="slds-form-element__label">Message</label>
                            <lightning-input-rich-text value={emailBody} onchange={handleEmailBodyChange}>
                            </lightning-input-rich-text>

                            <div class="attachments">
                                <span class="slds-form-element__label">Attachments</span>
                                <div class="attachments__uploader" onclick={handleUploaderClick}>
                                    <input type="file" class="file-input" onchange={handleFileUpload} multiple
                                        accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.jpg,.jpeg,.png,.gif,.csv">
                                    <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                    <span>Click to upload &bull; Max 10 files, 10MB each</span>
                                </div>
                                <template if:true={uploadedFiles.length}>
                                    <ul class="attachments__list">
                                        <template for:each={uploadedFiles} for:item="file">
                                            <li key={file.id} class="attachments__item">
                                                <span class="attachments__name">{file.name}</span>
                                                <span class={file.statusBadgeClass}>{file.statusBadgeLabel}</span>
                                                <button data-id={file.id} onclick={handleRemoveFile} title="Remove">
                                                    <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                                </button>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                            </div>
                        </template>
                    </template>

                    <!-- STEP 3: Approval or Publish, depending on event type -->
                    <template if:true={isFinalStep}>
                        <div class="summary">
                            <h3 class="summary__title">{finalStepTitle}</h3>
                            <p class="summary__row">{selectedAgencyIds.length} agencies will be assigned to this event.</p>
                            <p class="summary__row">
                                <template if:true={sendCommunication}>An email will be sent once you confirm.</template>
                                <template if:false={sendCommunication}>No email will be sent.</template>
                            </p>
                            <p class="summary__hint">{finalStepHint}</p>
                        </div>
                    </template>

                </div>

                <footer class="wizard-footer">
                    <lightning-button label="Back" variant="neutral" onclick={handleBack} disabled={isFirstStep}>
                    </lightning-button>
                    <div class="wizard-footer__right">
                        <lightning-button label="Cancel" variant="neutral" onclick={closeWizard}></lightning-button>
                        <template if:false={isFinalStep}>
                            <lightning-button label="Next" variant="brand" onclick={handleNext} disabled={isNextDisabled}>
                            </lightning-button>
                        </template>
                        <template if:true={isFinalStep}>
                            <lightning-button label={finalActionLabel} variant="brand" onclick={handleFinalize}
                                disabled={isFinalizing}>
                            </lightning-button>
                        </template>
                    </div>
                </footer>
            </div>
        </div>
    </template>
</template>
