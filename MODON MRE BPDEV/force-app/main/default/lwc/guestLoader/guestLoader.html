<template>
  <template if:true={isLoading}>
    <div class="overlay" role="status" aria-live="polite" aria-label={ariaLabel}>
      <div class="loader-card" part="card">
        <!-- optional logo slot / fallback to logoUrl -->
        <div class="logo-wrap">
          <slot name="logo">
            <template if:true={logoUrl}>
              <img src={logoUrl} alt="Logo" class="logo" />
            </template>
          </slot>
        </div>

        <!-- main animated spinner -->
        <div class="spinner" aria-hidden="true">
          <div class="ring"></div>
          <div class="dots">
            <span class="dot" style="--i:0"></span>
            <span class="dot" style="--i:1"></span>
            <span class="dot" style="--i:2"></span>
            <span class="dot" style="--i:3"></span>
          </div>
        </div>

        <!-- messages -->
        <div class="message" dir={dir}>{message}</div>
        <template if:true={subMessage}>
          <div class="submessage" dir={dir}>{subMessage}</div>
        </template>

        <!-- optional warning slot, renders nothing if not provided -->
        <slot name="warning"></slot>
      </div>
    </div>
  </template>
</template>
