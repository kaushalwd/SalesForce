<template>
    <div class="sr-summary-container">
        <div class="sr-summary-header">SR Summary</div>

        <div class="sr-summary-card total"  data-type="total"
             onclick={handleCardClick}>
            <div class="label">Total SR</div>
            <div class="value">{totalSR}</div>
        </div>

        <div class="sr-summary-card open" data-type="open"
             onclick={handleCardClick}>
            <div class="label">Open SR</div>
            <div class="value">{openSR}</div>
        </div>

        <div class="sr-summary-card closed" data-type="closed"
             onclick={handleCardClick}>
            <div class="label">Closed SR</div>
            <div class="value">{closedSR}</div>
        </div>

        <div class="sr-summary-card breached" data-type="breached"
             onclick={handleCardClick}>
            <div class="label">SR Breached Cases</div>
            <div class="value">{breachedSR}</div>
        </div>
    </div>
</template>
