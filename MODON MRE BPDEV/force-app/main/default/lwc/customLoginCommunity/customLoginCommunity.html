<template> 
    <c-custom-toast></c-custom-toast>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="large" variant="brand"></lightning-spinner>
    </template>
    <template if:false={isMobile}>
        <header class="header slds-grid slds-grid_align-spread slds-p-around_medium slds-box">
        <div class="slds-col">
        <img src={logowhiteUrl} onclick={homepage} class="logo" alt="Modon Logo" />
        </div>
        </header>
        <br />
        </template>
        <template if:true={isMobile}>
        <header class=" slds-box slds-theme_shade slds-p-around_small slds-text-align_center" style="background-color: black;">
        <div>
        <img src={logowhiteUrl} class="logo-mobile" onclick={homepage} alt="Modon Logo" />
        </div>
        </header>
        <br />
        </template>
    <template if:true={signup}>
        <c-signup onsignup={handleSignUpFromChild}></c-signup>
    </template>
    <template if:false={signup}>
    <div class="login-container">
        <div class="login-box company-font-text"> 
            <div class="info-card">
                <div class="logo-container">
                  <img src={logoUrl} alt="Modon Logo" class="logo"/>
                </div>
                <h2>Customer Portal</h2>
                <p class="description company-font-text">Welcome</p>
                <p class="description company-font-text">
                  Sign in with your registered email and password.
                </p>
            </div>

            <div class="login-card company-font-text">
                <lightning-input type="email" label="Email" placeholder="Enter your email" value={email} onchange={handleChange}></lightning-input>
                <lightning-input type="password" label="Password" placeholder="********" value={password} onchange={handleChange}></lightning-input>

                <div class="options company-font-text">
                    <br/>
                    <a href="#" onclick={handleFogotPassword}>Forgot password</a>
                </div>

                <div class="button-container company-font-text">
                    <lightning-button class="full-width-button" variant="brand" label="Sign in" onclick={handleLogin}></lightning-button>
                </div>

                <template if:true={errorCheck}>
                    <div class="error slds-var-p-around_x-small slds-var-p-top_small company-font-text" role="alert">
                        <span>{errorMessage}</span>
                    </div>
                </template>
                <div class="signup company-font-text">
                    Don't have an account yet?&nbsp; <span onclick={handlesignup} class="signBtn">Sign up</span>
                 </div>
            </div>
        </div>
    </div>
    </template>
    <footer class="footer">
        <p style="float:left">© Modon 2025 — All rights reserved</p>
        <div class="slds-grid slds-wrap slds-text-body_small">
      
          <div class="slds-col slds-size_1-of-6 slds-p-around_x-small slds-text-color_inverse ">
              <img src={instagramUrl} alt="Instagram" class="slds-icon" onclick={handleinstagram} />
          </div>
          <div class="slds-col slds-size_1-of-6 slds-p-around_x-small slds-text-color_inverse ">
              <img src={youtubeiconUrl} alt="Youtube" class="slds-icon" onclick={handleyoutube}/>
          </div>
          <div class="slds-col slds-size_1-of-6 slds-p-around_x-small slds-text-color_inverse ">
              <img src={linkediniconUrl} alt="Ln" class="slds-icon" onclick={handlelinkedin}/>
          </div>
          <div class="slds-col slds-size_1-of-6 slds-p-around_x-small slds-text-color_inverse ">
              <img src={facebookUrl} alt="Facebook" class="slds-icon" onclick={handlefacebook}/>
          </div>
          <div class="slds-col slds-size_1-of-6 slds-p-around_x-small slds-text-color_inverse ">
              <img src={twitterxUrl} alt="X" class="slds-icon" onclick={handletwitterx}/>
          </div>
 
      </div>
    </footer>
</template>
