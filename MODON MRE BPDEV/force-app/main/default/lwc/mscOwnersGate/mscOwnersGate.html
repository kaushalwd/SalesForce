<template>
    <template lwc:if={open}>
        <!-- The layer is the click target; the panel stops the event. Same
             arrangement as c/mscComplianceCheck and c/mscDrawer. -->
        <div class="og__layer" onclick={handleScrim}>
            <div class="og__scrim"></div>

            <section
                class="og__panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="og-title"
                onclick={stop}
                onkeydown={handleKeydown}
            >
                <div class="og__body">
                    <span class="eyebrow og__eyebrow">
                        <span class="eyebrow__dot"></span>
                        <span class="eyebrow__label">{labels.JO_GATE_EYEBROW}</span>
                    </span>
                    <h2 id="og-title" class="og__title">{title}</h2>
                    <p class="og__units">{unitList}</p>
                    <p class="og__body-text">{bodyText}</p>
                </div>

                <div class="og__foot">
                    <button class="pill og__sm" type="button" onclick={handleAdd}>
                        {labels.JO_GATE_ADD}
                    </button>
                    <!-- The confirming button states the CLAIM rather than saying OK.
                         A rep who reads it and it is not true will stop. -->
                    <button class="pill og__go" type="button" onclick={handleConfirm}>
                        {confirmText}
                    </button>
                </div>
            </section>
        </div>
    </template>
</template>
