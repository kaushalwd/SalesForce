<template>

    <div class="payment-plan-container">

        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Checking"
                size="medium">
            </lightning-spinner>
        </template>

        <!-- Existing Employee Payment Plan Process -->
        <template if:true={isProcessInProgress}>

            <div class="message-container warning">

                <lightning-icon
                    icon-name="utility:warning"
                    size="small"
                    alternative-text="Warning">
                </lightning-icon>

                <div class="message-content">
                    

                    <p> <b>
                        An Employee Payment Plan is already submitted for this Sales Order.</b>
                    </p>
                </div>

            </div>

        </template>


        <!-- No existing process -->
        <template if:false={isProcessInProgress}>

            <template if:true={isChecked}>

                <div class="confirmation-container">

                    <div class="confirmation-content">


                        <h1> <b>
                            Do you want to submit a request to change the Employee Payment Plan? </b>
                        </h1>

                    </div>

                </div>

                <div class="action-container">

                    <lightning-button
                        label="Submit Change Request"
                        variant="brand"
                        icon-name="utility:send"
                        icon-position="right"
                        disabled={isLoading}
                        onclick={handleSubmit}>
                    </lightning-button>

                </div>

            </template>

        </template>

    </div>

</template>
