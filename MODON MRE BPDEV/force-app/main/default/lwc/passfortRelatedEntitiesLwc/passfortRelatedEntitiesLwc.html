<template>
    <lightning-card>
        <h3 slot="title">
            <lightning-icon icon-name="standard:event" 
                            size="small">
            </lightning-icon>
            &nbsp;&nbsp;
            Compliance details ({noOfRecords})
            &nbsp;
            <lightning-icon icon-name="utility:target" 
                            size="small" 
                            variant={variantColor} 
                            title="Approval Status">
            </lightning-icon>
        </h3>
        <div class="slds-box slds-m-around_small">
            <template for:each={records} for:item="data">
                <div key={data.Id} class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_10-of-12">
                        <span>
                            <p>
                                <b>Entity Name : {data.Name}</b>
                            </p>
                            <p>
                                Risk Status : {data.RiskStatus}
                                &nbsp;
                                <lightning-icon icon-name={data.RiskIconName} 
                                                size="xx-small" 
                                                variant={data.RiskVariantColor} 
                                                title="Approval Status">
                                </lightning-icon></p>
                            </p>
                            <p>
                                Approval Status : {data.ApprovalStatus}
                                &nbsp;
                                <lightning-icon icon-name={data.ApprovalIconName} 
                                                size="xx-small" 
                                                variant={data.ApprovalVariantColor} 
                                                title="Approval Status">
                                </lightning-icon>
                            </p>
                            <p>
                                Comment : &nbsp;
                                <lightning-formatted-rich-text
                                    value={data.passfortComment}
                                ></lightning-formatted-rich-text>
                            </p>
                            &nbsp;
                        </span>
                    </div>
                    <div class="slds-col slds-size_2-of-12 slds-float_right">
                        <div class="slds-p-around_medium lgc-bg">
                            <lightning-button-menu alternative-text="Button menu" 
                                                   icon-size="small" 
                                                   onclick={handleButtonMenuAction}
                                                >
                                <lightning-menu-item id={data.Id} 
                                                     value={data} 
                                                     label="Edit">
                                </lightning-menu-item>
                            </lightning-button-menu>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
