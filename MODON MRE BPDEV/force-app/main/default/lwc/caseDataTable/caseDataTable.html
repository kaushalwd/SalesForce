<template>
    <lightning-card title="Case Info">
        
        <template if:true={pageData}>
            <lightning-datatable
                key-field="caseId"
                data={pageData}
                columns={columns}
                onsort={handleSort}
                sorted-by={sortedBy}
                sorted-direction={sortedDirection}
                hide-checkbox-column
            ></lightning-datatable>
        </template>
        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_medium">{error}</div>
        </template>

        <!-- Pagination Controls -->
        <div class="slds-m-around_medium slds-text-align_center">
            <lightning-button
                label="Previous"
                onclick={handlePrevious}
                disabled={isPreviousDisabled}
                class="slds-m-right_small"
            ></lightning-button>
            <span>Page {currentPage} of {totalPages}</span>
            <lightning-button
                label="Next"
                onclick={handleNext}
                disabled={isNextDisabled}
                class="slds-m-left_small"
            ></lightning-button>
        </div>
    </lightning-card>
</template>
