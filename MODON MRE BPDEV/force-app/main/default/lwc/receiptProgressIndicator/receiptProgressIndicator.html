<template>
  <div class="slds-box slds-theme_default">

    <div class="slds-path">
      <div class="slds-grid slds-path__track">
        <div class="slds-grid slds-path__scroller-container">
          <div class="slds-path__scroller">
            <div class="slds-path__scroller_inner">
              <ul class="slds-path__nav"
                role="listbox"
                aria-orientation="horizontal"
                data-path="status">
                <template for:each={displayStatuses} for:item="step" for:index="idx">
                  <li key={step.label}
                    class={step.className}
                    role="presentation"
                    data-path="status"
                    data-label={step.label}
                    onmouseenter={handleStageMouseEnter}
                    onmouseleave={handleStageMouseLeave}
                    onclick={handleStatusClick}>
                    <a role="option" tabindex="0" class="slds-path__link" title={step.label}>
                      <span class="slds-path__stage">
                        <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                          <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#check"></use>
                        </svg>
                      </span>
                      <template if:true={step.isComplete}>
                        <div style={statusStageWidthStyle}>
                          <p style={statusLabelStyle}>{step.label}</p>
                        </div>
                      </template>
                      <template if:false={step.isComplete}>
                        <span class={step.textClass}>{step.label}</span>
                      </template>
                    </a>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
</div>
</template>
