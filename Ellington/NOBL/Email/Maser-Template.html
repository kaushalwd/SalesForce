<!DOCTYPE html>
<html>
  <head>
    <title>Ellington Properties</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://use.typekit.net/wji4wrf.css" />
    <!--meta name="viewport" content="width=device-width" / -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <meta name="theme-color" content="#7F867A" />
    <meta name="color-scheme" content="light" />
    <style type="text/css">
      /*
************************
DARKMODE SWITCH
************************
*/
      :root {
        color-scheme: light dark;
        supported-color-schemes: light dark;
      }

      @media (prefers-color-scheme: dark) {
        .lightimage {
          display: none !important;
        }

        .darkimageWrapper,
        .darkimage {
          display: block !important;
        }
      }

      @media all and (max-width: 650px) {
        .desktopview {
          display: none !important;
        }

        .mobileviewdiv,
        .mobileviewimg {
          display: block !important;
        }
      }

      /*
        
        
  
************************
DARKMODE SWITCH
************************
*/
      table {
        border-spacing: 0;
      }

      div,
      p,
      a,
      li,
      th {
        -webkit-text-size-adjust: none;
      }

      /* CLIENT-SPECIFIC STYLES */
      body,
      table,
      th,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      table,
      th {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }

      /* RESET STYLES */
      table {
        border-collapse: collapse !important;
      }

      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }

      /* iOS BLUE LINKS */
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
        font-size: inherit !important;
        font-family: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
      }

      /* ANDROID CENTER FIX */
      div[style*="margin: 16px 0;"] {
        margin: 0 !important;
      }

      /* MEDIA QUERIES */
      @media all and (max-width: 650px) {
        .text-block {
          /* margin: 10px auto 0 !important;*/
          display: block !important;
          width: auto !important;
        }

        .mob-center {
          text-align: center !important;
        }

        .mob-font {
          font-size: 19px !important;
          text-align: center !important;
          margin-top: 20px !important;
          line-height: 25px !important;
        }

        .wrapper {
          width: 100%;
          border: 0px !important;
        }

        .email-wrapper {
          background: #fff;
        }

        .header img {
          width: 100%;
        }

        .content-block th {
          display: block !important;
          width: 100% !important;
        }

        .footer th {
          display: block !important;
          margin: 3px !important;
          font-size: 13px !important;
          text-align: center !important;
          width: 100%;
        }

        .footer {
          width: 100% !important;
          text-align: center !important;
          margin: 10px 0 !important;
          height: auto !important;
        }

        .social-media-icon img {
          width: 20px !important;
          padding: 0 5px;
        }

        .social-media-icon th {
          padding: 0px;
        }

        *[class="small-font"] {
          line-height: 15px !important;
        }

        .logo-mobile img {
          width: 220px !important;
        }

        *[class="desktop-semi-footer"],
        *[class="logo-desktop"] {
          display: none !important;
        }

        *[class="mobile-semi-footer"],
        *[class="logo-mobile"] {
          overflow: visible !important;
          float: none !important;
          display: block !important;
          line-height: 100% !important;
        }

        .nnja {
          display: none;
        }

        .inblock {
          display: inline-block;
        }

        .mobilecenter {
          text-align: center !important;
        }

        .mobileleft {
          text-align: left !important;
        }

        /*.table-des-1 { background: #4C3733}*/
        .table-des-1 {
          width: 95% !important;
        }

        .table-des-1 th {
          display: block !important;
          width: 95% !important;
          margin: auto;
          text-align: center !important;
        }

        .tdblock th {
          display: block !important;
          width: 90% !important;
          margin: auto;
          text-align: center !important;
          padding: 0 0 20px 0 !important;
        }

        .heading {
          display: block !important;
        }

        .noborder {
          border: 0px !important;
        }

        .dsktp-block {
          display: unset !important;
        }

        .w90 {
          width: 90% !important;
          margin: auto;
        }

        .fs-20 {
          font-size: 20px !important;
        }

        .to100 {
          width: 95%;
        }
      }
    </style>
  </head>

  <body
    bgcolor="white"
    leftmargin="0"
    topmargin="0"
    marginwidth="0"
    marginheight="0"
  >
    <!-- EMAIL WRAPPER -->
    <custom name="opencounter" type="tracking"/>
    <table bgcolor="white" class="email-wrapper" width="100%" cellpadding="0">
      <tr>
        <td align="center">
          <table cellpadding="0" cellspacing="0" border="0" style="border-spacing: 0; width: 600px; margin:0px; padding:0px;">
            <tr>
              <td valign="middle" align="center" style="text-size-adjust: none; border-collapse: collapse; font-weight: normal; font-size: 11px; color: rgb(77, 77, 77); padding:20px 0px;">
                <a href="%%view_email_url%%" target="_blank" style="text-size-adjust: none; color: rgb(77, 77, 77); text-decoration: none;font-family: 'acumin-pro', sans-serif;"><span style="color: rgb(77, 77, 77); text-decoration: none; ">View online</span></a>
              </td>
            </tr>
          </table>
          <table cellpadding="0" cellspacing="0" border="0" role="presentation" bgcolor="#faf8f5" style="background-color: white; border-spacing: 0; width: 600px; margin:0px; padding:0px;" >
            <tr>
              <td valign="top">
                <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="margin:0px; padding:0px;">
                  <div data-type="slot" data-key="xzcrglavpxf" data-label="Drop blocks or content here">
                    
                  </div>
                  <div data-type="slot" data-key="cwel9ace82j" data-label="Drop blocks or content here"></div>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    <!-- END EMAIL WRAPPER -->
  </body>
</html>
