<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-color: #f0f4f9;
    --card-bg: #ffffff;
    --card-border: #e2e8f0;
    --primary-orange: #ff6b00;
    --hover-orange: #ea580c;
    --text-dark: #1e293b;
    --text-muted: #64748b;
    --required: #e53e3e;
    --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-dark);
    margin: 0;
    padding: 20px 12px;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 780px;
  }

  /* Shared Header Card */
  .header-card {
    background: linear-gradient(135deg, #ffffff 0%, #fff7ed 100%);
    border-radius: 16px;
    border: 1px solid #ffedd5;
    border-left: 8px solid var(--primary-orange);
    padding: 20px 24px;
    margin-bottom: 20px;
    box-shadow: var(--card-shadow);
  }

  .header-card h2 {
    font-family: 'Outfit', sans-serif;
    margin: 0 0 4px 0;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary-orange);
  }

  .header-card p {
    margin: 0 0 12px 0;
    font-size: 14px;
    color: var(--text-muted);
  }

  /* Navigation Bar inside Header */
  .nav-tabs {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap
  }

  .nav-btn {
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #fed7aa;
    background-color: #ffffff;
    color: var(--primary-orange);
    transition: all 0.2s ease;
  }

  .nav-btn:hover, .nav-btn.active {
    background-color: var(--primary-orange);
    color: #ffffff;
  }

  /* General Cards */
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--card-border);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--card-shadow);
  }

  /* Form Elements Styling */
  .form-group label {
    display: block;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-dark);
  }

  .required-asterisk {
    color: var(--required);
  }

  input[type="text"],
  input[type="number"],
  input[type="date"],
  input[type="url"],
  textarea,
  select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 14px;
    background-color: #ffffff;
    outline: none;
    transition: all 0.2s ease-in-out;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--primary-orange);
    box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
  }

  textarea {
    resize: vertical;
    min-height: 70px;
    white-space: pre-line;
  }

  .responsive-row {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  @media (min-width: 600px) {
    .responsive-row {
      flex-direction: row;
    }
    .responsive-row > div {
      flex: 1;
    }
  }
  

  .prasad-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px dashed #e2e8f0;
  }

  .prasad-row:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .prasad-row-title {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--primary-orange);
  }

  .title-box {
    margin-top: 10px;
    padding: 10px 14px;
    background-color: #fff7ed;
    border: 1px dashed var(--primary-orange);
    border-radius: 8px;
    font-size: 14px;
    color: #9a3412;
    display: none;
  }

  .duration-group {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .duration-group input {
    text-align: center;
  }

  .photo-preview-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 10px;
  }

  .photo-thumb {
    width: 100%;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
  }

  .btn-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }

  .btn-submit {
    background-color: var(--primary-orange);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .btn-submit:hover {
    background-color: var(--hover-orange);
  }

  .btn-clear {
    background: none;
    border: none;
    color: var(--primary-orange);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }

  #statusMessage {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    font-weight: 500;
  }
  .status-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .status-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .page-loader-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-color);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.3s ease;
}
.page-loader-spinner {
  width: 42px;
  height: 42px;
  border: 4px solid #ffedd5;
  border-top-color: var(--primary-orange);
  border-radius: 50%;
  animation: page-spin 0.8s linear infinite;
}
.page-loader-text {
  margin-top: 14px;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  color: var(--text-muted);
  font-size: 14px;
  text-align: center;
  padding: 0 20px;
}
@keyframes page-spin { to { transform: rotate(360deg); } }
.page-loader-overlay.hide { opacity: 0; pointer-events: none; }
</style>
