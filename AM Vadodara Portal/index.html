<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>
<body>

<div class="container">
  
  <?!= include('Header', {page: 'index'}); ?>

  <form id="sabhaForm">

    <!-- Date & Haribhakto Count -->
    <div class="card">
      <div class="responsive-row" style="margin-bottom: 12px;">
        <div class="form-group">
          <label>Date <span class="required-asterisk">*</span></label>
          <input type="date" id="sabhaDate" name="date" required>
        </div>
      </div>
      
      <div class="form-group" style="margin-bottom: 0;">
        <label>Total Haribhakto <span class="required-asterisk">*</span></label>
        <div class="responsive-row">
          <div>
            <input type="number" name="maleBhaktos" placeholder="Male Count" min="0" required>
          </div>
          <div>
            <input type="number" name="femaleBhaktos" placeholder="Female Count" min="0" required>
          </div>
        </div>
      </div>
    </div>

    <!-- Special Event (Theme) -->
    <div class="card">
      <div class="form-group">
        <label>Special event (Theme) <span class="required-asterisk">*</span></label>
        <input type="text" name="specialEvent" placeholder="Your answer" required>
      </div>
    </div>

    <!-- Kirtans -->
    <div class="card">
      <div class="form-group">
        <label>Kirtans</label>
        <textarea name="kirtans" placeholder="Your answer"></textarea>
      </div>
    </div>

    <!-- Vachanamrut -->
    <div class="card">
      <div class="form-group">
        <label>Vachanamrut</label>
        <div class="responsive-row">
          <div>
            <select id="vachChapter" name="vachChapter">
              <option value="">Select Chapter</option>
            </select>
          </div>
          <div>
            <select id="vachNumber" name="vachNumber" disabled>
              <option value="">Select Number</option>
            </select>
          </div>
        </div>
        <div id="vachTitleBox" class="title-box">
          <strong>Title:</strong> <span id="vachTitleText"></span>
        </div>
      </div>
    </div>

    <!-- Swami Ni Vato -->
    <div class="card">
      <div class="form-group">
        <label>Swami ni vato</label>
        <div class="responsive-row">
          <div style="flex: 2;">
            <select name="swamiPrakaran">
              <option value="">Select Prakaran</option>
              <option value="પ્રકરણ ૧ - ભગવાન અને સંતનો મહિમા">પ્રકરણ ૧ - ભગવાન અને સંતનો મહિમા</option>
              <option value="પ્રકરણ ૨ - સંતસમાગમ">પ્રકરણ ૨ - સંતસમાગમ</option>
              <option value="પ્રકરણ ૩ - સર્વોપરી નિશ્ચય અને માહાત્મ્ય">પ્રકરણ ૩ - સર્વોપરી નિશ્ચય અને માહાત્મ્ય</option>
              <option value="પ્રકરણ ૪ - સ્વરૂપનિષ્ઠાની રસ્તાની વાતો">પ્રકરણ ૪ - સ્વરૂપનિષ્ઠાની રસ્તાની વાતો</option>
              <option value="પ્રકરણ ૫ - મહિમા અને કૃતાર્થપણું">પ્રકરણ ૫ - મહિમા અને કૃતાર્થપણું</option>
              <option value="પ્રકરણ ૬ - સર્વદેશી સમજણ">પ્રકરણ ૬ - સર્વદેશી સમજણ</option>
              <option value="પ્રકરણ ૭ - ભગવાનનું અસાધારણ એશ્વર્ય">પ્રકરણ ૭ - ભગવાનનું અસાધારણ એશ્વર્ય</option>
            </select>
          </div>
          <div style="flex: 1;">
            <input type="text" name="swamiVatNo" placeholder="Vat No(s). (e.g. 12, 15)">
          </div>
        </div>
      </div>
    </div>

    <!-- Other Readings -->
    <div class="card">
      <div class="form-group">
        <label>Other readings</label>
        <textarea name="otherReadings" placeholder="Your answer"></textarea>
      </div>
    </div>

    <!-- Combined Prasad Section -->
    <div class="card">
      <div class="form-group">
        <label style="font-size: 15px; border-bottom: 2px solid var(--primary-orange); padding-bottom: 4px; margin-bottom: 12px; display: inline-block;">
          Prasad & Refreshments
        </label>
        
        <div class="prasad-row">
          <div class="prasad-row-title">Prasad</div>
          <div class="responsive-row">
            <div><input type="text" name="prasadItem" placeholder="Prasad Item"></div>
            <div><input type="text" name="prasadSewa" placeholder="Sewa From"></div>
          </div>
        </div>

        <div class="prasad-row">
          <div class="prasad-row-title">Alpahar</div>
          <div class="responsive-row">
            <div><input type="text" name="alpaharItem" placeholder="Alpahar Item"></div>
            <div><input type="text" name="alpaharSewa" placeholder="Sewa From"></div>
          </div>
        </div>

        <div class="prasad-row">
          <div class="prasad-row-title">Mahaprasad</div>
          <div class="responsive-row">
            <div><input type="text" name="mahaprasadItem" placeholder="Mahaprasad Item"></div>
            <div><input type="text" name="mahaprasadSewa" placeholder="Sewa From"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- Santo -->
    <div class="card">
      <div class="form-group">
        <label>Santo</label>
        <textarea name="santo" placeholder="Your answer"></textarea>
      </div>
    </div>

    <!-- Guest -->
    <div class="card">
      <div class="form-group">
        <label>Guest</label>
        <textarea name="guest" placeholder="Your answer"></textarea>
      </div>
    </div>

    <!-- Special Announcement -->
    <div class="card">
      <div class="form-group">
        <label>Special announcement <span class="required-asterisk">*</span></label>
        <textarea name="specialAnnouncement" placeholder="Your answer" required></textarea>
      </div>
    </div>

    <!-- Duration of Sabha -->
    <div class="card">
      <div class="form-group">
        <label>Duration of sabha</label>
        <div class="duration-group">
          <input type="number" name="durationHr" placeholder="Hr" min="0" max="23"> :
          <input type="number" name="durationMin" placeholder="Min" min="0" max="59"> :
          <input type="number" name="durationSec" placeholder="Sec" min="0" max="59">
        </div>
      </div>
    </div>

    <!-- Important Takeaways -->
    <div class="card">
      <div class="form-group">
        <label>Important takeaways from speakers <span class="required-asterisk">*</span></label>
        <textarea name="importantTakeaways" placeholder="Your answer" required style="min-height: 100px;"></textarea>
      </div>
    </div>

    <!-- Media Link -->
    <div class="card">
      <div class="form-group">
        <label>Sabha Media Link (Google Photos / YouTube)</label>
        <input type="url" name="mediaLink" placeholder="https://photos.app.goo.gl/... or https://youtu.be/...">
      </div>
    </div>

    <!-- Photo Upload (Up to 4 Photos) -->
    <div class="card">
      <div class="form-group">
        <label>Upload Sabha Photos (Max 4 Photos)</label>
        <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotoSelect(event)">
        <small style="color: var(--text-muted); display:block; margin-top:4px;">You can select up to 4 photos to show directly in report.</small>
        <div id="photoPreview" class="photo-preview-grid"></div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="btn-container">
      <button type="submit" class="btn-submit" id="submitBtn">Submit Report</button>
      <button type="reset" class="btn-clear" onclick="resetVachFields()">Clear form</button>
    </div>

  </form>

  <div id="statusMessage"></div>
</div>

<script>
  let masterData = [];
  let selectedPhotosBase64 = [];

  window.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('sabhaDate').setAttribute('max', today);

    const chapterSelect = document.getElementById('vachChapter');
    chapterSelect.innerHTML = '<option value="">Loading Chapters...</option>';

    google.script.run
      .withSuccessHandler(data => {
        masterData = data;
        if (!data || data.length === 0) {
          chapterSelect.innerHTML = '<option value="">No data found in sheet</option>';
          return;
        }
        populateChapters();
      })
      .withFailureHandler(err => {
        chapterSelect.innerHTML = '<option value="">Error loading data</option>';
        alert("Failed to load Vachanamrut Data:\n" + err.message);
      })
      .getVachanamrutMasterData();
  });

  function handlePhotoSelect(event) {
    const files = Array.from(event.target.files).slice(0, 4);
    selectedPhotosBase64 = [];
    const previewContainer = document.getElementById('photoPreview');
    previewContainer.innerHTML = '';

    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = function(e) {
        selectedPhotosBase64.push({
          base64: e.target.result,
          mimeType: file.type
        });
        const img = document.createElement('img');
        img.src = e.target.result;
        img.className = 'photo-thumb';
        previewContainer.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }

  function populateChapters() {
    const chapterSelect = document.getElementById('vachChapter');
    const chapters = [...new Set(masterData.map(item => String(item[0]).trim()))].filter(Boolean);
    
    chapterSelect.innerHTML = '<option value="">Select Chapter</option>';
    chapters.forEach(chap => {
      const option = document.createElement('option');
      option.value = chap;
      option.textContent = chap;
      chapterSelect.appendChild(option);
    });
  }

  document.getElementById('vachChapter').addEventListener('change', function() {
    const selectedChapter = this.value;
    const numberSelect = document.getElementById('vachNumber');
    const titleBox = document.getElementById('vachTitleBox');
    
    numberSelect.innerHTML = '<option value="">Select Number</option>';
    titleBox.style.display = 'none';

    if (!selectedChapter) {
      numberSelect.disabled = true;
      return;
    }

    const filteredNumbers = masterData.filter(item => String(item[0]).trim() === selectedChapter);
    filteredNumbers.forEach(item => {
      const option = document.createElement('option');
      option.value = item[1];
      option.textContent = item[1];
      numberSelect.appendChild(option);
    });

    numberSelect.disabled = false;
  });

  document.getElementById('vachNumber').addEventListener('change', function() {
    const selectedChapter = document.getElementById('vachChapter').value;
    const selectedNumber = this.value;
    const titleBox = document.getElementById('vachTitleBox');
    const titleText = document.getElementById('vachTitleText');

    if (!selectedNumber) {
      titleBox.style.display = 'none';
      return;
    }

    const match = masterData.find(item => 
      String(item[0]).trim() === selectedChapter && String(item[1]).trim() === String(selectedNumber).trim()
    );
    
    if (match && match[2]) {
      titleText.textContent = match[2];
      titleBox.style.display = 'block';
    } else {
      titleBox.style.display = 'none';
    }
  });

  function resetVachFields() {
    document.getElementById('vachNumber').disabled = true;
    document.getElementById('vachTitleBox').style.display = 'none';
    document.getElementById('photoPreview').innerHTML = '';
    selectedPhotosBase64 = [];
  }

  document.getElementById('sabhaForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    const selectedDate = new Date(this.date.value);
    const todayDate = new Date();
    todayDate.setHours(23, 59, 59, 999);

    if (selectedDate > todayDate) {
      alert("Sabha Date cannot be in the future!");
      return;
    }
    
    submitBtn.disabled = true;
    statusMsg.style.display = 'none';

    // 1. Upload Photos One-by-One First
    const uploadedUrls = [];
    if (selectedPhotosBase64.length > 0) {
      for (let i = 0; i < selectedPhotosBase64.length; i++) {
        submitBtn.innerText = `Uploading Photo ${i + 1} of ${selectedPhotosBase64.length}...`;
        try {
          const photoUrl = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(url => resolve(url))
              .withFailureHandler(err => reject(err))
              .uploadSinglePhoto(selectedPhotosBase64[i], this.date.value, i);
          });
          if (photoUrl) uploadedUrls.push(photoUrl);
        } catch (err) {
          alert(`Error uploading photo ${i + 1}: ` + err.message);
          submitBtn.disabled = false;
          submitBtn.innerText = 'Submit Report';
          return;
        }
      }
    }

    // 2. Now Submit Form Data
    submitBtn.innerText = 'Saving Report...';

    const selectedChap = document.getElementById('vachChapter').value;
    const selectedNum = document.getElementById('vachNumber').value;
    let selectedTitle = '';
    
    if (selectedChap && selectedNum) {
      const match = masterData.find(item => 
        String(item[0]).trim() === selectedChap && String(item[1]).trim() === String(selectedNum).trim()
      );
      if (match) selectedTitle = match[2];
    }

    const formData = {
      date: this.date.value,
      maleBhaktos: this.maleBhaktos.value || '0',
      femaleBhaktos: this.femaleBhaktos.value || '0',
      specialEvent: this.specialEvent.value,
      kirtans: this.kirtans.value,
      vachChapter: selectedChap,
      vachNumber: selectedNum,
      vachTitle: selectedTitle,
      swamiPrakaran: this.swamiPrakaran.value,
      swamiVatNo: this.swamiVatNo.value,
      otherReadings: this.otherReadings.value,
      prasadItem: this.prasadItem.value,
      prasadSewa: this.prasadSewa.value,
      alpaharItem: this.alpaharItem.value,
      alpaharSewa: this.alpaharSewa.value,
      mahaprasadItem: this.mahaprasadItem.value,
      mahaprasadSewa: this.mahaprasadSewa.value,
      santo: this.santo.value,
      guest: this.guest.value,
      specialAnnouncement: this.specialAnnouncement.value,
      durationHr: this.durationHr.value || '0',
      durationMin: this.durationMin.value || '0',
      durationSec: this.durationSec.value || '0',
      importantTakeaways: this.importantTakeaways.value,
      mediaLink: this.mediaLink.value,
      photoUrls: uploadedUrls // Send already uploaded photo URLs
    };

    google.script.run
      .withSuccessHandler(function(response) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Report';
        statusMsg.className = response.status === 'success' ? 'status-success' : 'status-error';
        statusMsg.innerText = response.message;
        statusMsg.style.display = 'block';
        if(response.status === 'success') {
          document.getElementById('sabhaForm').reset();
          resetVachFields();
        }
      })
      .withFailureHandler(function(err) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Report';
        statusMsg.className = 'status-error';
        statusMsg.innerText = 'Error: ' + err.message;
        statusMsg.style.display = 'block';
      })
      .processForm(formData);
  });
</script>

</body>
</html>
